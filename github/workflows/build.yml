name: Build Desktop App

# متى يعمل هذا الملف؟ (عند رفع أي تعديل على فرع main)
on:
  push:
    branches: [ "main" ] 

jobs:
  build:
    # تحديد نظام التشغيل للخادم السحابي
    runs-on: windows-latest 

    steps:
    # 1. جلب الكود من المستودع
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. تثبيت بيئة Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18' # يمكنك تغييرها لنسخة Node التي تستخدمها

    # 3. تثبيت المكتبات والحزم
    - name: Install Dependencies
      run: npm install

    # 4. بناء التطبيق وتجهيزه
    - name: Build Application
      run: npm run build # تأكد من أن هذا الأمر موجود في ملف package.json

    # 5. حفظ البرنامج النهائي الجاهز للتحميل
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Desktop-App-Windows
        path: dist/ # أو مسار المجلد الذي يتم استخراج البرنامج النهائي فيه
