                  <span style={{color:"#60a5fa",fontFamily:"monospace"}}>F2</span> متابعة/تأكيد &nbsp;·&nbsp;
                  <span style={{color:"#60a5fa",fontFamily:"monospace"}}>F3</span> مسح السلة<br/>
                  <span style={{color:"#60a5fa",fontFamily:"monospace"}}>F4</span> تعليق السلة &nbsp;·&nbsp;
                  <span style={{color:"#60a5fa",fontFamily:"monospace"}}>F5</span> السلات المعلقة &nbsp;·&nbsp;
                  <span style={{color:"#60a5fa",fontFamily:"monospace"}}>F6</span> مبيعات اليوم<br/>
                  <span style={{color:"#60a5fa",fontFamily:"monospace"}}>F7</span> الأكثر مبيعاً &nbsp;·&nbsp;
                  <span style={{color:"#60a5fa",fontFamily:"monospace"}}>F8</span> طباعة &nbsp;·&nbsp;
                  <span style={{color:"#60a5fa",fontFamily:"monospace"}}>F9</span> بيع جديد &nbsp;·&nbsp;
                  <span style={{color:"#60a5fa",fontFamily:"monospace"}}>Del</span> حذف الأخير
                </div>
              </div>
            ):cart.map((item,idx)=>{
              const pi=getProdIcon(item);
              const isSvc=item._svc===true;
              const remStock=isSvc?9999:(item.stock-item.qty);
              const isLow=!isSvc&&remStock>=0&&remStock<=(item.minStock||5);
              const isEditing=editPriceId===(item._sid||item.id);
              const itemKey=item._sid||`prod_${item.id}_${idx}`;
              const rowBg=isSvc
                ?(item._svcType==="recharge"?`rgba(16,185,129,.06)`:`rgba(139,92,246,.06)`)
                :C.bg;
              const rowBorder=isSvc
                ?(item._svcType==="recharge"?"rgba(16,185,129,.22)":"rgba(139,92,246,.22)")
                :(isLow?`${C.acc}35`:C.brd);
              return(
                <div key={itemKey} style={{
                  background:rowBg,borderRadius:9,padding:"7px 9px",marginBottom:4,
                  border:`1px solid ${rowBorder}`,
                  animation:"fadeUp .18s ease",position:"relative",
                  display:"flex",alignItems:"center",gap:8,transition:"background .12s"}}>

                  {/* badge خدمة / مخزون منخفض */}
                  {(isSvc||isLow)&&<div style={{position:"absolute",top:-7,right:8,
                    background:isLow?C.acc:(item._svcType==="recharge"?"#10b981":"#8b5cf6"),
                    color:isLow?"#080f1e":"white",fontSize:7,fontWeight:900,padding:"1px 6px",borderRadius:20,whiteSpace:"nowrap"}}>
                    {isLow?`⚠ باقي ${remStock}`:(item._svcType==="recharge"?"📱 شحن":"🖨️ طباعة")}
                  </div>}

                  {/* أيقونة */}
                  {renderPI(pi,28,7)}

                  {/* اسم + سعر */}
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.txt,lineHeight:1.3,
                      whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{item.name}</div>
                    <div style={{fontSize:9,color:C.mut,marginTop:1,display:"flex",alignItems:"center",gap:3}}>
                      {isEditing?(
                        <input autoFocus type="number" value={editPriceVal}
                          onChange={e=>setEPV(e.target.value)}
                          onBlur={()=>{
                            const np=safeNum(editPriceVal);
                            if(np>0)setCart(c=>c.map(i=>(i._sid||i.id)===(item._sid||item.id)?{...i,price:np}:i));
                            setEPId(null);setEPV("");
                          }}
                          onKeyDown={e=>{if(e.key==="Enter")e.target.blur();if(e.key==="Escape"){setEPId(null);setEPV("");}}}
                          style={{...INP,fontSize:10,padding:"1px 5px",width:75,display:"inline-block"}}
                          dir="ltr"/>
                      ):(
                        <>
                          <span>{fmt(item.price)} دج</span>
                          <button onClick={()=>{setEPId(item._sid||item.id);setEPV(String(item.price));}}
                            style={{background:"none",border:"none",color:`${C.acc}50`,cursor:"pointer",padding:0,fontSize:9,lineHeight:1}}>✏</button>
                        </>
                      )}
                    </div>
                  </div>

                  {/* تحكم الكمية */}
                  <div style={{display:"flex",alignItems:"center",background:C.card,
                    borderRadius:7,border:`1px solid ${C.brd}`,flexShrink:0}}>
                    <button onClick={()=>updQty(item._sid||item.id,-1)}
                      style={{background:"none",border:"none",color:C.red,cursor:"pointer",
                        padding:"4px 8px",fontSize:14,fontWeight:700,lineHeight:1}}
                      onMouseEnter={e=>e.currentTarget.style.background="#450a0a"}
                      onMouseLeave={e=>e.currentTarget.style.background="none"}>−</button>
                    <span style={{fontWeight:900,fontSize:13,minWidth:20,textAlign:"center",
                      color:C.txt,borderRight:`1px solid ${C.brd}`,borderLeft:`1px solid ${C.brd}`,
                      padding:"3px 0"}}>{item.qty}</span>
                    <button onClick={()=>updQty(item._sid||item.id,+1)}
                      style={{background:"none",border:"none",color:C.grn,cursor:"pointer",
                        padding:"4px 8px",fontSize:14,fontWeight:700,lineHeight:1}}
                      onMouseEnter={e=>e.currentTarget.style.background="#052e16"}
                      onMouseLeave={e=>e.currentTarget.style.background="none"}>+</button>
                  </div>

                  {/* المجموع الفرعي */}
                  <div style={{fontWeight:900,color:C.acc,fontSize:12,
                    minWidth:54,textAlign:"left",flexShrink:0}}>
                    {fmt(item.price*item.qty)}<span style={{fontSize:8,fontWeight:400,marginRight:2,color:C.mut}}>دج</span>
                  </div>

                  {/* حذف */}
                  <button
                    onClick={()=>setCart(c=>c.filter(i=>(i._sid||i.id)!==(item._sid||item.id)))}
                    style={{background:"none",border:"none",color:"#ef444428",cursor:"pointer",
                      padding:"2px 3px",display:"flex",borderRadius:5,
                      fontSize:11,flexShrink:0,transition:"color .15s",lineHeight:1}}
                    onMouseEnter={e=>e.currentTarget.style.color="#ef4444"}
                    onMouseLeave={e=>e.currentTarget.style.color="#ef444428"}>✕</button>
                </div>
              );
            })}
          </div>

          {/* Footer — شريط المجموع الجديد */}
          {cart.length>0&&(
            <div style={{borderTop:`1px solid rgba(245,158,11,.15)`,flexShrink:0,background:"#040b14"}}>

              {/* ── تفاصيل الدفع — تظهر فقط بعد الضغط على متابعة ── */}
              {showCartDet&&(
                <div style={{padding:"10px 12px 0"}}>
                  {/* Discount */}
                  <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:8}}>
                    <span style={{fontSize:10,color:C.mut,flexShrink:0,fontWeight:600}}>خصم:</span>
                    <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                      {[0,5,10,15,20,25].map(d=>(
                        <button key={d} onClick={()=>setDisc(d)} style={{padding:"3px 8px",borderRadius:20,border:`1px solid ${discount===d?C.acc:C.brd}`,background:discount===d?C.acc:C.bg,color:discount===d?"#080f1e":C.mut,fontFamily:"Tajawal,sans-serif",fontWeight:discount===d?800:500,fontSize:10,cursor:"pointer",transition:"all .15s"}}>
                          {d===0?"لا":d+"%"}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Note */}
                  <div style={{marginBottom:8}}>
                    <input
                      key="note-input"
                      defaultValue={note}
                      onBlur={e=>setNote(e.target.value)}
                      onChange={e=>{ note_draft.current=e.target.value; }}
                      placeholder="📝 ملاحظة على الفاتورة (اختياري)..."
                      style={{...INP,fontSize:11,padding:"7px 10px"}}/>
                  </div>

                  {/* Breakdown */}
                  <div style={{background:C.bg,borderRadius:9,padding:"8px 11px",marginBottom:8,border:`1px solid ${C.brd}`}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:11}}>
                      <span style={{color:C.mut}}>المجموع الفرعي</span>
                      <span style={{color:C.sub,fontWeight:600}}>{fmt(subTotal)} دج</span>
                    </div>
                    {discount>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:11}}>
                      <span style={{color:C.grn}}>↓ خصم {discount}%</span>
                      <span style={{color:C.grn,fontWeight:700}}>− {fmt(discAmt)} دج</span>
                    </div>}
                    {redeemDiscount>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:11}}>
                      <span style={{color:C.pur}}>✂ نقاط مستبدلة</span>
                      <span style={{color:C.pur,fontWeight:700}}>− {fmt(redeemDiscount)} دج</span>
                    </div>}
                    <div style={{display:"flex",justifyContent:"space-between",paddingTop:6,borderTop:`1px dashed ${C.brd}`,marginTop:2}}>
                      <span style={{color:C.txt,fontWeight:700,fontSize:12}}>الإجمالي</span>
                      <span style={{fontWeight:900,fontSize:20,color:C.acc,lineHeight:1}}>{fmt(total)}<span style={{fontSize:9,fontWeight:400,marginRight:3}}>دج</span></span>
                    </div>
                  </div>
                </div>
              )}

              {/* ── شريط الإجمالي البارز ── */}
              <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",padding:"10px 14px 0"}}>
                <div>
                  <div style={{fontSize:8,color:"rgba(245,158,11,.4)",letterSpacing:3,fontWeight:700,marginBottom:2}}>▸ الإجمالي</div>
                  <div style={{fontWeight:900,fontSize:30,fontFamily:"'Courier New',monospace",
                    color:C.acc,lineHeight:1,
                    textShadow:`0 0 18px ${C.acc}40`}}>
                    <span style={{fontSize:12,color:`${C.acc}55`,fontWeight:700,marginLeft:3}}>دج</span>
                    {fmt(total)}<span style={{fontSize:16}}>.00</span>
                  </div>
                  <div style={{display:"flex",gap:5,marginTop:5}}>
                    <span style={{background:`${C.acc}12`,border:`1px solid ${C.acc}22`,
                      borderRadius:20,padding:"3px 9px",fontSize:10,color:C.acc,fontWeight:700}}>
                      {cart.reduce((s,i)=>s+i.qty,0)} قطعة
                    </span>
                    {discount>0&&<span style={{background:`${C.grn}10`,border:`1px solid ${C.grn}22`,
                      borderRadius:20,padding:"3px 9px",fontSize:10,color:C.grn,fontWeight:700}}>
                      خصم {discount}%
                    </span>}
                  </div>
                </div>
                {showCartDet&&(
                  <button onClick={()=>setShowCartDet(false)}
                    style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:10,
                      width:36,height:36,cursor:"pointer",color:C.mut,fontSize:15,
                      display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginBottom:2}}>
                    ✕
                  </button>
                )}
              </div>

              {/* ── أزرار الدفع ── */}
              <div style={{display:"flex",gap:8,padding:"9px 12px 13px"}}>
                <button
                  onClick={()=>{suspendCartRef.current&&suspendCartRef.current();}}
                  style={{width:44,height:44,background:`${C.acc}08`,
                    border:`1px solid ${C.acc}22`,borderRadius:11,
                    cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:17,flexShrink:0,transition:"all .15s"}}
                  title="تعليق السلة"
                  onMouseEnter={e=>e.currentTarget.style.background=`${C.acc}18`}
                  onMouseLeave={e=>e.currentTarget.style.background=`${C.acc}08`}>
                  ⏸
                </button>
                <button
                  onClick={()=>{ if(!showCartDet){setShowCartDet(true);}else{setPhase("checkout");} }}
                  style={{flex:1,background:`linear-gradient(135deg,${C.acc},${C.accD})`,
                    color:"#080f1e",border:"none",borderRadius:11,padding:"13px 0",
                    fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,
                    cursor:"pointer",boxShadow:`0 5px 18px ${C.acc}35`,
                    display:"flex",alignItems:"center",justifyContent:"center",gap:7,
                    transition:"all .15s"}}
                  onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-1px)";e.currentTarget.style.boxShadow=`0 8px 26px ${C.acc}50`;}}
                  onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow=`0 5px 18px ${C.acc}35`;}}>
                  <span>💳</span>
                  <span>{showCartDet?"تأكيد الدفع":"متابعة للدفع"}</span>
                </button>
              </div>
            </div>
          )}
        </>
      );

      const CheckPanel=()=>{
        const isCard=payMethod==="cib"||payMethod==="baridimob";
        const isDebt=payMethod==="debt";
        const isPartial=payMethod==="partial";
        const needsAmount=!isCard&&!isDebt;
        const canConfirm=isCard||isDebt||(isPartial&&rcv&&parseFloat(rcv)>0)||(!isPartial&&(!showRcv||(rcv&&change>=0)));
        const quickAmounts=[total,Math.ceil(total/500)*500,Math.ceil(total/1000)*1000,Math.ceil(total/2000)*2000]
          .filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);

        return(
        <div style={{display:"flex",flexDirection:"column",height:"100%",background:C.surf,overflow:"hidden"}}>
          {/* Header */}
          <div style={{padding:"10px 13px",borderBottom:`1px solid ${C.brd}`,display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
            <button onClick={()=>{setPhase("cart");setRcv("");setShowCartDet(false);}} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:"6px 11px",color:C.sub,cursor:"pointer",display:"flex",alignItems:"center",gap:4,fontSize:12,fontFamily:"Tajawal,sans-serif",fontWeight:600}}>← رجوع</button>
            <div style={{fontWeight:900,fontSize:14,color:C.acc}}>💳 إتمام عملية البيع</div>
          </div>

          <div style={{flex:1,overflowY:"auto"}}>
            {/* Order summary */}
            <div style={{padding:"8px 13px",borderBottom:`1px solid ${C.brd}`,maxHeight:150,overflowY:"auto"}}>
              {cart.map((i,idx)=>(
                <div key={i._sid||(i.id!=null?String(i.id):`item-${idx}`)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:idx<cart.length-1?`1px dashed ${C.brd}22`:"none",fontSize:11}}>
                  <span style={{color:C.sub,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",paddingLeft:8}}>{getProdIcon(i).icon} {i.name}<span style={{color:C.mut}}> ×{i.qty}</span></span>
                  <span style={{fontWeight:700,color:C.txt,flexShrink:0}}>{fmt(i.price*i.qty)}</span>
                </div>
              ))}
            </div>

            {/* Totals */}
            <div style={{padding:"8px 13px",borderBottom:`1px solid ${C.brd}`}}>
              <div style={{background:C.bg,borderRadius:10,padding:"9px 12px",border:`1px solid ${C.brd}`}}>
                {discount>0&&<>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                    <span style={{color:C.mut}}>المجموع</span><span style={{color:C.sub}}>{fmt(subTotal)} دج</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:5}}>
                    <span style={{color:C.grn}}>خصم {discount}%</span><span style={{color:C.grn,fontWeight:700}}>− {fmt(discAmt)} دج</span>
                  </div>
                </>}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{color:C.mut,fontSize:12,fontWeight:600}}>المبلغ المطلوب</span>
                  <span style={{fontWeight:900,fontSize:24,color:C.acc,lineHeight:1}}>{fmt(total)}<span style={{fontSize:10,fontWeight:400,marginRight:3}}>دج</span></span>
                </div>
                {note&&<div style={{marginTop:6,fontSize:10,color:C.mut,borderTop:`1px dashed ${C.brd}`,paddingTop:5}}>📝 {note}</div>}
              </div>
            </div>

            {/* ── طريقة الدفع ── */}
            <div style={{padding:"8px 13px",borderBottom:`1px solid ${C.brd}`}}>
              <div style={{fontSize:10,color:C.mut,fontWeight:700,marginBottom:7}}>طريقة الدفع</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                {PAYS.map(p=>(
                  <button key={p.id} onClick={()=>{
                    setPay(p.id);setRcv("");
                    const {total:tot2}=calcCart(cart,discount);
                    pushToDisplay(cart,tot2,discount,p.id,null);
                  }}
                    style={{padding:"9px 6px",borderRadius:10,border:`2px solid ${payMethod===p.id?C.acc:C.brd}`,
                      background:payMethod===p.id?`${C.acc}18`:C.bg,
                      color:payMethod===p.id?C.acc:C.mut,
                      fontFamily:"Tajawal,sans-serif",fontWeight:payMethod===p.id?900:500,
                      fontSize:11,cursor:"pointer",transition:"all .15s",
                      display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                    <span style={{fontSize:18}}>{p.icon}</span>
                    <span>{p.label}</span>
                  </button>
                ))}
              </div>
              {/* Info for each method */}
              {isCard&&<div style={{marginTop:8,background:`${C.blu}15`,border:`1px solid ${C.blu}30`,borderRadius:8,padding:"7px 11px",fontSize:11,color:C.blu}}>
                ℹ الدفع الإلكتروني — المبلغ الكامل {fmt(total)} دج يُسجّل مباشرة
              </div>}
              {isDebt&&<div style={{marginTop:8,background:`${C.red}15`,border:`1px solid ${C.red}30`,borderRadius:8,padding:"7px 11px",fontSize:11,color:C.red}}>
                ⚠ سيُسجّل المبلغ كدين{selCust?` على ${customers.find(c=>String(c.id)===String(selCust))?.name}`:" — بدون عميل (غير قابل للمتابعة)"}
              </div>}
              {isPartial&&<div style={{marginTop:8,background:`${C.acc}10`,border:`1px solid ${C.acc}25`,borderRadius:8,padding:"7px 11px",fontSize:11,color:C.acc}}>
                ℹ أدخل المبلغ المدفوع جزئياً — الفرق يُسجّل كدين
              </div>}
            </div>

            {/* Amount received — toggle for cash/partial */}
            {needsAmount&&(
              <div style={{padding:"8px 13px",borderBottom:`1px solid ${C.brd}`}}>

                {/* زر التفعيل */}
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:showRcv?8:0}}>
                  <label style={{fontSize:11,color:C.mut,fontWeight:700}}>
                    {isPartial?"المبلغ المدفوع جزئياً":"المبلغ المستلم"}
                  </label>
                  <button onClick={()=>{setShowRcv(v=>!v);if(showRcv)setRcv("");}} style={{
                    display:"flex",alignItems:"center",gap:5,
                    background:showRcv?`${C.acc}18`:C.card,
                    border:`1px solid ${showRcv?C.acc:C.brd}`,
                    borderRadius:20,padding:"4px 10px",
                    cursor:"pointer",transition:"all .2s",
                    fontFamily:"Tajawal,sans-serif",fontSize:11,fontWeight:700,
                    color:showRcv?C.acc:C.mut
                  }}>
                    {/* Toggle pill */}
                    <div style={{
                      width:28,height:16,borderRadius:20,
                      background:showRcv?C.acc:"rgba(255,255,255,.1)",
                      position:"relative",transition:"background .2s",flexShrink:0
                    }}>
                      <div style={{
                        position:"absolute",top:2,
                        left:showRcv?12:2,
                        width:12,height:12,borderRadius:"50%",
                        background:"white",transition:"left .2s",
                        boxShadow:"0 1px 3px rgba(0,0,0,.3)"
                      }}/>
                    </div>
                    {showRcv?"مفعّل":"غير مفعّل"}
                  </button>
                </div>

                {/* حقل الإدخال — يظهر فقط عند التفعيل */}
                {showRcv&&(
                  <>
                    <input autoFocus type="number" value={rcv} onChange={e=>{
                      setRcv(e.target.value);
                      const v=safeNum(e.target.value||0);
                      if(v>0){
                        const {total:tot3}=calcCart(cart,discount);
                        pushToDisplay(cart,tot3,discount,payMethod,v);
                      }
                    }} placeholder="0"
                      style={{...INP,fontSize:24,fontWeight:900,textAlign:"center",padding:"11px",letterSpacing:2,
                        border:`2px solid ${rcv?(isPartial?C.acc:change>=0?C.grn:C.red):C.brd}`,
                        color:rcv?(isPartial?C.acc:change>=0?C.grn:C.red):C.txt,
                        background:rcv?(isPartial?`${C.acc}15`:change>=0?"#052e1620":"#450a0a20"):C.bg,
                        transition:"all .2s"
                      }}/>
                    {/* Quick amounts */}
                    <div style={{display:"flex",gap:5,marginTop:6}}>
                      {quickAmounts.map(amt=>(
                        <button key={amt} onClick={()=>setRcv(String(amt))}
                          style={{flex:1,background:rcvNum===amt?C.acc:C.card,color:rcvNum===amt?"#080f1e":C.sub,
                            border:`1px solid ${rcvNum===amt?C.acc:C.brd}`,borderRadius:7,padding:"6px 3px",
                            fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:10,cursor:"pointer",transition:"all .15s"}}>
                          {fmt(amt)}
                        </button>
                      ))}
                    </div>
                  </>
                )}
              </div>
            )}

            {/* Change / Debt display */}
            {(rcv||isCard||isDebt)&&(
              <div style={{padding:"8px 13px"}}>
                {isCard&&(
                  <div style={{background:"#052e16",border:"1px solid #166534",borderRadius:10,padding:"10px 13px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontSize:10,color:C.grn,fontWeight:600,marginBottom:2}}>مبلغ البطاقة</div>
                    <div style={{fontWeight:900,fontSize:22,color:C.grn}}>{fmt(total)}<span style={{fontSize:10,marginRight:3}}>دج</span></div></div>
                    <div style={{fontSize:28}}>💳</div>
                  </div>
                )}
                {isDebt&&(
                  <div style={{background:"#3d0c0c",border:"1px solid #7f1d1d",borderRadius:10,padding:"10px 13px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontSize:10,color:C.red,fontWeight:600,marginBottom:2}}>مبلغ الدين المسجّل</div>
                    <div style={{fontWeight:900,fontSize:22,color:C.red}}>{fmt(total)}<span style={{fontSize:10,marginRight:3}}>دج</span></div></div>
                    <div style={{fontSize:28}}>📋</div>
                  </div>
                )}
                {isPartial&&rcv&&(
                  <div style={{background:rcvNum>0&&rcvNum<total?"#1a1200":"#052e16",border:`1px solid ${rcvNum>0&&rcvNum<total?"#f59e0b":"#166534"}`,borderRadius:10,padding:"10px 13px"}}>

                      return(

                            <span style={{position:"absolute",top:-4,right:-4,zIndex:2,

                              {btn.badge}
                            </span>
                          )}
                          <button
                            onClick={btn.action}
                            disabled={btn.disabled}
                            style={{
                              display:"flex",alignItems:"center",gap:4,
                              padding:"5px 10px",borderRadius:20,
                              background:btn.active?`${btn.color}20`:`${btn.color}10`,

                  return(
                    <PhotoCard key={p.id} p={p} onClick={()=>addFn(p)}
                      hotRank={rank<=2?rank:0} isNew={isNew} size={110}/>

                try{
                  const newId = await db.save("products",{...prod, createdAt:new Date().toISOString()});

                  const newProduct = {...prod, id:newId, createdAt:new Date().toISOString()};
                  productsRef.current = [...productsRef.current, newProduct];
                  addFn(newProduct, false);
                  notify("✅ تم تسجيل المنتج وإضافته للسلة: "+prod.name);

                  reload(["products"]);
                }catch(e){ notify("❌ خطأ: "+e.message,"err"); }
                setNewProd(null);
              }}
              onClose={()=>setNewProd(null)}

                            إجمالي المرتجع: {fmt(Object.entries(retItems).reduce((a,[idx,q])=>a+(retSale.items[idx]?.price||0)*q,0))} دج
                          </div>

            <div style={{position:"fixed",inset:0,zIndex:500,background:"#000",display:"flex",flexDirection:"column"}}>

              {/* رأس */}
              <div style={{
                background:"linear-gradient(135deg,#0e7490,#0891b2)",

                justifyContent:"space-between",flexShrink:0

                  <div style={{fontSize:16,fontWeight:900,color:"white"}}>📡 الماسح اللاسلكي</div>

                  background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.25)",
                  borderRadius:10,padding:"8px 14px",color:"white",
                  fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:12,cursor:"pointer"
                }}>✕ إغلاق</button>
              </div>

              {/* منطقة الكاميرا */}
              <div style={{flex:1,position:"relative",overflow:"hidden"}}>

                  position:"absolute",top:"50%",left:"50%",
                  transform:"translate(-50%,-55%)",

                    {top:0,right:0,borderTop:"3px solid #06b6d4",borderRight:"3px solid #06b6d4"},
                    {bottom:0,left:0,borderBottom:"3px solid #06b6d4",borderLeft:"3px solid #06b6d4"},
                    {bottom:0,right:0,borderBottom:"3px solid #06b6d4",borderRight:"3px solid #06b6d4"},
                  ].map((s,i)=>(
                    <div key={i} style={{position:"absolute",width:28,height:28,...s}}/>
                  ))}
                  {/* خط المسح */}
                  <div style={{
                    position:"absolute",left:0,right:0,height:2,
                    background:"linear-gradient(90deg,transparent,#06b6d4,transparent)",
                    animation:"scanline 2s linear infinite"
                  }}/>
                </div>
              </div>

              {/* سجل المسح */}
              <div style={{
                background:"#0a1628",borderTop:"1px solid rgba(6,182,212,.2)",
                maxHeight:200,overflowY:"auto",flexShrink:0
              }}>
                <div style={{padding:"8px 14px",fontSize:10,color:"rgba(6,182,212,.5)",fontWeight:700,letterSpacing:1}}>
                  سجل المسح ({scannerLog.length})

                {scannerLog.length===0?(
                  <div style={{padding:"12px 14px",fontSize:11,color:"rgba(255,255,255,.2)",textAlign:"center"}}>
                    في انتظار أول مسح...
                  </div>
                ):scannerLog.slice().reverse().map((s,i)=>(
                  <div key={i} style={{
                    display:"flex",alignItems:"center",justifyContent:"space-between",
                    padding:"7px 14px",borderBottom:"1px solid rgba(255,255,255,.04)",
                    background:i===0?"rgba(6,182,212,.06)":"transparent"
                  }}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:12}}>{s.found?"✅":"❌"}</span>
                      <span style={{fontSize:11,color:s.found?"rgba(255,255,255,.8)":"rgba(239,68,68,.7)",fontWeight:600}}>{s.name}</span>
                    </div>
                    <span style={{fontSize:9,color:"rgba(255,255,255,.2)"}}>{s.time}</span>
                  </div>
                ))}
              </div>

              (!kioskSearch||p.name.includes(kioskSearch)||(p.barcode||"").includes(kioskSearch))&&
              (kioskCat==="all"||p.category===kioskCat)

                    <div style={{background:`linear-gradient(135deg,${C.acc},${C.accD})`,borderRadius:11,width:42,height:42,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,boxShadow:`0 3px 12px ${C.acc}40`}}>📚</div>

                      <div style={{fontWeight:900,fontSize:15,color:C.acc,lineHeight:1}}>مكتبة حشايشي</div>
