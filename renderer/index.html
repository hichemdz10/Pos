    const PKG_ICONS=["🌱","🌿","🌳","📖","🎯","🔍","📐","🔬","🎓","💡","⚡","🏆","🎨","📋","✏️","📚","🎒","🌟","⭐","🔭","🧪","💎","🏅","🎓","📊","🔢"];
    const LEVELS=["ابتدائي س1","ابتدائي س2","ابتدائي س3","ابتدائي س4","ابتدائي س5","متوسط س1","متوسط س2","متوسط س3","متوسط س4","ثانوي س1","ثانوي س2","ثانوي س3","خاص"];
    const PKG_COLORS=["#10b981","#22c55e","#16a34a","#f59e0b","#ef4444","#3b82f6","#8b5cf6","#06b6d4","#f97316","#fbbf24","#ec4899","#64748b","#7c3aed"];

    function PackageModal({package_,products,cats,onClose,onSave}){
      const[f,setF]=useState({name:package_?.name||"",icon:package_?.icon||"🎒",iconColor:package_?.iconColor||"#f59e0b",level:package_?.level||"ابتدائي س1",notes:package_?.notes||"",items:[...(package_?.items||[])]});
      const[prodSearch,setPSearch]=useState("");
      const set=(k,v)=>setF(x=>({...x,[k]:v}));
      const filtP=products.filter(p=>!prodSearch||p.name.includes(prodSearch)||(p.barcode||"").includes(prodSearch));
      const hasItem=id=>f.items.some(i=>i.productId===id);
      const toggleItem=p=>{
        if(hasItem(p.id))setF(x=>({...x,items:x.items.filter(i=>i.productId!==p.id)}));
        else setF(x=>({...x,items:[...x.items,{productId:p.id,qty:1}]}));
      };
      const setQty=(id,q)=>setF(x=>({...x,items:x.items.map(i=>i.productId===id?{...i,qty:Math.max(1,parseInt(q)||1)}:i)}));
      const total=f.items.reduce((s,it)=>{const p=products.find(x=>x.id===it.productId);return s+(p?p.price*it.qty:0);},0);
      const save=async()=>{
        if(!f.name.trim()){alert("أدخل اسم الباقة");return;}
        await onSave({...(package_||{}),...f});
      };
      return(
        <div style={{position:"fixed",inset:0,zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.75)"}}/>
          <div style={{background:C.surf,borderRadius:"18px 18px 0 0",padding:"18px 16px",width:"100%",maxWidth:560,maxHeight:"95vh",overflowY:"auto",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .28s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div style={{fontWeight:900,fontSize:15,color:C.acc}}>{package_?"✏️ تعديل الباقة":"🎒 إنشاء باقة جديدة"}</div>
              <button onClick={onClose} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:7,padding:7,color:C.mut,cursor:"pointer",display:"flex"}}><Ico.x/></button>
            </div>

            {/* Icon + Color picker */}
            <div style={{background:C.bg,borderRadius:14,padding:14,marginBottom:14,border:`1px solid ${C.brd}`}}>
              <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:11}}>
                <div style={{width:58,height:58,borderRadius:16,background:`${f.iconColor}22`,border:`2px solid ${f.iconColor}50`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,flexShrink:0}}>{f.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:11,color:C.mut,fontWeight:600,marginBottom:6}}>أيقونة الباقة</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {PKG_ICONS.map(ic=><button key={ic} className="icon-btn" onClick={()=>set("icon",ic)} style={{background:f.icon===ic?`${f.iconColor}30`:C.card,border:`1.5px solid ${f.icon===ic?f.iconColor:C.brd}`,borderRadius:7,padding:"4px 6px",fontSize:17,cursor:"pointer",transition:"all .15s"}}>{ic}</button>)}
                  </div>
                </div>
              </div>
              <div style={{fontSize:11,color:C.mut,fontWeight:600,marginBottom:6}}>لون الأيقونة</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {PKG_COLORS.map(c=><button key={c} onClick={()=>set("iconColor",c)} style={{width:28,height:28,borderRadius:50,background:c,border:f.iconColor===c?"3px solid white":"2px solid transparent",cursor:"pointer",transition:"all .15s",boxShadow:f.iconColor===c?`0 0 8px ${c}80`:"none"}}/>)}
              </div>
            </div>

            {/* Basic fields */}
            <div style={{marginBottom:13}}><label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:600}}>اسم الباقة *</label><input value={f.name} onChange={e=>set("name",e.target.value)} placeholder="مثال: باقة السنة الأولى ابتدائي" style={INP}/></div>
            <div style={{marginBottom:13}}><label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:600}}>المستوى الدراسي</label><select value={f.level} onChange={e=>set("level",e.target.value)} style={INP}>{LEVELS.map(l=><option key={l} value={l}>{l}</option>)}</select></div>
            <div style={{marginBottom:14}}><label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:600}}>ملاحظات</label><input value={f.notes} onChange={e=>set("notes",e.target.value)} placeholder="وصف اختياري..." style={INP}/></div>

            {/* Product picker */}
            <div style={{background:C.bg,borderRadius:14,padding:13,marginBottom:14,border:`1px solid ${C.brd}`}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:C.txt,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span>اختر المنتجات</span>
                {f.items.length>0&&<span style={{background:`${C.acc}18`,color:C.acc,borderRadius:20,padding:"2px 9px",fontSize:11,fontWeight:800}}>{f.items.length} منتج — {fmt(total)} دج</span>}
              </div>
              <div style={{position:"relative",marginBottom:9}}>
                <input value={prodSearch} onChange={e=>setPSearch(e.target.value)} placeholder="ابحث عن منتج..." style={{...INP,paddingRight:35,padding:"8px 35px 8px 11px",fontSize:12}}/>
                <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:C.mut,pointerEvents:"none"}}><Ico.srch/></span>
              </div>
              <div style={{maxHeight:200,overflowY:"auto"}}>
                {filtP.slice(0,30).map(p=>{
                  const pi=getProdIcon(p);
                  const sel=hasItem(p.id);
                  const item=f.items.find(i=>i.productId===p.id);
                  return(
                    <div key={p.id} style={{display:"flex",alignItems:"center",gap:9,padding:"7px 8px",borderRadius:9,marginBottom:3,background:sel?`${pi.color}12`:C.card,border:`1px solid ${sel?pi.color+"30":C.brd}`,transition:"all .15s",cursor:"pointer"}} onClick={()=>toggleItem(p)}>
                      {renderPI(pi,36,10)}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:600,color:sel?C.txt:C.sub,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
                        <div style={{fontSize:10,color:C.mut}}>{fmt(p.price)} دج — مخزون: {p.stock}</div>
                      </div>
                      {sel&&<input type="number" value={item?.qty||1} min="1" onClick={e=>e.stopPropagation()} onChange={e=>setQty(p.id,e.target.value)} style={{...INP,width:50,padding:"4px 6px",fontSize:13,fontWeight:700,textAlign:"center",color:pi.color,border:`1px solid ${pi.color}40`}}/>}
                      <div style={{width:22,height:22,borderRadius:50,background:sel?C.grn:C.brd,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .2s"}}>
                        {sel?<Ico.chk/>:null}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={{display:"flex",gap:9}}>
              <button onClick={onClose} style={{flex:1,background:C.card,color:C.txt,border:`1px solid ${C.brd}`,borderRadius:10,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:600,cursor:"pointer"}}>إلغاء</button>
              <button onClick={save} style={{flex:2,background:`linear-gradient(135deg,#7c3aed,#6d28d9)`,color:"white",border:"none",borderRadius:10,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:"pointer",boxShadow:"0 5px 16px #7c3aed35"}}>{package_?"💾 حفظ التعديلات":"🎒 إنشاء الباقة"}</button>
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════
    //  CUSTOMERS VIEW
    // ══════════════════════════════════════════════
    function CustomersView({customers,sales,notify,reload}){
      const[search,setSrch]=useState(""),[modal,setModal]=useState(false),[edit,setEdit]=useState(null),[detail,setDetail]=useState(null);
      const filt=customers.filter(c=>!search||c.name.includes(search)||(c.phone||"").includes(search));
      // ── Bug fix: compare as numbers (customerId saved via parseInt) ──
      const custSales=cid=>sales.filter(s=>Number(s.customerId)===Number(cid));
      const del=async id=>{if(!confirm("حذف هذا العميل؟"))return;await db.remove("customers",id);await reload(["customers"]);notify("✓ تم الحذف");};
      if(detail){
        const cs=custSales(detail.id);
        const csSorted=[...cs].sort((a,b)=>new Date(b.date)-new Date(a.date));
        const lastVisit=csSorted[0]?.date;
        // إجمالي المشتريات يستثني المرتجعات
        const actualTotal=cs.filter(s=>s.payMethod!=="return").reduce((s,x)=>s+(x.total||0),0);
        // الدين من السجل الرسمي (يُحدَّث عند كل بيع)
        const debt=Math.max(0, detail.debt||0);
        const tier=loyaltyTier(actualTotal);
        const lPoints=detail.loyaltyPoints||0;
        const lEarned=detail.totalPointsEarned||0;
        const nextTier=LOYALTY.tiers.slice().reverse().find(t=>t.min>actualTotal);
        const progressPct=nextTier?Math.min(100,Math.round((actualTotal/nextTier.min)*100)):100;
        return(
        <div style={{height:"calc(100vh - 54px)",overflowY:"auto",padding:14}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
            <button onClick={()=>setDetail(null)} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:"7px 13px",color:C.txt,fontFamily:"Tajawal,sans-serif",fontSize:12,cursor:"pointer"}}>← رجوع</button>
            <div style={{fontWeight:800,fontSize:15,color:C.acc}}>👤 {detail.name}</div>
            <span style={{fontSize:14}}>{tier.icon}</span>
            <span style={{fontSize:11,fontWeight:700,color:tier.color,background:`${tier.color}18`,padding:"3px 10px",borderRadius:20,border:`1px solid ${tier.color}30`}}>{tier.label}</span>
          </div>

          {/* بطاقة الولاء */}
          <div style={{background:`linear-gradient(135deg,${tier.color}18,${tier.color}08)`,borderRadius:14,padding:14,marginBottom:12,border:`1.5px solid ${tier.color}35`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div>
                <div style={{fontSize:22}}>{tier.icon}</div>
                <div style={{fontWeight:900,fontSize:16,color:tier.color,marginTop:2}}>{tier.label}</div>
                <div style={{fontSize:10,color:C.mut}}>مجموع المشتريات: {fmt(actualTotal)} دج</div>
              </div>
              <div style={{textAlign:"left"}}>
                <div style={{fontWeight:900,fontSize:22,color:C.acc}}>{lPoints}</div>
                <div style={{fontSize:10,color:C.mut}}>نقطة متاحة</div>
                <div style={{fontSize:10,color:C.sub,marginTop:2}}>مجموع مكتسب: {lEarned}</div>
              </div>
            </div>
            {/* شريط التقدم للفئة التالية */}
            {nextTier&&(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:9,color:C.mut}}>التقدم نحو {nextTier.icon} {nextTier.label}</span>
                <span style={{fontSize:9,color:tier.color,fontWeight:700}}>{progressPct}%</span>
              </div>
              <div style={{height:5,borderRadius:10,background:C.brd,overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:10,background:`linear-gradient(90deg,${tier.color},${C.acc})`,width:`${progressPct}%`,transition:"width .6s ease"}}/>
              </div>
              <div style={{fontSize:9,color:C.mut,marginTop:3}}>يحتاج {fmt(nextTier.min-actualTotal)} دج إضافية للوصول لـ {nextTier.label}</div>
            </div>
            )}
            {!nextTier&&<div style={{fontSize:10,color:tier.color,fontWeight:700,textAlign:"center",marginTop:4}}>🏆 أعلى مستوى — بلاتيني!</div>}
            {/* قيمة النقاط */}
            {lPoints>0&&<div style={{marginTop:8,fontSize:10,background:`${C.grn}12`,color:C.grn,padding:"4px 10px",borderRadius:7,border:`1px solid ${C.grn}20`,fontWeight:600}}>
              💰 رصيد النقاط يساوي {fmt(pointsToDZD(lPoints))} دج قابل للاستبدال
            </div>}
          </div>

          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
            {[
              ["إجمالي المشتريات",`${fmt(actualTotal)} دج`,C.acc,"💰"],
              ["عدد الفواتير",cs.filter(s=>s.payMethod!=="return").length,C.blu,"🧾"],
              ["آخر زيارة",lastVisit?dateLabel(lastVisit):"—",C.grn,"📅"],
              ...(debt>0?[["ديون متبقية",`${fmt(debt)} دج`,C.red,"⚠️"]]:[] )
            ].map(([l,v,c,ic])=>(
              <div key={l} style={{background:C.card,borderRadius:11,padding:"12px 16px",border:`1px solid ${c}22`,flex:"1 1 130px"}}>
                <div style={{fontSize:22}}>{ic}</div>
                <div style={{fontWeight:900,fontSize:18,color:c,marginTop:4}}>{v}</div>
                <div style={{fontSize:11,color:C.mut}}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}>
            <div style={{fontWeight:800,fontSize:13,marginBottom:12}}>سجل المشتريات</div>
            {csSorted.length===0?<div style={{color:C.mut,fontSize:12}}>لا توجد مشتريات بعد</div>
            :csSorted.map((s,i)=>(
              <div key={s.id||i} style={{padding:"9px 0",borderBottom:i<csSorted.length-1?`1px solid ${C.brd}`:"none"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:12,color:C.sub,fontWeight:600}}>{dateLabel(s.date)} — {timeLabel(s.date)}</span>
                  <span style={{fontWeight:800,color:s.total<0?C.red:C.acc,fontSize:14}}>{fmt(s.total)} دج</span>
                </div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
                  {(s.items||[]).slice(0,4).map((it,j)=><span key={j} style={{background:C.bg,borderRadius:6,padding:"2px 7px",fontSize:10,color:C.mut}}>{it.name} ×{it.qty}</span>)}
                  {(s.items||[]).length>4&&<span style={{fontSize:10,color:C.mut}}>+{s.items.length-4}</span>}
                  {s.payMethod&&<span style={{marginRight:"auto",fontSize:9,padding:"2px 7px",borderRadius:6,background:s.payMethod==="debt"?`${C.red}18`:s.payMethod==="partial"?`${C.amb}18`:`${C.grn}18`,color:s.payMethod==="debt"?C.red:s.payMethod==="partial"?C.amb:C.grn,fontWeight:700}}>
                    {{cash:"نقداً",cib:"CIB",baridimob:"بريدي",partial:"جزئي",debt:"دين",return:"مرتجع"}[s.payMethod]||s.payMethod}
                  </span>}
                </div>
              </div>
            ))}
          </div>
        </div>
      );}
      return(
        <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 54px)",overflow:"hidden"}}>
          <div style={{padding:"10px 12px",background:C.surf,borderBottom:`1px solid ${C.brd}`,flexShrink:0}}>
            <div style={{display:"flex",gap:8,marginBottom:7}}>
              <div style={{position:"relative",flex:1}}>
                <input value={search} onChange={e=>setSrch(e.target.value)} placeholder="بحث بالاسم أو الهاتف..." style={{...INP,paddingRight:36}}/>
                <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:C.mut,pointerEvents:"none"}}><Ico.srch/></span>
              </div>
              <button onClick={()=>{setEdit(null);setModal(true);}} style={{background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:8,padding:"8px 13px",fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:5,flexShrink:0}}>

            </div>
            <div style={{fontSize:11,color:C.mut}}>{customers.length} عميل مسجّل</div>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:10}}>
            {filt.map(c=>{
              const cs=custSales(c.id);
              const debt=Math.max(0, c.debt||0);
              const total=cs.filter(s=>s.payMethod!=="return").reduce((s,x)=>s+(x.total||0),0);
              const tier=loyaltyTier(total);
              const lPoints=c.loyaltyPoints||0;
              return(
              <div key={c.id} style={{background:C.card,borderRadius:11,padding:"11px 13px",marginBottom:7,border:`1px solid ${debt>0?C.red+"30":C.brd}`,display:"flex",alignItems:"center",gap:11,animation:"fadeUp .2s ease"}}>
                <div style={{background:`linear-gradient(135deg,${tier.color}80,${tier.color}40)`,borderRadius:50,width:40,height:40,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{tier.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,color:C.txt,marginBottom:2}}>{c.name}</div>
                  <div style={{display:"flex",gap:7,alignItems:"center"}}>
                    <Ico.phone/><span style={{fontSize:11,color:C.mut}}>{c.phone}</span>
                    {c.address&&<span style={{fontSize:10,color:"#2a4a6a"}}>📍 {c.address}</span>}
                  </div>
                  {debt>0&&<div style={{fontSize:10,color:C.red,fontWeight:700,marginTop:2}}>⚠ دين: {fmt(debt)} دج</div>}
                </div>
                <div style={{textAlign:"center",flexShrink:0}}>
                  <div style={{fontWeight:900,color:C.acc,fontSize:13}}>{fmt(total)}</div>
                  <div style={{fontSize:9,color:C.mut}}>دج — {cs.filter(s=>s.payMethod!=="return").length} فاتورة</div>
                  {lPoints>0&&<div style={{fontSize:9,color:C.grn,fontWeight:700,marginTop:1}}>🏆 {lPoints} نقطة</div>}
                </div>
                <div style={{display:"flex",gap:5,flexShrink:0}}>
                  <button onClick={()=>setDetail(c)} style={{background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:6,padding:"6px 8px",cursor:"pointer",display:"flex"}}><Ico.eye/></button>
                  <button onClick={()=>{setEdit(c);setModal(true);}} style={{background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:6,padding:"6px 8px",cursor:"pointer",display:"flex"}}><Ico.edit/></button>
                  <button onClick={()=>del(c.id)} style={{background:"#450a0a",color:C.red,border:"none",borderRadius:6,padding:"6px 8px",cursor:"pointer",display:"flex"}}><Ico.trash/></button>
                </div>
              </div>
            );})}
            {filt.length===0&&<div style={{textAlign:"center",padding:50,color:C.mut}}><div style={{fontSize:40,opacity:.3}}>👥</div><div style={{marginTop:8}}>لا يوجد عملاء</div></div>}
          </div>
          {modal&&<SimpleModal
            title={edit?"✏️ تعديل عميل":"➕ إضافة عميل جديد"}
            fields={[{k:"name",l:"الاسم الكامل *",t:"text",p:"أحمد بن علي"},{k:"phone",l:"رقم الهاتف",t:"tel",p:"0500000000"},{k:"address",l:"المدينة",t:"text",p:"المدينة"},{k:"city",l:"الولاية",t:"text",p:"الجزائر"},{k:"notes",l:"ملاحظات",t:"text",p:"..."}]}
            initial={edit||{name:"",phone:"",address:"",notes:""}}
            required={["name"]}
            onClose={()=>setModal(false)}
            onSave={async d=>{
              await db.save("customers",{
                ...(edit||{}),
                ...d,
                totalPurchases:edit?.totalPurchases||0,
                debt:edit?.debt||0,
                createdAt:edit?.createdAt||new Date().toISOString()
              });
              await reload(["customers"]);
              setModal(false);
              notify(edit?"✓ تم تحديث العميل":"✓ تم إضافة العميل");
            }}/>}
        </div>
      );
    }

    // ══════════════════════════════════════════════
    //  SUPPLIERS VIEW
    // ══════════════════════════════════════════════

    // ════════════════════════════════════════════════════════════
    //  SettingsView — قسم الإعدادات الكامل
    // ════════════════════════════════════════════════════════════
    // ── مكوّنات مساعدة لقسم الإعدادات (خارج SettingsView لتجنب فقد focus) ──
    const SToggle = ({val,onChange,label,sub}) => (
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:14}}>
        <div>
          <div style={{fontSize:13,color:C.txt,fontWeight:600}}>{label}</div>
          {sub&&<div style={{fontSize:11,color:C.mut,marginTop:2}}>{sub}</div>}
        </div>
        <button onClick={()=>onChange(!val)} style={{
          width:48,height:26,borderRadius:13,border:"none",cursor:"pointer",
          background:val?C.grn:"rgba(255,255,255,.08)",position:"relative",
          transition:"background .2s",flexShrink:0
        }}>
          <div style={{
            position:"absolute",top:3,left:val?24:3,width:20,height:20,
            borderRadius:"50%",background:"#fff",transition:"left .2s",
            boxShadow:"0 1px 4px rgba(0,0,0,.3)"
          }}/>
        </button>
      </div>
    );

    const SField = ({label,k,type="text",placeholder="",rows,form,set}) => {
      const LBL={fontSize:11,color:C.mut,marginBottom:5,fontWeight:700,display:"block"};
      return(
        <div style={{marginBottom:14}}>
          <label style={LBL}>{label}</label>
          {rows ? (
            <textarea value={form[k]||""} onChange={e=>set(k,e.target.value)}
              placeholder={placeholder} rows={rows}
              style={{...INP,resize:"vertical",width:"100%",boxSizing:"border-box",fontSize:12}}/>
          ) : (
            <input type={type} value={form[k]||""} onChange={e=>set(k,e.target.value)}
              placeholder={placeholder}
              style={{...INP,width:"100%",boxSizing:"border-box",fontSize:12}}/>
          )}
        </div>
      );
    };

    const SSelect = ({label,k,options,sub,form,set}) => (
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:14}}>
        <div>
          <div style={{fontSize:13,color:C.txt,fontWeight:600}}>{label}</div>
          {sub&&<div style={{fontSize:11,color:C.mut,marginTop:2}}>{sub}</div>}
        </div>
        <select value={form[k]||""} onChange={e=>set(k,e.target.value)}
          style={{...INP,fontSize:12,flexShrink:0,minWidth:130}}>
          {options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
        </select>
      </div>
    );

    function SettingsView({settings,onSave,isLight,setIsLight,notify,products,customers,sales,suppliers,purchases,reload}){
      const [tab, setTab] = useState("store");
      const [form, setForm] = useState({...settings});
      const set = (k,v) => setForm(f=>({...f,[k]:v}));
      // ── ثوابت أنماط CSS محلية ──
      const LBL = {fontSize:11,color:C.mut,marginBottom:5,fontWeight:700,display:"block"};
      const G   = {background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`};

      const TABS_S = [
        {id:"store",    icon:"🏪", label:"المتجر والفاتورة"},
        {id:"hardware", icon:"🖨️", label:"الأجهزة والطباعة"},
        {id:"pos",      icon:"🛒", label:"واجهة البيع"},
        {id:"display",  icon:"🖥️", label:"شاشة العميل"},
        {id:"inventory",icon:"📦", label:"المخزون"},
        {id:"data",     icon:"💾", label:"النظام والبيانات"},
      ];

      const saveAll = () => { onSave(form); notify("✅ تم حفظ الإعدادات"); };

      // ── تصدير البيانات كـ JSON ──
      const exportData = () => {
        const data = { products, customers, sales, suppliers, purchases,
          exportedAt: new Date().toISOString(), version:"1.0" };
        const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href=url; a.download=`pos-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click(); URL.revokeObjectURL(url);
        notify("✅ تم تصدير البيانات بنجاح");
      };

      // ── استيراد JSON ──
      const importData = (e) => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if(!data.products) throw new Error("ملف غير صالح");
            notify("⏳ جاري الاستيراد...");
            // هنا يمكن إضافة منطق الاستيراد
            notify("✅ تم استيراد البيانات — أعد تشغيل التطبيق لرؤية التغييرات");
          } catch(err){ notify("❌ فشل الاستيراد: "+err.message,"err"); }
        };
        reader.readAsText(file);
        e.target.value="";
      };

      // ── رفع الشعار ──
      const uploadLogo = (e) => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => { set("storeLogo", ev.target.result); };
        reader.readAsDataURL(file);
        e.target.value="";
      };

      // ── رفع وسائط شاشة العميل ──
      const uploadMedia = (e) => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => { set("displayMedia", ev.target.result); };
        reader.readAsDataURL(file);
        e.target.value="";
      };

      return(
        <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 54px)",overflow:"hidden",fontFamily:"Tajawal,sans-serif"}}>

          {/* Header */}
          <div style={{padding:"12px 16px",background:C.surf,borderBottom:`1px solid ${C.brd}`,flexShrink:0,
            display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontWeight:900,fontSize:16,color:C.txt}}>⚙️ الإعدادات</div>
            <button onClick={saveAll} style={{
              background:`linear-gradient(135deg,${C.grn},#059669)`,color:"#fff",
              border:"none",borderRadius:8,padding:"8px 20px",cursor:"pointer",
              fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:13}}>
              💾 حفظ الإعدادات
            </button>
          </div>

          <div style={{flex:1,display:"flex",overflow:"hidden"}}>

            {/* Sidebar tabs */}
            <div style={{width:180,background:C.surf,borderLeft:`1px solid ${C.brd}`,
              flexShrink:0,overflowY:"auto",padding:8}}>
              {TABS_S.map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)} style={{
                  width:"100%",display:"flex",alignItems:"center",gap:9,
                  padding:"10px 12px",borderRadius:9,border:"none",cursor:"pointer",
                  background:tab===t.id?`${C.acc}22`:"transparent",
                  color:tab===t.id?C.acc:C.sub,
                  fontFamily:"Tajawal,sans-serif",fontWeight:tab===t.id?800:500,
                  fontSize:12,marginBottom:2,textAlign:"right",
                  borderRight:tab===t.id?`3px solid ${C.acc}`:"3px solid transparent",
                  transition:"all .15s"
                }}>
                  <span>{t.icon}</span><span>{t.label}</span>
                </button>
              ))}
            </div>

            {/* Content */}
            <div style={{flex:1,overflowY:"auto",padding:16}}>

              {/* ══ 1. المتجر والفاتورة ══ */}
              {tab==="store"&&(<>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>🏪 هوية المتجر</div>
                  <SField label="اسم المتجر" k="storeName" placeholder="مكتبة حشايشي — منذ 2002" form={form} set={set}/>
                  <SField label="رقم الهاتف" k="storePhone" placeholder="0550 000 000" type="tel" form={form} set={set}/>
                  <SField label="العنوان" k="storeAddress" placeholder="شارع الاستقلال، ورقلة" form={form} set={set}/>
                </div>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>📄 تخصيص الفاتورة</div>
                  <SField label="تذييل الفاتورة" k="invoiceFooter" placeholder="شكراً لزيارتكم 🙏" rows={2} form={form} set={set}/>
                  <div style={{marginBottom:14}}>
                    <label style={LBL}>شعار المتجر (Logo)</label>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      {form.storeLogo&&(
                        <img src={form.storeLogo} alt="logo"
                          style={{width:64,height:64,objectFit:"contain",
                            background:C.bg,borderRadius:8,border:`1px solid ${C.brd}`,padding:4}}/>
                      )}
                      <div>
                        <label style={{
                          background:C.card2,color:C.sub,border:`1px solid ${C.brd}`,
                          borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:12,
                          fontFamily:"Tajawal,sans-serif",display:"inline-block"}}>
                          📁 اختر صورة
                          <input type="file" accept="image/*" style={{display:"none"}} onChange={uploadLogo}/>
                        </label>
                        {form.storeLogo&&(
                          <button onClick={()=>set("storeLogo","")}
                            style={{marginRight:8,background:"#450a0a",color:C.red,border:"none",
                              borderRadius:6,padding:"7px 10px",cursor:"pointer",fontSize:11,
                              fontFamily:"Tajawal,sans-serif"}}>✕ حذف</button>
                        )}
                        <div style={{fontSize:10,color:C.mut,marginTop:4}}>PNG أو JPG — يظهر على الفاتورة</div>
                      </div>
                    </div>
                  </div>
                </div>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>🔗 مفاتيح الربط</div>
                  <SField label="Supabase URL" k="supaUrl" placeholder="https://xxxx.supabase.co" type="url" form={form} set={set}/>
                  <SField label="Supabase Anon Key" k="supaKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6Ik..." form={form} set={set}/>
                  <SField label="Telegram Bot Token" k="tgToken" placeholder="123456:ABC-DEF..." form={form} set={set}/>
                  <div style={{height:1,background:C.brd,margin:"4px 0 12px"}}/>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                    <span style={{fontSize:16}}>✨</span>
                    <div style={{fontSize:13,fontWeight:800,color:C.acc}}>مفتاح الذكاء الاصطناعي</div>
                  </div>
                  <SField label="Groq API Key (ملخص اليوم الذكي — مجاني)" k="anthropicKey" placeholder="gsk_..." form={form} set={set}/>
                  <div style={{fontSize:10,color:C.mut,marginTop:-8,marginBottom:6}}>
                    مجاني 100% — احصل عليه من <span style={{color:C.blu}}>console.groq.com</span> ← API Keys ← Create
                  </div>
                  <div style={{fontSize:10,color:C.red,marginTop:4,marginBottom:6}}>
                    ⚠️ مفاتيح Supabase وTelegram تُطبَّق عند إعادة تشغيل التطبيق
                  </div>
                </div>
              </>)}

              {/* ══ 2. الأجهزة والطباعة ══ */}
              {tab==="hardware"&&(<>
                <div style={{...G,borderColor:`${C.amb}40`,background:`${C.amb}08`}}>
                  <div style={{fontSize:11,color:C.amb,marginBottom:8}}>
                    ℹ️ إعدادات الطابعة الصامتة تعمل فقط في نسخة سطح المكتب (Electron)
                  </div>
                </div>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>🖨️ إعدادات الطباعة</div>
                  <SSelect label="مقاس ورق الإيصال" k="paperSize" options={[
                    {v:"80mm",l:"80mm — المقاس القياسي"},
                    {v:"58mm",l:"58mm — المقاس الصغير"},
                    {v:"a4",  l:"A4 — ورق عادي"},
                  ]} sub="يؤثر على تنسيق الإيصال المطبوع" form={form} set={set}/>
                  <SToggle val={!!(form.silentPrint)} onChange={v=>set("silentPrint",v)}
                    label="الطباعة الصامتة"
                    sub="بدون نافذة تأكيد الطباعة — Electron فقط"/>
                  <SToggle val={!!(form.autoPrintAfterSale)} onChange={v=>set("autoPrintAfterSale",v)}
                    label="طباعة تلقائية بعد كل بيع"
                    sub="يطبع الإيصال مباشرة بعد إتمام البيع"/>
                </div>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>📷 ماسح الباركود</div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:14}}>
                    <div>
                      <div style={{fontSize:13,color:C.txt,fontWeight:600}}>تأخير القراءة المزدوجة (ms)</div>
                      <div style={{fontSize:11,color:C.mut,marginTop:2}}>يمنع تسجيل المنتج مرتين عند المسح السريع</div>
                    </div>
                    <input type="number" min={50} max={500} value={form.scanDelay||120}
                      onChange={e=>set("scanDelay",parseInt(e.target.value))}
                      style={{...INP,width:90,textAlign:"center",fontSize:13}}/>
                  </div>
                </div>
              </>)}

              {/* ══ 3. واجهة البيع ══ */}
              {tab==="pos"&&(<>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>🎨 المظهر</div>
                  <SSelect label="الوضع الافتراضي عند الفتح" k="defaultTheme" options={[
                    {v:"dark", l:"🌙 الوضع الليلي"},
                    {v:"light",l:"☀️ الوضع النهاري"},
                  ]} form={form} set={set}/>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:14}}>
                    <div style={{fontSize:13,color:C.txt,fontWeight:600}}>المظهر الحالي</div>
                    <button onClick={()=>{setIsLight(v=>!v);}}
                      style={{background:C.card2,color:C.sub,border:`1px solid ${C.brd}`,
                        borderRadius:8,padding:"7px 16px",cursor:"pointer",
                        fontFamily:"Tajawal,sans-serif",fontSize:12}}>
                      {isLight?"🌙 التبديل للليلي":"☀️ التبديل للنهاري"}
                    </button>
                  </div>
                </div>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>🔊 الأصوات</div>
                  <SToggle val={!(form.muteSound)} onChange={v=>set("muteSound",!v)}
                    label="أصوات الكاشير التفاعلية"
                    sub="صوت عند إضافة منتج وعند إتمام البيع"/>
                  <SToggle val={!!(form.notifSound)} onChange={v=>set("notifSound",v)}
                    label="صوت طلبات تلغرام الجديدة"
                    sub="تنبيه صوتي عند وصول طلب جديد"/>
                </div>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>💳 طريقة الدفع</div>
                  <SSelect label="طريقة الدفع الافتراضية" k="defaultPayMethod" options={[
                    {v:"cash",     l:"💵 نقداً"},
                    {v:"cib",      l:"💳 CIB"},
                    {v:"baridimob",l:"📱 بريدي موب"},
                  ]} sub="تُحدد الطريقة المختارة تلقائياً عند فتح شاشة الدفع" form={form} set={set}/>
                </div>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>🏷️ الخصومات والأسعار</div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:14}}>
                    <div>
                      <div style={{fontSize:13,color:C.txt,fontWeight:600}}>أقصى خصم مسموح به (%)</div>
                      <div style={{fontSize:11,color:C.mut,marginTop:2}}>يمنع الكاشير من تجاوز هذه النسبة</div>
                    </div>
                    <input type="number" min={0} max={100} value={form.maxDiscount??30}
                      onChange={e=>set("maxDiscount",parseInt(e.target.value))}
                      style={{...INP,width:80,textAlign:"center",fontSize:13}}/>
                  </div>
                  <SToggle val={!!(form.allowPriceEdit)} onChange={v=>set("allowPriceEdit",v)}
                    label="السماح بتعديل السعر في السلة"
                    sub="يتيح للكاشير تغيير سعر أي منتج يدوياً"/>
                </div>
              </>)}

              {/* ══ 4. شاشة العميل ══ */}
              {tab==="display"&&(<>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>💬 رسائل الشاشة</div>
                  <SField label="رسالة الترحيب (السلة فارغة)" k="displayWelcome"
                    placeholder="أهلاً بكم في مكتبة حشايشي 🙏" form={form} set={set}/>
                  <SField label="الرسالة الثانوية" k="displaySubtitle"
                    placeholder="نتمنى لكم تسوقاً ممتعاً" form={form} set={set}/>
                </div>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>🎬 وسائط الشاشة (Screensaver)</div>
                  <div style={{marginBottom:12}}>
                    {form.displayMedia?(
                      <div style={{marginBottom:10}}>
                        {form.displayMedia.startsWith("data:video")?(
                          <video src={form.displayMedia} controls
                            style={{width:"100%",maxHeight:140,borderRadius:8,background:"#000"}}/>
                        ):(
                          <img src={form.displayMedia} alt="media"
                            style={{width:"100%",maxHeight:140,objectFit:"cover",borderRadius:8}}/>
                        )}
                      </div>
                    ):(
                      <div style={{height:80,background:C.bg,borderRadius:8,border:`1px dashed ${C.brd}`,
                        display:"flex",alignItems:"center",justifyContent:"center",marginBottom:10}}>

                      </div>
                    )}
                    <div style={{display:"flex",gap:8}}>
                      <label style={{background:C.card2,color:C.sub,border:`1px solid ${C.brd}`,
                        borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:12,
                        fontFamily:"Tajawal,sans-serif"}}>
                        📁 رفع صورة أو فيديو
                        <input type="file" accept="image/*,video/mp4,video/webm"
                          style={{display:"none"}} onChange={uploadMedia}/>
                      </label>
                      {form.displayMedia&&(
                        <button onClick={()=>set("displayMedia","")}
                          style={{background:"#450a0a",color:C.red,border:"none",
                            borderRadius:6,padding:"7px 10px",cursor:"pointer",
                            fontSize:11,fontFamily:"Tajawal,sans-serif"}}>✕ حذف</button>
                      )}
                    </div>
                    <div style={{fontSize:10,color:C.mut,marginTop:6}}>
                      MP4، WebM، PNG، JPG — تُعرض عند عدم وجود نشاط في السلة
                    </div>
                  </div>
                </div>
              </>)}

              {/* ══ 5. المخزون والتنبيهات ══ */}
              {tab==="inventory"&&(<>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>📦 تنبيهات المخزون</div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:14}}>
                    <div>
                      <div style={{fontSize:13,color:C.txt,fontWeight:600}}>حد التنبيه الافتراضي</div>
                      <div style={{fontSize:11,color:C.mut,marginTop:2}}>يُعتبر المنتج "شارف على النفاد" دون هذا الرقم</div>
                    </div>
                    <input type="number" min={1} max={100} value={form.defaultMinStock??5}
                      onChange={e=>set("defaultMinStock",parseInt(e.target.value))}
                      style={{...INP,width:80,textAlign:"center",fontSize:13}}/>
                  </div>
                  <SToggle val={!!(form.blockSaleIfNoStock)} onChange={v=>set("blockSaleIfNoStock",v)}
                    label="منع البيع عند نفاد المخزون"
                    sub="يرفض إضافة المنتج للسلة إذا كان المخزون صفراً"/>
                  <SToggle val={!!(form.notifyLowStock)} onChange={v=>set("notifyLowStock",v)}
                    label="إشعار عند اقتراب النفاد"
                    sub="تنبيه تلقائي عند وصول المخزون لحد التنبيه"/>
                </div>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>📊 ملخص المخزون الحالي</div>
                  {(()=>{
                    const total  = products.length;
                    const outOf  = products.filter(p=>p.stock<=0).length;
                    const low    = products.filter(p=>p.stock>0&&p.stock<=(p.minStock||form.defaultMinStock||5)).length;
                    const ok     = total - outOf - low;
                    return(
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                        {[
                          {l:"متوفر",   n:ok,     c:C.grn},
                          {l:"يقترب النفاد",n:low, c:C.amb},
                          {l:"نفد المخزون",n:outOf,c:C.red},
                        ].map(({l,n,c})=>(
                          <div key={l} style={{background:C.bg,borderRadius:10,padding:"12px 10px",textAlign:"center",border:`1px solid ${c}33`}}>
                            <div style={{fontSize:22,fontWeight:900,color:c}}>{n}</div>
                            <div style={{fontSize:10,color:C.mut,marginTop:3}}>{l}</div>
                          </div>
                        ))}
                      </div>
                    );
                  })()}
                </div>
              </>)}

              {/* ══ 6. النظام والبيانات ══ */}
              {tab==="data"&&(<>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>💾 النسخ الاحتياطي</div>
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
                    <button onClick={exportData} style={{
                      background:"linear-gradient(135deg,#1e3a5f,#1e40af)",color:"#60a5fa",
                      border:"1px solid #1e40af",borderRadius:8,padding:"10px 18px",
                      cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:13,
                      display:"flex",alignItems:"center",gap:6}}>
                      ⬇️ تصدير JSON
                    </button>
                    <label style={{
                      background:"linear-gradient(135deg,#064e3b,#065f46)",color:"#6ee7b7",
                      border:"1px solid #065f46",borderRadius:8,padding:"10px 18px",
                      cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:13,
                      display:"flex",alignItems:"center",gap:6}}>
                      ⬆️ استيراد JSON
                      <input type="file" accept=".json" style={{display:"none"}} onChange={importData}/>
                    </label>
                  </div>
                  <div style={{fontSize:10,color:C.mut,lineHeight:1.7}}>
                    📦 الملف يحتوي على: المنتجات ({products.length}) — العملاء ({customers.length}) — المبيعات ({sales.length}) — الموردون ({suppliers.length})
                  </div>
                </div>
                <div style={{background:C.card,borderRadius:12,padding:"18px 20px",marginBottom:12,border:`1px solid ${C.brd}`}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:14}}>ℹ️ معلومات النظام</div>
                  {[
                    {l:"إصدار البرنامج",      v:"v5.0"},
                    {l:"إجمالي المنتجات",     v:products.length+" منتج"},
                    {l:"إجمالي المبيعات",     v:sales.length+" عملية"},
                    {l:"إجمالي العملاء",      v:customers.length+" عميل"},
                    {l:"حجم بيانات localStorage", v:(()=>{try{return(JSON.stringify(localStorage).length/1024).toFixed(1)+"KB"}catch(_){return"N/A"}})()},
                  ].map(({l,v})=>(
                    <div key={l} style={{display:"flex",justifyContent:"space-between",
                      padding:"7px 0",borderBottom:`1px solid ${C.brd}22`,fontSize:12}}>
                      <span style={{color:C.mut}}>{l}</span>
                      <span style={{color:C.txt,fontWeight:600}}>{v}</span>
                    </div>
                  ))}
                </div>
                <div style={{...G,borderColor:"#ef444440"}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.red,marginBottom:14}}>⚠️ منطقة الخطر</div>
                  <button onClick={()=>{
                    if(!confirm("هل أنت متأكد من مسح جميع الإعدادات المحلية؟\nلن تُحذف بيانات Supabase."))return;
                    localStorage.removeItem("pos_settings");
                    notify("✓ تم مسح الإعدادات — أعد تحميل الصفحة");
                  }} style={{background:"#450a0a",color:C.red,border:"1px solid #ef444440",
                    borderRadius:8,padding:"9px 16px",cursor:"pointer",
                    fontFamily:"Tajawal,sans-serif",fontSize:12,fontWeight:700}}>
                    🗑️ مسح الإعدادات المحلية
                  </button>
                </div>
              </>)}

            </div>
          </div>
        </div>
      );
    }
    // ════════════════════════════════════════════════════════════
    // ══════════════════════════════════════════════
    //  PURCHASE MODAL — فاتورة الشراء من المورد
    // ══════════════════════════════════════════════
    // ══════════════════════════════════════════════
    //  InvoiceOCRModal — قراءة فواتير الموردين بالذكاء الاصطناعي
    // ══════════════════════════════════════════════
    function InvoiceOCRModal({onClose, products, cats, appSettings, onApply, onProductCreated}) {
      const [imgData,   setImgData]  = useState(null);
      const [loading,   setLoading]  = useState(false);
      const [result,    setResult]   = useState(null);
      const [error,     setError]    = useState(null);
      const [selected,  setSelected] = useState({});
      // نموذج إنشاء منتج جديد: {idx, name, category, price, cost, qty, unit}
      const [newProdForm, setNPF]    = useState(null);
      const [npSaving,    setNPS]    = useState(false);
      // منتجات تم إنشاؤها مؤقتاً في هذه الجلسة {idx -> product}
      const [created,   setCreated]  = useState({});
      const fileRef = useRef(null);

      const handleFile = e => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          setImgData(ev.target.result);
          setResult(null); setError(null); setSelected({}); setCreated({});
        };
        reader.readAsDataURL(file);
      };

      const analyze = async () => {
        if(!imgData) return;
        const apiKey = appSettings?.anthropicKey;
        if(!apiKey){ setError("no_key"); return; }
        setLoading(true); setError(null); setResult(null); setCreated({});

        const prodList = products.map(p=>`${p.name}|${p.category||""}|تكلفة:${p.cost||0}دج`).join("\n");
        const prompt = `You are analyzing an Algerian stationery supplier invoice. It may be in Arabic, French, or both.\n\nExtract ALL line items. For each item:\n- name: exact text on invoice\n- matched_name: best match from inventory list below (or null if no match)\n- qty: quantity (integer)\n- cost: unit purchase price (number, 0 if not found)\n- confidence: 0-1 match confidence\n\nInventory:\n${prodList}\n\nReturn ONLY a JSON array, no other text, no markdown:\n[{"name":"...","matched_name":"...or null","qty":1,"cost":0,"confidence":0.9}]`;

        try {
          const resp = await fetch("https://api.groq.com/openai/v1/chat/completions",{
            method:"POST",
            headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
            body:JSON.stringify({
              model:"meta-llama/llama-4-scout-17b-16e-instruct",
              max_tokens:1500,
              messages:[{role:"user",content:[
                {type:"image_url",image_url:{url:imgData}},
                {type:"text",text:prompt}
              ]}]
            })
          });
          if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${resp.status}`);}
          const data  = await resp.json();
          let   text  = data.choices?.[0]?.message?.content||"";
          text         = text.replace(/```json|```/g,"").trim();
          const items  = JSON.parse(text);
          const enriched = items.map(it=>({
            ...it,
            product: products.find(p=>p.name===it.matched_name)||null
          }));
          setResult(enriched);
          const initSel={};
          enriched.forEach((it,i)=>{ if(it.product) initSel[i]=true; });
          setSelected(initSel);
        } catch(e){ setError(e.message); }
        finally{ setLoading(false); }
      };

      // فتح نموذج إنشاء منتج جديد لبند معين
      const openNewProd = (it, idx) => {
        const det = detectIcon(it.name||"");
        setNPF({
          idx,
          name:     it.name||"",
          category: cats[0]?.name||"عام",
          price:    String(Math.round((it.cost||0)*1.3)),
          cost:     String(it.cost||""),
          qty:      String(it.qty||1),
          unit:     "قطعة",
          stock:    String(it.qty||0),
          minStock: "5",
          icon:     det.icon,
          iconColor:det.color,
        });
      };

      // حفظ المنتج الجديد
      const saveNewProd = async () => {
        if(!newProdForm?.name||!newProdForm?.price) return;
        setNPS(true);
        try {
          const prod = {
            name:     newProdForm.name,
            category: newProdForm.category,
            price:    safeNum(newProdForm.price),
            cost:     safeNum(newProdForm.cost),
            stock:    safeInt(newProdForm.stock),
            minStock: safeInt(newProdForm.minStock)||5,
            unit:     newProdForm.unit||"قطعة",
            icon:     newProdForm.icon,
            iconColor:newProdForm.iconColor,
          };
          const id = await onProductCreated(prod);
          // أضف المنتج للقائمة المحلية واعلمه كـ matched
          const fullProd = {...prod, id};
          setCreated(c=>({...c,[newProdForm.idx]:fullProd}));
          setResult(r=>r.map((it,i)=>i===newProdForm.idx?{...it,product:fullProd}:it));
          setSelected(s=>({...s,[newProdForm.idx]:true}));
          setNPF(null);
        } catch(e){ alert("خطأ في الحفظ: "+e.message); }
        finally{ setNPS(false); }
      };

      const apply = () => {
        const allProds = [...products, ...Object.values(created)];
        const lines = result
          .filter((it,i)=>selected[i] && (it.product || created[i]))
          .map((it,i)=>({
            prodId: String((it.product||created[i]).id),
            qty:    String(it.qty||1),
            cost:   String(it.cost||(it.product||created[i]).cost||"")
          }));
        if(!lines.length) return;
        onApply(lines);
        onClose();
      };

      const confColor = c => c>=0.85?C.grn:c>=0.6?C.amb:C.red;
      const total = result
        ? result.filter((it,i)=>selected[i]&&(it.product||created[i]))
            .reduce((s,it)=>safeInt(it.qty)*safeNum(it.cost)+s,0)
        : 0;
      const matchedCount  = result ? result.filter((it,i)=>selected[i]&&(it.product||created[i])).length : 0;
      const unmatchedCount= result ? result.filter((it,i)=>!it.product&&!created[i]).length : 0;

      return(
        <div onClick={e=>{if(e.target===e.currentTarget)onClose();}}
          style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:3500,
            display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
          <div style={{background:C.surf,borderRadius:18,width:"100%",maxWidth:500,
            border:`1px solid ${C.brd}`,maxHeight:"92vh",display:"flex",flexDirection:"column",
            boxShadow:"0 24px 64px rgba(0,0,0,.6)"}}>

            {/* رأس */}
            <div style={{padding:"13px 18px",borderBottom:`1px solid ${C.brd}`,flexShrink:0,
              background:`linear-gradient(135deg,${C.grn}15,${C.acc}08)`,
              display:"flex",alignItems:"center",justifyContent:"space-between",borderRadius:"18px 18px 0 0"}}>
              <div>
                <div style={{fontWeight:900,fontSize:15,color:C.txt}}>📷 قراءة الفاتورة بالذكاء الاصطناعي</div>
                <div style={{fontSize:10,color:C.mut,marginTop:2}}>صوّر أو ارفع صورة فاتورة المورد</div>
              </div>
              <button onClick={onClose} style={{background:"none",border:"none",color:C.mut,fontSize:22,cursor:"pointer"}}>✕</button>
            </div>

            <div style={{flex:1,overflowY:"auto",padding:"14px 16px"}}>

              {/* منطقة الصورة */}
              {!imgData ? (
                <div onClick={()=>fileRef.current?.click()}
                  style={{border:`2px dashed ${C.brd}`,borderRadius:14,padding:"30px 20px",
                    textAlign:"center",cursor:"pointer",marginBottom:14,
                    background:C.card,transition:"all .15s"}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor=C.grn}
                  onMouseLeave={e=>e.currentTarget.style.borderColor=C.brd}>
                  <div style={{fontSize:44,marginBottom:10}}>📄</div>
                  <div style={{fontWeight:800,fontSize:14,color:C.txt,marginBottom:4}}>اضغط لرفع صورة الفاتورة</div>
                  <div style={{fontSize:11,color:C.mut}}>أو التقط صورة بالكاميرا</div>
                  <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:14}}>
                    <span style={{fontSize:10,background:C.card2,borderRadius:8,padding:"4px 10px",color:C.mut}}>📸 كاميرا</span>
                    <span style={{fontSize:10,background:C.card2,borderRadius:8,padding:"4px 10px",color:C.mut}}>🖼️ معرض الصور</span>
                    <span style={{fontSize:10,background:C.card2,borderRadius:8,padding:"4px 10px",color:C.mut}}>JPG · PNG</span>
                  </div>
                </div>
              ) : (
                <div style={{marginBottom:14}}>
                  <img src={imgData} alt="فاتورة"
                    style={{width:"100%",maxHeight:200,objectFit:"contain",
                      borderRadius:10,border:`1px solid ${C.brd}`,background:C.card,display:"block"}}/>
                  <div style={{display:"flex",gap:8,marginTop:8}}>
                    <button onClick={()=>fileRef.current?.click()}
                      style={{flex:1,background:C.card2,border:`1px solid ${C.brd}`,borderRadius:8,
                        padding:"7px",cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontSize:12,color:C.mut}}>
                      🔄 تغيير
                    </button>
                    <button onClick={analyze} disabled={loading}
                      style={{flex:2,background:loading?C.card2:`linear-gradient(135deg,${C.grn},#047857)`,
                        color:loading?C.mut:"#fff",border:"none",borderRadius:8,padding:"7px",
                        cursor:loading?"default":"pointer",fontFamily:"Tajawal,sans-serif",
                        fontSize:13,fontWeight:800,transition:"all .15s"}}>
                      {loading?"⏳ يحلّل الفاتورة...":"🔍 تحليل بالذكاء الاصطناعي"}
                    </button>
                  </div>
                </div>
              )}

              <input ref={fileRef} type="file" accept="image/*" capture="environment"
                onChange={handleFile} style={{display:"none"}}/>

              {/* خطأ */}
              {error && (
                <div style={{background:`${C.red}12`,border:`1px solid ${C.red}30`,
                  borderRadius:10,padding:"10px 14px",marginBottom:12}}>
                  {error==="no_key"
                    ?<div style={{fontSize:12,color:C.red}}>🔑 أضف مفتاح Groq في <b>الإعدادات ← مفاتيح الربط</b></div>
                    :<div style={{fontSize:11,color:C.red,wordBreak:"break-all"}}>⚠️ {error}</div>}
                </div>
              )}

              {/* ── نموذج إنشاء منتج جديد ── */}
              {newProdForm && (
                <div style={{position:"sticky",top:0,zIndex:10,
                  background:C.surf,border:`2px solid ${C.acc}`,borderRadius:14,
                  padding:"14px 14px",marginBottom:12,
                  boxShadow:`0 8px 32px rgba(0,0,0,.4)`}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                    <div style={{fontWeight:900,fontSize:13,color:C.acc}}>
                      ➕ إضافة منتج جديد للمخزون
                    </div>
                    <button onClick={()=>setNPF(null)}
                      style={{background:"none",border:"none",color:C.mut,fontSize:18,cursor:"pointer",lineHeight:1}}>✕</button>
                  </div>
                  {/* preview icon + name */}
                  <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12,
                    background:C.bg,borderRadius:10,padding:"8px 10px",border:`1px solid ${C.brd}`}}>
                    <div style={{width:36,height:36,borderRadius:9,
                      background:`${newProdForm.iconColor}22`,
                      display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>
                      {newProdForm.icon}
                    </div>
                    <input value={newProdForm.name}
                      onChange={e=>{
                        const det=detectIcon(e.target.value);
                        setNPF(f=>({...f,name:e.target.value,icon:det.icon,iconColor:det.color}));
                      }}
                      placeholder="اسم المنتج *"
                      style={{...INP,flex:1,fontWeight:700,fontSize:13}}/>
                  </div>
                  {/* الحقول */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                    <div>
                      <div style={{fontSize:10,color:C.mut,marginBottom:4,fontWeight:600}}>التصنيف</div>
                      <select value={newProdForm.category}
                        onChange={e=>setNPF(f=>({...f,category:e.target.value}))}
                        style={{...INP,fontSize:12}}>
                        {cats.map(c=><option key={c.id||c.name} value={c.name}>{c.icon} {c.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:C.mut,marginBottom:4,fontWeight:600}}>الوحدة</div>
                      <select value={newProdForm.unit}
                        onChange={e=>setNPF(f=>({...f,unit:e.target.value}))}
                        style={{...INP,fontSize:12}}>
                        {["قطعة","علبة","رزمة","دفتر","ورقة","كراس","كيلو"].map(u=>
                          <option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:C.mut,marginBottom:4,fontWeight:600}}>سعر الشراء (دج) *</div>
                      <input type="number" value={newProdForm.cost}
                        onChange={e=>setNPF(f=>({...f,cost:e.target.value,
                          price:f.price||String(Math.round(safeNum(e.target.value)*1.3))}))}
                        placeholder="0" style={{...INP,fontSize:12}}/>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:C.mut,marginBottom:4,fontWeight:600}}>سعر البيع (دج) *</div>
                      <input type="number" value={newProdForm.price}
                        onChange={e=>setNPF(f=>({...f,price:e.target.value}))}
                        placeholder="0" style={{...INP,fontSize:12}}/>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:C.mut,marginBottom:4,fontWeight:600}}>الكمية الأولية</div>
                      <input type="number" value={newProdForm.stock}
                        onChange={e=>setNPF(f=>({...f,stock:e.target.value}))}
                        placeholder="0" style={{...INP,fontSize:12}}/>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:C.mut,marginBottom:4,fontWeight:600}}>حد التنبيه</div>
                      <input type="number" value={newProdForm.minStock}
                        onChange={e=>setNPF(f=>({...f,minStock:e.target.value}))}
                        placeholder="5" style={{...INP,fontSize:12}}/>
                    </div>
                  </div>
                  {/* هامش الربح */}
                  {newProdForm.cost>0&&newProdForm.price>0&&(
                    <div style={{fontSize:11,color:C.grn,marginBottom:8,fontWeight:600,
                      background:`${C.grn}10`,borderRadius:7,padding:"4px 9px",display:"inline-block"}}>
                      هامش الربح: {Math.round((safeNum(newProdForm.price)-safeNum(newProdForm.cost))/safeNum(newProdForm.price)*100)}%
                      — {fmt(safeNum(newProdForm.price)-safeNum(newProdForm.cost))} دج
                    </div>
                  )}
                  <div style={{display:"flex",gap:7}}>
                    <button onClick={()=>setNPF(null)}
                      style={{flex:1,background:C.card2,border:`1px solid ${C.brd}`,borderRadius:9,
                        padding:"9px",color:C.mut,fontFamily:"Tajawal,sans-serif",fontSize:12,cursor:"pointer"}}>
                      إلغاء
                    </button>

                      style={{flex:2,background:npSaving||!newProdForm.name||!newProdForm.price

                        color:npSaving||!newProdForm.name||!newProdForm.price?"#666":"#080f1e",
                        border:"none",borderRadius:9,padding:"9px",
                        fontFamily:"Tajawal,sans-serif",fontSize:13,fontWeight:900,cursor:"pointer",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                      {npSaving

                        :<>✅ إضافة للمخزون</>}
                    </button>

                </div>

                    <div style={{fontSize:12,fontWeight:700,color:C.mut}}>
