                    </div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {unmatchedCount>0&&(
                        <span style={{fontSize:10,background:`${C.red}15`,border:`1px solid ${C.red}30`,
                          borderRadius:8,padding:"2px 8px",color:C.red,fontWeight:700}}>
                          {unmatchedCount} غير متطابق
                        </span>
                      )}
                      <button onClick={()=>{
                        const all={}; result.forEach((_,i)=>{if(result[i].product||created[i])all[i]=true;});
                        setSelected(all);
                      }} style={{fontSize:10,background:C.card2,border:`1px solid ${C.brd}`,
                        borderRadius:6,padding:"3px 8px",cursor:"pointer",color:C.mut,fontFamily:"Tajawal,sans-serif"}}>
                        تحديد الكل
                      </button>
                    </div>
                  </div>

                  {result.map((it,i)=>{
                    const prod = it.product || created[i];
                    const isNew = !!created[i];
                    return(
                      <div key={i}
                        onClick={()=>prod&&setSelected(s=>({...s,[i]:!s[i]}))}
                        style={{background:selected[i]?`${C.grn}10`:prod?C.card:"#450a0a15",
                          border:`1.5px solid ${selected[i]?C.grn:prod?C.brd:"#ef444430"}`,
                          borderRadius:10,padding:"10px 12px",marginBottom:7,
                          cursor:prod?"pointer":"default",transition:"all .15s"}}>
                        <div style={{display:"flex",alignItems:"flex-start",gap:9}}>
                          {/* checkbox */}
                          <div style={{width:20,height:20,borderRadius:5,flexShrink:0,marginTop:1,
                            background:selected[i]?C.grn:C.card2,
                            border:`1.5px solid ${selected[i]?C.grn:C.brd}`,
                            display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff"}}>
                            {selected[i]?"✓":""}
                          </div>
                          <div style={{flex:1}}>
                            {/* اسم + بيانات */}
                            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:4}}>
                              <span style={{fontSize:12,fontWeight:800,color:C.txt}}>{it.name}</span>
                              <span style={{fontSize:10,background:C.brd,color:C.mut,borderRadius:8,padding:"1px 7px"}}>×{it.qty}</span>
                              {it.cost>0&&<span style={{fontSize:10,color:C.acc,fontWeight:700}}>{fmt(it.cost)} دج</span>}
                              <span style={{fontSize:10,color:confColor(it.confidence),fontWeight:700}}>
                                {Math.round((it.confidence||0)*100)}%
                              </span>
                              {isNew&&<span style={{fontSize:9,background:`${C.pur}20`,color:C.pur,
                                borderRadius:6,padding:"1px 6px",fontWeight:700}}>جديد ✨</span>}
                            </div>
                            {/* حالة التطابق */}
                            {prod
                              ?<div style={{fontSize:11,color:isNew?C.pur:C.grn}}>
                                {isNew?"✨":"✓"} {prod.name}
                                <span style={{color:C.mut,marginRight:6}}>
                                  مخزون: {isNew?0:prod.stock} → <b style={{color:C.grn}}>{(isNew?0:prod.stock)+(safeInt(it.qty)||0)}</b>
                                </span>
                              </div>
                              :<div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                                <span style={{fontSize:11,color:"#ef4444"}}>✗ لا يوجد في المخزون</span>
                                <button
                                  onClick={e=>{e.stopPropagation(); openNewProd(it,i);}}
                                  style={{fontSize:10,background:`${C.acc}18`,
                                    border:`1px solid ${C.acc}40`,borderRadius:7,
                                    padding:"3px 9px",color:C.acc,cursor:"pointer",
                                    fontFamily:"Tajawal,sans-serif",fontWeight:700,
                                    display:"flex",alignItems:"center",gap:4}}>
                                  ➕ إضافة للمخزون
                                </button>
                              </div>
                            }
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* أسفل */}
            {result && (
              <div style={{padding:"10px 16px",borderTop:`1px solid ${C.brd}`,flexShrink:0,
                background:C.surf,display:"flex",alignItems:"center",gap:8}}>
                <div style={{flex:1,fontSize:11,color:C.mut}}>
                  <div style={{fontWeight:600}}>{matchedCount} منتج محدد {Object.keys(created).length>0&&`(${Object.keys(created).length} جديد)`}</div>
                  {total>0&&<div style={{color:C.acc,fontWeight:700}}>الإجمالي: {fmt(total)} دج</div>}
                </div>
                <button onClick={onClose}
                  style={{background:C.card2,color:C.sub,border:`1px solid ${C.brd}`,
                    borderRadius:8,padding:"8px 14px",cursor:"pointer",
                    fontFamily:"Tajawal,sans-serif",fontSize:12,fontWeight:700}}>
                  إلغاء
                </button>
                <button onClick={apply} disabled={matchedCount===0}
                  style={{background:matchedCount===0?C.card2:`linear-gradient(135deg,${C.grn},#047857)`,
                    color:matchedCount===0?C.mut:"#fff",
                    border:"none",borderRadius:8,padding:"8px 18px",cursor:matchedCount===0?"default":"pointer",
                    fontFamily:"Tajawal,sans-serif",fontSize:12,fontWeight:800}}>
                  ✅ تعبئة الفاتورة
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function PurchaseModal({supplier, products, appSettings, cats, notify, reload, onClose, onSave}){
      const [lines,    setLines]   = useState([{prodId:"",qty:1,cost:""}]);
      const [note,     setNote]    = useState("");
      const [saving,   setSaving]  = useState(false);
      const [showOCR,  setShowOCR] = useState(false);
      const [localProds, setLocalProds] = useState(products); // يتحدث عند إنشاء منتج جديد

      // تحديث localProds عند تغيير products الخارجية
      useEffect(()=>setLocalProds(products),[products]);

      const addLine  = () => setLines(l=>[...l,{prodId:"",qty:1,cost:""}]);
      const remLine  = i  => setLines(l=>l.filter((_,j)=>j!==i));
      const setLine  = (i,k,v) => setLines(l=>l.map((r,j)=>j===i?{...r,[k]:v}:r));

      const totalCost = lines.reduce((s,l)=>{
        const q=safeInt(l.qty), c=safeNum(l.cost);
        return s+q*c;
      },0);

      const handleSave = async()=>{
        const valid = lines.filter(l=>l.prodId&&parseInt(l.qty)>0);
        if(!valid.length){alert("أضف منتجاً واحداً على الأقل");return;}
        setSaving(true);
        try{ await onSave(valid, note); }
        finally{ setSaving(false); }
      };

      const OVL={position:"fixed",inset:0,background:"rgba(0,0,0,.65)",zIndex:3000,
        display:"flex",alignItems:"center",justifyContent:"center",padding:16};
      const BOX={background:C.surf,borderRadius:16,width:"100%",maxWidth:560,
        maxHeight:"88vh",display:"flex",flexDirection:"column",
        border:`1px solid ${C.brd}`,overflow:"hidden"};

      return(
        <div style={OVL} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
          <div style={BOX}>
            {/* Header */}
            <div style={{padding:"14px 18px",borderBottom:`1px solid ${C.brd}`,
              display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
              <div>
                <div style={{fontWeight:900,fontSize:15,color:C.txt}}>📦 فاتورة شراء</div>
                <div style={{fontSize:11,color:C.mut,marginTop:2}}>🏭 {supplier.name}</div>
              </div>
              <div style={{display:"flex",gap:7,alignItems:"center"}}>
                <button onClick={()=>setShowOCR(true)}
                  style={{background:`linear-gradient(135deg,${C.grn}20,${C.grn}10)`,
                    border:`1px solid ${C.grn}40`,borderRadius:8,padding:"7px 11px",
                    color:C.grn,cursor:"pointer",fontFamily:"Tajawal,sans-serif",
                    fontSize:11,fontWeight:800,display:"flex",alignItems:"center",gap:5}}>
                  📷 قراءة الفاتورة
                </button>
                <button onClick={onClose} style={{background:"none",border:"none",color:C.mut,fontSize:20,cursor:"pointer",lineHeight:1}}>✕</button>
              </div>
            </div>
            {/* OCR Modal */}
            {showOCR&&(
              <InvoiceOCRModal
                onClose={()=>setShowOCR(false)}
                products={localProds}
                cats={cats||[]}
                appSettings={appSettings}
                onApply={lines=>{ setLines(lines); setShowOCR(false); }}
                onProductCreated={async newProd=>{
                  // احفظ المنتج الجديد وأضفه للقائمة المحلية فوراً
                  const saved = await db.save("products", newProd);
                  if(reload) await reload(["products"]);
                  const id = saved?.id || saved?.[0]?.id;
                  if(id) setLocalProds(p=>[...p,{...newProd,id}]);
                  if(notify) notify(`✅ تمت إضافة "${newProd.name}" للمخزون`);
                  return id;
                }}
              />
            )}

            {/* Lines */}
            <div style={{flex:1,overflowY:"auto",padding:"12px 16px"}}>
              {lines.map((ln,i)=>{
                const prod = products.find(p=>String(p.id)===String(ln.prodId));
                return(
                  <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 70px 90px 32px",
                    gap:6,marginBottom:8,alignItems:"center"}}>
                    {/* المنتج */}
                    <select value={ln.prodId} onChange={e=>{
                        const p=products.find(x=>String(x.id)===String(e.target.value));
                        setLine(i,"prodId",e.target.value);
                        if(p&&!ln.cost) setLine(i,"cost",p.cost||"");
                      }}
                      style={{...INP,fontSize:12}}>
                      <option value="">— اختر منتجاً —</option>
                      {products.map(p=>(
                        <option key={p.id} value={p.id}>{p.name} (مخزون: {p.stock})</option>
                      ))}
                    </select>
                    {/* الكمية */}
                    <input type="number" min={1} value={ln.qty}
                      onChange={e=>setLine(i,"qty",e.target.value)}
                      placeholder="الكمية"
                      style={{...INP,fontSize:12,textAlign:"center"}}/>
                    {/* سعر الشراء */}
                    <input type="number" min={0} value={ln.cost}
                      onChange={e=>setLine(i,"cost",e.target.value)}
                      placeholder="سعر الشراء"
                      style={{...INP,fontSize:12,textAlign:"center"}}/>
                    {/* حذف */}
                    <button onClick={()=>remLine(i)}
                      style={{background:"#450a0a",color:C.red,border:"none",
                        borderRadius:6,width:32,height:32,cursor:"pointer",fontSize:14,
                        display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>

                    {/* معلومة المنتج */}
                    {prod&&<div style={{gridColumn:"1/-1",fontSize:10,color:C.mut,
                      background:C.bg,borderRadius:6,padding:"3px 8px",display:"flex",gap:12}}>
                      <span>📦 مخزون حالي: <b style={{color:C.acc}}>{prod.stock}</b></span>
                      <span>→ بعد الاستلام: <b style={{color:C.grn}}>{prod.stock+(parseInt(ln.qty)||0)}</b></span>
                      {ln.cost&&<span>💰 تكلفة السطر: <b style={{color:C.txt}}>{fmt(safeInt(ln.qty)*safeNum(ln.cost))} دج</b></span>}
                    </div>}
                  </div>
                );
              })}

              <button onClick={addLine} style={{width:"100%",background:C.bg,
                border:`1px dashed ${C.brd}`,borderRadius:8,padding:"8px 0",
                color:C.mut,cursor:"pointer",fontSize:12,fontFamily:"Tajawal,sans-serif",marginBottom:10}}>
                ＋ إضافة منتج آخر
              </button>

              <textarea value={note} onChange={e=>setNote(e.target.value)}
                placeholder="ملاحظات الفاتورة (اختياري)..."
                style={{...INP,resize:"vertical",minHeight:54,fontSize:12,width:"100%",boxSizing:"border-box"}}/>
            </div>

            {/* Footer */}
            <div style={{padding:"12px 16px",borderTop:`1px solid ${C.brd}`,
              flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
              <div style={{fontSize:13,color:C.txt}}>
                💰 الإجمالي: <b style={{color:C.acc}}>{fmt(totalCost)} دج</b>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={onClose}
                  style={{background:C.card,color:C.mut,border:`1px solid ${C.brd}`,
                    borderRadius:8,padding:"8px 16px",cursor:"pointer",
                    fontFamily:"Tajawal,sans-serif",fontSize:12}}>إلغاء</button>
                <button onClick={handleSave} disabled={saving}
                  style={{background:`linear-gradient(135deg,${C.grn},#059669)`,
                    color:"#fff",border:"none",borderRadius:8,padding:"8px 20px",
                    cursor:saving?"not-allowed":"pointer",fontFamily:"Tajawal,sans-serif",
                    fontWeight:800,fontSize:13,opacity:saving?.6:1}}>
                  {saving?"⏳ جارٍ الحفظ...":"✅ تأكيد الاستلام"}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════
    //  SUPPLIERS VIEW
    // ══════════════════════════════════════════════
    function SuppliersView({suppliers,products,purchases,cats,notify,reload,appSettings}){
      const[search,  setSrch]   = useState("");
      const[modal,   setModal]  = useState(false);
      const[edit,    setEdit]   = useState(null);
      const[purSup,  setPurSup] = useState(null);   // المورد المختار لفاتورة شراء
      const[tab,     setTab]    = useState("list");  // "list" | "history"

      const filt = suppliers.filter(s=>!search||s.name.includes(search)||(s.phone||"").includes(search));

      const del = async id=>{
        if(!confirm("حذف هذا المورد؟"))return;
        await db.remove("suppliers",id);
        await reload(["suppliers"]);
        notify("✓ تم الحذف");
      };

      // حفظ فاتورة الشراء وتحديث المخزون
      const savePurchase = async(lines, note)=>{
        // 1. تحديث مخزون كل منتج
        for(const ln of lines){
          const prod = products.find(p=>String(p.id)===String(ln.prodId));
          if(!prod) continue;
          const newStock = (prod.stock||0) + (parseInt(ln.qty)||0);
          const newCost  = parseFloat(ln.cost)||prod.cost||0;
          await db.save("products",{...prod, stock:newStock, cost:newCost});
        }
        // 2. حفظ الفاتورة في جدول purchases
        await db.save("purchases",{
          supplierId: purSup.id,
          supplierName: purSup.name,
          items: lines.map(l=>({
            prodId: l.prodId,
            prodName: (products.find(p=>String(p.id)===String(l.prodId))||{}).name||"",
            qty:     parseInt(l.qty),
            cost:    parseFloat(l.cost)||0,
          })),
          total: lines.reduce((s,l)=>safeInt(l.qty)*safeNum(l.cost)+s, 0),
          note: note||null,
          date: new Date().toISOString(),
        });
        await reload(["products","purchases"]);
        setPurSup(null);
        notify(`✅ تم تسجيل الفاتورة وتحديث مخزون ${lines.length} منتج`);
      };

      // سجل فواتير الشراء مرتبة من الأحدث
      const purHist = [...(purchases||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));

      return(
        <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 54px)",overflow:"hidden"}}>
          {/* Toolbar */}
          <div style={{padding:"10px 12px",background:C.surf,borderBottom:`1px solid ${C.brd}`,
            flexShrink:0,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <div style={{display:"flex",gap:5,flexShrink:0}}>
              {[{id:"list",l:"🏭 الموردون"},{id:"history",l:"📋 سجل الشراء"}].map(t=>(
                <button key={t.id} onClick={()=>setTab(t.id)}
                  style={{...pill(tab===t.id),borderRadius:8,padding:"7px 12px",fontSize:12}}>{t.l}</button>
              ))}
            </div>
            {tab==="list"&&<>
              <div style={{position:"relative",flex:1,minWidth:120}}>
                <input value={search} onChange={e=>setSrch(e.target.value)}
                  placeholder="بحث..." style={{...INP,paddingRight:32,fontSize:12}}/>
                <span style={{position:"absolute",right:9,top:"50%",transform:"translateY(-50%)",
                  color:C.mut,pointerEvents:"none"}}><Ico.srch/></span>
              </div>
              <button onClick={()=>{setEdit(null);setModal(true);}}
                style={{background:`linear-gradient(135deg,${C.acc},${C.accD})`,
                  color:"#080f1e",border:"none",borderRadius:8,padding:"8px 13px",
                  fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:12,
                  cursor:"pointer",display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                <Ico.plus/> مورد جديد
              </button>
            </>}
          </div>

          {/* ── قائمة الموردين ── */}
          {tab==="list"&&(
            <div style={{flex:1,overflowY:"auto",padding:10}}>
              {filt.map(s=>{
                const supPurchases = (purchases||[]).filter(p=>p.supplierId===s.id);
                const totalSpent   = supPurchases.reduce((a,p)=>a+(p.total||0),0);
                return(
                  <div key={s.id} style={{background:C.card,borderRadius:12,padding:"13px 15px",
                    marginBottom:8,border:`1px solid ${C.brd}`,animation:"fadeUp .2s ease"}}>
                    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,flex:1,minWidth:0}}>
                        <div style={{background:"linear-gradient(135deg,#1d4ed8,#1e40af)",
                          borderRadius:9,width:42,height:42,
                          display:"flex",alignItems:"center",justifyContent:"center",
                          fontSize:20,flexShrink:0}}>🏭</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:800,fontSize:14,color:C.txt,marginBottom:3}}>{s.name}</div>
                          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                            {s.phone&&<span style={{fontSize:11,color:C.mut}}><Ico.phone/> {s.phone}</span>}
                            {s.address&&<span style={{fontSize:11,color:C.mut}}>📍 {s.address}</span>}
                          </div>
                          {s.products&&<div style={{fontSize:11,color:C.sub,marginTop:3}}>🏷️ {s.products}</div>}
                          {totalSpent>0&&(
                            <div style={{fontSize:10,color:C.grn,marginTop:3,fontWeight:700}}>
                              💰 إجمالي المشتريات: {fmt(totalSpent)} دج ({supPurchases.length} فاتورة)
                            </div>
                          )}
                        </div>
                      </div>
                      <div style={{display:"flex",gap:5,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}}>
                        {/* زر فاتورة الشراء */}
                        <button onClick={()=>setPurSup(s)}
                          style={{background:"linear-gradient(135deg,#065f46,#047857)",
                            color:"#6ee7b7",border:"none",borderRadius:6,
                            padding:"7px 10px",cursor:"pointer",fontSize:11,
                            fontFamily:"Tajawal,sans-serif",fontWeight:700,
                            display:"flex",alignItems:"center",gap:4}}>
                          📦 استلام بضاعة
                        </button>
                        <button onClick={()=>{setEdit(s);setModal(true);}}
                          style={{background:"#1e3a5f",color:"#60a5fa",border:"none",
                            borderRadius:6,padding:"7px 9px",cursor:"pointer",display:"flex"}}><Ico.edit/></button>
                        <button onClick={()=>del(s.id)}
                          style={{background:"#450a0a",color:C.red,border:"none",
                            borderRadius:6,padding:"7px 9px",cursor:"pointer",display:"flex"}}><Ico.trash/></button>
                      </div>
                    </div>
                  </div>
                );
              })}
              {filt.length===0&&<div style={{textAlign:"center",padding:50,color:C.mut}}>
                <div style={{fontSize:40,opacity:.3}}>🏭</div>
                <div style={{marginTop:8}}>لا يوجد موردون</div>
              </div>}
            </div>
          )}

          {/* ── سجل فواتير الشراء ── */}
          {tab==="history"&&(
            <div style={{flex:1,overflowY:"auto",padding:10}}>
              {purHist.length===0&&<div style={{textAlign:"center",padding:50,color:C.mut}}>
                <div style={{fontSize:40,opacity:.3}}>📋</div>
                <div style={{marginTop:8}}>لا توجد فواتير شراء بعد</div>
              </div>}
              {purHist.map((p,i)=>(
                <div key={i} style={{background:C.card,borderRadius:12,padding:"12px 15px",
                  marginBottom:8,border:`1px solid ${C.brd}`,animation:"fadeUp .2s ease"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <div>
                      <div style={{fontWeight:800,fontSize:13,color:C.txt}}>🏭 {p.supplierName}</div>
                      <div style={{fontSize:10,color:C.mut,marginTop:2}}>
                        {dateLabel(p.date)} — {timeLabel(p.date)}
                      </div>
                    </div>
                    <div style={{fontWeight:900,color:C.grn,fontSize:15}}>{fmt(p.total)} دج</div>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                    {(p.items||[]).map((it,j)=>(
                      <div key={j} style={{background:C.bg,borderRadius:7,padding:"4px 9px",
                        fontSize:11,color:C.sub,display:"flex",gap:6,alignItems:"center"}}>
                        <span style={{color:C.txt,fontWeight:600}}>{it.prodName}</span>
                        <span style={{color:C.grn,fontWeight:700}}>+{it.qty}</span>
                        {it.cost>0&&<span style={{color:C.mut}}>@ {fmt(it.cost)}</span>}
                      </div>
                    ))}
                  </div>
                  {p.note&&<div style={{fontSize:11,color:C.mut,marginTop:6,
                    borderTop:`1px solid ${C.brd}`,paddingTop:5}}>📝 {p.note}</div>}
                </div>
              ))}
            </div>
          )}

          {/* Modal إضافة/تعديل مورد */}
          {modal&&<SimpleModal
            title={edit?"✏️ تعديل مورد":"➕ إضافة مورد جديد"}
            fields={[
              {k:"name",    l:"اسم المورد *", t:"text", p:"دار النشر"},
              {k:"phone",   l:"الهاتف",        t:"tel",  p:"0500000000"},
              {k:"address", l:"العنوان",        t:"text", p:"المدينة"},
              {k:"products",l:"المنتجات",       t:"text", p:"كتب، أقلام..."},
              {k:"notes",   l:"ملاحظات",        t:"text", p:"..."},
            ]}
            initial={edit||{name:"",phone:"",address:"",products:"",notes:""}}
            required={["name"]}
            onClose={()=>setModal(false)}
            onSave={async d=>{
              await db.save("suppliers",{...(edit||{}),...d,
                createdAt:edit?.createdAt||new Date().toISOString()});
              await reload(["suppliers"]);
              setModal(false);
              notify(edit?"✓ تم التحديث":"✓ تم إضافة المورد");
            }}/>}

          {/* Modal فاتورة الشراء */}
          {purSup&&<PurchaseModal
            supplier={purSup}
            products={products}
            cats={cats}
            appSettings={appSettings}
            notify={notify}
            reload={reload}
            onClose={()=>setPurSup(null)}
            onSave={savePurchase}/>}
        </div>
      );
    }

    // ══════════════════════════════════════════════
    //  REPORTS VIEW
    // ══════════════════════════════════════════════
    function ReportsView({sales,products,cats}){
      const[period,setPeriod]=useState("day"),[tab,setTab]=useState("sales");
      const now=new Date();
      const fd=s=>{const d=new Date(s.date);if(period==="day")return s.date?.slice(0,10)===todayStr();if(period==="week")return(now-d)<7*24*3600*1000;if(period==="month")return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();return true;};
      const flt=sales.filter(fd);
      const fltSales=flt.filter(x=>x.payMethod!=="return"); // #6 استبعاد المرتجعات
      const rev=fltSales.reduce((s,x)=>s+(x.total||0),0);
      const prof=fltSales.reduce((s,x)=>{
        const discFactor=x.discount>0?(1-x.discount/100):1;
        return s+(x.items||[]).reduce((a,it)=>{
          const p=products.find(pr=>pr.id===it.id);
          const cost=it.cost!==undefined?it.cost:(p?.cost||0);
          return a+(it.price*discFactor-cost)*it.qty;
        },0);
      },0);
      const items=fltSales.reduce((s,x)=>s+(x.items||[]).reduce((a,i)=>a+i.qty,0),0);
      const cs={};flt.forEach(s=>(s.items||[]).forEach(it=>{const p=products.find(pr=>pr.id===it.id);const cat=p?.category||"أخرى";cs[cat]=(cs[cat]||0)+it.price*it.qty;}));
      const cd=Object.entries(cs).sort((a,b)=>b[1]-a[1]);const mc=Math.max(...cd.map(c=>c[1]),1);
      const pc={};flt.forEach(s=>(s.items||[]).forEach(it=>{pc[it.id]={qty:(pc[it.id]?.qty||0)+it.qty,rev:(pc[it.id]?.rev||0)+it.price*it.qty,name:it.name};}));
      const tp=Object.values(pc).sort((a,b)=>b.qty-a.qty).slice(0,8);
      const dd=Array.from({length:10},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(9-i));const k=d.toISOString().slice(0,10);const ds=sales.filter(s=>s.date?.slice(0,10)===k);return{label:d.toLocaleDateString("fr-FR",{day:"numeric",month:"numeric"}),rev:ds.reduce((s,x)=>s+(x.total||0),0),count:ds.length};});
      const md=Math.max(...dd.map(d=>d.rev),1);
      return(
        <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 54px)",overflow:"hidden"}}>
          <div style={{padding:"10px 12px",background:C.surf,borderBottom:`1px solid ${C.brd}`,flexShrink:0}}>
            <div style={{display:"flex",gap:6,marginBottom:8}}>{[{id:"day",l:"اليوم"},{id:"week",l:"الأسبوع"},{id:"month",l:"الشهر"},{id:"all",l:"الكل"}].map(p=><button key={p.id} onClick={()=>setPeriod(p.id)} style={pill(period===p.id)}>{p.l}</button>)}</div>
            <div style={{display:"flex",gap:6}}>{[{id:"sales",l:"المبيعات"},{id:"products",l:"المنتجات"},{id:"history",l:"سجل الفواتير"}].map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...pill(tab===t.id),borderRadius:8,padding:"6px 12px"}}>{t.l}</button>)}</div>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:12}}>
            <div style={{display:"flex",gap:9,flexWrap:"wrap",marginBottom:14}}>
              {[{l:"إيرادات",v:`${fmt(rev)} دج`,c:C.acc,i:"💰"},{l:"أرباح صافية",v:`${fmt(prof)} دج`,c:C.grn,i:"📈"},{l:"عدد الفواتير",v:flt.length,c:C.blu,i:"🧾"},{l:"قطع مباعة",v:items,c:C.pur,i:"📦"}].map(k=>(
                <div key={k.l} style={{background:C.card,borderRadius:13,padding:"12px 16px",border:`1px solid ${k.c}22`,flex:"1 1 130px"}}><div style={{fontSize:24}}>{k.i}</div><div style={{fontWeight:900,fontSize:18,color:k.c,marginTop:4}}>{k.v}</div><div style={{fontSize:11,color:C.mut}}>{k.l}</div>{k.l==="أرباح صافية"&&rev>0&&<div style={{fontSize:10,color:C.grn,fontWeight:600}}>هامش {Math.round(prof/rev*100)}%</div>}</div>
              ))}
            </div>
            {tab==="sales"&&<>
              <div style={{background:C.card,borderRadius:14,padding:15,border:`1px solid ${C.brd}`,marginBottom:12}}>
                <div style={{fontWeight:800,fontSize:13,marginBottom:13}}>📅 مبيعات آخر 10 أيام</div>
                <div style={{display:"flex",alignItems:"flex-end",gap:5,height:90}}>
                  {dd.map((d,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><div style={{fontSize:7.5,color:C.mut,textAlign:"center"}}>{d.rev>0?`${Math.round(d.rev/1000)}k`:""}</div><div style={{width:"100%",borderRadius:"4px 4px 0 0",background:d.rev>0?`linear-gradient(180deg,${C.acc},${C.accD})`:C.brd,height:`${Math.max(3,(d.rev/md)*80)}px`,transition:"height .5s ease"}}/><div style={{fontSize:8,color:C.mut,whiteSpace:"nowrap"}}>{d.label}</div>{d.count>0&&<div style={{fontSize:7,color:C.acc}}>{d.count}×</div>}</div>)}
                </div>
              </div>
              <div style={{background:C.card,borderRadius:14,padding:15,border:`1px solid ${C.brd}`}}>
                <div style={{fontWeight:800,fontSize:13,marginBottom:13}}>🏷️ حسب التصنيف</div>
                {cd.length===0?<div style={{color:C.mut,fontSize:12}}>لا توجد بيانات</div>
                :cd.map(([cat,rv],i)=>{const ci=cats.find(c=>c.name===cat);return(<div key={i} style={{marginBottom:11}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:5,fontSize:12}}><span style={{color:C.txt,fontWeight:600}}>{ci?.icon||"📦"} {cat}</span><span style={{color:C.acc,fontWeight:700}}>{fmt(rv)} دج</span></div><div style={{background:C.bg,borderRadius:6,height:6,overflow:"hidden"}}><div style={{background:`linear-gradient(90deg,${C.acc},${C.accL})`,height:"100%",width:`${rv/mc*100}%`,borderRadius:6,transition:"width .5s ease"}}/></div></div>);})}
              </div>
            </>}
            {tab==="products"&&<div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}><div style={{fontWeight:800,fontSize:13,marginBottom:13}}>🏆 أداء المنتجات</div>{tp.length===0?<div style={{color:C.mut,fontSize:12}}>لا توجد بيانات</div>:tp.map((p,i)=>{const prod=products.find(x=>x.name===p.name);const pi=prod?getProdIcon(prod):{icon:"📦",color:C.mut,img:null};return(<div key={i} style={{display:"flex",alignItems:"center",gap:11,padding:"8px 0",borderBottom:i<tp.length-1?`1px solid ${C.brd}`:"none"}}><div style={{fontWeight:900,color:i<3?C.acc:C.mut,fontSize:16,width:22,textAlign:"center",flexShrink:0}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</div>{renderPI(pi,32,9)}<div style={{flex:1,fontSize:12,color:C.txt,fontWeight:600,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{p.name}</div><div style={{fontSize:11,color:C.grn,fontWeight:700,flexShrink:0}}>{p.qty}×</div><div style={{fontSize:11,color:C.acc,fontWeight:700,flexShrink:0}}>{fmt(p.rev)} دج</div></div>);})}</div>}
            {tab==="history"&&<div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}><div style={{fontWeight:800,fontSize:13,marginBottom:13}}>🧾 سجل الفواتير ({flt.length})</div>{flt.length===0?<div style={{color:C.mut,fontSize:12}}>لا توجد فواتير</div>:[...flt].reverse().map((s,i)=><div key={i} style={{padding:"9px 0",borderBottom:i<flt.length-1?`1px solid ${C.brd}`:"none"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}><div style={{display:"flex",alignItems:"center",gap:8}}><div style={{background:`${C.acc}18`,borderRadius:7,padding:"3px 8px",fontSize:10,color:C.acc,fontWeight:800}}>#{(s.id||"").toString().padStart(4,"0")}</div><div style={{fontSize:11,color:C.mut}}>{dateLabel(s.date)} {timeLabel(s.date)}</div></div><div style={{fontWeight:900,color:C.acc,fontSize:14}}>{fmt(s.total)} دج</div></div><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{(s.items||[]).slice(0,5).map((it,j)=><span key={j} style={{background:C.bg,borderRadius:6,padding:"2px 7px",fontSize:10,color:C.mut}}>{it.name} ×{it.qty}</span>)}{(s.items||[]).length>5&&<span style={{fontSize:10,color:C.mut}}>+{s.items.length-5}</span>}</div></div>)}</div>}
          </div>
        </div>
      );
    }

    function CatModal({onClose,onSave}){
      const[name,setName]       =useState("");
      const[icon,setIcon]       =useState("📦");
      const[catImg,setCatImg]   =useState(null);
      const[mode,setMode]       =useState("emoji"); // "emoji" | "photo"
      const[processing,setProc]=useState(false);
      const icons=["📚","📓","✏️","🎨","📎","🎒","🖊️","📐","📏","🗂️","🖍️","📌","📋","🔖","🗒️","📝","🔬","⚛️","🌍","🔢","💡","🖼️","🎵","🎯","⚽","🧸","🔑","💊","🍎","🛒","🏠","🚗","💻"];

      const handlePhoto=async e=>{
        const file=e.target.files?.[0]; if(!file)return;
        setProc(true);
        try{
          const url=URL.createObjectURL(file);
          const img=new Image();
          img.onload=()=>{
            const S=280;
            const canvas=document.createElement("canvas");
            canvas.width=S; canvas.height=S;
            const ctx=canvas.getContext("2d");
            const side=Math.min(img.width,img.height);
            ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
            setCatImg(canvas.toDataURL("image/jpeg",.88));
            URL.revokeObjectURL(url);
            setProc(false);
          };
          img.onerror=()=>setProc(false);
          img.src=url;
        }catch(_){setProc(false);}
      };

      const handleSave=()=>{
        if(!name.trim()){alert("أدخل اسم التصنيف");return;}
        onSave({name:name.trim(), icon, catImg: catImg||null});
      };

      return(
        <div style={{position:"fixed",inset:0,zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.75)"}}/>
          <div style={{background:C.surf,borderRadius:"20px 20px 0 0",padding:"20px 18px 24px",width:"100%",maxWidth:420,maxHeight:"92vh",overflowY:"auto",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .28s cubic-bezier(.34,1.56,.64,1)"}} onClick={e=>e.stopPropagation()}>

            {/* رأس */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div style={{fontWeight:900,fontSize:15,color:C.acc}}>➕ تصنيف جديد</div>
              <button onClick={onClose} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:7,color:C.mut,cursor:"pointer",display:"flex"}}><Ico.x/></button>
            </div>

            {/* اسم التصنيف */}
            <label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:700}}>اسم التصنيف *</label>
            <input value={name} onChange={e=>setName(e.target.value)}
              placeholder="مثال: أدوات مكتبية"
              style={{...INP,marginBottom:18,fontSize:14}}/>

            {/* تبديل أيقونة / صورة */}
            <div style={{display:"flex",background:C.bg,borderRadius:12,padding:4,marginBottom:16,border:`1px solid ${C.brd}`}}>
              {[["emoji","😊 أيقونة"],["photo","📷 صورة"]].map(([m,l])=>(
                <button key={m} onClick={()=>setMode(m)} style={{
                  flex:1,padding:"9px 0",borderRadius:9,border:"none",
                  background:mode===m?`linear-gradient(135deg,${C.acc},${C.accD})`:"transparent",
                  color:mode===m?"#080f1e":C.mut,
                  fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:13,cursor:"pointer",
                  transition:"all .2s"
                }}>{l}</button>
              ))}
            </div>

            {/* وضع الأيقونة */}
            {mode==="emoji"&&(
              <div>
                {/* معاينة */}
                <div style={{display:"flex",justifyContent:"center",marginBottom:14}}>
                  <div style={{
                    width:70,height:70,borderRadius:18,
                    background:`${C.acc}18`,border:`2px solid ${C.acc}30`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:36,boxShadow:`0 4px 16px ${C.acc}20`
                  }}>{icon}</div>
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
                  {icons.map(ic=>(
                    <button key={ic} onClick={()=>setIcon(ic)} style={{
                      background:icon===ic?`${C.acc}25`:C.card,
                      border:`2px solid ${icon===ic?C.acc:C.brd}`,
                      borderRadius:10,padding:"7px 10px",fontSize:21,
                      cursor:"pointer",transition:"all .15s",
                      boxShadow:icon===ic?`0 0 10px ${C.acc}40`:"none"
                    }}>{ic}</button>
                  ))}
                </div>
              </div>
            )}

            {/* وضع الصورة */}
            {mode==="photo"&&(
              <div>
                {catImg ? (
                  /* معاينة الصورة */
                  <div style={{position:"relative",marginBottom:14}}>
                    <div style={{
                      width:"100%",height:170,borderRadius:16,overflow:"hidden",
                      border:`2px solid ${C.acc}40`,boxShadow:`0 4px 20px rgba(0,0,0,.3)`
                    }}>
                      <img src={catImg} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
                    </div>
                    <button onClick={()=>setCatImg(null)} style={{
                      position:"absolute",top:8,left:8,
                      background:"rgba(239,68,68,.9)",backdropFilter:"blur(4px)",
                      border:"none",borderRadius:"50%",width:30,height:30,
                      color:"white",cursor:"pointer",fontSize:14,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      boxShadow:"0 2px 8px rgba(0,0,0,.4)"
                    }}>✕</button>
                    <div style={{
                      position:"absolute",bottom:10,right:10,
                      background:"rgba(0,0,0,.65)",backdropFilter:"blur(4px)",
                      borderRadius:20,padding:"4px 12px",fontSize:10,color:"white",fontWeight:700
                    }}>✅ تم رفع الصورة</div>
                  </div>
                ) : (
                  /* منطقة رفع الصورة */
                  <label style={{
                    display:"block",cursor:processing?"not-allowed":"pointer",
                    marginBottom:14
                  }}>
                    <div style={{
                      border:`2px dashed ${processing?C.mut:C.acc}`,
                      borderRadius:16,padding:"32px 20px",textAlign:"center",
                      background:processing?C.bg:`${C.acc}06`,
                      transition:"all .2s"
                    }}>
                      {processing ? (
                        <>
                          <div style={{fontSize:32,animation:"spin 1s linear infinite",display:"inline-block",marginBottom:10}}>⚙️</div>
                          <div style={{fontSize:12,color:C.mut,fontWeight:700}}>جاري معالجة الصورة...</div>
                        </>
                      ) : (
                        <>
                          <div style={{fontSize:44,marginBottom:10}}>🖼️</div>
                          <div style={{fontWeight:800,fontSize:14,color:C.acc,marginBottom:6}}>اضغط لاختيار صورة</div>
                          <div style={{fontSize:11,color:C.mut}}>أو التقط صورة بالكاميرا</div>
                          <div style={{
                            marginTop:12,display:"inline-block",
                            background:`linear-gradient(135deg,${C.acc},${C.accD})`,
                            color:"#080f1e",borderRadius:20,padding:"7px 20px",
                            fontSize:12,fontWeight:800
                          }}>📷 اختيار / التقاط</div>
                        </>
                      )}
                    </div>
                    <input type="file" accept="image/*" capture="environment"
                      onChange={handlePhoto} style={{display:"none"}} disabled={processing}/>
                  </label>
                )}
              </div>
            )}

            {/* أزرار الحفظ */}
            <div style={{display:"flex",gap:9,marginTop:20}}>
              <button onClick={onClose} style={{flex:1,background:C.card,color:C.txt,border:`1px solid ${C.brd}`,borderRadius:11,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:600,cursor:"pointer"}}>إلغاء</button>
              <button onClick={handleSave} style={{flex:2,background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:11,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:"pointer",boxShadow:`0 5px 16px ${C.acc}35`}}>
                {mode==="photo"&&catImg?"🖼️ إضافة بالصورة":"✓ إضافة التصنيف"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function SimpleModal({title,fields,initial,required,onClose,onSave}){
      const[f,setF]=useState(initial);const set=(k,v)=>setF(x=>({...x,[k]:v}));
      const save=async()=>{for(const r of required)if(!f[r]?.trim()){alert(`يرجى ملء: ${fields.find(x=>x.k===r)?.l||r}`);return;}await onSave(f);};
      return(
        <div style={{position:"fixed",inset:0,zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.72)"}}/>
          <div style={{background:C.surf,borderRadius:"16px 16px 0 0",padding:"18px 16px",width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .28s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}><div style={{fontWeight:900,fontSize:15,color:C.acc}}>{title}</div><button onClick={onClose} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:7,padding:7,color:C.mut,cursor:"pointer",display:"flex"}}><Ico.x/></button></div>
            {fields.map(({k,l,t,p})=><div key={k} style={{marginBottom:13}}><label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:600}}>{l}</label><input type={t||"text"} value={f[k]||""} onChange={e=>set(k,e.target.value)} placeholder={p} style={INP}/></div>)}
            <div style={{display:"flex",gap:9,marginTop:4}}><button onClick={onClose} style={{flex:1,background:C.card,color:C.txt,border:`1px solid ${C.brd}`,borderRadius:10,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:600,cursor:"pointer"}}>إلغاء</button><button onClick={save} style={{flex:2,background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:10,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:"pointer",boxShadow:`0 5px 16px ${C.acc}35`}}>✓ حفظ</button></div>
          </div>
        </div>
      );
    }

// ══════════════════════════════════════════════
//  SmartFormsView — ملء الاستمارات بالذكاء الاصطناعي
// ══════════════════════════════════════════════
function SmartFormsView({ appSettings, notify }) {
  const { useState, useRef, useCallback } = React;

  // ── mode: "home" | "forms" | "copy" ──
  const [mode,       setMode]     = useState("home");
  // ── shared: scan + extract ──
  const [step,       setStep]     = useState("scan");   // scan | result
  const [selForm,    setSelForm]  = useState(null);
  const [imgData,    setImgData]  = useState(null);
  const [scanning,   setScanning] = useState(false);
  const [fields,     setFields]   = useState({});
  const [downloading,setDL]       = useState(false);
  const [copied,     setCopied]   = useState({});       // {field: true} لتأثير "تم النسخ"
  const fileRef    = useRef(null); // معرض الصور (بدون capture)
  const cameraRef  = useRef(null); // كاميرا مباشرة

  const goHome = () => { setMode("home"); setStep("scan"); setSelForm(null); setImgData(null); setFields({}); setCopied({}); };

  // ── حقول بطاقة الهوية الكاملة للوضع Copy ──
  const ID_FIELDS = [
    { key:"full_name",         label:"الاسم الكامل (لقب + اسم)",   group:"شخصية" },
    { key:"birth_date",        label:"تاريخ الميلاد",               group:"شخصية" },
    { key:"birth_place",       label:"مكان الميلاد",                group:"شخصية" },
    { key:"gender",            label:"الجنس",                       group:"شخصية" },
    { key:"card_number",       label:"رقم بطاقة الهوية",            group:"بطاقة" },
    { key:"issue_date",        label:"تاريخ الإصدار",               group:"بطاقة" },
    { key:"expiry_date",       label:"تاريخ الانتهاء",              group:"بطاقة" },
    { key:"issue_place",       label:"دائرة الإصدار",               group:"بطاقة" },
    { key:"wilaya",            label:"الولاية",                     group:"بطاقة" },
    { key:"address",           label:"العنوان الكامل",              group:"عنوان" },
    { key:"commune",           label:"البلدية",                     group:"عنوان" },
    { key:"father_name",       label:"اسم الأب",                    group:"عائلة" },
    { key:"mother_name",       label:"اسم الأم",                    group:"عائلة" },
    { key:"nin",               label:"رقم التعريف الوطني (NIN)",    group:"رقمي" },
  ];

  // ── استخراج البيانات من صورة البطاقة ──
  const scanCard = async (targetFields) => {
    if (!imgData) return;
    const apiKey = appSettings?.anthropicKey;
    if (!apiKey) { notify("🔑 أضف مفتاح Groq في الإعدادات", "err"); return; }
    setScanning(true);
    const fieldKeys = targetFields.map(f => f.key || f).join(", ");
    const prompt = `أنت نظام OCR لبطاقات الهوية الجزائرية. استخرج هذه الحقول من الصورة:
${fieldKeys}
قواعد:
- full_name: اللقب ثم الاسم كاملاً بالعربية
- birth_date / issue_date / expiry_date: بصيغة DD/MM/YYYY
- gender: ذكر أو أنثى
- wilaya: اسم الولاية بالعربية فقط
- الحقول غير الموجودة في البطاقة: قيمة فارغة ""
أجب بـ JSON فقط بدون أي نص آخر: {"field":"value"}`;
    try {
      const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
        body: JSON.stringify({
          model:"meta-llama/llama-4-scout-17b-16e-instruct",
          max_tokens:900,
          messages:[{role:"user",content:[
            {type:"image_url",image_url:{url:imgData}},
            {type:"text",text:prompt}
          ]}]
        })
      });
      if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data  = await resp.json();
      let   text  = data.choices?.[0]?.message?.content||"{}";
      text = text.replace(/```json|```/g,"").trim();
      const ex = JSON.parse(text);
      const today = new Date().toLocaleDateString("fr-DZ");
      // لوضع الاستمارات: map من placeholder إلى قيمة
      if (mode==="forms" && selForm) {
        const tmpl = FORM_TEMPLATES[selForm];
        const result={};
        // خريطة الربط بين مفاتيح البطاقة والحقول
        const MAP = {
          "اسم_الشخص_الكامل":ex.full_name,   "اسم_الأب_الكامل":ex.full_name,
          "اسم_الزوج_الكامل":ex.full_name,   "تاريخ_الميلاد":ex.birth_date,
          "تاريخ_ميلاد_الأب":ex.birth_date,   "تاريخ_ميلاد_الزوج":ex.birth_date,
          "مكان_الميلاد":ex.birth_place,      "مكان_ميلاد_الأب":ex.birth_place,
          "مكان_ميلاد_الزوج":ex.birth_place,  "رقم_البطاقة":ex.card_number,
          "رقم_بطاقة_الزوج":ex.card_number,   "تاريخ_إصدار_البطاقة":ex.issue_date,
          "دائرة_الإصدار":ex.issue_place,     "ولاية_الإصدار":ex.wilaya,
          "العنوان_الكامل":ex.address,        "عنوان_الولي":ex.address,
          "تاريخ_التحرير":today,              "مكان_التحرير":ex.commune||ex.wilaya,
          "رقم_بطاقة_الولي":ex.card_number,  "تاريخ_إصدار_بطاقة_الولي":ex.issue_date,
          "الولاية":ex.wilaya,               "البلدية":ex.commune,
          "اسم_الولي_الكامل":ex.full_name,   "تاريخ_ومكان_ميلاد_الولي":`${ex.birth_date||""} بـ ${ex.birth_place||""}`,
          "رقم_تعريف_الأب":ex.nin,           "رقم_تعريف_الأم":ex.nin,
          "اسم_الطبيب":"",                   "اسم_المريض":ex.full_name,
          "السن": ex.birth_date ? String(new Date().getFullYear()-parseInt(ex.birth_date.split("/")[2]||0)) : "",
        };
        tmpl.fields.forEach(f=>{ result[f] = MAP[f]||ex[f]||""; });
        setFields(result);
      } else {
        // وضع النسخ: احتفظ بكل الحقول
        const result={};
        targetFields.forEach(f=>{ result[f.key] = ex[f.key]||""; });
        setFields(result);
      }
      setStep("result");
    } catch(e){ notify("خطأ في الاستخراج: "+e.message,"err"); }
    finally{ setScanning(false); }
  };

  // ── نسخ حقل للحافظة ──
  const copyField = (key, val) => {
    navigator.clipboard?.writeText(val).catch(()=>{
      const ta=document.createElement("textarea");
      ta.value=val; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
    });
    setCopied(c=>({...c,[key]:true}));
    setTimeout(()=>setCopied(c=>({...c,[key]:false})),2000);
  };

  // ── نسخ الكل ──
  const copyAll = () => {
    const lines = ID_FIELDS
      .filter(f=>fields[f.key])
      .map(f=>`${f.label}: ${fields[f.key]}`).join("\n");
    navigator.clipboard?.writeText(lines).catch(()=>{});
    notify("✅ تم نسخ جميع البيانات");
  };

  // ── مولّد DOCX مخصص لاستمارة المنحة المدرسية (A4 - RTL - صفحة واحدة) ──
  const generateManhajDocx = async (flds) => {
    const v = k => (flds[k]||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") || "...........................";

    const rpr = (bold,sz) =>
      `<w:rPr>${bold?"<w:b/>":""}<w:rtl/><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Traditional Arabic"/></w:rPr>`;

    const ppr = (align="right",beforePt=0,afterPt=60) =>
      `<w:pPr><w:bidi/><w:jc w:val="${align}"/><w:spacing w:before="${beforePt}" w:after="${afterPt}"/></w:pPr>`;

    // خلية جدول
    const cell = (text, widthDxa, fill, bold=false, sz=26, align="right") => `
      <w:tc>
        <w:tcPr>
          <w:tcW w:w="${widthDxa}" w:type="dxa"/>
          ${fill?`<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`:""}
          <w:tcMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tcMar>
        </w:tcPr>
        <w:p>${ppr(align,0,0)}<w:r>${rpr(bold,sz)}<w:t xml:space="preserve">${text}</w:t></w:r></w:p>
      </w:tc>`;

    // صف حقل عادي: تسمية + قيمة
    const row = (label, key) => `
    <w:tr>
      <w:trPr><w:trHeight w:val="420" w:hRule="atLeast"/></w:trPr>
      ${cell(label, 3200, "EDF4FF", true, 26)}
      ${cell(v(key),  5600, "",       false, 26)}
    </w:tr>`;

    // صف عنوان قسم (يمتد عمودين)
    const section = (title, fill="1B3A6B") => `
    <w:tr>
      <w:trPr><w:trHeight w:val="480" w:hRule="atLeast"/></w:trPr>
      <w:tc>
        <w:tcPr>
          <w:tcW w:w="8800" w:type="dxa"/>
          <w:gridSpan w:val="2"/>
          <w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>
          <w:tcMar><w:top w:w="60" w:type="dxa"/><w:left w:w="120" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tcMar>
        </w:tcPr>
        <w:p>${ppr("center",0,0)}
          <w:r><w:rPr><w:b/><w:rtl/><w:color w:val="FFFFFF"/><w:sz w:val="28"/><w:szCs w:val="28"/><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Traditional Arabic"/></w:rPr>
            <w:t>${title}</w:t></w:r>
        </w:p>
      </w:tc>
    </w:tr>`;

    const borders = `
    <w:tblBorders>
      <w:top    w:val="single" w:sz="6"  w:color="1B3A6B"/>
      <w:left   w:val="single" w:sz="6"  w:color="1B3A6B"/>
      <w:bottom w:val="single" w:sz="6"  w:color="1B3A6B"/>
      <w:right  w:val="single" w:sz="6"  w:color="1B3A6B"/>
      <w:insideH w:val="single" w:sz="2" w:color="B8CCE4"/>
      <w:insideV w:val="single" w:sz="2" w:color="B8CCE4"/>
    </w:tblBorders>`;

    const docXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>
  <w:p>${ppr("center",0,80)}
    <w:r><w:rPr><w:b/><w:sz w:val="38"/><w:szCs w:val="38"/>
      <w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Traditional Arabic"/>
    </w:rPr><w:t>&#x2605; استمارة المنحة المدرسية الخاصة &#x2605;</w:t></w:r>
  </w:p>
  <w:tbl>
    <w:tblPr>
      <w:tblW w:w="8800" w:type="dxa"/>
      ${borders}
      <w:tblLayout w:type="fixed"/>
      <w:bidiVisual/>
      <w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="0" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar>
    </w:tblPr>
    <w:tblGrid><w:gridCol w:w="3200"/><w:gridCol w:w="5600"/></w:tblGrid>
    ${section("▪ معلومات المؤسسة التعليمية")}
    ${row("الولاية","الولاية")}
    ${row("الدائرة","الدائرة")}
    ${row("البلدية","البلدية")}
    ${row("اسم المؤسسة","اسم_المؤسسة")}
    ${row("السنة الدراسية","السنة_الدراسية")}
    ${row("المستوى الدراسي","المستوى_الدراسي")}
    ${section("▪ معلومات التلميذ")}
    ${row("لقب واسم التلميذ","لقب_واسم_التلميذ")}
    ${row("تاريخ ومكان الميلاد","تاريخ_ومكان_ميلاد_التلميذ")}
    ${row("رقم التعريف المدرسي","رقم_التعريف_المدرسي")}
    ${row("اسم الأب","اسم_الأب")}
    ${row("اسم الأم","اسم_الأم")}
    ${section("▪ معلومات الولي القانوني")}
    ${row("اسم الولي الكامل","اسم_الولي_الكامل")}
    ${row("تاريخ ومكان ميلاد الولي","تاريخ_ومكان_ميلاد_الولي")}
    ${row("عنوان الولي","عنوان_الولي")}
    ${row("رقم تعريف الأب","رقم_تعريف_الأب")}
    ${row("رقم تعريف الأم","رقم_تعريف_الأم")}
    ${row("رقم بطاقة الولي","رقم_بطاقة_الولي")}
    ${row("تاريخ إصدار البطاقة","تاريخ_إصدار_بطاقة_الولي")}
    ${row("جهة الإصدار","جهة_إصدار_بطاقة_الولي")}
  </w:tbl>
  <w:p>${ppr("left",160,0)}
    <w:r><w:rPr><w:rtl/><w:sz w:val="24"/><w:szCs w:val="24"/><w:rFonts w:cs="Traditional Arabic"/></w:rPr>
      <w:t>التوقيع: ________________________         التاريخ: _______________</w:t></w:r>
  </w:p>
  <w:sectPr>
    <w:pgSz w:w="11906" w:h="16838"/>
    <w:pgMar w:top="750" w:right="850" w:bottom="750" w:left="850" w:header="0" w:footer="0" w:gutter="0"/>
    <w:bidi/>
  </w:sectPr>
</w:body>
</w:document>`;

    const cTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml"  ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;
    const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;
    const wordRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>`;

    const z = new JSZip();
    z.file("[Content_Types].xml", cTypes);
    z.file("_rels/.rels", rels);
    z.file("word/_rels/document.xml.rels", wordRels);
    z.file("word/document.xml", docXml);
    return await z.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  };

  // ── تنزيل DOCX مملوء ──
  const downloadFilled = async () => {
    setDL(true);
    try {
      const tmpl = FORM_TEMPLATES[selForm];
      let blob;
      if(selForm === "manhaj_madrasiya"){
        // مولّد مخصص: A4 - RTL - خط أكبر - صفحة واحدة
        blob = await generateManhajDocx(fields);
      } else {
        // بقية الاستمارات: الطريقة التقليدية (استبدال placeholders)
        const binStr=atob(tmpl.b64);
        const bytes=new Uint8Array(binStr.length);
        for(let i=0;i<binStr.length;i++) bytes[i]=binStr.charCodeAt(i);
        const zip=await JSZip.loadAsync(bytes.buffer);
        let xml=await zip.file("word/document.xml").async("string");
        Object.entries(fields).forEach(([k,v])=>{
          const esc=(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
          xml=xml.split(`{{${k}}}`).join(esc||"......................................");
        });
        zip.file("word/document.xml",xml);
        blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
      }
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download=`${tmpl.label}_مملوء.docx`;
      a.click(); URL.revokeObjectURL(url);
      notify(`✅ تم تنزيل "${tmpl.label}"`);
    } catch(e){ notify("خطأ: "+e.message,"err"); }
    finally{ setDL(false); }
  };

  // ──────────────────────────────────────
  // واجهة: الصفحة الرئيسية
  // ──────────────────────────────────────
  if(mode==="home") return(
    <div style={{height:"calc(100vh - 54px)",overflowY:"auto",padding:"18px 14px"}}>
      <div style={{fontWeight:900,fontSize:18,color:C.txt,marginBottom:4}}>📋 خدمات الاستمارات الذكية</div>
      <div style={{fontSize:12,color:C.mut,marginBottom:22}}>مسح بطاقة الهوية ← ملء تلقائي فوري</div>

      {/* بطاقة وضع النسخ السريع */}
      <button onClick={()=>{setMode("copy");setStep("scan");}}
        style={{width:"100%",background:`linear-gradient(135deg,${C.acc}20,${C.acc}08)`,
          border:`2px solid ${C.acc}50`,borderRadius:16,padding:"18px 16px",
          cursor:"pointer",marginBottom:14,textAlign:"right",transition:"all .15s"}}
        onMouseEnter={e=>{e.currentTarget.style.background=`linear-gradient(135deg,${C.acc}30,${C.acc}15)`;}}
        onMouseLeave={e=>{e.currentTarget.style.background=`linear-gradient(135deg,${C.acc}20,${C.acc}08)`;}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:50,height:50,borderRadius:14,flexShrink:0,
            background:`linear-gradient(135deg,${C.acc},${C.accD})`,
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>🪪</div>
          <div style={{flex:1,textAlign:"right"}}>
            <div style={{fontWeight:900,fontSize:15,color:C.txt,marginBottom:4}}>
              مساعد الملء السريع للمواقع
            </div>
            <div style={{fontSize:12,color:C.mut,lineHeight:1.6}}>
              استخرج بيانات البطاقة ← انسخ كل حقل بضغطة ← الصقه في أي موقع حكومي
            </div>
            <div style={{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}}>
              {["الضمان الاجتماعي","بريد الجزائر","الجلفة نت","CNAC","CNAS"].map(s=>(
                <span key={s} style={{fontSize:10,background:`${C.acc}15`,border:`1px solid ${C.acc}30`,
                  borderRadius:6,padding:"2px 8px",color:C.acc,fontWeight:600}}>{s}</span>
              ))}
            </div>
          </div>
        </div>
      </button>

      {/* عنوان قسم الاستمارات */}
      <div style={{fontSize:11,color:C.mut,fontWeight:700,marginBottom:10,marginTop:4}}>
        📄 ملء وتنزيل استمارات Word
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {Object.entries(FORM_TEMPLATES).map(([key,tmpl])=>(
          <button key={key} onClick={()=>{setMode("forms");setSelForm(key);setStep("scan");}}
            style={{background:C.card,border:`1.5px solid ${C.brd}`,borderRadius:14,
              padding:"14px 12px",cursor:"pointer",textAlign:"right",transition:"all .15s",
              display:"flex",flexDirection:"column",gap:5}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor=C.pur;e.currentTarget.style.background=`${C.pur}10`;}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor=C.brd;e.currentTarget.style.background=C.card;}}>
            <div style={{fontSize:26}}>{tmpl.icon}</div>
            <div style={{fontSize:12,fontWeight:800,color:C.txt,lineHeight:1.4}}>{tmpl.label}</div>
            <div style={{fontSize:10,color:C.mut}}>{tmpl.fields.length} حقل</div>
          </button>
        ))}
      </div>
    </div>
  );

  // ──────────────────────────────────────
  // واجهة: مسح البطاقة (مشتركة)
  // ──────────────────────────────────────
  const modeLabel  = mode==="copy" ? "مساعد الملء السريع" : FORM_TEMPLATES[selForm]?.label;
  const modeIcon   = mode==="copy" ? "🪪" : FORM_TEMPLATES[selForm]?.icon;
  const scanFields = mode==="copy" ? ID_FIELDS : FORM_TEMPLATES[selForm]?.fields.map(f=>({key:f,label:f.replace(/_/g," ")}));

  if(step==="scan") return(
    <div style={{height:"calc(100vh - 54px)",overflowY:"auto",padding:"18px 14px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
        <button onClick={goHome}
          style={{background:C.card2,border:`1px solid ${C.brd}`,borderRadius:8,
            padding:"7px 13px",cursor:"pointer",color:C.mut,fontSize:12,fontFamily:"Tajawal,sans-serif"}}>
          ← رجوع
        </button>
        <div>
          <div style={{fontWeight:900,fontSize:15,color:C.txt}}>{modeIcon} {modeLabel}</div>
          <div style={{fontSize:11,color:C.mut}}>صوّر بطاقة الهوية من الوجه الأمامي</div>
        </div>
      </div>

      {!imgData ? (
        <div onClick={()=>fileRef.current?.click()}
          style={{border:`2px dashed ${C.brd}`,borderRadius:18,padding:"44px 20px",
            textAlign:"center",cursor:"pointer",background:C.card,marginBottom:14,transition:"all .15s"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acc;e.currentTarget.style.background=`${C.acc}06`;}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=C.brd;e.currentTarget.style.background=C.card;}}>
          <div style={{fontSize:56,marginBottom:12}}>🪪</div>
          <div style={{fontWeight:800,fontSize:15,color:C.txt,marginBottom:6}}>صوّر بطاقة الهوية</div>
          <div style={{fontSize:12,color:C.mut,marginBottom:16}}>اختر طريقة الإدخال</div>
          <div style={{display:"flex",gap:8,justifyContent:"center"}}>
            <button onClick={e=>{e.stopPropagation();cameraRef.current?.click();}}
              style={{fontSize:12,background:`${C.acc}18`,border:`1px solid ${C.acc}40`,
                borderRadius:10,padding:"8px 16px",color:C.acc,cursor:"pointer",
                fontFamily:"Tajawal,sans-serif",fontWeight:700}}>
              📸 كاميرا
            </button>
            <button onClick={e=>{e.stopPropagation();fileRef.current?.click();}}
              style={{fontSize:12,background:C.card2,border:`1px solid ${C.brd}`,
                borderRadius:10,padding:"8px 16px",color:C.sub,cursor:"pointer",
                fontFamily:"Tajawal,sans-serif",fontWeight:700}}>
              🖼️ معرض الصور
            </button>
          </div>
        </div>
      ):(
        <div style={{marginBottom:14}}>
          <img src={imgData} alt="بطاقة"
            style={{width:"100%",maxHeight:200,objectFit:"contain",borderRadius:12,
              border:`1px solid ${C.brd}`,background:C.card,display:"block"}}/>
          <div style={{display:"flex",gap:8,marginTop:10}}>
            <button onClick={()=>setImgData(null)}
              style={{flex:1,background:C.card2,border:`1px solid ${C.brd}`,borderRadius:9,
                padding:"9px",cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontSize:12,color:C.mut}}>
              🔄 تغيير
            </button>
            <button onClick={()=>scanCard(scanFields)} disabled={scanning}
              style={{flex:2,background:scanning?C.card2:`linear-gradient(135deg,${C.acc},${C.accD})`,
                color:scanning?C.mut:"#080f1e",border:"none",borderRadius:9,padding:"9px",
                cursor:scanning?"default":"pointer",fontFamily:"Tajawal,sans-serif",
                fontSize:13,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
              {scanning
                ?<><span style={{animation:"spin .8s linear infinite",display:"inline-block"}}>⚙️</span> يحلّل البطاقة...</>
                :<>✨ استخراج البيانات</>}
            </button>
          </div>
        </div>
      )}

      <input ref={cameraRef} type="file" accept="image/*" capture="environment"
        onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setImgData(ev.target.result);r.readAsDataURL(f);}}
        style={{display:"none"}}/>
      <input ref={fileRef} type="file" accept="image/*"
        onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setImgData(ev.target.result);r.readAsDataURL(f);}}
        style={{display:"none"}}/>
    </div>
  );

  // ──────────────────────────────────────
  // واجهة النتيجة — وضع النسخ السريع
  // ──────────────────────────────────────
  if(step==="result" && mode==="copy"){
    const groups = [...new Set(ID_FIELDS.map(f=>f.group))];
    return(
      <div style={{height:"calc(100vh - 54px)",overflowY:"auto",padding:"14px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div>
            <div style={{fontWeight:900,fontSize:15,color:C.txt}}>🪪 بيانات بطاقة الهوية</div>
            <div style={{fontSize:11,color:C.grn,fontWeight:700}}>✅ اضغط على أي حقل لنسخه فوراً</div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>{setStep("scan");setImgData(null);}}
              style={{background:C.card2,border:`1px solid ${C.brd}`,borderRadius:8,
                padding:"6px 10px",cursor:"pointer",fontSize:11,color:C.mut,fontFamily:"Tajawal,sans-serif"}}>
              🔄 مسح جديد
            </button>
            <button onClick={goHome}
              style={{background:C.card2,border:`1px solid ${C.brd}`,borderRadius:8,
                padding:"6px 10px",cursor:"pointer",fontSize:11,color:C.mut,fontFamily:"Tajawal,sans-serif"}}>
              ← رجوع
            </button>
          </div>
        </div>

        {/* صورة مصغّرة */}
        {imgData&&<img src={imgData} alt="" style={{width:"100%",maxHeight:90,objectFit:"contain",
          borderRadius:8,border:`1px solid ${C.brd}`,background:C.card,display:"block",marginBottom:12}}/>}

        {/* حقول مجمّعة */}
        {groups.map(grp=>{
          const grpFields = ID_FIELDS.filter(f=>f.group===grp && fields[f.key]);
          if(!grpFields.length) return null;
          return(
            <div key={grp} style={{marginBottom:14}}>
              <div style={{fontSize:10,color:C.mut,fontWeight:800,marginBottom:6,
                textTransform:"uppercase",letterSpacing:"0.5px"}}>
                {grp==="شخصية"?"👤 المعلومات الشخصية":grp==="بطاقة"?"🪪 بيانات البطاقة":grp==="عنوان"?"🏠 العنوان":"👨‍👩‍👧 معلومات العائلة"}
              </div>
              {grpFields.map(f=>(
                <div key={f.key} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  {/* حقل قابل للتعديل */}
                  <input
                    value={fields[f.key]||""}
                    onChange={e=>setFields(p=>({...p,[f.key]:e.target.value}))}
                    style={{flex:1,background:C.card,border:`1px solid ${C.brd}`,borderRadius:9,
                      padding:"9px 12px",fontSize:13,color:C.txt,fontFamily:"Tajawal,sans-serif",
                      textAlign:"right",outline:"none"}}
