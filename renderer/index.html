                  <button
                    onClick={()=>copyField(f.key,fields[f.key]||"")}
                    style={{flexShrink:0,width:42,height:38,borderRadius:9,
                      background:copied[f.key]?`${C.grn}20`:`${C.acc}15`,
                      border:`1px solid ${copied[f.key]?C.grn:C.acc}40`,
                      cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:16,transition:"all .2s"}}>
                    {copied[f.key]?"✅":"📋"}
                  </button>
                </div>
              ))}
            </div>
          );
        })}

        {/* حقول فارغة يمكن تعبئتها يدوياً */}
        {ID_FIELDS.filter(f=>!fields[f.key]).length>0&&(
          <div style={{marginBottom:14}}>
            <div style={{fontSize:10,color:C.mut,fontWeight:800,marginBottom:8}}>✏️ أضف يدوياً</div>
            {ID_FIELDS.filter(f=>!fields[f.key]).map(f=>(
              <div key={f.key} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                <input
                  value={fields[f.key]||""}
                  onChange={e=>setFields(p=>({...p,[f.key]:e.target.value}))}
                  placeholder={f.label}
                  style={{flex:1,background:C.bg,border:`1px dashed ${C.brd}`,borderRadius:9,
                    padding:"8px 12px",fontSize:12,color:C.txt,fontFamily:"Tajawal,sans-serif",
                    textAlign:"right",outline:"none"}}/>
                <button onClick={()=>copyField(f.key,fields[f.key]||"")}
                  style={{flexShrink:0,width:42,height:36,borderRadius:9,
                    background:copied[f.key]?`${C.grn}20`:C.card2,
                    border:`1px solid ${copied[f.key]?C.grn:C.brd}`,
                    cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>
                  {copied[f.key]?"✅":"📋"}
                </button>
              </div>
            ))}
          </div>
        )}

        {/* زر نسخ الكل */}
        <button onClick={copyAll}
          style={{width:"100%",background:`linear-gradient(135deg,${C.acc},${C.accD})`,
            color:"#080f1e",border:"none",borderRadius:12,padding:"14px 0",
            fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",gap:8,
            boxShadow:`0 5px 18px ${C.acc}30`,marginBottom:10}}>
          📋 نسخ جميع البيانات دفعة واحدة
        </button>

        {/* تلميح */}
        <div style={{background:`${C.pur}08`,border:`1px solid ${C.pur}20`,borderRadius:10,padding:"10px 12px"}}>
          <div style={{fontSize:11,fontWeight:700,color:C.pur,marginBottom:4}}>💡 كيف تستخدم هذا:</div>
          <div style={{fontSize:11,color:C.mut,lineHeight:1.8}}>
            ① افتح الموقع الحكومي في تاب جديد<br/>
            ② ارجع للتطبيق واضغط 📋 بجانب الحقل المطلوب<br/>
            ③ انتقل للموقع واضغط Ctrl+V أو اضغط طويلاً ← لصق
          </div>
        </div>
      </div>
    );
  }

  // ──────────────────────────────────────
  // واجهة النتيجة — وضع الاستمارات
  // ──────────────────────────────────────
  if(step==="result" && mode==="forms"){
    const tmpl = FORM_TEMPLATES[selForm];
    return(
      <div style={{height:"calc(100vh - 54px)",overflowY:"auto",padding:"14px"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div>
            <div style={{fontWeight:900,fontSize:15,color:C.txt}}>{tmpl.icon} {tmpl.label}</div>
            <div style={{fontSize:11,color:C.grn,fontWeight:700}}>✅ راجع الحقول وعدّل إن لزم</div>
          </div>
          <button onClick={()=>{setStep("scan");setImgData(null);}}
            style={{background:C.card2,border:`1px solid ${C.brd}`,borderRadius:8,
              padding:"6px 12px",cursor:"pointer",color:C.mut,fontSize:12,fontFamily:"Tajawal,sans-serif"}}>
            🔄 مسح جديد
          </button>
        </div>

        {imgData&&<img src={imgData} alt="" style={{width:"100%",maxHeight:90,objectFit:"contain",
          borderRadius:8,border:`1px solid ${C.brd}`,background:C.card,display:"block",marginBottom:12}}/>}

        <div style={{marginBottom:14}}>
          {tmpl.fields.map(f=>(
            <div key={f} style={{marginBottom:8}}>
              <div style={{fontSize:10,color:C.mut,fontWeight:700,marginBottom:3}}>{f.replace(/_/g," ")}</div>
              <input value={fields[f]||""} onChange={e=>setFields(p=>({...p,[f]:e.target.value}))}
                placeholder={`أدخل ${f.replace(/_/g," ")}...`}
                style={{...INP,fontSize:12,padding:"8px 12px",
                  border:`1.5px solid ${fields[f]?C.grn+"60":C.brd}`,
                  background:fields[f]?`${C.grn}08`:C.bg}}/>
            </div>
          ))}
        </div>

        <button onClick={downloadFilled} disabled={downloading}
          style={{width:"100%",background:downloading?C.card2:`linear-gradient(135deg,${C.grn},#047857)`,
            color:downloading?C.mut:"#fff",border:"none",borderRadius:12,padding:"14px 0",
            fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:downloading?"default":"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",gap:8,
            boxShadow:downloading?"none":`0 5px 18px ${C.grn}35`}}>
          {downloading
            ?<><span style={{animation:"spin .8s linear infinite",display:"inline-block"}}>⚙️</span> جاري إنشاء الملف...</>
            :<>📥 تنزيل الاستمارة المملوءة (.docx)</>}
        </button>

        <button onClick={goHome}
          style={{width:"100%",marginTop:8,background:"none",border:`1px solid ${C.brd}`,borderRadius:10,
            padding:"10px",cursor:"pointer",color:C.mut,fontFamily:"Tajawal,sans-serif",fontSize:12}}>
          ← العودة للاستمارات
        </button>
      </div>
    );
  }

  return null;
}

function TelegramView({ notify, onBadgeUpdate, products, appSettings, onSendToCart }) {
  const [orders,   setOrders]   = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [filter,   setFilter]   = useState("pending");
  const [selected, setSelected] = useState(null);
  const [imgModal, setImgModal] = useState(null);
  const [search,   setSearch]   = useState("");
  const [lastSync,       setLastSync]       = useState(null);
  const [stats,          setStats]          = useState({ pending:0, confirmed:0, completed:0, cancelled:0 });
  const [confirmDelete,  setConfirmDelete]  = useState(null);
  const [deleting,       setDeleting]       = useState(false);
  const [showNLP,        setShowNLP]        = useState(false);

  const STATUS = {
    pending:   { label:"قيد الانتظار", color:"#f59e0b", bg:"#2d1a00", icon:"⏳", grad:"linear-gradient(135deg,#f59e0b,#d97706)" },
    confirmed: { label:"مؤكد",         color:"#3b82f6", bg:"#0f1e3d", icon:"✅", grad:"linear-gradient(135deg,#3b82f6,#2563eb)" },
    completed: { label:"مكتمل",        color:"#10b981", bg:"#032015", icon:"🎉", grad:"linear-gradient(135deg,#10b981,#059669)" },
    cancelled: { label:"ملغى",         color:"#ef4444", bg:"#2d0808", icon:"❌", grad:"linear-gradient(135deg,#ef4444,#dc2626)" },
  };

  const fetchOrders = async () => {
    try {
      setLoading(true);
      const url = filter === "all"
        ? `${SUPA_URL}/rest/v1/telegram_orders?order=created_at.desc&limit=50`
        : `${SUPA_URL}/rest/v1/telegram_orders?status=eq.${filter}&order=created_at.desc&limit=50`;
      const res = await fetch(url, { headers: { "apikey": SUPA_KEY, "Authorization": `Bearer ${SUPA_KEY}` } });
      const data = await res.json();
      setOrders(Array.isArray(data) ? data : []);
      setLastSync(new Date());

      const allRes = await fetch(`${SUPA_URL}/rest/v1/telegram_orders?select=status`,
        { headers: { "apikey": SUPA_KEY, "Authorization": `Bearer ${SUPA_KEY}` } });
      const allData = await allRes.json();
      if (Array.isArray(allData)) {
        const s = { pending:0, confirmed:0, completed:0, cancelled:0 };
        allData.forEach(o => { if(s[o.status]!==undefined) s[o.status]++; });
        setStats(s);
        onBadgeUpdate(s.pending);
      }
    } catch(e) { notify("خطأ في التحميل", "err"); }
    finally { setLoading(false); }
  };

  const updateStatus = async (id, status) => {
    try {
      await fetch(`${SUPA_URL}/rest/v1/telegram_orders?id=eq.${id}`, {
        method:"PATCH",
        headers:{ "apikey":SUPA_KEY, "Authorization":`Bearer ${SUPA_KEY}`,
          "Content-Type":"application/json", "Prefer":"return=minimal" },
        body: JSON.stringify({ status, updated_at: new Date().toISOString() })
      });
      notify(`✓ تم تحديث الطلب إلى: ${STATUS[status]?.label}`);
      setSelected(null);
      fetchOrders();
    } catch(e) { notify("خطأ في التحديث", "err"); }
  };

  const deleteOrder = async (id) => {
    try {
      setDeleting(true);
      await fetch(`${SUPA_URL}/rest/v1/telegram_orders?id=eq.${id}`, {
        method:"DELETE",
        headers:{ "apikey":SUPA_KEY, "Authorization":`Bearer ${SUPA_KEY}`, "Prefer":"return=minimal" }
      });
      notify("🗑️ تم حذف الطلب");
      setConfirmDelete(null);
      setSelected(null);
      fetchOrders();
    } catch(e) { notify("خطأ في الحذف", "err"); }
    finally { setDeleting(false); }
  };

  const deleteAllByStatus = async (status) => {
    try {
      setDeleting(true);
      await fetch(`${SUPA_URL}/rest/v1/telegram_orders?status=eq.${status}`, {
        method:"DELETE",
        headers:{ "apikey":SUPA_KEY, "Authorization":`Bearer ${SUPA_KEY}`, "Prefer":"return=minimal" }
      });
      notify(`🗑️ تم حذف جميع طلبات «${STATUS[status]?.label}»`);
      setConfirmDelete(null);
      fetchOrders();
    } catch(e) { notify("خطأ في الحذف الجماعي", "err"); }
    finally { setDeleting(false); }
  };

  // 1. مرجع للفلتر لتتجنب مشكلة Stale Closure في الـ WebSocket
  const filterRef = useRef(filter);
  useEffect(() => { 
    filterRef.current = filter; 
  }, [filter]);

  // 2. جلب البيانات من السيرفر عند تغيير الفلتر فقط
  useEffect(() => {
    fetchOrders();
  }, [filter]);

  // 3. فتح قناة الاستماع مرة واحدة فقط عند فتح الكاشير (Dependency Array فارغ)
  useEffect(() => {
    const channel = supa.channel("telegram-realtime")
      .on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "telegram_orders"
      }, payload => {
        const newOrder = payload.new;

        // تشغيل صوت التنبيه وإظهار الإشعار
        if (typeof playNotifSound === "function") playNotifSound();
        notify("📱 طلب جديد من تلغرام!");

        // استخدام filterRef بدلاً من filter المباشر
        setOrders(prev => {
          if (filterRef.current === "all" || filterRef.current === "pending") {
            return [newOrder, ...prev];
          }
          return prev;
        });

        // تحديث العدادات 
        setStats(prevStats => {
          const newStats = { ...prevStats, pending: (prevStats.pending || 0) + 1 };
          onBadgeUpdate(newStats.pending); 
          return newStats;
        });
      })
      .subscribe();

    // التنظيف عند إغلاق التطبيق أو المكون بالكامل
    return () => {
      supa.removeChannel(channel);
    };
  }, []); // القوسان الفارغان يعنيان: افتح الاتصال مرة واحدة فقط!

  const timeAgo = d => {
    const m = Math.floor((Date.now() - new Date(d)) / 60000);
    if(m<1) return "الآن";
    if(m<60) return `${m} د`;
    const h = Math.floor(m/60);
    if(h<24) return `${h} س`;
    return new Date(d).toLocaleDateString("fr-FR");
  };

  const filtered = orders.filter(o =>
    !search || (o.customer_name||"").includes(search) || (o.order_text||"").includes(search)
  );
  const totalAll = Object.values(stats).reduce((a,b)=>a+b,0);
  const modalSt = selected ? (STATUS[selected.status] || STATUS.pending) : STATUS.pending;

  /* ── StatChip ── */
  const Chip = ({st, k}) => {
    const active = filter===k;
    return (
      <div onClick={() => setFilter(k)} style={{
        flex:1, borderRadius:13, padding:"10px 6px", textAlign:"center",
        cursor:"pointer", transition:"all .2s",
        background: active ? `${st.color}18` : "rgba(255,255,255,.03)",
        border:`1px solid ${active ? st.color+"45" : "rgba(255,255,255,.07)"}`,
        boxShadow: active ? `0 4px 14px ${st.color}22` : "none",
        transform: active ? "translateY(-1px)" : "none"
      }}>
        <div style={{fontSize:19, marginBottom:3, lineHeight:1}}>{st.icon}</div>
        <div style={{fontWeight:900, fontSize:17, color: active?st.color:"rgba(255,255,255,.85)", lineHeight:1}}>
          {stats[k]||0}
        </div>
        <div style={{fontSize:8, color:"rgba(255,255,255,.3)", marginTop:3, letterSpacing:.2}}>{st.label}</div>
      </div>
    );
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"calc(100vh - 54px)", overflow:"hidden" }}>

      {/* ══ HEADER ══ */}
      <div style={{
        background:"linear-gradient(180deg,#071020 0%,#0c1d38 100%)",
        borderBottom:"1px solid rgba(0,136,204,.2)", flexShrink:0,
        padding:"12px 14px 10px",
        boxShadow:"0 4px 20px rgba(0,0,0,.4)"
      }}>
        {/* شريط العنوان */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:13 }}>
          <div style={{ display:"flex", alignItems:"center", gap:11 }}>
            {/* أيقونة تلغرام */}
            <div style={{
              background:"linear-gradient(135deg,#0088cc,#005f96)",
              borderRadius:12, width:44, height:44, flexShrink:0,
              display:"flex", alignItems:"center", justifyContent:"center",
              boxShadow:"0 4px 18px #0088cc50"
            }}>
              <svg viewBox="0 0 24 24" fill="white" width="22" height="22">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8l-1.68 7.93c-.12.56-.44.7-.9.43l-2.5-1.84-1.2 1.16c-.13.13-.25.25-.5.25l.18-2.5 4.58-4.14c.2-.18-.04-.27-.3-.1L7.32 15.3l-2.43-.76c-.53-.17-.54-.53.11-.78l9.55-3.68c.44-.16.82.1.69.72z"/>
              </svg>
            </div>
            <div>
              <div style={{ fontWeight:900, fontSize:16, color:"white", lineHeight:1.1 }}>طلبات تلغرام</div>
              <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:3 }}>
                <div style={{
                  width:7, height:7, borderRadius:"50%",
                  background: stats.pending>0 ? "#ef4444" : "#10b981",
                  boxShadow: stats.pending>0 ? "0 0 8px #ef4444" : "0 0 6px #10b981",
                  animation:"glow 1.8s ease infinite"
                }}/>
                <div style={{ fontSize:10, color:"rgba(255,255,255,.45)" }}>
                  مزامنة كل 30 ث
                  {lastSync && ` · آخر تحديث ${lastSync.toLocaleTimeString("ar-DZ",{hour:"2-digit",minute:"2-digit"})}`}
                </div>
              </div>
            </div>
          </div>
          <div style={{display:"flex",gap:7,flexShrink:0}}>
          {/* زر محلّل الرسائل */}
          <button onClick={()=>setShowNLP(true)} style={{
            background:"rgba(0,136,204,.18)", border:"1px solid rgba(0,136,204,.4)",
            borderRadius:10, padding:"8px 12px", color:"#60c8f0",
            cursor:"pointer", fontFamily:"Tajawal,sans-serif",
            fontWeight:700, fontSize:12,
            display:"flex", alignItems:"center", gap:5
          }}>
            🤖 تحليل رسالة
          </button>
          {showNLP && (
            <NLPParserModal
              onClose={()=>setShowNLP(false)}
              products={products||[]}
              appSettings={appSettings}
              notify={notify}
              onSendToCart={onSendToCart}
            />
          )}
          {(filter==="completed"||filter==="cancelled") && stats[filter]>0 && (
            <button onClick={()=>setConfirmDelete({bulk:true, status:filter})} style={{
              background:"rgba(239,68,68,.12)", border:"1px solid rgba(239,68,68,.3)",
              borderRadius:10, padding:"8px 12px", color:"#f87171",
              cursor:"pointer", fontFamily:"Tajawal,sans-serif",
              fontWeight:700, fontSize:12,
              display:"flex", alignItems:"center", gap:5, transition:"all .2s"
            }}>
              🗑️ حذف الكل
            </button>
          )}
          <button onClick={fetchOrders} style={{
            background:"rgba(0,136,204,.12)", border:"1px solid rgba(0,136,204,.3)",
            borderRadius:10, padding:"8px 14px", color:"#60b8e0",
            cursor:"pointer", fontFamily:"Tajawal,sans-serif",
            fontWeight:700, fontSize:12,
            display:"flex", alignItems:"center", gap:6, transition:"all .2s",
            flexShrink:0
          }}>
            <span style={{display:"inline-block", animation:loading?"spin .8s linear infinite":"none"}}>🔄</span>
            تحديث
          </button>
          </div>
        </div>

        {/* بطاقات الإحصائيات */}
        <div style={{ display:"flex", gap:7, marginBottom:12 }}>
          {Object.entries(STATUS).map(([k,st]) => <Chip key={k} k={k} st={st}/>)}
          {/* الكل */}
          <div onClick={() => setFilter("all")} style={{
            flex:1, borderRadius:13, padding:"10px 6px", textAlign:"center",
            cursor:"pointer", transition:"all .2s",
            background: filter==="all" ? "rgba(255,255,255,.1)" : "rgba(255,255,255,.03)",
            border:`1px solid ${filter==="all" ? "rgba(255,255,255,.3)" : "rgba(255,255,255,.07)"}`,
            boxShadow: filter==="all" ? "0 4px 14px rgba(255,255,255,.08)" : "none",
            transform: filter==="all" ? "translateY(-1px)" : "none"
          }}>
            <div style={{fontSize:19, marginBottom:3}}>📋</div>
            <div style={{fontWeight:900,fontSize:17,color:"rgba(255,255,255,.9)",lineHeight:1}}>{totalAll}</div>
            <div style={{fontSize:8,color:"rgba(255,255,255,.3)",marginTop:3}}>الكل</div>
          </div>
        </div>

        {/* بحث + فلتر */}
        <div style={{display:"flex",gap:7,alignItems:"center"}}>
          {/* حقل البحث */}
          <div style={{
            flex:1, display:"flex", alignItems:"center", gap:8,
            background:"rgba(255,255,255,.06)", border:"1px solid rgba(255,255,255,.1)",
            borderRadius:10, padding:"7px 12px", transition:"border .2s"
          }}>
            <span style={{fontSize:14, opacity:.5}}>🔍</span>
            <input
              value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="بحث باسم العميل أو نص الطلب..."
              style={{
                flex:1, background:"transparent", border:"none", outline:"none",
                color:"white", fontFamily:"Tajawal,sans-serif", fontSize:12,
                caretColor:"#0088cc"
              }}
            />
            {search && (
              <button onClick={()=>setSearch("")} style={{
                background:"none",border:"none",color:"rgba(255,255,255,.4)",
                cursor:"pointer",fontSize:14,padding:0,lineHeight:1
              }}>✕</button>
            )}
          </div>
          {/* عدد النتائج */}
          {search && (
            <div style={{
              background:"rgba(0,136,204,.15)", borderRadius:8, padding:"6px 10px",
              fontSize:10, color:"#60b8e0", fontWeight:700, flexShrink:0,
              border:"1px solid rgba(0,136,204,.25)"
            }}>
              {filtered.length} نتيجة
            </div>
          )}
        </div>
      </div>

      {/* ══ قائمة الطلبات ══ */}
      <div style={{ flex:1, overflowY:"auto", padding:"11px 12px 20px", background:C.bg }}>
        {loading ? (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:70, color:C.mut }}>
            <div style={{ fontSize:44, animation:"spin 1s linear infinite", display:"inline-block", marginBottom:14 }}>⚙️</div>
            <div style={{ fontSize:14, fontWeight:700, color:C.sub }}>جاري تحميل الطلبات...</div>
            <div style={{ fontSize:11, marginTop:6, opacity:.5 }}>يرجى الانتظار</div>
          </div>
        ) : filtered.length === 0 ? (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:70, color:C.mut }}>
            <div style={{ fontSize:60, opacity:.12, marginBottom:16 }}>
              {search?"🔍":"📭"}
            </div>
            <div style={{ fontSize:16, fontWeight:800, marginBottom:7, color:C.sub }}>
              {search ? "لا نتائج مطابقة" : "لا توجد طلبات"}

            <div style={{ fontSize:11, opacity:.5, textAlign:"center", maxWidth:220 }}>

            </div>
            {search && (
              <button onClick={()=>setSearch("")} style={{

// ══════════════════════════════════════════════
// ══════════════════════════════════════════════
//  DailySummaryModal — ملخص اليوم بالذكاء الاصطناعي
// ══════════════════════════════════════════════
// ══════════════════════════════════════════════
//  CopilotPanel — مساعد الكاشير الذكي (قراءة + تعديل)
// ══════════════════════════════════════════════
function CopilotPanel({onClose, products, customers, sales, purchases, appSettings, reload, notify}) {
  const [query,         setQuery]        = useState("");
  const [loading,       setLoading]      = useState(false);
  const [result,        setResult]       = useState(null);
  const [error,         setError]        = useState(null);
  const [history,       setHistory]      = useState([]);
  const [pendingAction, setPendingAction]= useState(null); // { msg, field, productId, oldVal, newVal }
  const [applying,      setApplying]     = useState(false);
  const inputRef = useRef(null);
  useEffect(()=>{ setTimeout(()=>inputRef.current?.focus(),100); },[]);

  const buildSnapshot = () => {
    const today  = new Date().toISOString().slice(0,10);
    const month  = today.slice(0,7);
    const tSales = sales.filter(s=>(s.date||"").slice(0,10)===today);
    const mSales = sales.filter(s=>(s.date||"").slice(0,7)===month);
    const tRev   = tSales.reduce((a,s)=>a+s.total,0);
    const mRev   = mSales.reduce((a,s)=>a+s.total,0);
    const tProfit=tSales.reduce((s,x)=>{
      const discFactor=x.discount>0?(1-x.discount/100):1;
      return s+(x.items||[]).reduce((a,it)=>{
        const p=products.find(pr=>pr.id===it.id);
        return a+(it.price*discFactor-(it.cost||p?.cost||0))*it.qty;
      },0);
    },0);
    const prodQty={};
    sales.forEach(s=>(s.items||[]).forEach(it=>{
      if(!prodQty[it.name])prodQty[it.name]={qty:0,rev:0};
      prodQty[it.name].qty+=it.qty; prodQty[it.name].rev+=it.price*it.qty;
    }));
    const top10=Object.entries(prodQty).sort((a,b)=>b[1].qty-a[1].qty).slice(0,10)
      .map(([n,v])=>({name:n,qty:v.qty,revenue:v.rev}));
    return {
      date: today,
      today: {revenue:tRev, profit:tProfit, invoices:tSales.length},
      month: {revenue:mRev, invoices:mSales.length},
      total_sales: sales.length,
      products: products.map(p=>({id:p.id,name:p.name,cat:p.category||"عام",price:p.price,stock:p.stock,cost:p.cost||0,minStock:p.minStock||5})),
      debtors: customers.filter(c=>c.debt>0).map(c=>({name:c.name,debt:c.debt})),
      total_debt: customers.reduce((a,c)=>a+(c.debt||0),0),
      low_stock: products.filter(p=>p.stock>0&&p.stock<=(p.minStock||5)).map(p=>p.name),
      out_of_stock: products.filter(p=>p.stock<=0).map(p=>p.name),
      top_products: top10,
      recent_purchases_total: (purchases||[]).filter(p=>(p.createdAt||"").slice(0,7)===month).reduce((a,p)=>a+(p.totalCost||0),0),
    };
  };

  // ── تطبيق التعديل على قاعدة البيانات ──
  const applyAction = async () => {
    if(!pendingAction) return;
    setApplying(true);
    try {
      const { productId, field, newVal, productName } = pendingAction;
      const prod = products.find(p=>p.id===productId);
      if(!prod) throw new Error("المنتج غير موجود");
      await db.save("products", { ...prod, [field]: newVal });
      await reload(["products"]);
      notify(`✓ تم تعديل ${field==="price"?"السعر":field==="stock"?"المخزون":"التكلفة"} — ${productName}`, "ok");
      setPendingAction(null);
      setResult(prev=>prev?({...prev, action:null}):prev);
    } catch(e) {
      notify("خطأ أثناء التعديل: "+e.message, "err");
    } finally { setApplying(false); }
  };

  const ask = async () => {
    if(!query.trim()) return;
    const apiKey = appSettings?.anthropicKey;
    if(!apiKey){ setError("no_key"); return; }
    setLoading(true); setError(null); setResult(null); setPendingAction(null);
    const snap = buildSnapshot();
    const prompt = `أنت مساعد ذكي لمكتبة قرطاسية جزائرية. بيانات المتجر:\n${JSON.stringify(snap,null,1)}\n\nطلب صاحب المكتبة: "${query}"\n\nأجب بـ JSON فقط:\n{"answer":"جواب واضح بالعربية","type":"stat|list|table|action","highlight":"رقم أو كلمة بارزة","items":[{"label":"...","value":"..."}],"action":null}\n\nإذا كان الطلب تعديل سعر أو مخزون أو تكلفة منتج، استبدل action بـ:\n{"product_id":123,"product_name":"اسم المنتج","field":"price|stock|cost","old_value":100,"new_value":150,"confirm_msg":"تأكيد تغيير السعر من 100 إلى 150 دج"}\n\nقواعد:\n- type=action فقط عند طلب تعديل حقيقي\n- استخدم product_id من بيانات المنتجات\n- new_value يجب أن يكون رقماً صحيحاً\n- إذا لم يُذكر المنتج بوضوح اطرح سؤالاً في answer\nلا تضف \`\`\`json أو أي علامات تنسيق.`;
    try {
      const resp = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
        body:JSON.stringify({model:"llama-3.3-70b-versatile",max_tokens:700,
          messages:[{role:"system",content:"أجب بـ JSON فقط. لا تكتب أي شيء خارج الـ JSON."},{role:"user",content:prompt}]})
      });
      if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${resp.status}`);}
      const data = await resp.json();
      let text = data.choices?.[0]?.message?.content||"";
      text = text.replace(/```json|```/g,"").trim();
      const parsed = JSON.parse(text);
      // جهّز التعديل المعلّق إن وُجد
      if(parsed.action && parsed.action.product_id && parsed.action.field && parsed.action.new_value!=null){
        setPendingAction({
          productId:   parsed.action.product_id,
          productName: parsed.action.product_name||"",
          field:       parsed.action.field,
          oldVal:      parsed.action.old_value,
          newVal:      parsed.action.new_value,
          msg:         parsed.action.confirm_msg||"تأكيد التعديل؟",
        });
      }
      setResult(parsed);
      setHistory(h=>[{q:query,r:parsed},...h.slice(0,4)]);
      setQuery("");
    } catch(e){ setError(e.message); }
    finally{ setLoading(false); inputRef.current?.focus(); }
  };

  const EXAMPLES = ["كم حققنا اليوم؟","أفضل 5 منتجات مبيعاً","العملاء الذين لديهم ديون","المنتجات التي تقترب من النفاد","غيّر سعر قلم بيك إلى 20 دج","أضف 50 للمخزون من دفتر 200 صفحة"];

  return (
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.72)",zIndex:3100,
        display:"flex",alignItems:"flex-end",justifyContent:"center",padding:"0 0 0 0"}}>
      <div style={{background:C.surf,width:"100%",maxWidth:520,borderRadius:"20px 20px 0 0",
        border:`1px solid ${C.brd}`,borderBottom:"none",maxHeight:"88vh",
        display:"flex",flexDirection:"column",
        boxShadow:"0 -8px 40px rgba(0,0,0,.4)"}}>

        {/* رأس */}
        <div style={{padding:"14px 18px 10px",borderBottom:`1px solid ${C.brd}`,
          background:`linear-gradient(135deg,${C.pur}15,${C.blu}10)`,
          borderRadius:"20px 20px 0 0",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:34,height:34,borderRadius:10,
                background:`linear-gradient(135deg,${C.pur},${C.blu})`,
                display:"flex",alignItems:"center",justifyContent:"center"}}>
                <svg viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.8" style={{width:18,height:18}}>
                  <path d="M12 2a4 4 0 0 1 4 4c0 1.5-.8 2.8-2 3.5V11h2a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h-.5l.5 3H8l.5-3H8a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h2V9.5A4 4 0 0 1 8 6a4 4 0 0 1 4-4z"/>
                  <circle cx="9.5" cy="13.5" r=".7" fill="white"/>
                  <circle cx="14.5" cy="13.5" r=".7" fill="white"/>
                </svg>
              </div>
              <div>
                <div style={{fontWeight:900,fontSize:14,color:C.txt}}>مساعد الكاشير الذكي</div>
                <div style={{fontSize:10,color:C.mut}}>اسألني أو اطلب مني تعديل أي بيانات</div>
              </div>
            </div>
            <button onClick={onClose} style={{background:"none",border:"none",color:C.mut,fontSize:22,cursor:"pointer"}}>✕</button>
          </div>
        </div>

        {/* محتوى قابل للتمرير */}
        <div style={{flex:1,overflowY:"auto",padding:"12px 16px"}}>

          {/* أمثلة سريعة */}
          {!result && !loading && (
            <div>
              <div style={{fontSize:11,color:C.mut,marginBottom:8,fontWeight:700}}>💡 أسئلة وأوامر مقترحة</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
                {EXAMPLES.map(ex=>(
                  <button key={ex} onClick={()=>{setQuery(ex);setTimeout(()=>inputRef.current?.focus(),50);}}
                    style={{background:ex.includes("غيّر")||ex.includes("أضف")?`${C.acc}15`:C.card2,
                      border:`1px solid ${ex.includes("غيّر")||ex.includes("أضف")?C.acc+"40":C.brd}`,
                      borderRadius:20,padding:"5px 12px",fontSize:11,
                      color:ex.includes("غيّر")||ex.includes("أضف")?C.acc:C.sub,
                      cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontWeight:600}}>
                    {ex}
                  </button>
                ))}
              </div>
              {/* بطاقة شرح التعديل */}
              <div style={{background:`${C.acc}0e`,border:`1px solid ${C.acc}25`,borderRadius:10,
                padding:"9px 12px",marginBottom:8,fontSize:11,color:C.mut,lineHeight:1.8}}>
                ✏️ <b style={{color:C.acc}}>أوامر التعديل:</b> يمكنك قول مثلاً:<br/>
                «غيّر سعر القلم إلى 25 دج» &nbsp;·&nbsp; «اجعل مخزون الدفتر 100» &nbsp;·&nbsp; «عدّل تكلفة المصحف إلى 300»
              </div>
            </div>
          )}

          {/* جاري التحليل */}
          {loading && (
            <div style={{textAlign:"center",padding:"30px 0"}}>
              <div style={{fontSize:28,marginBottom:8,display:"inline-block",animation:"spin 1s linear infinite"}}>⚙️</div>
              <div style={{fontSize:13,color:C.mut}}>يعالج طلبك...</div>
            </div>
          )}

          {/* خطأ */}
          {error && (
            <div style={{background:`${C.red}12`,border:`1px solid ${C.red}30`,
              borderRadius:10,padding:"10px 14px",marginBottom:10}}>
              {error==="no_key"
                ? <div style={{fontSize:12,color:C.red}}>🔑 أضف مفتاح Groq API في <b>الإعدادات ← مفاتيح الربط</b></div>
                : <div style={{fontSize:11,color:C.red,wordBreak:"break-all"}}>⚠️ {error}</div>}
            </div>
          )}

          {/* النتيجة */}
          {result && (
            <div style={{marginBottom:10}}>
              {/* إجابة رئيسية */}
              <div style={{background:`linear-gradient(135deg,${C.pur}12,${C.blu}08)`,
                border:`1px solid ${C.pur}30`,borderRadius:12,padding:"12px 14px",marginBottom:8}}>
                {result.highlight && (
                  <div style={{fontSize:28,fontWeight:900,color:C.pur,marginBottom:4}}>{result.highlight}</div>
                )}
                <div style={{fontSize:13,color:C.txt,lineHeight:1.8}}>{result.answer}</div>
              </div>

              {/* قائمة/جدول */}
              {result.items?.length>0 && (
                <div style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:10,overflow:"hidden",marginBottom:8}}>
                  {result.items.map((it,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                      padding:"8px 12px",borderBottom:i<result.items.length-1?`1px solid ${C.brd}40`:"none",
                      background:i%2===0?C.card:C.card2}}>
                      <span style={{fontSize:12,color:C.sub,fontWeight:600}}>{it.label}</span>
                      <span style={{fontSize:13,color:C.acc,fontWeight:800}}>{it.value}</span>
                    </div>
                  ))}
                </div>
              )}

              {/* ── بطاقة التأكيد للتعديل ── */}
              {pendingAction && (
                <div style={{background:`${C.acc}10`,border:`2px solid ${C.acc}50`,
                  borderRadius:12,padding:"12px 14px"}}>
                  <div style={{fontWeight:800,fontSize:13,color:C.acc,marginBottom:6}}>
                    ⚡ تعديل مقترح
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                    background:C.bg,borderRadius:9,padding:"8px 12px",marginBottom:10,
                    border:`1px solid ${C.brd}`}}>
                    <div>
                      <div style={{fontSize:12,fontWeight:700,color:C.txt,marginBottom:3}}>{pendingAction.productName}</div>
                      <div style={{fontSize:11,color:C.mut}}>
                        {pendingAction.field==="price"?"السعر":pendingAction.field==="stock"?"المخزون":"التكلفة"}:&nbsp;
                        <span style={{color:C.red,textDecoration:"line-through",marginLeft:4}}>{pendingAction.oldVal}</span>
                        &nbsp;→&nbsp;
                        <span style={{color:C.grn,fontWeight:900}}>{pendingAction.newVal}</span>
                        {pendingAction.field!=="stock"?" دج":" قطعة"}
                      </div>
                    </div>
                  </div>
                  <div style={{fontSize:11,color:C.mut,marginBottom:10}}>{pendingAction.msg}</div>
                  <div style={{display:"flex",gap:7}}>
                    <button onClick={()=>setPendingAction(null)}
                      style={{flex:1,background:C.card2,border:`1px solid ${C.brd}`,borderRadius:9,
                        padding:"8px 0",color:C.mut,fontFamily:"Tajawal,sans-serif",
                        fontWeight:700,fontSize:12,cursor:"pointer"}}>
                      إلغاء
                    </button>
                    <button onClick={applyAction} disabled={applying}
                      style={{flex:2,background:applying?`${C.acc}50`:`linear-gradient(135deg,${C.acc},${C.accD})`,
                        border:"none",borderRadius:9,padding:"8px 0",
                        color:"#080f1e",fontFamily:"Tajawal,sans-serif",
                        fontWeight:900,fontSize:13,cursor:applying?"default":"pointer",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                      {applying
                        ? <><span style={{animation:"spin .7s linear infinite",display:"inline-block"}}>⚙️</span> جاري الحفظ...</>
                        : <>✅ تأكيد التعديل</>}
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* تاريخ الأسئلة */}
          {history.length>1 && (
            <div>
              <div style={{fontSize:11,color:C.mut,marginBottom:6,fontWeight:700}}>📜 أسئلة سابقة</div>
              {history.slice(1).map((h,i)=>(
                <button key={i} onClick={()=>setResult(h.r)}
                  style={{width:"100%",textAlign:"right",background:C.card2,border:`1px solid ${C.brd}`,
                    borderRadius:8,padding:"6px 10px",marginBottom:4,cursor:"pointer",
                    fontSize:11,color:C.mut,fontFamily:"Tajawal,sans-serif"}}>
                  {h.q}
                </button>
              ))}
            </div>
          )}
        </div>

        {/* حقل الإدخال */}
        <div style={{padding:"10px 14px 16px",borderTop:`1px solid ${C.brd}`,flexShrink:0,
          background:C.surf}}>
          <div style={{display:"flex",gap:8}}>
            <input ref={inputRef} value={query} onChange={e=>setQuery(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask();}}}
              placeholder="اسأل أو اطلب تعديلاً: غيّر سعر X إلى Y دج..."
              style={{flex:1,background:C.card,border:`1.5px solid ${C.brd}`,borderRadius:10,
                padding:"10px 14px",fontSize:13,color:C.txt,fontFamily:"Tajawal,sans-serif",outline:"none"}}
            />
            <button onClick={ask} disabled={loading||!query.trim()}
              style={{background:loading||!query.trim()?C.card2:`linear-gradient(135deg,${C.pur},${C.blu})`,
                color:loading||!query.trim()?C.mut:"#fff",border:"none",borderRadius:10,
                padding:"0 18px",cursor:loading||!query.trim()?"default":"pointer",
                fontFamily:"Tajawal,sans-serif",fontSize:18,fontWeight:800,transition:"all .15s"}}>
              {loading?"⏳":"↑"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
//  NLPParserModal — محلّل رسائل تلغرام بالذكاء الاصطناعي
// ══════════════════════════════════════════════
function NLPParserModal({onClose, products, appSettings, notify, onSendToCart}) {
  const [msg,      setMsg]      = useState("");
  const [loading,  setLoading]  = useState(false);
  const [parsed,   setParsed]   = useState(null);
  const [error,    setError]    = useState(null);
  const [confirmed,setConfirmed]= useState({});

  const parse = async () => {
    if(!msg.trim()) return;
    const apiKey = appSettings?.anthropicKey;
    if(!apiKey){setError("no_key");return;}
    setLoading(true); setError(null); setParsed(null); setConfirmed({});
    const prodList = products.map(p=>`${p.name}|${p.category||""}|${p.price}دج|مخزون:${p.stock}`).join("\n");
    const prompt = `أنت مساعد لمكتبة قرطاسية جزائرية. استخرج المنتجات والكميات من رسالة الزبون.\n\nقائمة المنتجات المتوفرة:\n${prodList}\n\nرسالة الزبون: "${msg}"\n\nأجب بـ JSON فقط بدون أي نص خارجه:\n[{"requested":"ما طلبه الزبون بالضبط","matched_name":"اسم المنتج من القائمة أو null","qty":1,"confidence":0.9,"note":"ملاحظة اختيارية"}]\n- confidence: 0-1 (مدى تطابق الطلب مع المنتج)\n- إذا لم يتطابق أي منتج اكتب matched_name: null\nلا تضف \`\`\`json أو أي علامات تنسيق.`;
    try {
      const resp = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
        body:JSON.stringify({model:"llama-3.3-70b-versatile",max_tokens:800,
          messages:[{role:"system",content:"أجب بـ JSON فقط. لا تكتب أي شيء خارج الـ JSON."},{role:"user",content:prompt}]})
      });
      if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${resp.status}`);}
      const data  = await resp.json();
      let text    = data.choices?.[0]?.message?.content||"";
      text        = text.replace(/```json|```/g,"").trim();
      const items = JSON.parse(text);
      // أضف product object لكل عنصر
      const enriched = items.map(it=>{
        const prod = products.find(p=>p.name===it.matched_name);
        return {...it, product:prod||null};
      });
      setParsed(enriched);
      // افتراضياً: كل عنصر متطابق مؤكد
      const initConf = {};
      enriched.forEach((it,i)=>{ if(it.product) initConf[i]=true; });
      setConfirmed(initConf);
    } catch(e){ setError(e.message); }
    finally{ setLoading(false); }
  };

  const sendToCart = () => {
    const items = parsed
      .filter((_,i)=>confirmed[i])
      .map(it=>({
        ...it.product,
        qty: it.qty,
        _fromNLP: true,
      }))
      .filter(it=>it.id);
    if(!items.length){notify("لم تحدد أي منتج","err");return;}
    onSendToCart(items);
    notify(`✓ أُرسل ${items.length} منتج للكاشير`);
    onClose();
  };

  const confColor = c => c>=0.85?"#10b981":c>=0.6?C.amb:"#ef4444";

  return (
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.72)",zIndex:3200,
        display:"flex",alignItems:"center",justifyContent:"center",padding:14}}>
      <div style={{background:C.surf,borderRadius:18,width:"100%",maxWidth:480,
        border:`1px solid ${C.brd}`,overflow:"hidden",
        boxShadow:"0 24px 64px rgba(0,0,0,.5)",maxHeight:"90vh",display:"flex",flexDirection:"column"}}>

        {/* رأس */}
        <div style={{padding:"14px 18px",background:`linear-gradient(135deg,#0088cc20,#0088cc08)`,
          borderBottom:`1px solid ${C.brd}`,flexShrink:0,
          display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontWeight:900,fontSize:15,color:C.txt}}>📱 محلّل رسائل تلغرام</div>
            <div style={{fontSize:10,color:C.mut,marginTop:2}}>الصق رسالة الزبون وسيحوّلها لطلب جاهز</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:C.mut,fontSize:22,cursor:"pointer"}}>✕</button>
        </div>

        <div style={{flex:1,overflowY:"auto",padding:"14px 16px"}}>

          {/* حقل الرسالة */}
          <div style={{marginBottom:12}}>
            <label style={{fontSize:11,color:C.mut,fontWeight:700,display:"block",marginBottom:6}}>رسالة الزبون</label>
            <textarea value={msg} onChange={e=>setMsg(e.target.value)}
              placeholder={"مثال: خصني 3 كراريس 96 صفحة، وزوج ستيلوات زرق، ومسطرة 30سم"}
              rows={3}
              style={{width:"100%",background:C.card,border:`1.5px solid ${C.brd}`,borderRadius:10,
                padding:"10px 12px",fontSize:13,color:C.txt,fontFamily:"Tajawal,sans-serif",
                resize:"vertical",outline:"none",boxSizing:"border-box",lineHeight:1.7}}
            />
          </div>

          <button onClick={parse} disabled={loading||!msg.trim()}
            style={{width:"100%",background:loading||!msg.trim()?C.card2:"linear-gradient(135deg,#0088cc,#006aaa)",
              color:loading||!msg.trim()?C.mut:"#fff",border:"none",borderRadius:10,
              padding:"11px",cursor:loading||!msg.trim()?"default":"pointer",
              fontFamily:"Tajawal,sans-serif",fontSize:13,fontWeight:800,marginBottom:14,
              transition:"all .15s"}}>
            {loading?"⏳ يحلّل الرسالة...":"🔍 تحليل الرسالة بالذكاء الاصطناعي"}
          </button>

          {/* خطأ */}
          {error && (
            <div style={{background:`${C.red}12`,border:`1px solid ${C.red}30`,borderRadius:10,padding:"10px 14px",marginBottom:12}}>
              {error==="no_key"
                ?<div style={{fontSize:12,color:C.red}}>🔑 أضف مفتاح Groq في <b>الإعدادات ← مفاتيح الربط</b></div>
                :<div style={{fontSize:11,color:C.red,wordBreak:"break-all"}}>⚠️ {error}</div>}
            </div>
          )}

          {/* النتائج */}
          {parsed && (
            <div>
              <div style={{fontSize:12,color:C.mut,marginBottom:8,fontWeight:700}}>
                نتائج التحليل — {parsed.length} عنصر
                <span style={{fontSize:10,marginRight:6,color:C.grn}}>
                  (✓ حدد العناصر التي تريد إرسالها)
                </span>
              </div>
              {parsed.map((it,i)=>(
                <div key={i}
                  onClick={()=>it.product&&setConfirmed(c=>({...c,[i]:!c[i]}))}
                  style={{background:confirmed[i]?`${C.grn}10`:C.card,
                    border:`1.5px solid ${confirmed[i]?C.grn:it.product?C.brd:"#ef444440"}`,
                    borderRadius:10,padding:"10px 12px",marginBottom:8,
                    cursor:it.product?"pointer":"default",transition:"all .15s"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    {/* checkbox */}
                    <div style={{width:20,height:20,borderRadius:6,flexShrink:0,
                      background:confirmed[i]?C.grn:C.card2,
                      border:`1.5px solid ${confirmed[i]?C.grn:C.brd}`,
                      display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>
                      {confirmed[i]?"✓":""}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontSize:12,fontWeight:800,color:C.txt}}>{it.requested}</span>
                        <span style={{fontSize:10,background:`${C.brd}`,color:C.mut,
                          borderRadius:10,padding:"1px 7px"}}>×{it.qty}</span>
                        <span style={{fontSize:10,color:confColor(it.confidence),fontWeight:700}}>
                          {Math.round(it.confidence*100)}%
                        </span>
                      </div>
                      {it.product
                        ? <div style={{fontSize:11,color:C.grn,marginTop:2}}>
                            ✓ {it.product.name} — {fmt(it.product.price)} دج
                            {it.product.stock<=0&&<span style={{color:C.red,marginRight:6}}>⚠ نفد!</span>}
                          </div>
                        : <div style={{fontSize:11,color:"#ef4444",marginTop:2}}>✗ لا يوجد تطابق في المخزون</div>
                      }
                      {it.note&&<div style={{fontSize:10,color:C.mut,marginTop:2}}>{it.note}</div>}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* أسفل */}
        {parsed && (
          <div style={{padding:"10px 16px",borderTop:`1px solid ${C.brd}`,flexShrink:0,
            display:"flex",gap:8,justifyContent:"flex-end",background:C.surf}}>
            <div style={{fontSize:11,color:C.mut,flex:1,alignSelf:"center"}}>
              {Object.values(confirmed).filter(Boolean).length} منتج محدد
            </div>
            <button onClick={onClose}
              style={{background:C.card2,color:C.sub,border:`1px solid ${C.brd}`,
                borderRadius:8,padding:"8px 14px",cursor:"pointer",
                fontFamily:"Tajawal,sans-serif",fontSize:12,fontWeight:700}}>
              إلغاء
            </button>
            <button onClick={sendToCart}
              style={{background:"linear-gradient(135deg,#0088cc,#006aaa)",color:"#fff",
                border:"none",borderRadius:8,padding:"8px 18px",cursor:"pointer",
                fontFamily:"Tajawal,sans-serif",fontSize:12,fontWeight:800}}>
              🛒 إرسال للكاشير
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function DailySummaryModal({onClose, sales, products, customers, purchases, appSettings, notify}) {
  const [loading,  setLoading]  = useState(true);
  const [summary,  setSummary]  = useState(null);
  const [error,    setError]    = useState(null);

  const todayKey = todayStr();

  // ── حساب إحصائيات اليوم ──
  const todaySales = sales.filter(s => (s.date||s.createdAt||"").slice(0,10) === todayKey);

  const todayRevenue = todaySales.reduce((s,x) => s+(x.total||0), 0);

  const todayProfit = todaySales.reduce((s,x) => {
    const discFactor = x.discount>0?(1-x.discount/100):1;
    return s + (x.items||[]).reduce((a,it) => {
      const p    = products.find(pr => pr.id === it.id);
      const cost = it.cost !== undefined ? it.cost : (p?.cost||0);
      return a + (it.price*discFactor - cost) * it.qty;
    }, 0);
  }, 0);

  // أكثر منتج مبيعاً اليوم
  const prodQtys = {};
  todaySales.forEach(s => (s.items||[]).forEach(it => {
    prodQtys[it.name] = (prodQtys[it.name]||0) + it.qty;
  }));
  const topProd = Object.entries(prodQtys).sort((a,b) => b[1]-a[1])[0];

  // ديون جديدة اليوم
  const todayNewDebt = todaySales
    .filter(s => s.payMethod === "debt")
    .reduce((s,x) => s+(x.total||0), 0);

  // مصاريف شراء اليوم
  const todayExpenses = (purchases||[])
    .filter(p => (p.createdAt||p.date||"").slice(0,10) === todayKey)
    .reduce((s,p) => s+(p.totalCost||0), 0);

  const outOfStock  = products.filter(p => p.stock <= 0).length;
  const lowStock    = products.filter(p => p.stock > 0 && p.stock <= (p.minStock||5)).length;
  const totalDebt   = customers.reduce((s,c) => s+(c.debt||0), 0);
  const debtorCount = customers.filter(c => c.debt > 0).length;

  const stats = {
    revenue: todayRevenue, profit: todayProfit,
    margin:  todayRevenue > 0 ? Math.round(todayProfit/todayRevenue*100) : 0,
    salesCount: todaySales.length,
    topProd:  topProd ? `${topProd[0]} (${topProd[1]} وحدة)` : null,
    newDebt:  todayNewDebt, expenses: todayExpenses,
    outOfStock, lowStock, totalDebt, debtorCount,
  };

  const generate = async () => {
    const apiKey = appSettings?.anthropicKey;
    if (!apiKey) {
      setError("no_key");
      setLoading(false);
      return;
    }
    setLoading(true); setError(null); setSummary(null);

    const dayName = new Date().toLocaleDateString("ar-DZ", {weekday:"long", day:"numeric", month:"long"});
    const lines = [
      `اليوم: ${dayName}`,
      `المبيعات: ${fmt(stats.revenue)} دج في ${stats.salesCount} فاتورة`,
      `الربح الصافي التقديري: ${fmt(stats.profit)} دج (هامش ${stats.margin}%)`,
      stats.topProd     ? `أكثر منتج مباعاً: ${stats.topProd}` : null,
      stats.newDebt>0   ? `ديون جديدة اليوم: ${fmt(stats.newDebt)} دج` : null,
      stats.expenses>0  ? `مصاريف شراء اليوم: ${fmt(stats.expenses)} دج` : null,
      stats.outOfStock>0? `منتجات نفدت من المخزون: ${stats.outOfStock}` : null,
      stats.lowStock>0  ? `منتجات تقترب من النفاد: ${stats.lowStock}` : null,
      stats.totalDebt>0 ? `إجمالي الديون المتراكمة: ${fmt(stats.totalDebt)} دج لدى ${stats.debtorCount} عميل` : null,
    ].filter(Boolean).join("\n");

    const prompt =
      `أنت مساعد محاسبي لمكتبة قرطاسية في الجزائر. اكتب ملخصاً يومياً موجزاً بالعربية الفصحى لصاحب المكتبة:\n\n${lines}\n\nاكتب 3-4 جمل طبيعية كأنك تحدّث صاحب العمل في نهاية يوم العمل. أبرز أهم نقطة إيجابية وأهم تحذير إن وجد. لا تستخدم نقاطاً أو قوائم.`;

    try {
      const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          max_tokens: 400,
          messages: [{ role:"user", content: prompt }]
        })
      });
      if (!resp.ok) {
        const e = await resp.json().catch(()=>({}));
        throw new Error(e.error?.message || `خطأ HTTP ${resp.status}`);
      }
      const data = await resp.json();
      const text = data.choices?.[0]?.message?.content || "";
      if (!text) throw new Error("لم يُرجع النموذج نصاً");
      setSummary(text);
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { generate(); }, []);

  const StatBox = ({l,v,u,c}) => (
    <div style={{background:C.card,padding:"10px 8px",textAlign:"center",flex:1}}>
      <div style={{fontWeight:900,fontSize:16,color:c,lineHeight:1}}>
        {v}<span style={{fontSize:9,fontWeight:500,marginRight:2}}>{u}</span>
      </div>
      <div style={{fontSize:10,color:C.mut,marginTop:3}}>{l}</div>
    </div>
  );

  return (
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.68)",zIndex:3000,
        display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:C.surf,borderRadius:18,width:"100%",maxWidth:480,
        border:`1px solid ${C.brd}`,overflow:"hidden",
        boxShadow:"0 24px 64px rgba(0,0,0,.5)"}}>

        {/* ── رأس ── */}
        <div style={{padding:"14px 18px",
          background:`linear-gradient(135deg,${C.acc}18,${C.grn}10)`,
          borderBottom:`1px solid ${C.brd}`,
          display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontWeight:900,fontSize:15,color:C.txt}}>✨ ملخص اليوم — ذكاء اصطناعي</div>
            <div style={{fontSize:11,color:C.mut,marginTop:2}}>
              {new Date().toLocaleDateString("ar-DZ",{weekday:"long",day:"numeric",month:"long"})}
            </div>
          </div>
          <button onClick={onClose}
            style={{background:"none",border:"none",color:C.mut,fontSize:22,cursor:"pointer",lineHeight:1}}>✕</button>
        </div>

        {/* ── أرقام سريعة ── */}
        <div style={{display:"flex",gap:1,background:C.brd,borderBottom:`1px solid ${C.brd}`}}>
          <StatBox l="الإيرادات" v={fmt(stats.revenue)}  u="دج" c={C.acc}/>
          <StatBox l="الأرباح"   v={fmt(stats.profit)}   u="دج" c={C.grn}/>
          <StatBox l="الفواتير"  v={stats.salesCount}    u=""   c={C.blu}/>
          <StatBox l="الهامش"    v={`${stats.margin}%`}  u=""   c={C.pur}/>
        </div>

        {/* ── المحتوى ── */}
        <div style={{padding:"16px 18px",minHeight:120}}>

          {/* جاري التحليل */}
          {loading && (
            <div style={{textAlign:"center",padding:"20px 0"}}>
              <div style={{fontSize:32,marginBottom:10,display:"inline-block",
                animation:"spin 1.2s linear infinite"}}>⚙️</div>
              <div style={{fontSize:13,color:C.mut}}>يحلّل كلود بيانات اليوم...</div>
            </div>
          )}

          {/* خطأ */}
          {!loading && error && (
            <div>
              <div style={{background:`${C.red}10`,border:`1px solid ${C.red}30`,
                borderRadius:10,padding:"12px 14px",marginBottom:12}}>
                {error === "no_key" ? (
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:C.red,marginBottom:6}}>🔑 مفتاح API غير موجود</div>
                    <div style={{fontSize:11,color:C.mut,lineHeight:1.7}}>
                      اذهب إلى <b style={{color:C.acc}}>الإعدادات ← مفاتيح الربط</b> وأضف مفتاح <b>Groq API</b>.
                      <br/>مجاني من <span style={{color:C.blu}}>console.groq.com</span> ← API Keys ← Create
                    </div>
                  </div>
                ) : (
                  <div>
                    <div style={{fontSize:12,color:C.red,fontWeight:600,marginBottom:4}}>⚠️ فشل الاتصال</div>
                    <div style={{fontSize:11,color:C.mut,wordBreak:"break-all"}}>{error}</div>
                  </div>
                )}
              </div>
              <button onClick={generate}
                style={{background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#fff",
                  border:"none",borderRadius:8,padding:"8px 18px",cursor:"pointer",
                  fontFamily:"Tajawal,sans-serif",fontSize:12,fontWeight:800}}>
                🔄 إعادة المحاولة
              </button>
            </div>
          )}

          {/* الملخص */}
          {!loading && summary && (
            <div>
              <div style={{background:`linear-gradient(135deg,${C.grn}10,${C.acc}08)`,
                border:`1px solid ${C.grn}30`,borderRadius:12,
                padding:"14px 16px",marginBottom:12,
                lineHeight:2,fontSize:14,color:C.txt,fontWeight:500}}>
                {summary}
              </div>

              {/* تحذيرات */}
              {(stats.outOfStock>0 || stats.lowStock>0 || stats.newDebt>0) && (
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {stats.outOfStock>0 && (
                    <div style={{background:`${C.red}10`,border:`1px solid ${C.red}25`,
                      borderRadius:8,padding:"7px 12px",fontSize:11,color:C.red,fontWeight:700}}>
                      🚫 {stats.outOfStock} منتج نفد من المخزون
                    </div>
                  )}
                  {stats.lowStock>0 && (
                    <div style={{background:`${C.amb}10`,border:`1px solid ${C.amb}25`,
                      borderRadius:8,padding:"7px 12px",fontSize:11,color:C.amb,fontWeight:700}}>
                      ⚠️ {stats.lowStock} منتج يقترب من النفاد
                    </div>
                  )}
                  {stats.newDebt>0 && (
                    <div style={{background:"rgba(249,115,22,.1)",border:"1px solid rgba(249,115,22,.25)",
                      borderRadius:8,padding:"7px 12px",fontSize:11,color:"#f97316",fontWeight:700}}>
                      💳 {fmt(stats.newDebt)} دج ديون جديدة سُجِّلت اليوم
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
        </div>

        {/* ── أسفل ── */}
        {!loading && (
          <div style={{padding:"10px 18px",borderTop:`1px solid ${C.brd}`,
            display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button onClick={generate}
              style={{background:C.card2,color:C.sub,border:`1px solid ${C.brd}`,
                borderRadius:8,padding:"8px 16px",cursor:"pointer",
                fontFamily:"Tajawal,sans-serif",fontSize:12,fontWeight:700}}>
              🔄 تحديث
            </button>
            <button onClick={onClose}
              style={{background:`linear-gradient(135deg,${C.acc},${C.accD})`,
                color:"#fff",border:"none",borderRadius:8,padding:"8px 22px",
                cursor:"pointer",fontFamily:"Tajawal,sans-serif",fontSize:13,fontWeight:800}}>
              إغلاق
            </button>
          </div>
        )}

      </div>
    </div>
  );
}

//  HomeView — لوحة القيادة الرئيسية
// ══════════════════════════════════════════════
function HomeView({products, cats, customers, sales, packages, purchases, appSettings, notify, onNavigate}) {
  const {useEffect, useRef, useMemo} = React;
  const [showSummary, setShowSummary] = useState(false);

  // ── حسابات البيانات ──
  const todayKey = todayStr();
  const yesterdayKey = (()=>{ const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); })();

  const todaySales     = sales.filter(s=>(s.date||s.createdAt||"").slice(0,10)===todayKey);
  const yesterdaySales = sales.filter(s=>(s.date||s.createdAt||"").slice(0,10)===yesterdayKey);

  const calcRev    = arr => arr.reduce((s,x)=>s+(x.total||0),0);
  const calcProfit = arr => arr.reduce((s,x)=>{
    const discFactor=x.discount>0?(1-x.discount/100):1;
    return s+(x.items||[]).reduce((a,it)=>{
      const p=products.find(pr=>pr.id===it.id);
      return a+(it.price*discFactor-(it.cost!==undefined?it.cost:(p?.cost||0)))*it.qty;
    },0);
  },0);

  const todayRev      = calcRev(todaySales);
  const yesterdayRev  = calcRev(yesterdaySales);
  const todayProfit   = calcProfit(todaySales);
  const yesterdayProfit = calcProfit(yesterdaySales);
  const todayCount    = todaySales.length;
  const yesterdayCount= yesterdaySales.length;

  const pct = (a,b) => b===0 ? null : Math.round((a-b)/b*100);
  const arrow = (v) => v===null?"":v>0?` ↑${v}%`:` ↓${Math.abs(v)}%`;
  const arrowColor = (v) => v===null?C.mut:v>0?C.grn:C.red;

  const outOfStock = products.filter(p=>p.stock<=0);
  const lowStock   = products.filter(p=>p.stock>0&&p.stock<=(p.minStock||5));
  const stockValue = products.reduce((s,p)=>s+(p.cost||0)*p.stock,0);
  const totalDebt  = customers.reduce((s,c)=>s+(c.debt||0),0);

  // ── آخر 30 يوم ──
  const last30 = Array.from({length:30},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(29-i));
    const k=d.toISOString().slice(0,10);
    const ds=sales.filter(s=>(s.date||s.createdAt||"").slice(0,10)===k);
    return {k, rev:calcRev(ds), count:ds.length};
  });

  // ── هذا الأسبوع vs الماضي ──
  const thisWeek = Array.from({length:7},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    const k=d.toISOString().slice(0,10);
    const label=d.toLocaleDateString("fr-FR",{weekday:"short"});
    const ds=sales.filter(s=>(s.date||s.createdAt||"").slice(0,10)===k);
    return {label, rev:calcRev(ds)};
  });
  const lastWeek = Array.from({length:7},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(13-i));
    const k=d.toISOString().slice(0,10);
    const ds=sales.filter(s=>(s.date||s.createdAt||"").slice(0,10)===k);
    return {rev:calcRev(ds)};
  });

  // ── طرق الدفع ──
  const payMethods = {cash:0, cib:0, baridimob:0, debt:0, partial:0};
  sales.forEach(s=>{ if(payMethods[s.payMethod]!==undefined) payMethods[s.payMethod]+=(s.total||0); });

  // ── التصنيفات ──
  const catSales = {};
  sales.forEach(s=>(s.items||[]).forEach(it=>{
    const prod = products.find(p=>p.id===it.id);
    const cat = prod?.category||"أخرى";
    catSales[cat] = (catSales[cat]||0) + it.qty*(it.price||0);
  }));
  const catEntries = Object.entries(catSales).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // ── ساعات الذروة ──
  const hourCounts = Array(24).fill(0);
  sales.forEach(s=>{
    const h = new Date(s.date||s.createdAt||0).getHours();
    if(h>=0&&h<24) hourCounts[h]+=(s.total||0);
  });

  // ── أكثر مبيعاً ──
  const prodCounts={};
  sales.forEach(s=>(s.items||[]).forEach(it=>{prodCounts[it.name]=(prodCounts[it.name]||0)+it.qty;}));
  const topProds=Object.entries(prodCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const recentSales=[...sales].sort((a,b)=>new Date(b.date||b.createdAt||0)-new Date(a.date||a.createdAt||0)).slice(0,5);

  // ── Chart refs ──
  const weekChartRef   = useRef(null);
  const payChartRef    = useRef(null);
  const catChartRef    = useRef(null);
  const hourChartRef   = useRef(null);
  const weekChartInst  = useRef(null);
  const payChartInst   = useRef(null);
  const catChartInst   = useRef(null);
  const hourChartInst  = useRef(null);

  const CHART_COLORS = ["#f59e0b","#3b82f6","#10b981","#8b5cf6","#ef4444","#06b6d4"];

  const destroyChart = ref => { if(ref.current){ref.current.destroy();ref.current=null;} };

  // ── مخطط هذا الأسبوع vs الماضي ──
  useEffect(()=>{
    if(!weekChartRef.current) return;
    destroyChart(weekChartInst);
    weekChartInst.current = new Chart(weekChartRef.current, {
      type:"line",
      data:{
        labels: thisWeek.map(d=>d.label),
        datasets:[
          { label:"هذا الأسبوع", data:thisWeek.map(d=>d.rev),
            borderColor:"#f59e0b", backgroundColor:"rgba(245,158,11,.12)",
            borderWidth:2.5, pointBackgroundColor:"#f59e0b",
            pointRadius:4, tension:.4, fill:true },
          { label:"الأسبوع الماضي", data:lastWeek.map(d=>d.rev),
            borderColor:"#3b82f6", backgroundColor:"rgba(59,130,246,.06)",
            borderWidth:1.5, pointBackgroundColor:"#3b82f6",
            pointRadius:3, tension:.4, fill:true, borderDash:[4,3] }
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{labels:{color:C.mut,font:{family:"Tajawal",size:11}}},
          tooltip:{callbacks:{label:c=>`${fmt(c.raw)} دج`}} },
        scales:{
          x:{ticks:{color:C.mut,font:{family:"Tajawal",size:10}},grid:{color:C.brd+"44"}},
          y:{ticks:{color:C.mut,font:{family:"Tajawal",size:10},callback:v=>v>=1000?Math.round(v/1000)+"k":v},
            grid:{color:C.brd+"44"}}
        }
      }
    });
    return ()=>destroyChart(weekChartInst);
  },[sales.length]);

  // ── مخطط طرق الدفع ──
  useEffect(()=>{
    if(!payChartRef.current) return;
    destroyChart(payChartInst);
    const labels=["نقدي","CIB","بريدي موب","دَين","جزئي"];
    const values=[payMethods.cash,payMethods.cib,payMethods.baridimob,payMethods.debt,payMethods.partial];
    const nonZero = labels.map((l,i)=>({l,v:values[i]})).filter(x=>x.v>0);
    if(nonZero.length===0) return;
    payChartInst.current = new Chart(payChartRef.current, {
      type:"doughnut",
      data:{
        labels: nonZero.map(x=>x.l),
        datasets:[{ data:nonZero.map(x=>x.v),
          backgroundColor:CHART_COLORS.slice(0,nonZero.length),
          borderWidth:0, hoverOffset:6 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:"68%",
        plugins:{
          legend:{position:"bottom",labels:{color:C.mut,font:{family:"Tajawal",size:10},padding:8}},
          tooltip:{callbacks:{label:c=>`${c.label}: ${fmt(c.raw)} دج`}}
        }
      }
    });
    return ()=>destroyChart(payChartInst);
  },[sales.length]);

  // ── مخطط التصنيفات ──
  useEffect(()=>{
    if(!catChartRef.current||catEntries.length===0) return;
    destroyChart(catChartInst);
    catChartInst.current = new Chart(catChartRef.current, {
      type:"bar",
      data:{
        labels: catEntries.map(([k])=>k),
        datasets:[{ data:catEntries.map(([,v])=>v),
          backgroundColor:CHART_COLORS.map(c=>c+"cc"),
          borderColor:CHART_COLORS, borderWidth:1.5, borderRadius:6 }]
      },
      options:{
        indexAxis:"y", responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false},
          tooltip:{callbacks:{label:c=>`${fmt(c.raw)} دج`}} },
        scales:{
          x:{ticks:{color:C.mut,font:{family:"Tajawal",size:10},callback:v=>v>=1000?Math.round(v/1000)+"k":v},
            grid:{color:C.brd+"44"}},
          y:{ticks:{color:C.txt,font:{family:"Tajawal",size:11,weight:"bold"}},grid:{display:false}}
        }
      }
    });
    return ()=>destroyChart(catChartInst);
  },[sales.length]);

  // ── مخطط ساعات الذروة ──
  useEffect(()=>{
    if(!hourChartRef.current) return;
    destroyChart(hourChartInst);
    const peakHour = hourCounts.indexOf(Math.max(...hourCounts));
    hourChartInst.current = new Chart(hourChartRef.current, {
      type:"bar",
      data:{
        labels: Array.from({length:24},(_,i)=>`${i}h`),
        datasets:[{ data:hourCounts,
          backgroundColor: hourCounts.map((_,i)=>
            i===peakHour?"rgba(245,158,11,.9)":"rgba(59,130,246,.45)"),
          borderColor: hourCounts.map((_,i)=>
            i===peakHour?"#f59e0b":"#3b82f6"),
          borderWidth:1, borderRadius:3 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false},
          tooltip:{callbacks:{label:c=>`${fmt(c.raw)} دج`}} },
        scales:{
          x:{ticks:{color:C.mut,font:{family:"Tajawal",size:9}},grid:{display:false}},
          y:{ticks:{color:C.mut,font:{family:"Tajawal",size:9},callback:v=>v>=1000?Math.round(v/1000)+"k":v},
            grid:{color:C.brd+"33"}}
        }
      }
    });
    return ()=>destroyChart(hourChartInst);
  },[sales.length]);

  const statCards=[
    { icon:"💰", label:"إيرادات اليوم",  value:`${fmt(todayRev)} دج`,
      color:C.acc,  sub:`${todayCount} فاتورة`,
      delta:pct(todayRev,yesterdayRev) },
    { icon:"📈", label:"أرباح اليوم",    value:`${fmt(todayProfit)} دج`,
      color:C.grn,  sub:todayRev>0?`هامش ${Math.round(todayProfit/todayRev*100)}%`:"—",
      delta:pct(todayProfit,yesterdayProfit) },
    { icon:"🧾", label:"فواتير اليوم",   value:todayCount,
      color:C.blu,  sub:`أمس: ${yesterdayCount}`,
      delta:pct(todayCount,yesterdayCount) },
    { icon:"👥", label:"العملاء",        value:customers.length,
      color:C.pur,  sub:`${packages.length} باقة` },
    { icon:"🚫", label:"نفذ من المخزون", value:outOfStock.length,
      color:C.red,  sub:`${lowStock.length} منخفض`, onClick:()=>onNavigate("inventory") },
    { icon:"⚠️", label:"ديون العملاء",  value:`${fmt(totalDebt)} دج`,
      color:"#f97316", sub:`${customers.filter(c=>c.debt>0).length} عميل مديون`,
      onClick:()=>onNavigate("customers") },
  ];

  return (
    <div style={{height:"100%",overflowY:"auto",padding:12,background:C.bg}}>

      {/* ── زر ملخص اليوم الذكي ── */}
      <button onClick={()=>setShowSummary(true)} style={{
        width:"100%",marginBottom:12,
        background:`linear-gradient(135deg,${C.acc}18,${C.grn}10)`,
        border:`1.5px solid ${C.acc}40`,borderRadius:13,
        padding:"11px 16px",cursor:"pointer",
        display:"flex",alignItems:"center",justifyContent:"space-between",
        fontFamily:"Tajawal,sans-serif",transition:"all .15s"
      }}
        onMouseEnter={e=>{e.currentTarget.style.background=`linear-gradient(135deg,${C.acc}28,${C.grn}18)`;}}
        onMouseLeave={e=>{e.currentTarget.style.background=`linear-gradient(135deg,${C.acc}18,${C.grn}10)`;}}>

          <span style={{fontSize:22}}>✨</span>

            <div style={{fontSize:10,color:C.mut,marginTop:1}}>تحليل شامل لأداء المكتبة اليوم</div>
          </div>
        </div>
        <div style={{background:`linear-gradient(135deg,${C.acc},${C.accD})`,

          fontSize:11,fontWeight:800,flexShrink:0}}>

      </button>

      {showSummary && (

          <canvas ref={weekChartRef}/>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>

        <div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}>
          <div style={{fontWeight:800,fontSize:13,color:C.txt,marginBottom:10}}>💳 طرق الدفع</div>

            <canvas ref={payChartRef}/>

        </div>

        <div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}>

          <div style={{height:160}}>
            <canvas ref={catChartRef}/>

      {/* ── ساعات الذروة ── */}

          {topProds.length===0
            ?<div style={{color:C.mut,fontSize:12,textAlign:"center",padding:"14px 0"}}>لا توجد بيانات</div>
            :topProds.map(([name,qty],i)=>{
              const prod=products.find(p=>p.name===name);
              const pi=prod?getProdIcon(prod):{icon:"📦",color:C.mut,img:null};
              const maxQ = topProds[0][1];
              return(
                <div key={i} style={{marginBottom:8}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                    <span style={{fontSize:11,color:i<3?C.acc:C.mut,fontWeight:900,width:14,flexShrink:0}}>
                      {i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}
                    </span>
                    {renderPI(pi,22,6)}
                    <span style={{flex:1,fontSize:10,color:C.txt,fontWeight:600,
                      overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{name}</span>
                    <span style={{fontSize:10,color:C.acc,fontWeight:800,flexShrink:0}}>{qty}×</span>
                  </div>
                  <div style={{height:4,background:C.brd,borderRadius:4,overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${(qty/maxQ)*100}%`,

        </div>

        <div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}>
          <div style={{fontWeight:800,fontSize:13,color:C.txt,marginBottom:11}}>
            ⚠️ تنبيهات المخزون
            {(outOfStock.length+lowStock.length)>0&&
              <span style={{background:C.red,color:"white",borderRadius:20,
                fontSize:10,fontWeight:900,padding:"1px 7px",marginRight:6}}>
                {outOfStock.length+lowStock.length}
