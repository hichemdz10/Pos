<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef, useMemo } = React;
// ══════════════════════════════════════════════
//  🔊 نظام الأصوات — Web Audio API
// ══════════════════════════════════════════════
// سياق صوتي مشترك — Singleton لتجنّب تسرّب AudioContext
let _sharedAC = null;
const _ac = () => {
  if(!_sharedAC || _sharedAC.state === "closed")
    _sharedAC = new (window.AudioContext||window.webkitAudioContext)();
  if(_sharedAC.state === "suspended") _sharedAC.resume();
  return _sharedAC;
};

// صوت إضافة منتج للسلة — نغمة قصيرة خفيفة
const playCartSound = () => {
  try {
    const s = JSON.parse(localStorage.getItem("pos_settings")||"{}");
    if(s.muteSound) return;
    const ctx = _ac();
    [[880,.08],[1100,.06]].forEach(([f,d],i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type="sine"; o.frequency.value=f;
      const t=ctx.currentTime+i*.07;
      g.gain.setValueAtTime(.25,t);
      g.gain.exponentialRampToValueAtTime(.001,t+d+.08);
      o.start(t); o.stop(t+d+.1);
    });
  } catch(_){}
};

// صوت إشعار طلب جديد — ثلاث نغمات تصاعدية
const playNotifSound = () => {
  try {
    const ctx = _ac();
    [[440,.18],[554,.18],[659,.28]].forEach(([f,d],i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type="sine"; o.frequency.value=f;
      const t=ctx.currentTime+i*.2;
      g.gain.setValueAtTime(.35,t);
      g.gain.exponentialRampToValueAtTime(.001,t+d+.1);
      o.start(t); o.stop(t+d+.15);
    });
  } catch(_){}
};

    // ══════════════════════════════════════════════
    //  Supabase — طبقة قاعدة البيانات السحابية
    // ══════════════════════════════════════════════
    const SUPA_URL = "https://wvyqsdjbvtfwzsgipnpy.supabase.co";
    const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2eXFzZGpidnRmd3pzZ2lwbnB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMjg4ODUsImV4cCI6MjA5MjcwNDg4NX0.h8IkW7trVcTYSq8HRPyTAMs-TGR4M7lhD8f5CNm8e9I";
    const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

    // تحويل camelCase ↔ snake_case تلقائياً
    const toSnake = obj => {
      if(!obj||typeof obj!=="object"||Array.isArray(obj)) return obj;
      const r={};
      for(const[k,v] of Object.entries(obj))
        r[k.replace(/([A-Z])/g,'_$1').toLowerCase()]=v;
      return r;
    };
    const toCamel = obj => {
      if(!obj||typeof obj!=="object"||Array.isArray(obj)) return obj;
      const r={};
      for(const[k,v] of Object.entries(obj))
        r[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())]=v;
      return r;
    };

    // ══════════════════════════════════════════════
    //  🔀 DB ROUTER — يعمل على الكمبيوتر والهاتف
    //  الكمبيوتر → SQLite عبر Electron IPC
    //  الهاتف    → Supabase مباشرة
    // ══════════════════════════════════════════════
    const IS_DESKTOP = typeof window !== "undefined" && typeof window.electronAPI !== "undefined";

    const db = {
      // ── جلب كل السجلات ─────────────────────────
      async getAll(table) {
        if (IS_DESKTOP) {
          const data = await window.electronAPI.db.getAll(table);
          return data || [];
        }
        const {data, error} = await supa.from(table).select("*").order("id", {ascending: true});
        if (error) throw new Error(`getAll(${table}): ${error.message}`);
        return (data || []).map(toCamel);
      },

      // ── حفظ (إدراج أو تحديث) ──────────────────
      async save(table, item) {
        if (IS_DESKTOP) {
          return await window.electronAPI.db.save(table, item);
        }
        const row = toSnake(item);
        if (item.id) {
          const {id, ...updateRow} = row;
          const {data, error} = await supa.from(table).update(updateRow).eq("id", item.id).select("id").single();
          if (error) throw new Error(`update(${table}): ${error.message}`);
          return data.id;
        } else {
          delete row.id;
          const {data, error} = await supa.from(table).insert(row).select("id").single();
          if (error) throw new Error(`insert(${table}): ${error.message}`);
          return data.id;
        }
      },

      // ── حذف ────────────────────────────────────
      async remove(table, id) {
        if (IS_DESKTOP) {
          return await window.electronAPI.db.remove(table, id);
        }
        const {error} = await supa.from(table).delete().eq("id", id);
        if (error) throw new Error(`remove(${table}): ${error.message}`);
      },

      // ── تحديث المخزون مع حماية الرصيد السالب ───
      // delta: سالب عند البيع، موجب عند الشراء
      async updateStock(productId, delta) {
        if (IS_DESKTOP) {
          return await window.electronAPI.db.updateStock(productId, delta);
        }
        // على الهاتف — تحديث مباشر (بدون حماية delta — Supabase يتكفل)
        const {data: prod} = await supa.from("products").select("stock").eq("id", productId).single();
        if (!prod) return;
        const newStock = Math.max(0, (prod.stock || 0) + delta);
        await supa.from("products").update({stock: newStock}).eq("id", productId);
        return {newStock, oversold: newStock === 0 && (prod.stock + delta) < 0 ? Math.abs(prod.stock + delta) : 0};
      },
    };

    // ── مؤشر حالة المزامنة — يظهر فقط في وضع الكمبيوتر ──
    const SyncStatusBar = () => {
      const [status, setStatus] = React.useState(null);
      const [bootstrap, setBootstrap] = React.useState(null);
      const [oversold, setOversold]   = React.useState([]);
      const [otaUpdate, setOtaUpdate] = React.useState(null); // {version, hash, updatedAt}

      React.useEffect(() => {
        if (!IS_DESKTOP) return;
        window.electronAPI.sync.getStatus().then(setStatus);
        window.electronAPI.sync.onStatusChange(setStatus);
        window.electronAPI.sync.onBootstrapProgress(setBootstrap);
        window.electronAPI.sync.onOversoldAlert(alerts => {
          setOversold(alerts);
          if (alerts.length > 0) {
            const ids = alerts.map(a => a.id);
            window.electronAPI.db.markOversoldNotified(ids);
          }
        });
        // ── OTA: استقبال إشعار التحديث ──
        window.electronAPI.ota.onUpdateReady(info => {
          setOtaUpdate(info);
        });
        return () => window.electronAPI.sync.removeStatusListener();
      }, []);

      if (!IS_DESKTOP) return null;

      // ── شريط Bootstrap ──
      if (bootstrap && bootstrap.percent < 100) {
        return (
          <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:9998,
            background:"#0f1b2d",borderTop:"1px solid #1f3050",padding:"6px 16px"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,fontSize:11,color:"#94a3b8"}}>
              <span style={{animation:"spin 1s linear infinite",display:"inline-block"}}>🔄</span>
              <span>{bootstrap.message}</span>
              <div style={{flex:1,background:"#162236",borderRadius:4,height:4,overflow:"hidden"}}>
                <div style={{width:`${bootstrap.percent}%`,height:"100%",background:"#f59e0b",transition:"width .3s"}}/>
              </div>
              <span style={{color:"#f59e0b",fontWeight:700}}>{bootstrap.percent}%</span>
            </div>
          </div>
        );
      }

      // ── بانر تحديث الواجهة (OTA) ──
      if (otaUpdate) {
        return (
          <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:9999,
            background:"linear-gradient(135deg,#064e3b,#065f46)",
            borderTop:"1px solid #10b981",
            padding:"10px 16px",
            boxShadow:"0 -4px 20px rgba(16,185,129,.3)"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
              <span style={{fontSize:18}}>✨</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:800,fontSize:12,color:"#d1fae5"}}>
                  تحديث جديد جاهز — الإصدار {otaUpdate.version}
                </div>
                <div style={{fontSize:10,color:"#6ee7b7",marginTop:1}}>
                  تم تحميل واجهة محدّثة · أعد تشغيل البرنامج لتطبيقه
                </div>
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <button
                  onClick={()=>setOtaUpdate(null)}
                  style={{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.2)",
                    borderRadius:7,padding:"5px 12px",color:"#d1fae5",cursor:"pointer",
                    fontFamily:"Tajawal,sans-serif",fontSize:11,fontWeight:600}}>
                  لاحقاً
                </button>
                <button
                  onClick={()=>window.electronAPI.ota.restart()}
                  style={{background:"#10b981",border:"none",borderRadius:7,
                    padding:"5px 14px",color:"#022c22",cursor:"pointer",
                    fontFamily:"Tajawal,sans-serif",fontSize:12,fontWeight:900,
                    boxShadow:"0 2px 10px rgba(16,185,129,.4)"}}>
                  🔄 إعادة تشغيل الآن
                </button>
              </div>
            </div>
          </div>
        );
      }

      const dot = !status ? "⚪" : status.online ? "🟢" : "🔴";
      const msg = !status ? "..." :
        status.online
          ? `متصل${status.pendingCount > 0 ? ` | ${status.pendingCount} في الانتظار` : " | مزامن"}`
          : `لا إنترنت${status.pendingCount > 0 ? ` | ${status.pendingCount} عملية معلقة` : ""}`;

      return (
        <>
          {/* تنبيهات البيع بالزيادة */}
          {oversold.length > 0 && oversold.map(a => (
            <div key={a.id} style={{position:"fixed",top:50,right:12,zIndex:9999,
              background:"rgba(239,68,68,.97)",border:"1px solid #ef4444",
              color:"white",borderRadius:13,padding:"10px 18px",
              fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:13,
              boxShadow:"0 6px 24px rgba(0,0,0,.5)",animation:"popIn .2s ease",
              maxWidth:340}}>
              🔴 تنبيه: <strong>{a.product_name}</strong> — بيع {a.oversold_qty} قطعة زيادة عن المخزون أثناء غياب الإنترنت
            </div>
          ))}
          {/* شريط الحالة */}
          <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:9990,
            background:"rgba(8,15,30,.92)",borderTop:"1px solid #1f3050",
            padding:"3px 12px",display:"flex",alignItems:"center",gap:8,fontSize:10,color:"#64748b"}}>
            <span>{dot}</span>
            <span>{msg}</span>
            {status?.conflictCount > 0 && (
              <span style={{color:"#f59e0b",marginRight:"auto"}}>⚠️ {status.conflictCount} تعارض يحتاج مراجعة</span>
            )}
          </div>
        </>
      );
    };

    // ══════════════════════════════════════════════
    //  SMART ICON DETECTION
    // ══════════════════════════════════════════════
    const ICON_RULES=[
      // ─── دين ───
      {k:["مصحف","قرآن","قران","قرآن كريم"],    e:"📖",c:"#059669",bg:"#052e16"},
      // ─── أدوات الكتابة ───
      {k:["قلم رصاص","قلم الرصاص"],              e:"✏️", c:"#d97706",bg:"#451a03"},
      {k:["قلم حبر","قلم جاف","بيك","بيك كريستال"],e:"🖊️",c:"#3b82f6",bg:"#172554"},
      {k:["ماركر","فلوماستر","قلم لباد"],          e:"🖍️",c:"#ec4899",bg:"#500724"},
      {k:["سيال","تيبكس","سائل تصحيح","مسّاح سائل"],e:"🩹",c:"#a78bfa",bg:"#2e1065"},
      {k:["ممحاة","محاية"],                        e:"⬜",c:"#94a3b8",bg:"#1e293b"},
      {k:["براية","مبراة"],                        e:"🔧",c:"#78716c",bg:"#1c1917"},
      // ─── دفاتر ───
      {k:["دفتر","كراس","كراسة","دفاتر"],         e:"📓",c:"#10b981",bg:"#052e16"},
      // ─── كتب ───
      {k:["رياضيات","حساب"],                       e:"📐",c:"#3b82f6",bg:"#172554"},
      {k:["علوم"],                                  e:"🔬",c:"#22c55e",bg:"#052e16"},
      {k:["فيزياء","كيمياء"],                      e:"⚛️",c:"#06b6d4",bg:"#083344"},
      {k:["تاريخ","جغرافيا"],                      e:"🌍",c:"#f97316",bg:"#431407"},
      {k:["لغة عربية","نصوص","تعبير"],             e:"📝",c:"#8b5cf6",bg:"#2e1065"},
      {k:["لغة فرنسية","فرنسية"],                  e:"🇫🇷",c:"#60a5fa",bg:"#172554"},
      {k:["قاموس","معجم","موسوعة"],                e:"📖",c:"#f59e0b",bg:"#451a03"},
      {k:["كتاب","مرجع","منهج","كتب"],             e:"📚",c:"#f59e0b",bg:"#451a03"},
      // ─── أدوات هندسية ───
      {k:["مسطرة"],                                e:"📏",c:"#8b5cf6",bg:"#2e1065"},
      {k:["فرجار","بركار"],                        e:"⭕",c:"#06b6d4",bg:"#083344"},
      {k:["منقلة"],                                e:"🔵",c:"#3b82f6",bg:"#172554"},
      {k:["مثلث"],                                 e:"📐",c:"#8b5cf6",bg:"#2e1065"},
      {k:["مقص"],                                  e:"✂️",c:"#ef4444",bg:"#450a0a"},
      // ─── ألوان ───
      {k:["ألوان خشبية","أقلام تلوين","تلوين"],    e:"🖍️",c:"#f97316",bg:"#431407"},
      {k:["ألوان مائية","watercolor"],              e:"🎨",c:"#06b6d4",bg:"#083344"},
      {k:["ألوان","علبة ألوان"],                   e:"🎨",c:"#ec4899",bg:"#500724"},
      {k:["لوح رسم","لوحة"],                       e:"🖼️",c:"#64748b",bg:"#1e293b"},

    // تحويل أي قيمة مالية لصحيح (سنتيم) ثم إعادتها للوحدة
    const toInt   = v => Math.round((parseFloat(v)||0) * 100);          // دج → سنتيم
    const fromInt = v => v / 100;                                        // سنتيم → دج
    const safeNum = v => { const n=parseFloat(v); return isNaN(n)?0:n; }; // #5 حماية NaN

    const calcCart = (cartArr, discPct) => {
      const subI  = cartArr.reduce((s,i)=> s + toInt(i.price)*i.qty, 0);   // بالسنتيم
      const pct   = Math.min(100, Math.max(0, safeNum(discPct)));           // 0-100
      const discI = Math.round(subI * pct / 100);
      const totI  = subI - discI;
      return { subTotal: fromInt(subI), discAmt: fromInt(discI), total: fromInt(totI) };
    };

    // ══════════════════════════════════════════════
    //  CLOCK
    // ══════════════════════════════════════════════
    // ══════════════════════════════════════════════
    //  CUSTOMER DISPLAY BAR — شاشة العميل المحسّنة
    // ══════════════════════════════════════════════
    function CustomerDisplay({total,lastProduct,itemsCount,discount,customerName,onMenuOpen,sideOpen,cart}){
      const [displayTotal, setDisplayTotal] = useState(0);
      const [pulse,  setPulse]  = useState(false);
      const [key,    setKey]    = useState(0);

      const animRef  = useRef(null);
      const prevRef  = useRef(null);


      // count-up animation
      useEffect(()=>{
        if(animRef.current) cancelAnimationFrame(animRef.current);
        const start=displayTotal, end=total, dur=550;
        const t0=performance.now();
        const step=now=>{
          const p=Math.min((now-t0)/dur,1);
          const ease=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
          setDisplayTotal(Math.round(start+(end-start)*ease));
          if(p<1) animRef.current=requestAnimationFrame(step);
        };
        animRef.current=requestAnimationFrame(step);
        setPulse(true); setTimeout(()=>setPulse(false),700);
        return()=>{if(animRef.current)cancelAnimationFrame(animRef.current);};
      },[total]);

      useEffect(()=>{
        if(lastProduct&&lastProduct!==prevRef.current){setKey(k=>k+1);prevRef.current=lastProduct;}
      },[lastProduct]);


      const isEmpty=itemsCount===0;
      const cartItems=cart||[];
      const recentItems=[...cartItems].reverse().slice(0,4);
      const totalStr=displayTotal.toLocaleString('fr-DZ',{minimumFractionDigits:2,maximumFractionDigits:2});

      const HUD_BLUE   ="#010d1f";
      const GRID_COLOR ="rgba(30,120,255,.055)";
      const CORNER_CLR ="rgba(30,160,255,.55)";
      const NUM_CLR    = pulse?"#ffe566":isEmpty?"rgba(30,160,255,.15)":"#fab800";
      const fontSize   = isEmpty?36:total>=10000000?28:total>=1000000?36:total>=100000?46:58;

      return(
        <div style={{
          width:"100%",flexShrink:0,height:148,position:"relative",overflow:"hidden",
          background:HUD_BLUE,
          borderBottom:"1px solid rgba(30,120,255,.25)",
          display:"flex",flexDirection:"column",
          fontFamily:"'Tajawal',sans-serif"
        }}>

          {/* ── شبكة SVG ── */}
          <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}} xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="hud-grid" width="28" height="28" patternUnits="userSpaceOnUse">
                <path d="M 28 0 L 0 0 0 28" fill="none" stroke={GRID_COLOR} strokeWidth="0.7"/>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#hud-grid)" style={{animation:"gridPulse 6s ease infinite"}}/>
            {/* خطوط أفقية أكثر وضوحاً */}
            <line x1="0" y1="40" x2="100%" y2="40" stroke="rgba(30,120,255,.07)" strokeWidth="1"/>
            <line x1="0" y1="108" x2="100%" y2="108" stroke="rgba(30,120,255,.07)" strokeWidth="1"/>
            {/* فاصل عمودي */}
            <line x1="45%" y1="10" x2="45%" y2="138" stroke="rgba(30,120,255,.12)" strokeWidth="1" strokeDasharray="4,6"/>
            {/* توهج أسفلي */}
            <rect x="0" y="145" width="100%" height="3" fill="url(#hud-glow)"/>
            <defs>
              <linearGradient id="hud-glow" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="transparent"/>
                <stop offset="30%" stopColor="rgba(245,158,11,.4)"/>
                <stop offset="50%" stopColor="rgba(245,158,11,.7)"/>
                <stop offset="70%" stopColor="rgba(245,158,11,.4)"/>
                <stop offset="100%" stopColor="transparent"/>
              </linearGradient>
            </defs>
          </svg>

          {/* ── Watermark — مكتبة حشايشي ── */}
          <div style={{
            position:"absolute",
            inset:0,
            display:"flex",
            alignItems:"center",
            justifyContent:"center",
            pointerEvents:"none",
            zIndex:0,
            overflow:"hidden"
          }}>
            <div style={{
              fontSize:68,
              fontWeight:900,
              color:"transparent",
              WebkitTextStroke:"1px rgba(30,120,255,.09)",
              background:"linear-gradient(135deg,rgba(30,120,255,.07) 0%,rgba(30,200,255,.12) 50%,rgba(30,120,255,.05) 100%)",
              WebkitBackgroundClip:"text",
              WebkitTextFillColor:"transparent",
              whiteSpace:"nowrap",
              letterSpacing:8,
              userSelect:"none",
              filter:"blur(0.4px)",
              transform:"translateY(4px)",
              fontFamily:"'Tajawal',sans-serif"
            }}>مكتبة حشايشي</div>
          </div>
          <div style={{
            position:"absolute",left:0,right:0,height:"8%",
            background:"linear-gradient(180deg,transparent,rgba(30,120,255,.04),transparent)",
            animation:"scanline 5s linear infinite",pointerEvents:"none",zIndex:1
          }}/>

          {/* ── أركان HUD ── */}
          {[
            {top:6,right:8, style:{borderTop:`2px solid ${CORNER_CLR}`,borderRight:`2px solid ${CORNER_CLR}`}},
            {top:6,left:8,  style:{borderTop:`2px solid ${CORNER_CLR}`,borderLeft:`2px solid ${CORNER_CLR}`}},
            {bottom:6,right:8,style:{borderBottom:`2px solid ${CORNER_CLR}`,borderRight:`2px solid ${CORNER_CLR}`}},
            {bottom:6,left:8, style:{borderBottom:`2px solid ${CORNER_CLR}`,borderLeft:`2px solid ${CORNER_CLR}`}},
          ].map((c,i)=>(
            <div key={i} style={{
              position:"absolute",width:14,height:14,
              top:c.top,bottom:c.bottom,right:c.right,left:c.left,
              ...c.style,zIndex:3,
              animation:"cornerBlink 7s ease infinite",
              animationDelay:`${i*.4}s`
            }}/>
          ))}

          {/* ══ شريط علوي ══ */}
          <div style={{
            display:"flex",alignItems:"center",justifyContent:"space-between",
            padding:"8px 22px 0",flexShrink:0,position:"relative",zIndex:2
          }}>
            <button onClick={onMenuOpen} style={{
              background:"none",border:"none",
              color:sideOpen?"#fab800":"rgba(30,160,255,.4)",
              cursor:"pointer",padding:4,display:"flex",borderRadius:7,
              transition:"color .2s",zIndex:3
            }}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{width:18,height:18}}>
                <path d="M3 12h18M3 6h18M3 18h18"/>
              </svg>
            </button>
            <div style={{fontSize:9,color:"rgba(30,160,255,.35)",fontWeight:700,letterSpacing:3,
              animation:"hudFadeIn 1s ease forwards"}}>
              ◈ مكتبة حشايشي ◈
            </div>
            <MiniClock/>
          </div>

          {/* ══ المنطقة الرئيسية ══ */}
          <div style={{flex:1,display:"flex",minHeight:0,padding:"3px 0 0",position:"relative",zIndex:2}}>

            {/* ── يسار: إعلان + سلة ── */}
            <div style={{width:"44%",display:"flex",flexDirection:"column",padding:"3px 14px 8px 20px",gap:5,overflow:"hidden"}}>

              {/* ملخص السلة */}
              {isEmpty?(
                <div style={{flex:1,display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:20,opacity:.06}}>🛒</span>
                  <span style={{fontSize:9,color:"rgba(30,160,255,.15)",fontWeight:600,letterSpacing:1}}>السلة فارغة</span>
                </div>
              ):(
                <div style={{flex:1,display:"flex",flexDirection:"column",gap:3,overflow:"hidden"}}>
                  {recentItems.map((item,i)=>(
                    <div key={item.id||i} style={{
                      display:"flex",alignItems:"center",justifyContent:"space-between",gap:6,
                      opacity:i===0?1:i===1?.65:i===2?.38:.2,
                      animation:`hudSlideUp .35s ease ${i*.07}s both`
                    }}>
                      <div style={{display:"flex",alignItems:"center",gap:5,minWidth:0,flex:1}}>
                        <div style={{
                          width:3,height:3,borderRadius:"50%",flexShrink:0,
                          background:i===0?"#fab800":"rgba(30,160,255,.4)",
                          boxShadow:i===0?"0 0 6px #fab80099":""
                        }}/>
                        <span style={{
                          fontSize:10,fontWeight:i===0?700:500,
                          color:i===0?"rgba(255,255,255,.8)":"rgba(30,160,255,.5)",
                          whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"
                        }}>{item.name}</span>
                        <span style={{fontSize:8,color:"rgba(255,255,255,.2)",flexShrink:0}}>×{item.qty}</span>
                      </div>
                      <span style={{
                        fontSize:10,fontWeight:700,flexShrink:0,fontFamily:"monospace",
                        color:i===0?"#fab800":"rgba(245,158,11,.3)"
                      }}>{(item.price*item.qty).toLocaleString('fr-DZ',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
                    </div>
                  ))}
                  {cartItems.length>4&&(
                    <div style={{fontSize:8,color:"rgba(30,160,255,.25)",fontWeight:600,letterSpacing:.5}}>
                      ··· {cartItems.length-4} أصناف أخرى
                    </div>
                  )}
                </div>
              )}
            </div>

            {/* ── وسط/يمين: الإجمالي ── */}
            <div style={{
              flex:1,display:"flex",flexDirection:"column",
              alignItems:"center",justifyContent:"center",
              padding:"0 16px 8px",gap:2
            }}>

              {/* العنوان */}
              <div style={{
                fontSize:7.5,fontWeight:700,letterSpacing:4,
                color:"rgba(30,160,255,.35)",
                animation:"hudFadeIn .8s ease forwards"
              }}>◂ المبلغ الإجمالي ▸</div>

              {/* الرقم الرئيسي */}
              <div style={{
                fontSize,fontWeight:900,lineHeight:1,
                fontFamily:"'Courier New',monospace",
                fontVariantNumeric:"tabular-nums",
                color:NUM_CLR,
                letterSpacing:-1,
                transition:"font-size .25s",
                textShadow:isEmpty
                  ?"0 0 10px rgba(30,120,255,.15)"
                  :pulse
                    ?"0 0 30px rgba(245,158,11,.9),0 0 80px rgba(245,158,11,.4),0 0 4px #fff9"
                    :"0 0 20px rgba(245,158,11,.5),0 0 55px rgba(245,158,11,.2)",
                animation:pulse?"numCount .55s cubic-bezier(.34,1.56,.64,1) forwards":"none",
              }}>{totalStr}</div>

              {/* وحدة العملة */}
              <div style={{
                fontSize:16,fontWeight:900,letterSpacing:3,
                color:isEmpty?"rgba(30,160,255,.15)":"rgba(245,158,11,.75)",
                marginTop:2
              }}>دج</div>

              {/* بادجات المعلومات */}
              <div style={{display:"flex",gap:6,marginTop:4,alignItems:"center",flexWrap:"wrap",justifyContent:"center"}}>
                {itemsCount>0&&(
                  <div style={{
                    fontSize:8,color:"rgba(30,160,255,.6)",fontWeight:700,
                    background:"rgba(30,120,255,.08)",border:"1px solid rgba(30,120,255,.18)",
                    borderRadius:10,padding:"1px 7px",letterSpacing:.5
                  }}>{itemsCount} {itemsCount===1?"صنف":"أصناف"}</div>
                )}
                {discount>0&&(
                  <div style={{
                    fontSize:8,color:"#10b981",fontWeight:800,
                    background:"rgba(16,185,129,.08)",border:"1px solid rgba(16,185,129,.2)",
                    borderRadius:10,padding:"1px 7px"
                  }}>خصم {discount}%</div>
                )}
                {customerName&&(
                  <div style={{
                    fontSize:8,color:"rgba(167,139,250,.8)",fontWeight:700,
                    background:"rgba(139,92,246,.08)",border:"1px solid rgba(139,92,246,.2)",
                    borderRadius:10,padding:"1px 7px",
                    maxWidth:110,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"
                  }}>👤 {customerName}</div>
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    function MiniClock(){
      const [t,setT]=useState(new Date());
      useEffect(()=>{const id=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(id);},[]);
      const hh=String(t.getHours()).padStart(2,"0");
      const mm=String(t.getMinutes()).padStart(2,"0");
      const ss=String(t.getSeconds()).padStart(2,"0");
      const days=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
      return(
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-start",gap:1}}>
          <div style={{fontSize:16,fontWeight:900,color:"rgba(255,255,255,.7)",fontFamily:"monospace",letterSpacing:2,lineHeight:1}}>
            {hh}:{mm}<span style={{fontSize:11,color:C.acc,marginRight:1}}>:{ss}</span>
          </div>
          <div style={{fontSize:9,color:"rgba(255,255,255,.25)",fontWeight:500}}>{days[t.getDay()]}</div>
        </div>
      );
    }

    // ══════════════════════════════════════════════
    //  CAMERA SCANNER — مكوّن موحّد وآمن
    // ══════════════════════════════════════════════
    function CameraScanner({onDetected,onClose}){
      const mountedRef  = useRef(true);
      const instRef     = useRef(null);
      const detectedRef = useRef(false);
      const [status, setStatus] = useState("starting"); // starting | ready | error | manual
      const [manualVal, setManualVal] = useState("");

      // ── إيقاف الكاميرا بأمان تام ──
      const safeStop = async()=>{
        try{
          if(instRef.current){
            const s = instRef.current;
            instRef.current = null;
            if(s.isScanning) await s.stop();
          }
        }catch(_){}
      };

      // ── إغلاق آمن لا يحطم React ──
      const handleClose = ()=>{
        mountedRef.current = false;
        safeStop().finally(()=>{ try{ onClose(); }catch(_){} });
      };

      useEffect(()=>{
        mountedRef.current  = true;
        detectedRef.current = false;

        // إذا كان file:// — انتقل مباشرة للإدخال اليدوي
        if(window.location.protocol === "file:"){
          setStatus("manual"); return;
        }

        const timer = setTimeout(async()=>{
          if(!mountedRef.current) return;
          try{
            const scanner = new Html5Qrcode("qr-reader-modal");
            instRef.current = scanner;
            await scanner.start(
              {facingMode:"environment"},
              {fps:12, qrbox:{width:240,height:160}},
              text=>{
                if(!mountedRef.current || detectedRef.current) return;
                detectedRef.current = true;
                mountedRef.current = false;
                safeStop().finally(()=>{
                  try{ onDetected(text); }catch(_){}
                });
              },
              ()=>{}
            );
            if(mountedRef.current) setStatus("ready");
          }catch(e){
            if(mountedRef.current) setStatus("error");
          }
        }, 350);

        return()=>{
          mountedRef.current = false;
          clearTimeout(timer);
          safeStop();
        };
      },[]);

      const submitManual = ()=>{
        const v = manualVal.trim();
        if(!v) return;
        mountedRef.current = false;
        try{ onDetected(v); }catch(_){}
      };

      return(
        <div style={{position:"fixed",inset:0,zIndex:9990,display:"flex",
          alignItems:"flex-end",justifyContent:"center",
          background:"rgba(0,0,0,.82)",backdropFilter:"blur(4px)"}}
          onClick={handleClose}>
          <div style={{background:C.surf,borderRadius:"20px 20px 0 0",
            width:"100%",maxWidth:480,padding:"18px 18px 32px",
            boxShadow:"0 -8px 40px rgba(0,0,0,.6)",
            animation:"fadeUp .25s ease"}}
            onClick={e=>e.stopPropagation()}>

            {/* Header */}
            <div style={{display:"flex",justifyContent:"space-between",
              alignItems:"center",marginBottom:14}}>
              <div style={{fontWeight:900,fontSize:15,color:C.acc}}>
                📷 مسح الباركود
              </div>
              <button onClick={handleClose}
                style={{background:C.card,border:`1px solid ${C.brd}`,
                  borderRadius:"50%",width:32,height:32,color:C.mut,
                  cursor:"pointer",fontSize:18,
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                ✕
              </button>
            </div>

            {/* شاشة الكاميرا */}
            {(status==="starting"||status==="ready")&&(
              <div style={{borderRadius:14,overflow:"hidden",
                background:"#000",marginBottom:10,position:"relative"}}>
                <div id="qr-reader-modal" style={{width:"100%",minHeight:240}}/>
                {status==="ready"&&(
                  <div style={{position:"absolute",inset:0,pointerEvents:"none",
                    display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <div style={{border:`2px solid ${C.acc}`,borderRadius:12,
                      width:200,height:130,boxShadow:`0 0 0 9999px rgba(0,0,0,.45)`}}/>
                    <div style={{position:"absolute",left:0,right:0,height:2,top:"50%",
                      background:`linear-gradient(90deg,transparent,${C.acc},transparent)`,
                      animation:"scanLine 1.8s linear infinite"}}/>
                  </div>
                )}
                {status==="starting"&&(
                  <div style={{position:"absolute",inset:0,display:"flex",
                    alignItems:"center",justifyContent:"center",
                    background:"rgba(0,0,0,.6)",color:C.mut,fontSize:13}}>
                    ⏳ جارٍ تشغيل الكاميرا...
                  </div>
                )}
              </div>
            )}

            {/* خطأ الكاميرا */}
            {status==="error"&&(
              <div style={{background:"#1c1400",border:`1px solid ${C.amb}40`,
                borderRadius:12,padding:"14px 16px",marginBottom:12,textAlign:"center"}}>
                <div style={{fontSize:28,marginBottom:6}}>📵</div>
                <div style={{color:C.amb,fontWeight:700,fontSize:13,marginBottom:4}}>
                  تعذّر فتح الكاميرا
                </div>
                <div style={{color:C.mut,fontSize:11,marginBottom:10}}>
                  افتح الملف عبر خادم محلي أو أدخل الباركود يدوياً
                </div>
                <button onClick={()=>setStatus("manual")}
                  style={{background:`${C.acc}22`,border:`1px solid ${C.acc}50`,
                    borderRadius:9,padding:"7px 20px",color:C.acc,
                    fontFamily:"Tajawal,sans-serif",fontWeight:700,
                    fontSize:13,cursor:"pointer"}}>
                  ✏️ إدخال يدوي
                </button>
              </div>
            )}

            {/* file:// تحذير */}
            {status==="manual"&&window.location.protocol==="file:"&&(
              <div style={{background:"#0c1a2e",border:`1px solid ${C.blu}30`,
                borderRadius:10,padding:"10px 13px",marginBottom:12,fontSize:11,
                color:C.mut,display:"flex",gap:9,alignItems:"flex-start"}}>
                <span style={{fontSize:16,flexShrink:0}}>ℹ️</span>
                <span>
                  الكاميرا تعمل فقط عبر <b style={{color:C.acc}}>http://</b> — 
                  شغّل الملف بخادم محلي (python -m http.server 8080).<br/>

    // ── ScannerInit — ماسح وضع الهاتف اللاسلكي ──
    function ScannerInit({productsRef,setScannerLog,onAdd}){
      const mountedRef = useRef(true);
      const instRef    = useRef(null);
      const lastBc     = useRef("");
      const lastTime   = useRef(0);

      const safeStop = async()=>{
        try{
          if(instRef.current){
            const s=instRef.current; instRef.current=null;
            if(s.isScanning) await s.stop();
          }
        }catch(_){}
      };

      useEffect(()=>{
        mountedRef.current=true;
        if(typeof Html5Qrcode==="undefined"){ return; }

        const start=async()=>{
          try{
            const scanner=new Html5Qrcode("scanner-mode-reader");
            instRef.current=scanner;
            await scanner.start(
              {facingMode:"environment"},
              {fps:15, qrbox:{width:240,height:160}},
              async barcode=>{
                if(!mountedRef.current) return;
                // منع التكرار السريع لنفس الباركود
                const now=Date.now();
                if(barcode===lastBc.current && now-lastTime.current<2000) return;
                lastBc.current=barcode; lastTime.current=now;

                const p=productsRef.current.find(x=>(x.barcode||"").trim()===barcode.trim());
                if(mountedRef.current){
                  setScannerLog(prev=>[...prev,{
                    barcode, name:p?p.name:`غير معروف (${barcode})`,
                    found:!!p,
                    time:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})
                  }]);
                }

                // ① إضافة فورية للسلة المحلية (الهاتف نفسه) — بدون انتظار Supabase
                if(p && onAdd) onAdd(p);

                // ② إرسال للأجهزة الأخرى (الكمبيوتر) عبر Supabase — اختياري/شبكي
                supa.from("scan_queue").insert({barcode, consumed: false})
                  .then(({error})=>{ if(error) console.warn("scan_queue insert error:", error.message); })
                  .catch(e=>console.warn("scan_queue network error:", e));
              },
              ()=>{}
            );
          }catch(e){
            console.warn("ScannerInit error:",e);
          }
        };

        const t=setTimeout(start,400);
        return()=>{
          mountedRef.current=false;
          clearTimeout(t);
          safeStop();
        };
      },[]);

      return null;
    }

    function POSView({products,cats,customers,packages,sales,notify,reload,onMenuOpen,sideOpen,onNavigate,tabs,currentView,printInvoice,cart,setCart,suspended,setSuspended,appSettings={}}){

      const[rcv,setRcv]               =useState("");

      const[saving,setSaving]          =useState(false);
      // إعادة ضبط toggle والمبلغ عند تغيير طريقة الدفع
      const[sale,setSale]              =useState(null);
      const[mob,setMob]               =useState(false);
      const[isMobile,setIsMobile]      =useState(()=>window.innerWidth<768);
      useEffect(()=>{
        const fn=()=>setIsMobile(window.innerWidth<768);
        window.addEventListener("resize",fn);
        return()=>window.removeEventListener("resize",fn);
      },[]);
      const[selCust,setSelCust]        =useState("");
      const[discount,setDisc]          =useState(0);
      const[redeemPts,setRedeemPts]    =useState(0);   // نقاط يريد استبدالها
      const[showLoyalty,setShowLoyalty]=useState(false); // لوحة الولاء
      const[lastAdded,setLast]         =useState(null);
      const[showCamera,setCamera]      =useState(false);
      const[newProdModal,setNewProd]   =useState(null); // {barcode} عند مسح باركود غير معروف
      const[showPkgs,setPkgs]          =useState(false);
      const[payMethod,setPay]          =useState("cash");
      // إعادة ضبط toggle والمبلغ عند تغيير طريقة الدفع
      useEffect(()=>{ setShowRcv(false); setRcv(""); },[payMethod]);
      const[note,setNote]              =useState("");
      const note_draft                 =useRef("");
      const[editPriceId,setEPId]       =useState(null);
      const[editPriceVal,setEPV]       =useState("");
      const[showToday,setToday]        =useState(false);
      const[showHot,setHot]            =useState(false);
      const[kioskMode,setKiosk]        =useState(false);
      const[kioskSearch,setKSrch]      =useState("");
      const[kioskCat,setKCat]          =useState("all");
      const[kioskClock,setKClock]      =useState(new Date());
      // ── سلات معلقة ──
      const[showSuspended,setShowSusp] =useState(false);
      const[showCartDet,setShowCartDet]=useState(false); // إظهار تفاصيل الدفع في السلة
      // ── المرتجعات ──
      const[returnModal,setReturnModal]=useState(false);
      const[retSearch,setRetSearch]    =useState("");
      const[retSale,setRetSale]        =useState(null);
      const[retItems,setRetItems]      =useState({});
      // ── وضع الماسح اللاسلكي ──
      const[scannerMode,setScannerMode]=useState(false);
      const[scannerLog,setScannerLog]  =useState([]); // سجل ما تم مسحه
      // ── خدمات الطباعة والشحن ──
      const[showPrint,setPrint]        =useState(false);
      const[showRecharge,setRecharge]  =useState(false);
      const productsRef                =useRef(products);
      useEffect(()=>{ productsRef.current=products; },[products]);

      // ── Realtime listener — يستقبل الباركودات من الهاتف ──
      useEffect(()=>{
        const channel=supa.channel("scan-queue-channel")
          .on("postgres_changes",{
            event:"INSERT",schema:"public",table:"scan_queue"
          },async payload=>{
            const barcode=payload.new?.barcode;
            if(!barcode) return;
            // ابحث عن المنتج في القائمة المحدّثة
            const p=productsRef.current.find(x=>(x.barcode||"").trim()===barcode.trim());
            if(p){
              addFnRef.current(p,true);
              notify(`📡 ${p.name} — تم المسح`,"ok");
            } else {
              // المنتج غير موجود بعد — أعد تحميل قائمة المنتجات ثم حاول مجدداً
              await reload(["products"]);
              const p2=productsRef.current.find(x=>(x.barcode||"").trim()===barcode.trim());
              if(p2){
                addFnRef.current(p2,true);
                notify(`📡 ${p2.name} — تم المسح`,"ok");
              } else {
                notify(`⚠️ باركود غير معروف: ${barcode}`,"err");
              }
            }
            // احذف السجل بعد المعالجة
            await supa.from("scan_queue").delete().eq("id",payload.new.id);
          })
          .subscribe();
        return()=>{ supa.removeChannel(channel); };
      },[]);

      // ── Realtime listener — يستقبل تغييرات المنتجات لحظياً ──
      useEffect(()=>{
        const productChannel=supa.channel("realtime-products")
          .on("postgres_changes",{
            event:"*",schema:"public",table:"products"
          },payload=>{
            // تحديث القائمة فوراً دون Refresh
            reload(["products"]);
            if(payload.eventType==="INSERT"){
              notify(`✨ تم تسجيل منتج جديد: ${payload.new.name}`);
            }
          })
          .subscribe();
        return()=>{ supa.removeChannel(productChannel); };
      },[]);

      // ref لـ addFn / onScan حتى يصل لآخر نسخة دون إعادة subscribe
      const addFnRef=useRef(null);
      const onScanRef=useRef(null);

      useEffect(()=>{
        if(!kioskMode)return;
        const t=setInterval(()=>setKClock(new Date()),1000);
        return()=>clearInterval(t);
      },[kioskMode]);

      // ══ مزامنة شاشة الزبون الخارجية (display.html) ══
      const displayWindowRef = useRef(null);
      const pushToDisplay = (items, ttl, disc, pm, paid) => {
        try {
          localStorage.setItem('hashayshi_display_cart', JSON.stringify({
            active: items.length > 0,
            items: items.map(i => ({ name: i.name, qty: i.qty, price: i.price })),
            total: ttl, discount: disc || 0,
            paymentMethod: pm || null, paid: paid || 0,
            ts: Date.now()
          }));
        } catch(_){}
      };
      const completeSaleDisplay = (ttl) => {
        try {
          localStorage.setItem('hashayshi_display_complete', JSON.stringify({ id: 'sale_'+Date.now(), total: ttl, ts: Date.now() }));
          localStorage.setItem('hashayshi_display_cart', JSON.stringify({ active: false, items: [], total: 0 }));
        } catch(_){}
      };
      const clearDisplay = () => {
        try { localStorage.setItem('hashayshi_display_cart', JSON.stringify({ active: false, items: [], total: 0 })); } catch(_){}
      };

      // دفع فوري لكل تغيير على السلة
      useEffect(()=>{
        const {subTotal:sub,total:tot}=calcCart(cart,discount);
        pushToDisplay(cart, tot, discount, payMethod, null);
      }, [cart, discount]);

      // فتح شاشة الزبون الخارجية
      const openDisplay = () => {
        if (displayWindowRef.current && !displayWindowRef.current.closed) {
          displayWindowRef.current.focus();
        } else {
          displayWindowRef.current = window.open('display.html', 'customer_display',
            'width=1280,height=720,toolbar=no,menubar=no,scrollbars=no');
        }
      };
      const openDisplayAdmin = () => {
        window.open('display-admin.html', 'display_admin', 'width=1160,height=820,toolbar=no,menubar=no');
      };

      const bufRef=useRef(""),timeRef=useRef(0);
      // refs للوصول لآخر نسخة من الدوال داخل keydown
      const confirmSaleRef=useRef(null);
      const suspendCartRef=useRef(null);

      useEffect(()=>{
        const fn=e=>{
          // ══ اختصارات لوحة المفاتيح — الكاشيير ══
          // Escape: رجوع / إغلاق
          if(e.key==="Escape"){
            if(phase==="checkout"){setPhase("cart");setRcv("");return;}
            if(showToday){setToday(false);return;}
            if(showHot){setHot(false);return;}
            return;
          }
          // F1: تركيز حقل الباركود
          if(e.key==="F1"){e.preventDefault();document.getElementById("pos-scan-input")?.focus();return;}
          // F2: متابعة للدفع / تأكيد البيع / بيع جديد
          if(e.key==="F2"){
            e.preventDefault();
            if(phase==="cart"&&cart.length>0){setPhase("checkout");return;}
            if(phase==="checkout"){confirmSaleRef.current&&confirmSaleRef.current();return;}
            if(phase==="receipt"){setSale&&setSale(null);setPhase("cart");return;}
            return;
          }
          // F3: مسح السلة الكاملة
          if(e.key==="F3"){
            e.preventDefault();
            if(cart.length>0&&phase==="cart"){setCart([]);setLast(null);setNote("");notify("🗑 تم مسح السلة");}
            return;
          }
          // F4: تعليق السلة الحالية
          if(e.key==="F4"){
            e.preventDefault();
            if(cart.length>0&&phase==="cart"){suspendCartRef.current&&suspendCartRef.current();}
            return;
          }
          // F5: عرض/إخفاء السلات المعلقة
          if(e.key==="F5"){e.preventDefault();setShowSusp(v=>!v);return;}
          // F6: مبيعات اليوم
          if(e.key==="F6"){e.preventDefault();setToday(v=>!v);return;}
          // F7: الأكثر مبيعاً
          if(e.key==="F7"){e.preventDefault();setHot(v=>!v);return;}
          // F8: طباعة الفاتورة (في شاشة الإيصال)
          if(e.key==="F8"){e.preventDefault();if(phase==="receipt"&&sale)printInvoice(sale);return;}
          // F9: بيع جديد (في شاشة الإيصال)
          if(e.key==="F9"){e.preventDefault();if(phase==="receipt"){setSale&&setSale(null);setPhase("cart");}return;}
          // Delete: حذف آخر صنف من السلة
          if(e.key==="Delete"&&!["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)){
            setCart(prev=>{if(!prev.length)return prev;const nc=[...prev];nc.pop();return nc;});return;
          }
          if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName))return;
          const now=Date.now();
          const _sd = appSettings?.scanDelay ?? 120;
          if(now-timeRef.current>_sd)bufRef.current="";
          timeRef.current=now;
          if(e.key==="Enter"){const bc=bufRef.current.trim();bufRef.current="";if(bc.length>=2){const p=productsRef.current.find(x=>(x.barcode||"").trim()===bc);if(p)addFn(p,true);else notify("لم يُعثر على المنتج: "+bc,"err");}}
          else if(e.key.length===1)bufRef.current+=e.key;
        };
        window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);
      },[products,phase,showToday,showHot,cart,sale]);

      const filt=products.filter(p=>(!search||p.name.includes(search)||(p.barcode||"").includes(search))&&(selCat==="all"||p.category===selCat));

      // الأكثر مبيعاً — top 8 based on all sales history
      const hotIds=useMemo(()=>{
        const counts={};
        (sales||[]).forEach(s=>(s.items||[]).forEach(it=>{counts[it.id]=(counts[it.id]||0)+it.qty;}));
        return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([id])=>id);
      },[sales]);
      const hotProducts=hotIds.map(id=>products.find(p=>String(p.id)===String(id))).filter(Boolean);

      const {subTotal,discAmt,total}=calcCart(cart,discount);
      // #4 — change آمن
      const rcvNum=safeNum(rcv||0);
      const change=calcChange(rcvNum,total);
      const qty=cart.reduce((s,i)=>s+i.qty,0);

      // ── حسابات الولاء ──
      const selCustObj = selCust ? customers.find(c=>String(c.id)===String(selCust)) : null;
      const custTotalSpent = selCustObj
        ? sales.filter(s=>Number(s.customerId)===Number(selCustObj.id)&&s.payMethod!=="return").reduce((s,x)=>s+(x.total||0),0)
        : 0;
      const custTier   = loyaltyTier(custTotalSpent);
      const custPoints = selCustObj?.loyaltyPoints || 0;
      const maxRedeemPts = Math.min(custPoints, Math.floor(total / LOYALTY.pointValue));
      const redeemDiscount = pointsToDZD(Math.min(redeemPts, maxRedeemPts));
      const finalTotal = Math.max(0, total - redeemDiscount);
      const willEarn   = selCustObj ? earnedPoints(total, custTier) : 0;

      // مبيعات اليوم
      const todaySales=useMemo(()=>{
        const today=new Date().toISOString().slice(0,10);
        return(sales||[]).filter(s=>s.date?.slice(0,10)===today).sort((a,b)=>b.date.localeCompare(a.date));
      },[sales]);

      const addFn=(p,fromScan=false)=>{
        if(p.stock<=0){notify("المنتج غير متوفر في المخزون","err");return;}
        // ── نحسب الحالة قبل التحديث لتجنّب setState داخل setState ──
        const ex=cart.find(i=>i.id===p.id);
        if(ex&&ex.qty>=p.stock){notify("⚠ وصلت للحد الأقصى المتاح: "+p.stock,"err");return;}
        playCartSound();
        if(ex){
          setCart(prev=>prev.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i));
          setLast({...p,qty:ex.qty+1});
          const rem=p.stock-(ex.qty+1);
          if(rem>0&&rem<=(p.minStock||5))notify(`⚠ تنبيه: تبقى ${rem} فقط من "${p.name}"`,"err");
        } else {
          setCart(prev=>[...prev,{...p,qty:1}]);
          setLast({...p,qty:1});
          if(p.stock===1)notify(`⚠ آخر قطعة من "${p.name}"`,"err");
        }
        if(fromScan)notify(`✓ ${p.name}`);
      };
      // تحديث الـ refs في كل render لضمان آخر نسخة
      addFnRef.current=addFn;
      // ── تعليق السلة ──
      const suspendCart=()=>{
        if(!cart.length){notify("السلة فارغة","err");return;}
        const id=Date.now();
        setSuspended(prev=>[...prev,{id,cart:[...cart],note,custId:selCust,discount,time:new Date().toISOString()}]);
        setCart([]);setNote("");setSelCust("");setDisc(0);setLast(null);setRedeemPts(0);
        notify(`⏸ تم تعليق السلة (${cart.length} صنف)`);
      };
      const resumeCart=(s)=>{
        if(cart.length>0&&!confirm("السلة الحالية لها محتوى. هل تستبدلها بالسلة المعلقة؟"))return;
        setCart(s.cart);setNote(s.note||"");setSelCust(s.custId||"");setDisc(s.discount||0);
        setSuspended(prev=>prev.filter(x=>x.id!==s.id));
        setShowSusp(false);
      };
      const deleteSuspended=(id)=>setSuspended(prev=>prev.filter(x=>x.id!==id));
      // wire refs for keydown handler
      suspendCartRef.current=suspendCart;

      // ── معالجة المرتجعات ──
      const processReturn=async()=>{
        if(!retSale)return;
        const entries=Object.entries(retItems).filter(([,q])=>q>0);
        if(!entries.length){notify("اختر منتجاً للإرجاع","err");return;}
        // استعادة المخزون
        for(const[idx,retQty] of entries){
          const item=retSale.items[idx];
          const prod=products.find(p=>p.id===item.id);
          if(prod) await db.save("products",{...prod,stock:prod.stock+retQty});
        }
        // تسجيل المرتجع كبيع سالب — مع تطبيق نسبة خصم الفاتورة الأصلية
        const discFactor = retSale.discount>0 ? (1 - retSale.discount/100) : 1;
        const retAmount=Math.round(entries.reduce((acc,[idx,q])=>{
          const item=retSale.items[idx];
          return acc+(item.price*q);
        },0) * discFactor * 100) / 100;
        await db.save("sales",{
          items:entries.map(([idx,q])=>({...retSale.items[idx],qty:-q})),
          total:-retAmount, payMethod:"return",
          note:`مرتجع من فاتورة #${String(retSale.id||"").padStart(4,"0")}`,
          date:new Date().toISOString(), customerId:retSale.customerId
        });
        // تحديث دين العميل إذا كانت الفاتورة الأصلية بالأجل أو جزئية
        if(retSale.customerId&&(retSale.payMethod==="debt"||retSale.payMethod==="partial")){
          const cust=customers.find(c=>c.id===Number(retSale.customerId));
          if(cust){
            const debtReduction=retSale.payMethod==="debt"
              ? retAmount
              : Math.min(retAmount, Math.max(0,(retSale.total||0)-(retSale.received||0)));
            const newDebt=Math.max(0,(cust.debt||0)-debtReduction);
            await db.save("customers",{...cust,debt:newDebt});
          }
        }
        await reload(["products","sales"]);
        notify(`✓ تم استرجاع ${entries.length} صنف — ${fmt(retAmount)} دج`);
        setReturnModal(false);setRetSale(null);setRetItems({});setRetSearch("");
      };

      const addPkg=pkg=>{
        const missing=[];
        const additions=[];
        (pkg.items||[]).forEach(item=>{
          const p=products.find(x=>x.id===item.productId);
          if(!p||p.stock<item.qty){missing.push(p?.name||"منتج محذوف");}
          else{ additions.push({p, qty:item.qty}); }
        });
        if(missing.length){notify(`⚠ مخزون ناقص: ${missing.join("، ")}`,"err");return;}
        // تحديث السلة في عملية واحدة لتجنّب التعارض بين الحالات
        setCart(prev=>{
          const next=[...prev];
          additions.forEach(({p,qty})=>{
            const ex=next.find(i=>i.id===p.id);
            if(ex) ex.qty=Math.min(ex.qty+qty, p.stock);
            else next.push({...p, qty:Math.min(qty, p.stock)});
          });
          return next;
        });
        playCartSound();
        notify(`✓ تمت إضافة باقة: ${pkg.name}`);
        setPkgs(false);
      };
      const updQty=(key,d)=>setCart(prev=>prev.reduce((acc,i)=>{
        const ikey=i._sid||i.id;
        if(ikey!==key){acc.push(i);return acc;}
        const q=i.qty+d;
        // الحماية: التحقق من المخزون عند محاولة الزيادة (للمنتجات فقط)
        if(d>0&&q>i.stock&&!i._svc){
          notify(`⚠ وصلت للحد الأقصى المتاح: ${i.stock}`,"err");
          acc.push(i);
          return acc;
        }
        if(q>0) acc.push({...i,qty:q});
        return acc;
      },[]));

      // إضافة عنصر خدمة للسلة (بدون فحص المخزون)
      const addServiceItem=(item)=>{
        playCartSound();
        setCart(prev=>{
          const ex=prev.find(i=>i._sid&&i._sid===item._sid&&!item._unique);
          if(ex) return prev.map(i=>i._sid===item._sid?{...i,qty:i.qty+item.qty}:i);
          return[...prev,item];
        });
        setLast(item);
      };
      const confirmSale=async()=>{
        const isDebt=payMethod==="debt";
        const isCard=payMethod==="cib"||payMethod==="baridimob";
        const isPartial=payMethod==="partial";
        if(!isDebt&&!isCard&&!isPartial&&showRcv&&change<0){notify("المبلغ المستلم غير كافٍ","err");return;}
        if(isPartial&&(!rcv||rcvNum<=0)){notify("أدخل المبلغ المدفوع جزئياً","err");return;}
        setSaving(true);
        const received=isCard?finalTotal:isDebt?0:(showRcv?rcvNum:finalTotal);
        const actualChange=isCard?0:(isDebt||isPartial||!showRcv)?0:Math.max(0,rcvNum-finalTotal);
        const saleObj={
          date:new Date().toISOString(),
          items:cart.map(i=>({id:i._svc?null:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost||0,_svc:i._svc||false})),
          subTotal,discount,discAmt,total:finalTotal,
          redeemPts:redeemPts>0?redeemPts:undefined,
          redeemDiscount:redeemDiscount>0?redeemDiscount:undefined,
          received,changeAmt:actualChange,
          payMethod,note:(note_draft.current||note||"").trim(),
          customerId:selCust||null
        };
        try {
          let saleId;

          if (IS_DESKTOP) {
            // ── وضع الكمبيوتر: SQLite محلي عبر IPC ──
            const desktopSaleObj = {
              items:         JSON.stringify(saleObj.items),
              total:         saleObj.total,
              discount:      saleObj.discount || 0,
              paid:          saleObj.received,
              change:        saleObj.changeAmt,
              paymentMethod: saleObj.payMethod,   // toSnake → payment_method
              note:          saleObj.note,
              saleDate:      saleObj.date,         // toSnake → sale_date
              customerId:    saleObj.customerId,   // toSnake → customer_id
            };
            saleId = await window.electronAPI.db.save('sales', desktopSaleObj);

            // تحديث المخزون لكل منتج (الخدمات _svc لا تحسب)
            for (const item of saleObj.items) {
              if (!item._svc && item.id) {
                await window.electronAPI.db.updateStock(item.id, -item.qty);
              }
            }

            // تحديث دين العميل (دين كامل أو جزئي)
            if (saleObj.customerId && (saleObj.payMethod === 'debt' || saleObj.payMethod === 'partial')) {
              const cust = customers.find(c => String(c.id) === String(saleObj.customerId));
              if (cust) {
                const extraDebt = saleObj.payMethod === 'debt'
                  ? saleObj.total
                  : Math.max(0, saleObj.total - (saleObj.received || 0));
                await window.electronAPI.db.save('customers', { ...cust, debt: (cust.debt || 0) + extraDebt });
              }
            }
          } else {
            // ── وضع الهاتف: Supabase RPC ──
            const payload = { p_sale_data: saleObj };
            if (saleObj.customerId) payload.p_customer_id = saleObj.customerId;

            const { data, error } = await supa.rpc('process_sale_transaction', payload);
            if (error) throw new Error('خطأ اتصال: ' + error.message);
            if (data && !data.ok) throw new Error(data.msg);
            saleId = data.sale_id;
          }

          // ── تحديث نقاط الولاء ──
          if(selCustObj && payMethod!=="return"){
            const newPoints = Math.max(0,(selCustObj.loyaltyPoints||0) - (redeemPts||0)) + willEarn;
            const newTotal  = custTotalSpent + finalTotal;
            // على الكمبيوتر: ندمج تحديث الدين مع نقاط الولاء في عملية واحدة
            const updatedDebt = IS_DESKTOP && (payMethod==='debt'||payMethod==='partial')
              ? (selCustObj.debt||0) + (payMethod==='debt'
                  ? finalTotal
                  : Math.max(0, finalTotal-(saleObj.received||0)))
              : (selCustObj.debt||0);
            await db.save("customers",{
              ...selCustObj,
              debt: updatedDebt,
              loyaltyPoints: newPoints,
              totalPointsEarned:(selCustObj.totalPointsEarned||0)+willEarn,
              totalPurchases: newTotal,
            });
            if(willEarn>0) notify(`🏆 ${selCustObj.name} كسب ${willEarn} نقطة — الرصيد: ${newPoints}`);
          }

          // تحديث الواجهة وتفريغ السلة فوراً (لحظياً)
          setSale({...saleObj, id: saleId, num: saleId});
          completeSaleDisplay(saleObj.total);
          setCart([]);
          setPhase("receipt");
          setRedeemPts(0);
          setRcv(""); setShowRcv(false); setMob(false); setSelCust(""); setDisc(0); setLast(null); setNote(""); setPay("cash"); setShowCartDet(false);

          // جلب التحديثات في الخلفية
          reload(["products", "sales", "customers"]);

        } catch(e) {
          console.error("تفاصيل الخطأ الكاملة:", e);
          notify("❌ فشل إتمام البيع: " + (e.message || "Bad Request"), "err");
        } finally {
          setSaving(false);
        }
      };
      const onScan=bc=>{
        setCamera(false);
        // نستخدم productsRef.current لضمان آخر قائمة منتجات (تجنّب stale closure)
        const p=productsRef.current.find(x=>(x.barcode||"").trim()===bc.trim());
        if(p){ addFn(p,true); /* addFn تُطلق الإشعار عند fromScan=true */ }
        else { setNewProd({barcode:bc.trim()}); }
      };
      // تحديث الـ refs في كل render لضمان آخر نسخة دائماً
      onScanRef.current=onScan;
      confirmSaleRef.current=confirmSale;

      const PAYS=[
        {id:"cash",    label:"نقداً",      icon:"💵"},
        {id:"cib",     label:"CIB",        icon:"💳"},
        {id:"baridimob",label:"بريدي موب", icon:"📱"},
        {id:"partial", label:"جزئي",       icon:"🔄"},
        {id:"debt",    label:"دين",        icon:"📋"},
      ];

      if(phase==="receipt"&&sale)return(
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",padding:16,background:C.bg,overflow:"auto"}}>
          <div style={{background:C.card,borderRadius:20,width:"100%",maxWidth:420,border:`1px solid ${C.brd}`,animation:"fadeUp .35s ease",overflow:"hidden"}}>
            <div style={{background:"linear-gradient(135deg,#064e3b,#047857)",padding:"22px 24px",textAlign:"center",position:"relative",overflow:"hidden"}}>
              <div style={{position:"absolute",inset:0,background:"radial-gradient(circle at 50% 0%,rgba(16,185,129,.3),transparent 70%)"}}/>
              <div style={{fontSize:52,marginBottom:6,position:"relative"}}>✅</div>
              <div style={{fontWeight:900,fontSize:20,color:"white",position:"relative"}}>تمت عملية البيع!</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,.65)",marginTop:4,position:"relative"}}>
                فاتورة #{String(sale.num||sale.id||"").padStart(4,"0")} · {new Date(sale.date).toLocaleString("fr-FR")}
              </div>
              <div style={{fontSize:12,color:"#6ee7b7",marginTop:5,fontWeight:700,position:"relative",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                {PAYS.find(p=>p.id===sale.payMethod)?.icon||"💵"}
                {PAYS.find(p=>p.id===sale.payMethod)?.label||"نقداً"}
                {sale.payMethod==="debt"&&<span style={{background:"#7f1d1d",borderRadius:20,padding:"1px 8px",fontSize:10}}>دين مسجّل</span>}
              </div>
              {sale.customerId&&<div style={{fontSize:11,color:"#a7f3d0",marginTop:3,fontWeight:600,position:"relative"}}>👤 {customers.find(c=>c.id===sale.customerId)?.name||""}</div>}
            </div>
            <div style={{padding:"16px 20px"}}>
              <div style={{fontFamily:"monospace",fontSize:11,color:C.mut,textAlign:"center",marginBottom:10,letterSpacing:1}}>─── تفاصيل الفاتورة ───</div>
              <div style={{marginBottom:10,maxHeight:180,overflowY:"auto"}}>
                {sale.items.map((it,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px dashed ${C.brd}30`,fontSize:12}}>
                    <span style={{color:C.sub,flex:1}}>{it.name}<span style={{color:C.mut}}> ×{it.qty}</span></span>
                    <span style={{fontWeight:700,color:C.txt,flexShrink:0}}>{fmt(it.price*it.qty)} دج</span>
                  </div>
                ))}
              </div>
              {sale.discount>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
                <span style={{color:C.grn}}>خصم {sale.discount}%</span>
                <span style={{color:C.grn,fontWeight:700}}>− {fmt(sale.discAmt)} دج</span>
              </div>}
              <div style={{background:C.bg,borderRadius:11,padding:"12px 14px",marginTop:8,border:`1px solid ${C.brd}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                  <span style={{color:C.txt,fontWeight:800,fontSize:14}}>الإجمالي</span>
                  <span style={{color:C.acc,fontWeight:900,fontSize:22}}>{fmt(sale.total)} دج</span>
                </div>
                {sale.payMethod==="cash"&&<div style={{display:"flex",gap:16}}>
                  <div style={{flex:1}}><div style={{fontSize:10,color:C.mut}}>المستلم</div><div style={{fontWeight:700,color:C.sub,fontSize:13}}>{fmt(sale.received)} دج</div></div>
                  <div style={{flex:1,textAlign:"left"}}><div style={{fontSize:10,color:C.mut}}>الباقي</div><div style={{fontWeight:800,color:C.grn,fontSize:15}}>{fmt(sale.changeAmt)} دج</div></div>
                </div>}
                {sale.payMethod==="partial"&&<div style={{display:"flex",gap:16}}>
                  <div style={{flex:1}}><div style={{fontSize:10,color:C.mut}}>مدفوع</div><div style={{fontWeight:700,color:C.grn,fontSize:13}}>{fmt(sale.received)} دج</div></div>
                  <div style={{flex:1,textAlign:"left"}}><div style={{fontSize:10,color:C.mut}}>دين متبقٍّ</div><div style={{fontWeight:800,color:C.red,fontSize:15}}>{fmt(sale.total-sale.received)} دج</div></div>
                </div>}
                {sale.payMethod==="debt"&&<div style={{fontSize:12,color:C.red,fontWeight:700,textAlign:"center",padding:"4px 0"}}>📋 المبلغ كاملاً مسجّل كدين</div>}
                {(sale.payMethod==="cib"||sale.payMethod==="baridimob")&&<div style={{fontSize:12,color:C.blu,fontWeight:700,textAlign:"center",padding:"4px 0"}}>{PAYS.find(p=>p.id===sale.payMethod)?.icon} دفع إلكتروني مكتمل</div>}
                {sale.note&&<div style={{marginTop:8,fontSize:11,color:C.mut,borderTop:`1px dashed ${C.brd}`,paddingTop:6}}>📝 {sale.note}</div>}
              </div>
            </div>
            <div style={{padding:"0 20px 20px",display:"flex",flexDirection:"column",gap:9}}>
              <button onClick={()=>printInvoice(sale)} style={{width:"100%",background:"linear-gradient(135deg,#1e3a5f,#1e40af)",color:"white",border:"1px solid #2563eb50",borderRadius:12,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:14,cursor:"pointer",boxShadow:"0 4px 16px rgba(37,99,235,.3)",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                🖨️ طباعة الفاتورة
              </button>
              <button onClick={()=>{setSale(null);setPhase("cart");}} style={{width:"100%",background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:12,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:15,cursor:"pointer",boxShadow:`0 6px 22px ${C.acc}45`,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                🛒 بيع جديد
              </button>
            </div>
          </div>
        </div>
      );

      // ══════════════════════════════════════════════
      //  مودال خدمات الطباعة
      // ══════════════════════════════════════════════
      const PrintModal=()=>{
        const[selSvc,setSelSvc]=useState(null);
        const[qty,setQty]=useState(1);
        const[customPrice,setCustomPrice]=useState("");
        const[selCat2,setSelCat2]=useState("طباعة");
        const cats2=["طباعة","تشطيب"];
        const filtered=PRINT_SVCS.filter(s=>s.cat===selCat2);
        const effPrice=customPrice?safeNum(customPrice):selSvc?.price||0;

        const doAdd=()=>{
          if(!selSvc||qty<1||effPrice<=0){notify("اختر خدمة وكمية","err");return;}
          addServiceItem({
            _sid:`svc_print_${selSvc.id}`, _svc:true, _svcType:"print",
            id:null, name:selSvc.name, icon:selSvc.icon, iconColor:selSvc.color,
            price:effPrice, qty, cost:0, stock:99999, unit:selSvc.unit,
          });
          notify(`✓ ${selSvc.name} × ${qty} — ${fmt(effPrice*qty)} دج`);
          setPrint(false);
        };

        return(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:9998,
            display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(4px)"}}
            onClick={e=>{if(e.target===e.currentTarget)setPrint(false);}}>
            <div style={{background:C.surf,borderRadius:"22px 22px 0 0",width:"100%",maxWidth:520,
              maxHeight:"90vh",display:"flex",flexDirection:"column",
              boxShadow:"0 -8px 50px rgba(0,0,0,.6)",animation:"fadeUp .2s ease",overflow:"hidden"}}>

              {/* Header */}
              <div style={{padding:"14px 18px 10px",borderBottom:`1px solid ${C.brd}`,display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:36,height:36,borderRadius:10,background:"rgba(139,92,246,.2)",
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>🖨️</div>
                  <div>
                    <div style={{fontWeight:900,fontSize:15,color:C.txt}}>خدمات الطباعة</div>
                    <div style={{fontSize:10,color:C.mut}}>اختر الخدمة والكمية ثم أضفها للسلة</div>
                  </div>
                </div>
                <button onClick={()=>setPrint(false)} style={{background:C.card,border:"none",borderRadius:"50%",
                  width:30,height:30,color:C.mut,cursor:"pointer",fontSize:16,
                  display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
              </div>

              <div style={{flex:1,overflowY:"auto",padding:"12px 16px"}}>
                {/* Tabs */}
                <div style={{display:"flex",gap:6,marginBottom:12}}>
                  {cats2.map(c=>(
                    <button key={c} onClick={()=>{setSelCat2(c);setSelSvc(null);}}
                      style={{flex:1,padding:"7px 0",borderRadius:10,border:`1.5px solid ${selCat2===c?"#8b5cf6":C.brd}`,
                        background:selCat2===c?"rgba(139,92,246,.15)":C.card,
                        color:selCat2===c?"#a78bfa":C.mut,fontFamily:"Tajawal,sans-serif",
                        fontWeight:selCat2===c?800:500,fontSize:12,cursor:"pointer"}}>
                      {c==="طباعة"?"🖨️ طباعة":"✨ تشطيب"}
