          </div>
          {outOfStock.length===0&&lowStock.length===0
            ?<div style={{color:C.grn,fontSize:12,textAlign:"center",padding:"14px 0"}}>✅ المخزون بخير</div>
            :<div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:160,overflowY:"auto"}}>
              {[...outOfStock.map(p=>({...p,_t:"out"})),...lowStock.map(p=>({...p,_t:"low"}))].slice(0,8).map((p,i)=>{
                const pi=getProdIcon(p);
                return(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:7,
                    padding:"4px 7px",borderRadius:8,
                    background:p._t==="out"?`${C.red}12`:`${C.amb}12`,
                    border:`1px solid ${p._t==="out"?C.red:C.amb}20`}}>
                    {renderPI(pi,22,6)}
                    <div style={{flex:1,fontSize:10,color:C.txt,fontWeight:600,
                      overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{p.name}</div>
                    <span style={{background:p._t==="out"?C.red:C.amb,
                      color:p._t==="out"?"white":"#000",borderRadius:20,
                      fontSize:9,fontWeight:900,padding:"1px 6px",flexShrink:0}}>
                      {p._t==="out"?"نفذ":`${p.stock}`}
                    </span>
                  </div>
                );
              })}
            </div>
          }
          {(outOfStock.length+lowStock.length)>0&&
            <button onClick={()=>onNavigate("inventory")}
              style={{width:"100%",marginTop:8,background:`${C.acc}18`,color:C.acc,
                border:`1px solid ${C.acc}40`,borderRadius:9,padding:"6px 0",
                fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:11,cursor:"pointer"}}>
              📦 إدارة المخزون
            </button>}
        </div>
      </div>

      {/* ── آخر المبيعات ── */}
      <div style={{background:C.card,borderRadius:14,padding:14,
        border:`1px solid ${C.brd}`,marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}>
          <div style={{fontWeight:800,fontSize:13,color:C.txt}}>🧾 آخر المبيعات</div>
          <button onClick={()=>onNavigate("reports")}
            style={{background:"none",border:`1px solid ${C.brd}`,borderRadius:8,
              padding:"4px 10px",color:C.mut,fontFamily:"Tajawal,sans-serif",
              fontSize:11,cursor:"pointer"}}>عرض الكل</button>
        </div>
        {recentSales.length===0
          ?<div style={{color:C.mut,fontSize:12,textAlign:"center",padding:"14px 0"}}>لا توجد مبيعات بعد</div>
          :recentSales.map((s,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",
              alignItems:"center",padding:"7px 0",
              borderBottom:i<recentSales.length-1?`1px solid ${C.brd}`:"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{background:`${C.acc}18`,borderRadius:7,padding:"2px 7px",
                  fontSize:10,color:C.acc,fontWeight:800}}>
                  #{(s.id||i+1).toString().padStart(4,"0")}
                </div>
                <div>
                  <div style={{fontSize:11,color:C.txt,fontWeight:600}}>
                    {(s.items||[]).slice(0,2).map(it=>it.name).join("، ")}
                    {(s.items||[]).length>2?` +${s.items.length-2}`:""}
                  </div>
                  <div style={{fontSize:10,color:C.mut}}>
                    {dateLabel(s.date||s.createdAt)} {timeLabel(s.date||s.createdAt)}
                  </div>
                </div>
              </div>
              <div style={{fontWeight:900,color:C.acc,fontSize:14}}>{fmt(s.total)} دج</div>
            </div>
          ))
        }
      </div>

      {/* ── أزرار وصول سريع ── */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:4}}>
        {[
          {icon:"🛒",label:"نقطة البيع",id:"pos",       color:C.acc},
          {icon:"📦",label:"المخزون",   id:"inventory",  color:C.blu},
          {icon:"👥",label:"العملاء",   id:"customers",  color:C.pur},
          {icon:"🏭",label:"الموردون",  id:"suppliers",  color:C.grn},
          {icon:"📊",label:"التقارير",  id:"reports",    color:"#06b6d4"},
          {icon:"📋",label:"استمارات", id:"forms",      color:"#f59e0b"},
          {icon:"📱",label:"تلغرام",   id:"telegram",   color:"#3b82f6"},
        ].map(b=>(
          <button key={b.id} onClick={()=>onNavigate(b.id)}
            style={{background:C.card,border:`1px solid ${b.color}30`,borderRadius:12,
              padding:"11px 6px",cursor:"pointer",fontFamily:"Tajawal,sans-serif",
              color:b.color,display:"flex",flexDirection:"column",
              alignItems:"center",gap:5,transition:"all .15s"}}
            onMouseEnter={e=>{e.currentTarget.style.background=`${b.color}15`;e.currentTarget.style.transform="translateY(-2px)";}}
            onMouseLeave={e=>{e.currentTarget.style.background=C.card;e.currentTarget.style.transform="";}}>
            <span style={{fontSize:22}}>{b.icon}</span>
            <span style={{fontSize:11,fontWeight:700}}>{b.label}</span>
          </button>
        ))}
      </div>

    </div>
  );
}



// ══════════════════════════════════════════════
//  App — المكوّن الجذري الرئيسي
// ══════════════════════════════════════════════
function App() {
  const [products,  setProducts]  = useState([]);
  const [cats,      setCats]      = useState([]);
  const [customers, setCustomers] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [sales,     setSales]     = useState([]);
  const [packages,  setPackages]  = useState([]);
  const [purchases, setPurchases] = useState([]);
  const [loading,   setLoading]   = useState(true);
  const [currentView, setView]    = useState("pos");
  const [sideOpen,  setSideOpen]  = useState(false);
  const [notifs,    setNotifs]    = useState([]);
  const [isLight,   setIsLight]   = useState(false);
  // ── إعدادات التطبيق — محفوظة في localStorage ──
  const [appSettings, setAppSettings] = useState(()=>{
    try{
      const s = localStorage.getItem("pos_settings");
      return s ? JSON.parse(s) : {};
    } catch(_){ return {}; }
  });
  const saveSettings = (patch) => {
    setAppSettings(prev=>{
      const next = {...prev,...patch};
      try{ localStorage.setItem("pos_settings", JSON.stringify(next)); } catch(_){}
      return next;
    });
  };
  const [tgBadge,   setTgBadge]  = useState(0);
  const [showCopilot,setShowCopilot]=useState(false);
  // ── السلة والمعلقات تعيش في App حتى لا تُفقد عند التنقل ──
  const [cart,       setCart]      = useState([]);
  const [suspended,  setSuspended] = useState([]);
  const [loadStep,   setLoadStep]  = useState("connecting");

  // ── تحديث الثيم + تطبيق الإعدادات المحفوظة ──
  useEffect(()=>{
    const preferLight = appSettings.defaultTheme === "light";
    if(preferLight !== isLight) setIsLight(preferLight);
  },[]);
  useEffect(()=>{
    C = isLight ? LIGHT : DARK;
    document.body.classList.toggle("light-mode", isLight);
    setNotifs(n=>[...n]);
  },[isLight]);

  // ── تحميل البيانات — مع مهلة 6 ثوان لكل جدول ──
  const withTimeout = (p, ms=6000) =>
    Promise.race([p, new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))]);

  const reload = async (tables=["products","categories","customers","suppliers","sales","packages"]) => {
    // "cats" و "categories" كلاهما يحمّل جدول categories ويضبط setCats
    const map = {
      products:   [()=>db.getAll("products"),   setProducts],
      categories: [()=>db.getAll("categories"), setCats],
      cats:       [()=>db.getAll("categories"), setCats],  // alias
      customers:  [()=>db.getAll("customers"),  setCustomers],
      suppliers:  [()=>db.getAll("suppliers"),  setSuppliers],
      sales:      [()=>db.getAll("sales"),      setSales],
      packages:   [()=>db.getAll("packages"),   setPackages],
      purchases:  [()=>db.getAll("purchases"),  setPurchases],
    };
    // تفادي تكرار تحميل categories مرتين
    const uniqueTables = [...new Set(tables.map(t=>t==="cats"?"categories":t))];
    await Promise.all(
      uniqueTables.filter(t=>map[t]).map(async t=>{
        const [fn, setter] = map[t];
        try {
          const data = await withTimeout(fn());
          setter(data);
        } catch(e) {
          console.warn(`جدول "${t}" فشل:`, e.message);
          setter([]);
        }
      })
    );
  };

  // ── إدراج بيانات تجريبية إذا كانت الجداول فارغة ──
  const seedIfEmpty = async () => {
    try {
      const {data:existingProds} = await supa.from("products").select("id").limit(1);
      if (existingProds && existingProds.length === 0) {
        // أدرج التصنيفات أولاً
        for (const cat of SEED_CATS) {
          await supa.from("categories").insert(toSnake(cat)).catch(()=>{});
        }
        // ثم المنتجات
        for (const prod of SEED_PRODS) {
          await supa.from("products").insert(toSnake({...prod, createdAt: new Date().toISOString()})).catch(()=>{});
        }
        // ثم الباقات والعملاء والموردون
        for (const pkg of SEED_PACKAGES) {
          await supa.from("packages").insert(toSnake(pkg)).catch(()=>{});
        }
        for (const cust of SEED_CUSTOMERS) {
          await supa.from("customers").insert(toSnake(cust)).catch(()=>{});
        }
        for (const sup of SEED_SUPPLIERS) {
          await supa.from("suppliers").insert(toSnake(sup)).catch(()=>{});
        }
        console.log("✅ تم إدراج البيانات التجريبية");
      }
    } catch(e) {
      console.warn("seedIfEmpty:", e.message);
    }
  };

  useEffect(()=>{
    (async()=>{
      try {
        await seedIfEmpty();
        await reload();
      }
      catch(e){ console.error("reload:", e); }
      finally {
        // نتأكد أن React flush البيانات قبل إخفاء شاشة التحميل
        setTimeout(()=>setLoading(false), 80);
      }
    })();
  },[]);

  // ── الإشعارات ──
  const notify = (msg, type="ok") => {
    const id = Date.now() + Math.random();
    setNotifs(prev=>[...prev,{id,msg,type}]);
    setTimeout(()=>setNotifs(prev=>prev.filter(n=>n.id!==id)), 3200);
  };

  // ── طباعة الفاتورة ──
  const printInvoice = (sale) => {
    const s   = appSettings;
    const name = s.storeName  || "مكتبة حشايشي";
    const addr = s.storeAddress|| "";
    const phone= s.storePhone || "";
    const foot = s.invoiceFooter|| "شكراً لزيارتكم 🙏";
    const logo = s.storeLogo  || "";
    const paper= s.paperSize  || "80mm";
    const w80  = paper==="58mm" ? "200px" : "280px";
    const w = window.open("","_blank","width=420,height=680");
    if(!w) return;
    const items = (sale.items||[]).map(i=>
      `<tr><td>${i.name||""}</td><td style="text-align:center">${i.qty}</td><td>${fmt(i.price)} دج</td><td>${fmt((i.price||0)*(i.qty||1))} دج</td></tr>`
    ).join("");
    w.document.write(`<!DOCTYPE html><html dir="rtl"><head>
      <meta charset="UTF-8"/>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        *{box-sizing:border-box}
        body{font-family:Tajawal,Arial,sans-serif;padding:16px;direction:rtl;color:#111;max-width:${w80};margin:0 auto}
        h2{text-align:center;margin:4px 0 2px;font-size:17px}
        .sub{text-align:center;color:#666;font-size:11px;margin-bottom:14px}
        .logo{display:block;max-width:80px;max-height:60px;margin:0 auto 6px}
        table{width:100%;border-collapse:collapse;margin-bottom:12px}
        th,td{border:1px solid #ddd;padding:5px 7px;font-size:12px}
        th{background:#f5f5f5;font-weight:700}
        .total{font-weight:900;font-size:15px;text-align:left;border-top:2px solid #333;padding-top:6px}
        .info{font-size:10px;color:#555;text-align:center;margin-bottom:10px}
        .footer{text-align:center;color:#888;font-size:11px;margin-top:16px;border-top:1px dashed #ccc;padding-top:10px}
        @media print{body{padding:6px}}
      </style></head><body>
      ${logo?`<img class="logo" src="${logo}" alt="logo"/>`:""}
      <h2>📚 ${name}</h2>
      ${addr||phone?`<div class="info">${addr}${addr&&phone?" — ":""}${phone}</div>`:""}
      <div class="sub">التاريخ: ${new Date(sale.date||Date.now()).toLocaleString("fr-DZ")}</div>
      <table>
        <thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>المجموع</th></tr></thead>
        <tbody>${items}</tbody>
      </table>
      <div class="total">الإجمالي: ${fmt(sale.total||0)} دج</div>
      ${sale.discount>0?`<div style="font-size:12px;color:#059669">الخصم: ${sale.discount}%</div>`:""}
      ${sale.note?`<div style="font-size:11px;color:#888;margin-top:4px">ملاحظة: ${sale.note}</div>`:""}
      <div class="footer">${foot}</div>
      <script>setTimeout(()=>{window.print();},400);<\/script>
    </body></html>`);
    w.document.close();
  };

  // ── مؤقت احتياطي: إخفاء شاشة التحميل بعد 12 ثانية بكل الأحوال ──
  useEffect(()=>{
    const t = setTimeout(()=>setLoading(false), 12000);
    return ()=>clearTimeout(t);
  },[]);

  if(loading) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",
      height:"100vh",background:"#080f1e",flexDirection:"column",gap:16,
      fontFamily:"Tajawal,sans-serif",padding:24,textAlign:"center"}}>
      <div style={{fontSize:56}}>📚</div>
      <div style={{color:"#f59e0b",fontSize:22,fontWeight:900,letterSpacing:1}}>
        مكتبة حشايشي
      </div>
      <div style={{color:"#8fafc8",fontSize:13}}>جاري الاتصال بقاعدة البيانات…</div>
      <div style={{width:220,height:5,background:"#162236",borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",background:"linear-gradient(90deg,#f59e0b,#d97706)",
          borderRadius:4,animation:"shimmer 1.6s ease-in-out infinite"}}/>
      </div>
      <div style={{color:"#4d6b8a",fontSize:11,marginTop:4,maxWidth:280,lineHeight:1.7}}>
        في حال تأخّر التحميل، تأكد من:<br/>
        ١. الاتصال بالإنترنت<br/>
        ٢. أن Supabase يعمل ويقبل الطلبات<br/>
        ٣. تفعيل RLS يتطلب إضافة Policy للقراءة
      </div>
    </div>
  );

  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",
      background:C.bg,overflow:"hidden",fontFamily:"Tajawal,sans-serif",color:C.txt}}>

      {/* ── Overlay ── */}
      {sideOpen&&(
        <div onClick={()=>setSideOpen(false)}
          style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",
            zIndex:300,backdropFilter:"blur(2px)"}}/>
      )}

      {/* ── القائمة الجانبية ── */}
      <div style={{
        position:"fixed",top:0,right:0,bottom:0,width:220,
        background:C.surf,borderLeft:`1px solid ${C.brd}`,
        zIndex:400,display:"flex",flexDirection:"column",
        transform:sideOpen?"translateX(0)":"translateX(100%)",
        transition:"transform .25s cubic-bezier(.4,0,.2,1)",
        boxShadow:sideOpen?"-8px 0 40px rgba(0,0,0,.5)":"none"
      }}>
        {/* رأس القائمة */}
        <div style={{padding:"16px 16px 12px",borderBottom:`1px solid ${C.brd}`,
          display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{fontWeight:900,fontSize:15,color:C.acc}}>📚 مكتبة حشايشي</div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={()=>setIsLight(l=>!l)}
              style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,
                width:30,height:30,cursor:"pointer",fontSize:14,
                display:"flex",alignItems:"center",justifyContent:"center",
                color:C.txt,transition:"all .2s"}}>
              {isLight?"🌙":"☀️"}
            </button>
            <button onClick={()=>setSideOpen(false)}
              style={{background:"none",border:"none",color:C.mut,
                fontSize:20,cursor:"pointer",padding:"2px 6px",lineHeight:1}}>✕</button>
          </div>
        </div>

        {/* عناصر القائمة */}
        <div style={{flex:1,overflowY:"auto",padding:"8px"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>{setView(t.id);setSideOpen(false);}}
              style={{
                width:"100%",display:"flex",alignItems:"center",gap:12,
                padding:"11px 14px",borderRadius:12,border:"none",
                background:currentView===t.id?`${C.acc}18`:"none",
                color:currentView===t.id?C.acc:C.txt,
                fontFamily:"Tajawal,sans-serif",
                fontWeight:currentView===t.id?800:500,
                fontSize:14,cursor:"pointer",marginBottom:3,
                transition:"background .15s",position:"relative",textAlign:"right"
              }}
              onMouseEnter={e=>{if(currentView!==t.id)e.currentTarget.style.background=C.card;}}
              onMouseLeave={e=>{if(currentView!==t.id)e.currentTarget.style.background="none";}}>
              <span style={{fontSize:20}}>{t.icon}</span>
              <span style={{flex:1}}>{t.label}</span>
              {t.id==="telegram"&&tgBadge>0&&(
                <span style={{background:"#ef4444",color:"white",
                  borderRadius:20,fontSize:9,fontWeight:900,padding:"2px 7px"}}>
                  {tgBadge>9?"9+":tgBadge}
                </span>
              )}
              {currentView===t.id&&(
                <div style={{position:"absolute",right:0,top:"20%",bottom:"20%",
                  width:3,background:C.acc,borderRadius:"3px 0 0 3px"}}/>
              )}
            </button>
          ))}
        </div>

        {/* أسفل القائمة */}
        <div style={{padding:"10px 16px",borderTop:`1px solid ${C.brd}`,display:"flex",flexDirection:"column",gap:6}}>
          {/* أزرار شاشة الزبون */}
          <div style={{fontSize:9,color:C.mut,fontWeight:700,letterSpacing:1,marginBottom:2,textAlign:"center"}}>شاشة الزبون الخارجية</div>
          <div style={{display:"flex",gap:6}}>
            <button
              onClick={()=>{
                const w=window.open('display.html','customer_display','width=1280,height=720,toolbar=no,menubar=no,scrollbars=no');
                if(w){w.focus();}
              }}
              style={{flex:1,background:"rgba(6,182,212,.12)",border:"1px solid rgba(6,182,212,.3)",borderRadius:8,
                padding:"7px 4px",color:"#06b6d4",fontFamily:"Tajawal,sans-serif",fontSize:10,fontWeight:700,
                cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
              <span style={{fontSize:14}}>🖥️</span>
              <span>عرض الزبون</span>
            </button>
            <button
              onClick={()=>window.open('display-admin.html','display_admin','width=1160,height=820,toolbar=no,menubar=no')}
              style={{flex:1,background:"rgba(139,92,246,.12)",border:"1px solid rgba(139,92,246,.3)",borderRadius:8,
                padding:"7px 4px",color:"#8b5cf6",fontFamily:"Tajawal,sans-serif",fontSize:10,fontWeight:700,
                cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
              <span style={{fontSize:14}}>⚙️</span>
              <span>إعداد الشاشة</span>
            </button>
          </div>
          <div style={{fontSize:10,color:C.mut,textAlign:"center",paddingTop:4,borderTop:`1px solid ${C.brd}`}}>
            نظام نقطة البيع v5.0
          </div>
        </div>
      </div>

      {/* ── زر ☰ عائم — يظهر في كل الأقسام ماعدا POS ── */}
      {currentView!=="pos"&&(
        <button onClick={()=>setSideOpen(s=>!s)}
          style={{
            position:"fixed",top:12,right:12,zIndex:250,
            width:38,height:38,borderRadius:10,
            background:C.surf,border:`1px solid ${C.brd}`,
            color:C.txt,fontSize:18,cursor:"pointer",
            display:"flex",alignItems:"center",justifyContent:"center",
            boxShadow:"0 2px 12px rgba(0,0,0,.3)",transition:"all .15s"
          }}
          onMouseEnter={e=>e.currentTarget.style.background=C.card}
          onMouseLeave={e=>e.currentTarget.style.background=C.surf}>
          ☰
        </button>
      )}

      {/* ── المحتوى كامل الشاشة ── */}
      <div style={{flex:1,overflow:"hidden",position:"relative"}}>
        {currentView==="home"&&(
          <HomeView products={products} cats={cats} customers={customers}
            sales={sales} packages={packages} purchases={purchases}
            appSettings={appSettings} notify={notify} onNavigate={setView}/>
        )}
        {currentView==="pos"&&(
          <POSView products={products} cats={cats} customers={customers}
            packages={packages} sales={sales} notify={notify} reload={reload}
            onMenuOpen={()=>setSideOpen(s=>!s)} sideOpen={sideOpen}
            onNavigate={setView} tabs={TABS} currentView={currentView}
            printInvoice={printInvoice}
            cart={cart} setCart={setCart}
            suspended={suspended} setSuspended={setSuspended}
            appSettings={appSettings}/>
        )}
        {currentView==="inventory"&&(
          <InventoryView products={products} cats={cats} packages={packages}
            notify={notify} reload={reload} appSettings={appSettings}/>
        )}
        {currentView==="customers"&&(
          <CustomersView customers={customers} sales={sales}
            notify={notify} reload={reload}/>
        )}
        {currentView==="suppliers"&&(
          <SuppliersView suppliers={suppliers} products={products} purchases={purchases}
            cats={cats} notify={notify} reload={reload} appSettings={appSettings}/>
        )}
        {currentView==="reports"&&(
          <ReportsView sales={sales} products={products} cats={cats}/>
        )}
        {currentView==="forms"&&(
          <SmartFormsView appSettings={appSettings} notify={notify}/>
        )}
        {currentView==="telegram"&&(
          <TelegramView notify={notify} onBadgeUpdate={setTgBadge}
            products={products} appSettings={appSettings}
            onSendToCart={(items)=>{
              setCart(prev=>{
                const next=[...prev];
                items.forEach(it=>{
                  const ex=next.find(c=>c.id===it.id);
                  if(ex) ex.qty=Math.min(ex.qty+it.qty, it.stock);
                  else next.push({...it});
                });
                return next;
              });
              setView("pos");
            }}
          />
        )}
        {currentView==="settings"&&(
          <SettingsView
            settings={appSettings}
            onSave={saveSettings}
            isLight={isLight}
            setIsLight={setIsLight}
            notify={notify}
            products={products}
            customers={customers}
            sales={sales}
            suppliers={suppliers}
            purchases={purchases}
            reload={reload}
          />
        )}
      </div>

      {/* ── شريط حالة المزامنة (Electron فقط) ── */}
      <SyncStatusBar/>

      {/* ── زر المساعد الذكي العائم ── */}
      <button onClick={()=>setShowCopilot(true)}
        title="المساعد الذكي"
        style={{position:"fixed",top:58,left:12,zIndex:2000,
          width:32,height:32,borderRadius:9,
          border:`1px solid rgba(139,92,246,.35)`,cursor:"pointer",
          background:"rgba(139,92,246,.13)",
          color:"#a78bfa",fontSize:14,
          boxShadow:"0 2px 8px rgba(139,92,246,.18)",
          display:"flex",alignItems:"center",justifyContent:"center",
          transition:"all .15s"}}
        onMouseEnter={e=>{e.currentTarget.style.background="rgba(139,92,246,.25)";e.currentTarget.style.boxShadow="0 4px 14px rgba(139,92,246,.35)";}}
        onMouseLeave={e=>{e.currentTarget.style.background="rgba(139,92,246,.13)";e.currentTarget.style.boxShadow="0 2px 8px rgba(139,92,246,.18)";}}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" style={{width:16,height:16}}>
          <path d="M12 2a4 4 0 0 1 4 4c0 1.5-.8 2.8-2 3.5V11h2a2 2 0 0 1 2 2v1a2 2 0 0 1-2 2h-.5l.5 3H8l.5-3H8a2 2 0 0 1-2-2v-1a2 2 0 0 1 2-2h2V9.5A4 4 0 0 1 8 6a4 4 0 0 1 4-4z"/>
          <circle cx="9.5" cy="13.5" r=".8" fill="currentColor"/>
          <circle cx="14.5" cy="13.5" r=".8" fill="currentColor"/>
        </svg>
      </button>
      {showCopilot && (
        <CopilotPanel
          onClose={()=>setShowCopilot(false)}
          products={products} customers={customers}
          sales={sales} purchases={purchases}
          appSettings={appSettings}
          reload={reload} notify={notify}
        />
      )}

      {/* ── قائمة الإشعارات ── */}
      <div style={{position:"fixed",bottom:18,right:18,zIndex:9999,
        display:"flex",flexDirection:"column",gap:8,pointerEvents:"none"}}>
        {notifs.map(n=>(
          <div key={n.id} style={{
            background:n.type==="err"?"rgba(69,10,10,.97)":n.type==="warn"?"rgba(69,26,3,.97)":"rgba(5,46,22,.97)",
            border:`1px solid ${n.type==="err"?"#ef444650":n.type==="warn"?"#f59e0b50":"#10b98150"}`,
            color:n.type==="err"?"#fca5a5":n.type==="warn"?"#fcd34d":"#6ee7b7",
            borderRadius:13,padding:"10px 18px",
            fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:13,
            boxShadow:"0 6px 24px rgba(0,0,0,.5)",
            animation:"popIn .2s ease",maxWidth:320,
            backdropFilter:"blur(12px)"
          }}>{n.msg}</div>
        ))}
      </div>
    </div>
  );
}

    const root=ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
