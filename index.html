  try {
    const ctx = _ac();
    [[880,.08],[1100,.06]].forEach(([f,d],i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);

    });
  } catch(_){}

    function CustomerDisplay({total,lastProduct,itemsCount,discount,customerName,onMenuOpen,sideOpen,cart}){
      const [displayTotal, setDisplayTotal] = useState(0);
      const [pulse,  setPulse]  = useState(false);
      const [key,    setKey]    = useState(0);
      const [promoIdx,setPromoIdx] = useState(0);
      const animRef  = useRef(null);
      const prevRef  = useRef(null);
      const PROMOS=["🎒 باقات مدرسية متوفرة — اسأل الكاشير","✏️ خصومات على الأدوات المكتبية","📚 وصل جديد — كتب تعليمية وقصص أطفال","🖊️ قلم جاف علامات بأسعار مميزة","🎨 ألوان وأدوات رسم لجميع الأعمار"];

      // count-up animation
      useEffect(()=>{
        if(animRef.current) cancelAnimationFrame(animRef.current);
        const start=displayTotal, end=total, dur=550;
        const t0=performance.now();
        const step=now=>{
          const p=Math.min((now-t0)/dur,1);
          const ease=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
          setDisplayTotal(Math.round(start+(end-start)*ease));
          if(p<1) animRef.current=requestAnimationFrame(step);
        };
        animRef.current=requestAnimationFrame(step);
        setPulse(true); setTimeout(()=>setPulse(false),700);
        return()=>{if(animRef.current)cancelAnimationFrame(animRef.current);};
      },[total]);

      useEffect(()=>{
        if(lastProduct&&lastProduct!==prevRef.current){setKey(k=>k+1);prevRef.current=lastProduct;}
      },[lastProduct]);

      useEffect(()=>{
        const t=setInterval(()=>setPromoIdx(i=>(i+1)%PROMOS.length),4200);
        return()=>clearInterval(t);
      },[]);

      const isEmpty=itemsCount===0;
      const cartItems=cart||[];
      const recentItems=[...cartItems].reverse().slice(0,4);
      const totalStr=displayTotal.toLocaleString('fr-DZ',{minimumFractionDigits:2,maximumFractionDigits:2});

      const HUD_BLUE   ="#010d1f";
      const GRID_COLOR ="rgba(30,120,255,.055)";
      const CORNER_CLR ="rgba(30,160,255,.55)";
      const NUM_CLR    = pulse?"#ffe566":isEmpty?"rgba(30,160,255,.15)":"#fab800";
      const fontSize   = isEmpty?34:total>=10000000?26:total>=1000000?32:total>=100000?42:52;

      return(
        <div style={{
          width:"100%",flexShrink:0,height:148,position:"relative",overflow:"hidden",
          background:HUD_BLUE,
          borderBottom:"1px solid rgba(30,120,255,.25)",
          display:"flex",flexDirection:"column",
          fontFamily:"'Tajawal',sans-serif"
        }}>

          {/* ── شبكة SVG ── */}

            <defs>
              <pattern id="hud-grid" width="28" height="28" patternUnits="userSpaceOnUse">
                <path d="M 28 0 L 0 0 0 28" fill="none" stroke={GRID_COLOR} strokeWidth="0.7"/>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#hud-grid)" style={{animation:"gridPulse 6s ease infinite"}}/>

            <line x1="0" y1="40" x2="100%" y2="40" stroke="rgba(30,120,255,.07)" strokeWidth="1"/>

            {/* توهج أسفلي */}
            <rect x="0" y="145" width="100%" height="3" fill="url(#hud-glow)"/>

              <linearGradient id="hud-glow" x1="0%" y1="0%" x2="100%" y2="0%">

                <stop offset="70%" stopColor="rgba(245,158,11,.4)"/>
                <stop offset="100%" stopColor="transparent"/>
              </linearGradient>
            </defs>
          </svg>

          {/* ── Watermark — مكتبة حشايشي ── */}

            position:"absolute",
            inset:0,
            display:"flex",
            alignItems:"center",
            justifyContent:"center",

            zIndex:0,

            background:"linear-gradient(180deg,transparent,rgba(30,120,255,.04),transparent)",

          {/* ── أركان HUD ── */}
          {[
            {top:6,right:8, style:{borderTop:`2px solid ${CORNER_CLR}`,borderRight:`2px solid ${CORNER_CLR}`}},
            {top:6,left:8,  style:{borderTop:`2px solid ${CORNER_CLR}`,borderLeft:`2px solid ${CORNER_CLR}`}},

              position:"absolute",width:14,height:14,

              ...c.style,zIndex:3,

    function MiniClock(){
      const [t,setT]=useState(new Date());
      useEffect(()=>{const id=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(id);},[]);
      const hh=String(t.getHours()).padStart(2,"0");
      const mm=String(t.getMinutes()).padStart(2,"0");
      const ss=String(t.getSeconds()).padStart(2,"0");
      const days=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
      return(
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-start",gap:1}}>
          <div style={{fontSize:16,fontWeight:900,color:"rgba(255,255,255,.7)",fontFamily:"monospace",letterSpacing:2,lineHeight:1}}>
            {hh}:{mm}<span style={{fontSize:11,color:C.acc,marginRight:1}}>:{ss}</span>
          </div>
          <div style={{fontSize:9,color:"rgba(255,255,255,.25)",fontWeight:500}}>{days[t.getDay()]}</div>
        </div>
      );
    }

    //  CAMERA SCANNER — مكوّن موحّد وآمن
    // ══════════════════════════════════════════════
    function CameraScanner({onDetected,onClose}){
      const mountedRef  = useRef(true);
      const instRef     = useRef(null);
      const detectedRef = useRef(false);
      const [status, setStatus] = useState("starting"); // starting | ready | error | manual
      const [manualVal, setManualVal] = useState("");

      // ── إيقاف الكاميرا بأمان تام ──
      const safeStop = async()=>{
        try{
          if(instRef.current){
            const s = instRef.current;
            instRef.current = null;
            if(s.isScanning) await s.stop();
          }
        }catch(_){}
      };

      // ── إغلاق آمن لا يحطم React ──
      const handleClose = ()=>{
        mountedRef.current = false;
        safeStop().finally(()=>{ try{ onClose(); }catch(_){} });
      };

      useEffect(()=>{
        mountedRef.current  = true;
        detectedRef.current = false;

        // إذا كان file:// — انتقل مباشرة للإدخال اليدوي
        if(window.location.protocol === "file:"){
          setStatus("manual"); return;
        }

        const timer = setTimeout(async()=>{
          if(!mountedRef.current) return;
          try{
            const scanner = new Html5Qrcode("qr-reader-modal");
            instRef.current = scanner;
            await scanner.start(
              {facingMode:"environment"},
              {fps:12, qrbox:{width:240,height:160}},
              text=>{
                if(!mountedRef.current || detectedRef.current) return;
                detectedRef.current = true;
                mountedRef.current = false;
                safeStop().finally(()=>{
                  try{ onDetected(text); }catch(_){}
                });
              },
              ()=>{}
            );
            if(mountedRef.current) setStatus("ready");
          }catch(e){
            if(mountedRef.current) setStatus("error");
          }
        }, 350);

        return()=>{
          mountedRef.current = false;
          clearTimeout(timer);
          safeStop();
        };
      },[]);

      const submitManual = ()=>{
        const v = manualVal.trim();
        if(!v) return;
        mountedRef.current = false;
        try{ onDetected(v); }catch(_){}
      };

      return(
        <div style={{position:"fixed",inset:0,zIndex:9990,display:"flex",
          alignItems:"flex-end",justifyContent:"center",
          background:"rgba(0,0,0,.82)",backdropFilter:"blur(4px)"}}
          onClick={handleClose}>
          <div style={{background:C.surf,borderRadius:"20px 20px 0 0",
            width:"100%",maxWidth:480,padding:"18px 18px 32px",
            boxShadow:"0 -8px 40px rgba(0,0,0,.6)",
            animation:"fadeUp .25s ease"}}
            onClick={e=>e.stopPropagation()}>

            {/* Header */}
            <div style={{display:"flex",justifyContent:"space-between",
              alignItems:"center",marginBottom:14}}>
              <div style={{fontWeight:900,fontSize:15,color:C.acc}}>
                📷 مسح الباركود
              </div>
              <button onClick={handleClose}
                style={{background:C.card,border:`1px solid ${C.brd}`,
                  borderRadius:"50%",width:32,height:32,color:C.mut,
                  cursor:"pointer",fontSize:18,
                  display:"flex",alignItems:"center",justifyContent:"center"}}>
                ✕
              </button>
            </div>

            {/* شاشة الكاميرا */}
            {(status==="starting"||status==="ready")&&(
              <div style={{borderRadius:14,overflow:"hidden",
                background:"#000",marginBottom:10,position:"relative"}}>
                <div id="qr-reader-modal" style={{width:"100%",minHeight:240}}/>
                {status==="ready"&&(
                  <div style={{position:"absolute",inset:0,pointerEvents:"none",
                    display:"flex",alignItems:"center",justifyContent:"center"}}>
                    <div style={{border:`2px solid ${C.acc}`,borderRadius:12,
                      width:200,height:130,boxShadow:`0 0 0 9999px rgba(0,0,0,.45)`}}/>
                    <div style={{position:"absolute",left:0,right:0,height:2,top:"50%",
                      background:`linear-gradient(90deg,transparent,${C.acc},transparent)`,
                      animation:"scanLine 1.8s linear infinite"}}/>
                  </div>
                )}
                {status==="starting"&&(
                  <div style={{position:"absolute",inset:0,display:"flex",
                    alignItems:"center",justifyContent:"center",
                    background:"rgba(0,0,0,.6)",color:C.mut,fontSize:13}}>
                    ⏳ جارٍ تشغيل الكاميرا...
                  </div>
                )}
              </div>
            )}

            {/* خطأ الكاميرا */}
            {status==="error"&&(
              <div style={{background:"#1c1400",border:`1px solid ${C.amb}40`,
                borderRadius:12,padding:"14px 16px",marginBottom:12,textAlign:"center"}}>
                <div style={{fontSize:28,marginBottom:6}}>📵</div>
                <div style={{color:C.amb,fontWeight:700,fontSize:13,marginBottom:4}}>
                  تعذّر فتح الكاميرا
                </div>
                <div style={{color:C.mut,fontSize:11,marginBottom:10}}>
                  افتح الملف عبر خادم محلي أو أدخل الباركود يدوياً
                </div>
                <button onClick={()=>setStatus("manual")}
                  style={{background:`${C.acc}22`,border:`1px solid ${C.acc}50`,
                    borderRadius:9,padding:"7px 20px",color:C.acc,
                    fontFamily:"Tajawal,sans-serif",fontWeight:700,
                    fontSize:13,cursor:"pointer"}}>
                  ✏️ إدخال يدوي
                </button>
              </div>
            )}

            {/* file:// تحذير */}
            {status==="manual"&&window.location.protocol==="file:"&&(
              <div style={{background:"#0c1a2e",border:`1px solid ${C.blu}30`,
                borderRadius:10,padding:"10px 13px",marginBottom:12,fontSize:11,
                color:C.mut,display:"flex",gap:9,alignItems:"flex-start"}}>
                <span style={{fontSize:16,flexShrink:0}}>ℹ️</span>
                <span>
                  الكاميرا تعمل فقط عبر <b style={{color:C.acc}}>http://</b> — 
                  شغّل الملف بخادم محلي (python -m http.server 8080).<br/>
                  حالياً يمكنك إدخال الباركود يدوياً:
                </span>
              </div>
            )}

            {/* إدخال يدوي */}
            {(status==="error"||status==="manual")&&(
              <div style={{display:"flex",gap:8}}>
                <input
                  autoFocus
                  value={manualVal}
                  onChange={e=>setManualVal(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&submitManual()}
                  placeholder="أدخل رقم الباركود..."
                  style={{flex:1,background:C.bg,border:`1px solid ${C.brd}`,
                    borderRadius:11,padding:"11px 14px",color:C.txt,
                    fontFamily:"Tajawal,sans-serif",fontSize:14,
                    outline:"none",direction:"ltr"}}
                />
                <button onClick={submitManual}
                  style={{background:`linear-gradient(135deg,#1e40af,#1d4ed8)`,
                    border:"none",borderRadius:11,padding:"11px 18px",
                    color:"white",fontFamily:"Tajawal,sans-serif",
                    fontWeight:900,fontSize:14,cursor:"pointer",
                    boxShadow:"0 3px 12px #1d4ed840",flexShrink:0}}>
                  بحث
                </button>
              </div>
            )}

            {status==="ready"&&(
              <div style={{textAlign:"center",fontSize:11,color:C.mut}}>
                وجّه الكاميرا نحو الباركود — يُكشف تلقائياً 🔍
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── ScannerInit — ماسح وضع الهاتف اللاسلكي ──
    function ScannerInit({productsRef,setScannerLog,onAdd}){
      const mountedRef = useRef(true);
      const instRef    = useRef(null);
      const lastBc     = useRef("");
      const lastTime   = useRef(0);

      const safeStop = async()=>{
        try{
          if(instRef.current){
            const s=instRef.current; instRef.current=null;
            if(s.isScanning) await s.stop();
          }
        }catch(_){}
      };

      useEffect(()=>{
        mountedRef.current=true;
        if(typeof Html5Qrcode==="undefined"){ return; }

        const start=async()=>{
          try{
            const scanner=new Html5Qrcode("scanner-mode-reader");
            instRef.current=scanner;
            await scanner.start(
              {facingMode:"environment"},
              {fps:15, qrbox:{width:240,height:160}},
              async barcode=>{
                if(!mountedRef.current) return;
                // منع التكرار السريع لنفس الباركود
                const now=Date.now();
                if(barcode===lastBc.current && now-lastTime.current<2000) return;
                lastBc.current=barcode; lastTime.current=now;

                const p=productsRef.current.find(x=>(x.barcode||"").trim()===barcode.trim());
                if(mountedRef.current){
                  setScannerLog(prev=>[...prev,{
                    barcode, name:p?p.name:`غير معروف (${barcode})`,
                    found:!!p,
                    time:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})
                  }]);
                }

                // ① إضافة فورية للسلة المحلية (الهاتف نفسه) — بدون انتظار Supabase
                if(p && onAdd) onAdd(p);

                // ② إرسال للأجهزة الأخرى (الكمبيوتر) عبر Supabase — اختياري/شبكي
                supa.from("scan_queue").insert({barcode, consumed: false})
                  .then(({error})=>{ if(error) console.warn("scan_queue insert error:", error.message); })
                  .catch(e=>console.warn("scan_queue network error:", e));
              },
              ()=>{}
            );
          }catch(e){
            console.warn("ScannerInit error:",e);
          }
        };

        const t=setTimeout(start,400);
        return()=>{
          mountedRef.current=false;
          clearTimeout(t);
          safeStop();
        };
      },[]);

      return null;
    }

      );
    }

    function POSView({products,cats,customers,packages,sales,notify,reload,onMenuOpen,sideOpen,onNavigate,tabs,currentView,printInvoice,cart,setCart,suspended,setSuspended}){
      const[search,setSrch]            =useState("");
      const[selCat,setSelCat]          =useState("all");
      const[phase,setPhase]            =useState("cart");
      const[rcv,setRcv]               =useState("");
      const[showRcv,setShowRcv]        =useState(false);
      const[saving,setSaving]          =useState(false);
      // إعادة ضبط toggle والمبلغ عند تغيير طريقة الدفع
      const[sale,setSale]              =useState(null);
      const[mob,setMob]               =useState(false);
      const[isMobile,setIsMobile]      =useState(()=>window.innerWidth<768);
      useEffect(()=>{
        const fn=()=>setIsMobile(window.innerWidth<768);
        window.addEventListener("resize",fn);
        return()=>window.removeEventListener("resize",fn);
      },[]);
      const[selCust,setSelCust]        =useState("");
      const[discount,setDisc]          =useState(0);
      const[lastAdded,setLast]         =useState(null);
      const[showCamera,setCamera]      =useState(false);
      const[newProdModal,setNewProd]   =useState(null); // {barcode} عند مسح باركود غير معروف
      const[showPkgs,setPkgs]          =useState(false);
      const[payMethod,setPay]          =useState("cash");
      // إعادة ضبط toggle والمبلغ عند تغيير طريقة الدفع
      useEffect(()=>{ setShowRcv(false); setRcv(""); },[payMethod]);
      const[note,setNote]              =useState("");
      const note_draft                 =useRef("");
      const[editPriceId,setEPId]       =useState(null);
      const[editPriceVal,setEPV]       =useState("");
      const[showToday,setToday]        =useState(false);
      const[showHot,setHot]            =useState(false);
      const[kioskMode,setKiosk]        =useState(false);
      const[kioskSearch,setKSrch]      =useState("");
      const[kioskCat,setKCat]          =useState("all");
      const[kioskClock,setKClock]      =useState(new Date());
      // ── سلات معلقة ──
      const[showSuspended,setShowSusp] =useState(false);
      // ── المرتجعات ──
      const[returnModal,setReturnModal]=useState(false);
      const[retSearch,setRetSearch]    =useState("");
      const[retSale,setRetSale]        =useState(null);
      const[retItems,setRetItems]      =useState({});
      // ── وضع الماسح اللاسلكي ──
      const[scannerMode,setScannerMode]=useState(false);
      const[scannerLog,setScannerLog]  =useState([]); // سجل ما تم مسحه
      const productsRef                =useRef(products);
      useEffect(()=>{ productsRef.current=products; },[products]);

      // ── Realtime listener — يستقبل الباركودات من الهاتف ──
      useEffect(()=>{
        const channel=supa.channel("scan-queue-channel")
          .on("postgres_changes",{
            event:"INSERT",schema:"public",table:"scan_queue"
          },async payload=>{
            const barcode=payload.new?.barcode;
            if(!barcode) return;
            // ابحث عن المنتج
            const p=productsRef.current.find(x=>(x.barcode||"").trim()===barcode.trim());
            if(p){
              addFnRef.current(p,true);
              notify(`📡 ${p.name} — تم المسح`,"ok");
            } else {
              notify(`⚠️ باركود غير معروف: ${barcode}`,"err");
            }
            // احذف السجل بعد المعالجة
            await supa.from("scan_queue").delete().eq("id",payload.new.id);
          })
          .subscribe();
        return()=>{ supa.removeChannel(channel); };
      },[]);

      // ref لـ addFn / onScan حتى يصل لآخر نسخة دون إعادة subscribe
      const addFnRef=useRef(null);
      const onScanRef=useRef(null);

      useEffect(()=>{
        if(!kioskMode)return;
        const t=setInterval(()=>setKClock(new Date()),1000);
        return()=>clearInterval(t);
      },[kioskMode]);

      const bufRef=useRef(""),timeRef=useRef(0);
      useEffect(()=>{
        const fn=e=>{
          // ── اختصارات لوحة المفاتيح ──
          if(e.key==="Escape"){if(phase==="checkout"){setPhase("cart");setRcv("");return;}if(showToday){setToday(false);return;}}
          if(e.key==="F1"){e.preventDefault();document.getElementById("pos-scan-input")?.focus();return;}
          if(e.key==="Delete"&&!["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName)){
            setCart(prev=>{if(!prev.length)return prev;const nc=[...prev];nc.pop();return nc;});return;
          }
          if(["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName))return;
          const now=Date.now();
          if(now-timeRef.current>120)bufRef.current="";
          timeRef.current=now;
          if(e.key==="Enter"){const bc=bufRef.current.trim();bufRef.current="";if(bc.length>=2){const p=products.find(x=>(x.barcode||"")===bc);if(p)addFn(p,true);else notify("لم يُعثر على المنتج: "+bc,"err");}}
          else if(e.key.length===1)bufRef.current+=e.key;
        };
        window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);
      },[products,phase,showToday]);

      const filt=products.filter(p=>(!search||p.name.includes(search)||(p.barcode||"").includes(search))&&(selCat==="all"||p.category===selCat));

      // الأكثر مبيعاً — top 8 based on all sales history
      const hotIds=useMemo(()=>{
        const counts={};
        (sales||[]).forEach(s=>(s.items||[]).forEach(it=>{counts[it.id]=(counts[it.id]||0)+it.qty;}));
        return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([id])=>parseInt(id));
      },[sales]);
      const hotProducts=hotIds.map(id=>products.find(p=>p.id===id)).filter(Boolean);

      const subTotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
      const discAmt=Math.floor(subTotal*(discount/100));
      const total=subTotal-discAmt;
      // change only meaningful for cash / partial
      const rcvNum=parseFloat(rcv||0);
      const change=Math.round((rcvNum-total)*100)/100;
      const qty=cart.reduce((s,i)=>s+i.qty,0);

      // مبيعات اليوم
      const todaySales=useMemo(()=>{
        const today=new Date().toISOString().slice(0,10);
        return(sales||[]).filter(s=>s.date?.slice(0,10)===today).sort((a,b)=>b.date.localeCompare(a.date));
      },[sales]);

      const addFn=(p,fromScan=false)=>{
        if(p.stock<=0){notify("المنتج غير متوفر في المخزون","err");return;}
        playCartSound();
        setCart(prev=>{
          const ex=prev.find(i=>i.id===p.id);
          if(ex){
            if(ex.qty>=p.stock){notify("⚠ وصلت للحد الأقصى المتاح: "+p.stock,"err");return prev;}
            const nc=prev.map(i=>i.id===p.id?{...i,qty:i.qty+1}:i);
            setLast({...p,qty:ex.qty+1});
            const rem=p.stock-(ex.qty+1);
            if(rem>0&&rem<=(p.minStock||5))notify(`⚠ تنبيه: تبقى ${rem} فقط من "${p.name}"`,"err");
            return nc;
          }
          setLast({...p,qty:1});
          if(p.stock===1)notify(`⚠ آخر قطعة من "${p.name}"`,"err");
          return[...prev,{...p,qty:1}];
        });
        if(fromScan)notify(`✓ ${p.name}`);
      };
      // تحديث الـ refs في كل render لضمان آخر نسخة
      addFnRef.current=addFn;
      // ── تعليق السلة ──
      const suspendCart=()=>{
        if(!cart.length){notify("السلة فارغة","err");return;}
        const id=Date.now();
        setSuspended(prev=>[...prev,{id,cart:[...cart],note,custId:selCust,discount,time:new Date().toISOString()}]);
        setCart([]);setNote("");setSelCust("");setDisc(0);setLast(null);
        notify(`⏸ تم تعليق السلة (${cart.length} صنف)`);
      };
      const resumeCart=(s)=>{
        if(cart.length>0&&!confirm("السلة الحالية لها محتوى. هل تستبدلها بالسلة المعلقة؟"))return;
        setCart(s.cart);setNote(s.note||"");setSelCust(s.custId||"");setDisc(s.discount||0);
        setSuspended(prev=>prev.filter(x=>x.id!==s.id));
        setShowSusp(false);
      };
      const deleteSuspended=(id)=>setSuspended(prev=>prev.filter(x=>x.id!==id));

      // ── معالجة المرتجعات ──
      const processReturn=async()=>{
        if(!retSale)return;
        const entries=Object.entries(retItems).filter(([,q])=>q>0);
        if(!entries.length){notify("اختر منتجاً للإرجاع","err");return;}
        // استعادة المخزون
        for(const[idx,retQty] of entries){
          const item=retSale.items[idx];
          const prod=products.find(p=>p.id===item.id);
          if(prod) await db.save("products",{...prod,stock:prod.stock+retQty});
        }
        // تسجيل المرتجع كبيع سالب
        const retAmount=entries.reduce((acc,[idx,q])=>{
          const item=retSale.items[idx];
          return acc+(item.price*q);
        },0);
        await db.save("sales",{
          items:entries.map(([idx,q])=>({...retSale.items[idx],qty:-q})),
          total:-retAmount, payMethod:"return",
          note:`مرتجع من فاتورة #${String(retSale.id||"").padStart(4,"0")}`,
          date:new Date().toISOString(), customerId:retSale.customerId
        });
        // تحديث دين العميل إذا كانت الفاتورة الأصلية بالأجل أو جزئية
        if(retSale.customerId&&(retSale.payMethod==="debt"||retSale.payMethod==="partial")){
          const cust=customers.find(c=>c.id===Number(retSale.customerId));
          if(cust){
            const debtReduction=retSale.payMethod==="debt"
              ? retAmount
              : Math.min(retAmount, Math.max(0,(retSale.total||0)-(retSale.received||0)));
            const newDebt=Math.max(0,(cust.debt||0)-debtReduction);
            await db.save("customers",{...cust,debt:newDebt});
          }
        }
        await reload(["products","sales"]);
        notify(`✓ تم استرجاع ${entries.length} صنف — ${fmt(retAmount)} دج`);
        setReturnModal(false);setRetSale(null);setRetItems({});setRetSearch("");
      };

      const addPkg=pkg=>{
        const missing=[];
        (pkg.items||[]).forEach(item=>{
          const p=products.find(x=>x.id===item.productId);
          if(!p||p.stock<item.qty){missing.push(p?.name||"منتج محذوف");}
          else{
            addFn(p,false);
            for(let q=1;q<item.qty;q++) addFn(p,false);
          }
        });
        if(missing.length) notify(`⚠ مخزون ناقص: ${missing.join("، ")}`,"err");
        else notify(`✓ تمت إضافة باقة: ${pkg.name}`);
        setPkgs(false);
      };
      const updQty=(id,d)=>setCart(prev=>prev.reduce((acc,i)=>{
        if(i.id!==id){acc.push(i);return acc;}
        const q=i.qty+d;
        // الحماية: التحقق من المخزون عند محاولة الزيادة
        if(d>0&&q>i.stock){
          notify(`⚠ وصلت للحد الأقصى المتاح: ${i.stock}`,"err");
          acc.push(i);
          return acc;
        }
        if(q>0) acc.push({...i,qty:q});
        return acc;
      },[]));

      const confirmSale=async()=>{
        const isDebt=payMethod==="debt";
        const isCard=payMethod==="cib"||payMethod==="baridimob";
        const isPartial=payMethod==="partial";
        if(!isDebt&&!isCard&&!isPartial&&showRcv&&change<0){notify("المبلغ المستلم غير كافٍ","err");return;}
        if(isPartial&&(!rcv||rcvNum<=0)){notify("أدخل المبلغ المدفوع جزئياً","err");return;}
        setSaving(true);
        const received=isCard?total:isDebt?0:(showRcv?rcvNum:total);
        const actualChange=isCard?0:(isDebt||isPartial||!showRcv)?0:change;
        const saleObj={
          date:new Date().toISOString(),
          items:cart.map(i=>({id:i.id,name:i.name,qty:i.qty,price:i.price,cost:i.cost||0})),
          subTotal,discount,discAmt,total,
          received,changeAmt:actualChange,
          payMethod,note:(note_draft.current||note||"").trim(),
          customerId:selCust?parseInt(selCust):null
        };
        try{
          // 🚀 طلب واحد فقط للسحابة — مخزون + فاتورة + عميل في transaction واحدة
          const rpcParams = { p_sale_data: saleObj };
          if(saleObj.customerId) rpcParams.p_customer_id = saleObj.customerId;
          const { data, error } = await supa.rpc("process_sale_transaction", rpcParams);
          if(error) throw new Error("خطأ في الاتصال بقاعدة البيانات");
          if(data && !data.ok) throw new Error(data.msg);
          const saleId = data.sale_id;
          // تحديث البيانات في الخلفية دون تعطيل الشاشة
          reload(["products","sales","customers"]);
          // الانتقال الفوري للفاتورة
          setSale({...saleObj,id:saleId,num:saleId});
          setCart([]);setPhase("receipt");setRcv("");setShowRcv(false);setMob(false);setSelCust("");setDisc(0);setLast(null);setNote("");setPay("cash");
        }catch(e){
          console.error("confirmSale error:",e);
          notify("❌ خطأ في إتمام البيع: "+e.message,"err");
        }finally{
          setSaving(false);
        }
      };
      const onScan=bc=>{
        setCamera(false);
        // نستخدم productsRef.current لضمان آخر قائمة منتجات (تجنّب stale closure)
        const p=productsRef.current.find(x=>(x.barcode||"").trim()===bc.trim());
        if(p){ addFn(p,true); /* addFn تُطلق الإشعار عند fromScan=true */ }
        else { setNewProd({barcode:bc.trim()}); }
      };
      // تحديث الـ ref في كل render لضمان آخر نسخة دائماً
      onScanRef.current=onScan;

      const PAYS=[
        {id:"cash",    label:"نقداً",      icon:"💵"},
        {id:"cib",     label:"CIB",        icon:"💳"},
        {id:"baridimob",label:"بريدي موب", icon:"📱"},
        {id:"partial", label:"جزئي",       icon:"🔄"},
        {id:"debt",    label:"دين",        icon:"📋"},
      ];

      if(phase==="receipt"&&sale)return(
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",padding:16,background:C.bg,overflow:"auto"}}>
          <div style={{background:C.card,borderRadius:20,width:"100%",maxWidth:420,border:`1px solid ${C.brd}`,animation:"fadeUp .35s ease",overflow:"hidden"}}>
            <div style={{background:"linear-gradient(135deg,#064e3b,#047857)",padding:"22px 24px",textAlign:"center",position:"relative",overflow:"hidden"}}>
              <div style={{position:"absolute",inset:0,background:"radial-gradient(circle at 50% 0%,rgba(16,185,129,.3),transparent 70%)"}}/>
              <div style={{fontSize:52,marginBottom:6,position:"relative"}}>✅</div>
              <div style={{fontWeight:900,fontSize:20,color:"white",position:"relative"}}>تمت عملية البيع!</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,.65)",marginTop:4,position:"relative"}}>
                فاتورة #{String(sale.num||sale.id||"").padStart(4,"0")} · {new Date(sale.date).toLocaleString("fr-FR")}
              </div>
              <div style={{fontSize:12,color:"#6ee7b7",marginTop:5,fontWeight:700,position:"relative",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                {PAYS.find(p=>p.id===sale.payMethod)?.icon||"💵"}
                {PAYS.find(p=>p.id===sale.payMethod)?.label||"نقداً"}
                {sale.payMethod==="debt"&&<span style={{background:"#7f1d1d",borderRadius:20,padding:"1px 8px",fontSize:10}}>دين مسجّل</span>}
              </div>
              {sale.customerId&&<div style={{fontSize:11,color:"#a7f3d0",marginTop:3,fontWeight:600,position:"relative"}}>👤 {customers.find(c=>c.id===sale.customerId)?.name||""}</div>}
            </div>
            <div style={{padding:"16px 20px"}}>
              <div style={{fontFamily:"monospace",fontSize:11,color:C.mut,textAlign:"center",marginBottom:10,letterSpacing:1}}>─── تفاصيل الفاتورة ───</div>
              <div style={{marginBottom:10,maxHeight:180,overflowY:"auto"}}>
                {sale.items.map((it,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px dashed ${C.brd}30`,fontSize:12}}>
                    <span style={{color:C.sub,flex:1}}>{it.name}<span style={{color:C.mut}}> ×{it.qty}</span></span>
                    <span style={{fontWeight:700,color:C.txt,flexShrink:0}}>{fmt(it.price*it.qty)} دج</span>
                  </div>
                ))}
              </div>
              {sale.discount>0&&<div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}>
                <span style={{color:C.grn}}>خصم {sale.discount}%</span>
                <span style={{color:C.grn,fontWeight:700}}>− {fmt(sale.discAmt)} دج</span>
              </div>}
              <div style={{background:C.bg,borderRadius:11,padding:"12px 14px",marginTop:8,border:`1px solid ${C.brd}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                  <span style={{color:C.txt,fontWeight:800,fontSize:14}}>الإجمالي</span>
                  <span style={{color:C.acc,fontWeight:900,fontSize:22}}>{fmt(sale.total)} دج</span>
                </div>
                {sale.payMethod==="cash"&&<div style={{display:"flex",gap:16}}>
                  <div style={{flex:1}}><div style={{fontSize:10,color:C.mut}}>المستلم</div><div style={{fontWeight:700,color:C.sub,fontSize:13}}>{fmt(sale.received)} دج</div></div>
                  <div style={{flex:1,textAlign:"left"}}><div style={{fontSize:10,color:C.mut}}>الباقي</div><div style={{fontWeight:800,color:C.grn,fontSize:15}}>{fmt(sale.change)} دج</div></div>
                </div>}
                {sale.payMethod==="partial"&&<div style={{display:"flex",gap:16}}>
                  <div style={{flex:1}}><div style={{fontSize:10,color:C.mut}}>مدفوع</div><div style={{fontWeight:700,color:C.grn,fontSize:13}}>{fmt(sale.received)} دج</div></div>
                  <div style={{flex:1,textAlign:"left"}}><div style={{fontSize:10,color:C.mut}}>دين متبقٍّ</div><div style={{fontWeight:800,color:C.red,fontSize:15}}>{fmt(sale.total-sale.received)} دج</div></div>
                </div>}
                {sale.payMethod==="debt"&&<div style={{fontSize:12,color:C.red,fontWeight:700,textAlign:"center",padding:"4px 0"}}>📋 المبلغ كاملاً مسجّل كدين</div>}
                {(sale.payMethod==="cib"||sale.payMethod==="baridimob")&&<div style={{fontSize:12,color:C.blu,fontWeight:700,textAlign:"center",padding:"4px 0"}}>{PAYS.find(p=>p.id===sale.payMethod)?.icon} دفع إلكتروني مكتمل</div>}
                {sale.note&&<div style={{marginTop:8,fontSize:11,color:C.mut,borderTop:`1px dashed ${C.brd}`,paddingTop:6}}>📝 {sale.note}</div>}
              </div>
            </div>
            <div style={{padding:"0 20px 20px",display:"flex",flexDirection:"column",gap:9}}>
              <button onClick={()=>printInvoice(sale)} style={{width:"100%",background:"linear-gradient(135deg,#1e3a5f,#1e40af)",color:"white",border:"1px solid #2563eb50",borderRadius:12,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:14,cursor:"pointer",boxShadow:"0 4px 16px rgba(37,99,235,.3)",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                🖨️ طباعة الفاتورة
              </button>
              <button onClick={()=>{setSale(null);setPhase("cart");}} style={{width:"100%",background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:12,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:15,cursor:"pointer",boxShadow:`0 6px 22px ${C.acc}45`,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                🛒 بيع جديد
              </button>
            </div>
          </div>
        </div>
      );

      const CartPanel=()=>(
        <>
          {/* Header */}
          <div style={{padding:"10px 13px",borderBottom:`1px solid ${C.brd}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,background:`linear-gradient(135deg,${C.surf},${C.card})`}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{background:`linear-gradient(135deg,${C.acc},${C.accD})`,borderRadius:8,width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>🛒</div>
              <div>
                <div style={{fontWeight:800,fontSize:13,color:C.txt}}>سلة المشتريات</div>
                {qty>0&&<div style={{fontSize:10,color:C.mut}}>{qty} قطعة — {cart.length} صنف</div>}
              </div>
              {qty>0&&<div style={{background:C.acc,color:"#080f1e",borderRadius:20,fontSize:10,fontWeight:900,padding:"2px 8px"}}>{qty}</div>}
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              {/* Today sales toggle */}
              <button onClick={()=>setToday(v=>!v)} title="مبيعات اليوم"
                style={{background:showToday?`${C.blu}22`:C.card,border:`1px solid ${showToday?C.blu:C.brd}`,borderRadius:7,padding:"5px 8px",color:showToday?C.blu:C.mut,cursor:"pointer",fontSize:11,fontWeight:600,display:"flex",alignItems:"center",gap:4}}>
                📋 <span style={{background:todaySales.length?C.blu:"transparent",color:todaySales.length?"white":C.mut,borderRadius:20,fontSize:9,fontWeight:900,padding:"1px 5px"}}>{todaySales.length}</span>
              </button>
              {/* Hot products toggle */}
              <button onClick={()=>setHot(v=>!v)} title="الأكثر مبيعاً"
                style={{background:showHot?`${C.acc}22`:C.card,border:`1px solid ${showHot?C.acc:C.brd}`,borderRadius:7,padding:"5px 8px",color:showHot?C.acc:C.mut,cursor:"pointer",fontSize:13}}>
                🔥
              </button>
              {cart.length>0&&<button onClick={()=>{setCart([]);setLast(null);setNote("");}} style={{background:"#3d0c0c",color:"#f87171",border:"1px solid #7f1d1d",borderRadius:7,padding:"5px 9px",fontSize:11,cursor:"pointer",fontWeight:700,display:"flex",alignItems:"center",gap:3}}><Ico.trash/></button>}
            </div>
          </div>

          {/* Today's sales panel */}
          {showToday&&(
            <div style={{background:"#060e1a",borderBottom:`1px solid ${C.brd}`,flexShrink:0,maxHeight:200,overflowY:"auto",padding:"8px 12px"}}>
              <div style={{fontSize:11,fontWeight:800,color:C.blu,marginBottom:7}}>📋 مبيعات اليوم — {todaySales.length} عملية</div>
              {todaySales.length===0?(
                <div style={{fontSize:11,color:C.mut,textAlign:"center",padding:"12px 0"}}>لا توجد مبيعات اليوم بعد</div>
              ):todaySales.map(s=>(
                <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 8px",borderRadius:7,background:C.card,marginBottom:4,border:`1px solid ${C.brd}`}}>
                  <div>
                    <div style={{fontSize:11,fontWeight:700,color:C.txt}}>{fmt(s.total)} دج</div>
                    <div style={{fontSize:9,color:C.mut}}>{new Date(s.date).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})} · {(s.items||[]).length} صنف · {PAYS.find(p=>p.id===s.payMethod)?.icon||"💵"}</div>
                  </div>
                  <div style={{fontSize:9,color:s.payMethod==="debt"?C.red:C.grn,fontWeight:700}}>{s.payMethod==="debt"?"دين":s.change>0?`باقي ${fmt(s.change)}`:""}</div>
                </div>
              ))}
              {todaySales.length>0&&(
                <div style={{fontSize:11,fontWeight:800,color:C.acc,marginTop:6,textAlign:"center"}}>
                  إجمالي اليوم: {fmt(todaySales.reduce((s,x)=>s+x.total,0))} دج
                </div>
              )}
            </div>
          )}

          {/* Hot products quick-add */}
          {showHot&&hotProducts.length>0&&(
            <div style={{background:"#080f1a",borderBottom:`1px solid ${C.brd}`,flexShrink:0,padding:"8px 10px"}}>
              <div style={{fontSize:10,fontWeight:800,color:C.acc,marginBottom:6}}>🔥 الأكثر مبيعاً</div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {hotProducts.map(p=>(
                  <button key={p.id} onClick={()=>addFn(p,false)}
                    style={{background:C.card,border:`1px solid ${p.stock<=0?C.red:C.brd}`,borderRadius:8,padding:"5px 10px",color:p.stock<=0?C.red:C.txt,fontFamily:"Tajawal,sans-serif",fontSize:11,fontWeight:600,cursor:p.stock<=0?"not-allowed":"pointer",display:"flex",alignItems:"center",gap:5,opacity:p.stock<=0?.5:1}}>
                    <span>{getProdIcon(p).icon}</span>
                    <span style={{maxWidth:80,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</span>
                    <span style={{color:C.acc,fontWeight:800}}>{fmt(p.price)}</span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Customer selector */}
          <div style={{padding:"7px 12px",borderBottom:`1px solid ${C.brd}`,flexShrink:0,background:C.surf}}>
            <select value={selCust} onChange={e=>setSelCust(e.target.value)} style={{...INP,padding:"7px 11px",fontSize:12,color:selCust?C.txt:C.mut,background:selCust?`${C.pur}15`:C.bg,border:`1px solid ${selCust?C.pur:C.brd}`,transition:"all .2s"}}>
              <option value="">👤 عميل عابر (بدون حساب)</option>
              {customers.map(c=><option key={c.id} value={c.id}>👤 {c.name}{c.debt>0?` ⚠ دين: ${fmt(c.debt)} دج`:""}</option>)}
            </select>
          </div>

          {/* Cart items */}
          <div style={{flex:1,overflowY:"auto",padding:"8px 10px"}}>
            {cart.length===0?(
              <div style={{textAlign:"center",color:C.mut,padding:"24px 16px"}}>
                <div style={{fontSize:42,opacity:.2,marginBottom:8}}>🛒</div>
                <div style={{fontSize:13,fontWeight:600,marginBottom:3}}>السلة فارغة</div>
                <div style={{fontSize:10,opacity:.6,lineHeight:1.6}}>اضغط على منتج أو امسح الباركود</div>
                <div style={{fontSize:9,color:C.mut,marginTop:8,lineHeight:1.8,opacity:.5}}>F1: تركيز الماسح · Delete: حذف الأخير · Esc: رجوع</div>
              </div>
            ):cart.map(item=>{
              const pi=getProdIcon(item);
              const remStock=item.stock-item.qty;
              const isLow=remStock>=0&&remStock<=(item.minStock||5);
              const isEditing=editPriceId===item.id;
              return(
                <div key={item.id} style={{background:C.bg,borderRadius:11,padding:"9px 11px",marginBottom:6,border:`1px solid ${isLow?"#f59e0b40":C.brd}`,animation:"fadeUp .18s ease",position:"relative"}}>
                  {/* Low stock badge */}
                  {isLow&&<div style={{position:"absolute",top:-7,right:10,background:"#f59e0b",color:"#080f1e",fontSize:8,fontWeight:900,padding:"2px 7px",borderRadius:20}}>⚠ باقي {remStock} فقط</div>}
                  {/* Row 1: Icon + Name + Delete */}
                  <div style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:7}}>
                    {renderPI(pi,34,9)}
                    <div style={{flex:1,minWidth:0,overflow:"visible"}}>
                      <div style={{fontSize:11,fontWeight:700,color:C.txt,lineHeight:1.4,wordBreak:"break-word",whiteSpace:"normal",overflowWrap:"anywhere"}}>{item.name}</div>
                      {/* Price — click to edit */}
                      {isEditing?(
                        <input autoFocus type="number" value={editPriceVal}
                          onChange={e=>setEPV(e.target.value)}
                          onBlur={()=>{
                            const np=parseFloat(editPriceVal);
                            if(np>0)setCart(c=>c.map(i=>i.id===item.id?{...i,price:np}:i));
                            setEPId(null);setEPV("");
                          }}
                          onKeyDown={e=>{if(e.key==="Enter")e.target.blur();if(e.key==="Escape"){setEPId(null);setEPV("");}}}
                          style={{...INP,fontSize:11,padding:"2px 6px",width:90,display:"inline-block"}}
                          dir="ltr"/>
                      ):(
                        <div style={{fontSize:10,color:C.mut,marginTop:1,display:"flex",alignItems:"center",gap:4}}>
                          <span>{fmt(item.price)} دج/قطعة</span>
                          <button onClick={()=>{setEPId(item.id);setEPV(String(item.price));}}
                            title="تعديل السعر"
                            style={{background:"none",border:"none",color:"#f59e0b60",cursor:"pointer",padding:0,fontSize:10,lineHeight:1}}>✏</button>
                        </div>
                      )}
                    </div>
                    <button onClick={()=>setCart(c=>c.filter(i=>i.id!==item.id))} style={{background:"none",border:"none",color:"#ef444455",cursor:"pointer",padding:3,display:"flex",borderRadius:5,transition:"color .15s"}} onMouseEnter={e=>e.currentTarget.style.color="#ef4444"} onMouseLeave={e=>e.currentTarget.style.color="#ef444455"}><Ico.trash/></button>
                  </div>
                  {/* Row 2: Qty + Subtotal */}
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{display:"flex",alignItems:"center",background:C.card,borderRadius:8,border:`1px solid ${C.brd}`,overflow:"hidden"}}>
                      <button onClick={()=>updQty(item.id,-1)} style={{background:"none",border:"none",color:C.red,cursor:"pointer",padding:"5px 10px",fontSize:16,fontWeight:700,lineHeight:1}} onMouseEnter={e=>e.currentTarget.style.background="#450a0a"} onMouseLeave={e=>e.currentTarget.style.background="none"}>−</button>
                      <span style={{fontWeight:900,fontSize:15,minWidth:26,textAlign:"center",color:C.txt,borderRight:`1px solid ${C.brd}`,borderLeft:`1px solid ${C.brd}`,padding:"3px 0"}}>{item.qty}</span>
                      <button onClick={()=>updQty(item.id,+1)} style={{background:"none",border:"none",color:C.grn,cursor:"pointer",padding:"5px 10px",fontSize:16,fontWeight:700,lineHeight:1}} onMouseEnter={e=>e.currentTarget.style.background="#052e16"} onMouseLeave={e=>e.currentTarget.style.background="none"}>+</button>
                    </div>
                    <div style={{fontWeight:900,color:C.acc,fontSize:14}}>{fmt(item.price*item.qty)}<span style={{fontSize:9,fontWeight:400,marginRight:3}}>دج</span></div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Footer */}
          {cart.length>0&&(
            <div style={{padding:"10px 12px",borderTop:`1px solid ${C.brd}`,flexShrink:0,background:`linear-gradient(180deg,${C.surf},${C.card})`}}>
              {/* Discount */}
              <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:8}}>
                <span style={{fontSize:10,color:C.mut,flexShrink:0,fontWeight:600}}>خصم:</span>
                <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                  {[0,5,10,15,20,25].map(d=>(
                    <button key={d} onClick={()=>setDisc(d)} style={{padding:"3px 8px",borderRadius:20,border:`1px solid ${discount===d?C.acc:C.brd}`,background:discount===d?C.acc:C.bg,color:discount===d?"#080f1e":C.mut,fontFamily:"Tajawal,sans-serif",fontWeight:discount===d?800:500,fontSize:10,cursor:"pointer",transition:"all .15s"}}>
                      {d===0?"لا":d+"%"}
                    </button>
                  ))}
                </div>
              </div>

              {/* Note — uncontrolled لمنع إغلاق الكيبورد عند كل حرف */}
              <div style={{marginBottom:8}}>
                <input
                  key="note-input"
                  defaultValue={note}
                  onBlur={e=>setNote(e.target.value)}
                  onChange={e=>{ note_draft.current=e.target.value; }}
                  placeholder="📝 ملاحظة على الفاتورة (اختياري)..."
                  style={{...INP,fontSize:11,padding:"7px 10px"}}/>
              </div>

              {/* Breakdown */}
              <div style={{background:C.bg,borderRadius:9,padding:"8px 11px",marginBottom:8,border:`1px solid ${C.brd}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:11}}>
                  <span style={{color:C.mut}}>المجموع الفرعي</span>
                  <span style={{color:C.sub,fontWeight:600}}>{fmt(subTotal)} دج</span>
                </div>
                {discount>0&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:11}}>
                  <span style={{color:C.grn}}>↓ خصم {discount}%</span>
                  <span style={{color:C.grn,fontWeight:700}}>− {fmt(discAmt)} دج</span>
                </div>}
                <div style={{display:"flex",justifyContent:"space-between",paddingTop:6,borderTop:`1px dashed ${C.brd}`,marginTop:2}}>
                  <span style={{color:C.txt,fontWeight:700,fontSize:12}}>الإجمالي</span>
                  <span style={{fontWeight:900,fontSize:20,color:C.acc,lineHeight:1}}>{fmt(total)}<span style={{fontSize:9,fontWeight:400,marginRight:3}}>دج</span></span>
                </div>
              </div>

              <button onClick={()=>setPhase("checkout")} style={{width:"100%",background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:11,padding:"13px 0",fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:"pointer",boxShadow:`0 5px 20px ${C.acc}35`,display:"flex",alignItems:"center",justifyContent:"center",gap:7,transition:"transform .1s"}} onMouseDown={e=>e.currentTarget.style.transform="scale(.98)"} onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}>
                <span>💳</span><span>متابعة للدفع</span>
                <span style={{background:"rgba(0,0,0,.18)",borderRadius:20,padding:"2px 8px",fontSize:11}}>{fmt(total)} دج</span>
              </button>
            </div>
          )}
        </>
      );

      const CheckPanel=()=>{
        const isCard=payMethod==="cib"||payMethod==="baridimob";
        const isDebt=payMethod==="debt";
        const isPartial=payMethod==="partial";
        const needsAmount=!isCard&&!isDebt;
        const canConfirm=isCard||isDebt||(isPartial&&rcv&&parseFloat(rcv)>0)||(!isPartial&&(!showRcv||(rcv&&change>=0)));
        const quickAmounts=[total,Math.ceil(total/500)*500,Math.ceil(total/1000)*1000,Math.ceil(total/2000)*2000]
          .filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);

        return(
        <div style={{display:"flex",flexDirection:"column",height:"100%",background:C.surf,overflow:"hidden"}}>
          {/* Header */}
          <div style={{padding:"10px 13px",borderBottom:`1px solid ${C.brd}`,display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
            <button onClick={()=>{setPhase("cart");setRcv("");}} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:"6px 11px",color:C.sub,cursor:"pointer",display:"flex",alignItems:"center",gap:4,fontSize:12,fontFamily:"Tajawal,sans-serif",fontWeight:600}}>← رجوع</button>
            <div style={{fontWeight:900,fontSize:14,color:C.acc}}>💳 إتمام عملية البيع</div>
          </div>

          <div style={{flex:1,overflowY:"auto"}}>
            {/* Order summary */}
            <div style={{padding:"8px 13px",borderBottom:`1px solid ${C.brd}`,maxHeight:150,overflowY:"auto"}}>
              {cart.map((i,idx)=>(
                <div key={i.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"4px 0",borderBottom:idx<cart.length-1?`1px dashed ${C.brd}22`:"none",fontSize:11}}>
                  <span style={{color:C.sub,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",paddingLeft:8}}>{getProdIcon(i).icon} {i.name}<span style={{color:C.mut}}> ×{i.qty}</span></span>
                  <span style={{fontWeight:700,color:C.txt,flexShrink:0}}>{fmt(i.price*i.qty)}</span>
                </div>
              ))}
            </div>

            {/* Totals */}
            <div style={{padding:"8px 13px",borderBottom:`1px solid ${C.brd}`}}>
              <div style={{background:C.bg,borderRadius:10,padding:"9px 12px",border:`1px solid ${C.brd}`}}>
                {discount>0&&<>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:3}}>
                    <span style={{color:C.mut}}>المجموع</span><span style={{color:C.sub}}>{fmt(subTotal)} دج</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:5}}>
                    <span style={{color:C.grn}}>خصم {discount}%</span><span style={{color:C.grn,fontWeight:700}}>− {fmt(discAmt)} دج</span>
                  </div>
                </>}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{color:C.mut,fontSize:12,fontWeight:600}}>المبلغ المطلوب</span>
                  <span style={{fontWeight:900,fontSize:24,color:C.acc,lineHeight:1}}>{fmt(total)}<span style={{fontSize:10,fontWeight:400,marginRight:3}}>دج</span></span>
                </div>
                {note&&<div style={{marginTop:6,fontSize:10,color:C.mut,borderTop:`1px dashed ${C.brd}`,paddingTop:5}}>📝 {note}</div>}
              </div>
            </div>

            {/* ── طريقة الدفع ── */}
            <div style={{padding:"8px 13px",borderBottom:`1px solid ${C.brd}`}}>
              <div style={{fontSize:10,color:C.mut,fontWeight:700,marginBottom:7}}>طريقة الدفع</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
                {PAYS.map(p=>(
                  <button key={p.id} onClick={()=>{setPay(p.id);setRcv("");}}
                    style={{padding:"9px 6px",borderRadius:10,border:`2px solid ${payMethod===p.id?C.acc:C.brd}`,
                      background:payMethod===p.id?`${C.acc}18`:C.bg,
                      color:payMethod===p.id?C.acc:C.mut,
                      fontFamily:"Tajawal,sans-serif",fontWeight:payMethod===p.id?900:500,
                      fontSize:11,cursor:"pointer",transition:"all .15s",
                      display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                    <span style={{fontSize:18}}>{p.icon}</span>
                    <span>{p.label}</span>
                  </button>
                ))}
              </div>
              {/* Info for each method */}
              {isCard&&<div style={{marginTop:8,background:`${C.blu}15`,border:`1px solid ${C.blu}30`,borderRadius:8,padding:"7px 11px",fontSize:11,color:C.blu}}>
                ℹ الدفع الإلكتروني — المبلغ الكامل {fmt(total)} دج يُسجّل مباشرة
              </div>}
              {isDebt&&<div style={{marginTop:8,background:`${C.red}15`,border:`1px solid ${C.red}30`,borderRadius:8,padding:"7px 11px",fontSize:11,color:C.red}}>
                ⚠ سيُسجّل المبلغ كدين{selCust?` على ${customers.find(c=>c.id===parseInt(selCust))?.name}`:" — يُفضّل اختيار عميل"}
              </div>}
              {isPartial&&<div style={{marginTop:8,background:`${C.acc}10`,border:`1px solid ${C.acc}25`,borderRadius:8,padding:"7px 11px",fontSize:11,color:C.acc}}>
                ℹ أدخل المبلغ المدفوع جزئياً — الفرق يُسجّل كدين
              </div>}
            </div>

            {/* Amount received — toggle for cash/partial */}
            {needsAmount&&(
              <div style={{padding:"8px 13px",borderBottom:`1px solid ${C.brd}`}}>

                {/* زر التفعيل */}
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:showRcv?8:0}}>
                  <label style={{fontSize:11,color:C.mut,fontWeight:700}}>
                    {isPartial?"المبلغ المدفوع جزئياً":"المبلغ المستلم"}
                  </label>
                  <button onClick={()=>{setShowRcv(v=>!v);if(showRcv)setRcv("");}} style={{
                    display:"flex",alignItems:"center",gap:5,
                    background:showRcv?`${C.acc}18`:C.card,
                    border:`1px solid ${showRcv?C.acc:C.brd}`,
                    borderRadius:20,padding:"4px 10px",
                    cursor:"pointer",transition:"all .2s",
                    fontFamily:"Tajawal,sans-serif",fontSize:11,fontWeight:700,
                    color:showRcv?C.acc:C.mut
                  }}>
                    {/* Toggle pill */}
                    <div style={{
                      width:28,height:16,borderRadius:20,
                      background:showRcv?C.acc:"rgba(255,255,255,.1)",
                      position:"relative",transition:"background .2s",flexShrink:0
                    }}>
                      <div style={{
                        position:"absolute",top:2,
                        left:showRcv?12:2,
                        width:12,height:12,borderRadius:"50%",
                        background:"white",transition:"left .2s",
                        boxShadow:"0 1px 3px rgba(0,0,0,.3)"
                      }}/>
                    </div>
                    {showRcv?"مفعّل":"غير مفعّل"}
                  </button>
                </div>

                {/* حقل الإدخال — يظهر فقط عند التفعيل */}
                {showRcv&&(
                  <>
                    <input autoFocus type="number" value={rcv} onChange={e=>setRcv(e.target.value)} placeholder="0"
                      style={{...INP,fontSize:24,fontWeight:900,textAlign:"center",padding:"11px",letterSpacing:2,
                        border:`2px solid ${rcv?(isPartial?C.acc:change>=0?C.grn:C.red):C.brd}`,
                        color:rcv?(isPartial?C.acc:change>=0?C.grn:C.red):C.txt,
                        background:rcv?(isPartial?`${C.acc}15`:change>=0?"#052e1620":"#450a0a20"):C.bg,
                        transition:"all .2s"
                      }}/>
                    {/* Quick amounts */}
                    <div style={{display:"flex",gap:5,marginTop:6}}>
                      {quickAmounts.map(amt=>(
                        <button key={amt} onClick={()=>setRcv(String(amt))}
                          style={{flex:1,background:rcvNum===amt?C.acc:C.card,color:rcvNum===amt?"#080f1e":C.sub,
                            border:`1px solid ${rcvNum===amt?C.acc:C.brd}`,borderRadius:7,padding:"6px 3px",
                            fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:10,cursor:"pointer",transition:"all .15s"}}>
                          {fmt(amt)}
                        </button>
                      ))}
                    </div>
                  </>
                )}
              </div>
            )}

            {/* Change / Debt display */}
            {(rcv||isCard||isDebt)&&(
              <div style={{padding:"8px 13px"}}>
                {isCard&&(
                  <div style={{background:"#052e16",border:"1px solid #166534",borderRadius:10,padding:"10px 13px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontSize:10,color:C.grn,fontWeight:600,marginBottom:2}}>مبلغ البطاقة</div>
                    <div style={{fontWeight:900,fontSize:22,color:C.grn}}>{fmt(total)}<span style={{fontSize:10,marginRight:3}}>دج</span></div></div>
                    <div style={{fontSize:28}}>💳</div>
                  </div>
                )}
                {isDebt&&(
                  <div style={{background:"#3d0c0c",border:"1px solid #7f1d1d",borderRadius:10,padding:"10px 13px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div><div style={{fontSize:10,color:C.red,fontWeight:600,marginBottom:2}}>مبلغ الدين المسجّل</div>
                    <div style={{fontWeight:900,fontSize:22,color:C.red}}>{fmt(total)}<span style={{fontSize:10,marginRight:3}}>دج</span></div></div>
                    <div style={{fontSize:28}}>📋</div>
                  </div>
                )}
                {isPartial&&rcv&&(
                  <div style={{background:rcvNum>0&&rcvNum<total?"#1a1200":"#052e16",border:`1px solid ${rcvNum>0&&rcvNum<total?"#f59e0b":"#166534"}`,borderRadius:10,padding:"10px 13px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:12}}>
                      <span style={{color:C.mut}}>مدفوع الآن</span><span style={{color:C.grn,fontWeight:700}}>{fmt(rcvNum)} دج</span>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                      <span style={{color:C.mut}}>الدين المتبقي</span>
                      <span style={{color:rcvNum>=total?C.grn:C.red,fontWeight:900,fontSize:16}}>{fmt(Math.max(0,total-rcvNum))} دج</span>
                    </div>
                  </div>
                )}
                {payMethod==="cash"&&rcv&&(
                  <div style={{background:change>=0?"#052e16":"#3d0c0c",border:`1px solid ${change>=0?"#166534":"#7f1d1d"}`,borderRadius:10,padding:"10px 13px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>

                cursor:canConfirm&&!saving?"pointer":"not-allowed",
                transition:"all .25s",

                boxShadow:canConfirm?(isDebt?"0 5px 18px #b4530940":isCard?"0 5px 18px #1d4ed840":"0 5px 18px #05966940"):"none",

          </div>

                      flexShrink:0,

                      color:"white",fontSize:20,
                      cursor:"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",

                      flexShrink:0,
                      width:44,height:44,
                      background:scannerMode

                        :`linear-gradient(135deg,#0e7490aa,#0891b288)`,
                      border:`2px solid ${scannerMode?"#06b6d4":"#06b6d440"}`,

                      color:"white",fontSize:18,
                      cursor:"pointer",
                      display:"flex",alignItems:"center",justifyContent:"center",
                      boxShadow:scannerMode?"0 3px 14px #06b6d450":"none",
                      transition:"all .15s"

                    onMouseDown={e=>e.currentTarget.style.transform="scale(.93)"}
                    onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}>
                    📡
                  </button>
                </div>
                <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2}}>

                    <button key={c.id} onClick={()=>setSelCat(c.name)} style={{
                      ...pill(selCat===c.name),
                      display:"flex",alignItems:"center",gap:5,padding:"5px 12px"

                      {c.catImg

                    </button>

                  const isNew=p.createdAt&&(Date.now()-new Date(p.createdAt).getTime())<7*24*3600*1000;
                  return(
                    <PhotoCard key={p.id} p={p} onClick={()=>addFn(p)}

                    <span style={{fontSize:7,color:btn.color}}>✓</span>
                  </div>

                      transition:"all .15s",
                      boxShadow:btn.active?`0 0 10px ${btn.color}30`:"none"

                      <div style={{
                        position:"absolute",top:-4,right:-4,
                        background:C.red,color:"white",
                        borderRadius:"50%",width:16,height:16,
                        fontSize:9,fontWeight:900,
                        display:"flex",alignItems:"center",justifyContent:"center",
                        boxShadow:"0 2px 6px rgba(239,68,68,.5)"

                    )}
                  </div>
                );
              })}
            </div>
            )}{/* end !isMobile buttons column */}

              <div style={{width:360,background:C.surf,borderRight:`1px solid ${C.brd}`,display:"flex",flexDirection:"column",flexShrink:0}}>
                {phase==="cart"?CartPanel():CheckPanel()}

            <>

                <button onClick={()=>setMob(true)} style={{
                  position:"fixed",bottom:22,left:"50%",transform:"translateX(-50%)",

                  background:`linear-gradient(135deg,${C.acc},${C.accD})`,
                  color:"#080f1e",border:"none",borderRadius:30,
                  padding:"11px 22px",
                  fontSize:13,fontWeight:900,fontFamily:"Tajawal,sans-serif",
                  cursor:"pointer",
                  boxShadow:`0 6px 24px ${C.acc}55`,
                  display:"flex",alignItems:"center",gap:10,
                  whiteSpace:"nowrap"
                }}>
                  <span style={{position:"relative"}}>
                    🛒
                    <span style={{
                      position:"absolute",top:-8,right:-8,
                      background:C.red,color:"white",
                      borderRadius:20,fontSize:9,fontWeight:900,
                      padding:"1px 5px",minWidth:16,textAlign:"center"
                    }}>{qty}</span>
                  </span>
                  <span>عرض السلة</span>
                  <span style={{
                    background:"rgba(0,0,0,.2)",borderRadius:20,
                    padding:"2px 9px",fontSize:12
                  }}>{fmt(total)} دج</span>
                </button>
              )}
              {mob&&(
                <div style={{position:"fixed",inset:0,zIndex:300}} onClick={()=>setMob(false)}>
                  <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.7)",backdropFilter:"blur(3px)"}}/>
                  <div
                    style={{
                      position:"absolute",bottom:0,left:0,right:0,
                      background:C.surf,
                      borderRadius:"20px 20px 0 0",
                      border:`1px solid ${C.brd}`,
                      maxHeight:"88vh",display:"flex",flexDirection:"column"
                    }}
                    onClick={e=>e.stopPropagation()}
                  >
                    {/* مقبض السحب */}
                    <div style={{padding:"10px 0 4px",display:"flex",justifyContent:"center",flexShrink:0}}>
                      <div style={{width:40,height:4,background:C.brd,borderRadius:2}}/>
                    </div>
                    {/* رأس الـ sheet */}
                    <div style={{
                      display:"flex",alignItems:"center",justifyContent:"space-between",
                      padding:"4px 16px 10px",borderBottom:`1px solid ${C.brd}`,flexShrink:0
                    }}>
                      <span style={{fontWeight:800,fontSize:14}}>🛒 السلة</span>
                      <button onClick={()=>setMob(false)} style={{
                        background:C.card,border:`1px solid ${C.brd}`,
                        borderRadius:8,padding:"5px 10px",
                        color:C.mut,fontFamily:"Tajawal,sans-serif",
                        fontSize:12,cursor:"pointer"
                      }}>✕ إغلاق</button>
                    </div>
                    <div style={{flex:1,overflowY:"auto"}}>
                      {phase==="cart"?CartPanel():CheckPanel()}
                    </div>
                  </div>
                </div>
              )}
            </>
          )}
          {showCamera&&<CameraScanner onDetected={bc=>onScanRef.current(bc)} onClose={()=>setCamera(false)}/>}

          {/* ══ مودال تسجيل منتج جديد من باركود غير معروف ══ */}
          {newProdModal&&(
            <QuickAddProductModal
              barcode={newProdModal.barcode}
              cats={cats}
              onSave={async(prod)=>{
                try{
                  await db.save("products",{...prod, createdAt:new Date().toISOString()});
                  await reload(["products"]);
                  notify("✅ تم تسجيل المنتج: "+prod.name);
                  // بعد الحفظ — إضافة للسلة مباشرة
                  setTimeout(()=>{
                    const newP = products.find(x=>(x.barcode||"").trim()===prod.barcode);
                    if(newP) addFn(newP,true);
                  }, 600);
                }catch(e){ notify("❌ خطأ: "+e.message,"err"); }
                setNewProd(null);
              }}
              onClose={()=>setNewProd(null)}
            />
          )}
          {showPkgs&&<PackagePickerModal packages={packages} products={products} onSelect={addPkg} onClose={()=>setPkgs(false)}/>}

              <div style={{background:C.surf,borderRadius:"20px 20px 0 0",width:"100%",maxWidth:480,maxHeight:"80vh",display:"flex",flexDirection:"column",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .25s cubic-bezier(.34,1.56,.64,1)"}} onClick={e=>e.stopPropagation()}>

                    </div>

                    <div key={s.id} style={{background:C.card,borderRadius:13,padding:"12px 14px",marginBottom:8,border:"1px solid rgba(245,158,11,.25)",display:"flex",alignItems:"center",gap:12}}>

                        <div style={{fontWeight:800,fontSize:13,color:C.txt,marginBottom:3}}>

                        </div>
                        <div style={{fontSize:10,color:C.mut}}>
                          {fmt(s.cart.reduce((a,x)=>a+x.price*x.qty,0))} دج

                      </div>
                      <button onClick={()=>resumeCart(s)} style={{background:"rgba(245,158,11,.15)",color:"#f59e0b",border:"1px solid rgba(245,158,11,.3)",borderRadius:9,padding:"7px 13px",fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:12,cursor:"pointer"}}>استئناف</button>

              <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.8)"}}/>
              <div style={{background:C.surf,borderRadius:"20px 20px 0 0",width:"100%",maxWidth:520,maxHeight:"92vh",display:"flex",flexDirection:"column",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .28s cubic-bezier(.34,1.56,.64,1)"}} onClick={e=>e.stopPropagation()}>

                        <input value={retSearch} onChange={e=>setRetSearch(e.target.value)}

                          style={{...INP,width:"100%"}}/>
                      </div>
                      {/* قائمة الفواتير */}
                      <div style={{display:"flex",flexDirection:"column",gap:7}}>
                        {sales.filter(s=>s.payMethod!=="return"&&(
                          !retSearch||
                          String(s.id||"").includes(retSearch)||

                          const cust=customers.find(c=>c.id===s.customerId);

                            <button key={s.id} onClick={()=>{setRetSale(s);setRetItems({});}} style={{
                              background:C.card,border:`1px solid ${C.brd}`,borderRadius:12,

                              display:"flex",alignItems:"center",gap:12,transition:"all .15s"
                            }}>

                        const retQty=retItems[idx]||0;
                        return(
                          <div key={idx} style={{background:C.bg,borderRadius:11,padding:"10px 13px",marginBottom:7,border:`1px solid ${retQty>0?C.red+"40":C.brd}`,transition:"all .15s"}}>

                              <div style={{flex:1}}>
                                <div style={{fontSize:12,fontWeight:700,color:C.txt}}>{item.name}</div>
                                <div style={{fontSize:10,color:C.mut}}>{fmt(item.price)} دج × {item.qty}</div>
                              </div>
                              {/* أزرار الكمية */}
                              <div style={{display:"flex",alignItems:"center",gap:7,flexShrink:0}}>
                                <button onClick={()=>setRetItems(p=>({...p,[idx]:Math.max(0,(p[idx]||0)-1)}))}
                                  style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:7,width:30,height:30,color:C.txt,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>

                                  minWidth:28,textAlign:"center",fontSize:14,fontWeight:900,
                                  color:retQty>0?C.red:C.mut
                                }}>{retQty}</div>
                                <button onClick={()=>setRetItems(p=>({...p,[idx]:Math.min(item.qty,(p[idx]||0)+1)}))}
                                  style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:7,width:30,height:30,color:C.txt,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                              </div>
                              {retQty>0&&(
                                <div style={{fontSize:11,color:C.red,fontWeight:800,flexShrink:0,minWidth:64,textAlign:"left"}}>
                                  −{fmt(item.price*retQty)} دج
                                </div>
                              )}
                            </div>
                          </div>
                        );

                      {/* ملخص المرتجع */}

                    {kioskSearch&&<button onClick={()=>setKSrch("")} style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.mut,cursor:"pointer",fontSize:16,lineHeight:1}}>✕</button>}

                      ...pill(kioskCat===c.name),

                    }}>

                {/* ── المنطقة الرئيسية: شبكة المنتجات + السلة ── */}
                <div style={{flex:1,display:"flex",overflow:"hidden"}}>

                  {/* شبكة المنتجات — أكبر وأوضح */}

                    {kFilt.map(p=>{
                      const rank=hotIds.indexOf(p.id)+1||0;
                      const isNew=p.createdAt&&(Date.now()-new Date(p.createdAt).getTime())<7*24*3600*1000;
                      return(
                        <PhotoCard key={p.id} p={p} onClick={()=>addFn(p)}

                      <div style={{gridColumn:"1/-1",textAlign:"center",padding:80,color:C.mut}}>

                  {/* السلة — عرض أكبر */}
