    function PackagePickerModal({packages,products,onSelect,onClose}){
      const withItems=packages.filter(p=>(p.items||[]).length>0);
      const empty=packages.filter(p=>(p.items||[]).length===0);
      const pkgTotal=pkg=>(pkg.items||[]).reduce((s,it)=>{const p=products.find(x=>x.id===it.productId);return s+(p?p.price*it.qty:0);},0);
      return(
        <div style={{position:"fixed",inset:0,zIndex:600,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.75)"}}/>
          <div style={{background:C.surf,borderRadius:"18px 18px 0 0",padding:"18px 16px",width:"100%",maxWidth:540,maxHeight:"80vh",overflowY:"auto",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .3s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontWeight:900,fontSize:16,color:C.acc}}>🎒 اختر باقة</div>
              <button onClick={onClose} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:7,padding:7,color:C.mut,cursor:"pointer",display:"flex"}}><Ico.x/></button>
            </div>
            {withItems.length===0?<div style={{textAlign:"center",padding:30,color:C.mut}}><div style={{fontSize:36,opacity:.3}}>📦</div><div style={{marginTop:8}}>لا توجد باقات تحتوي منتجات بعد<br/><span style={{fontSize:11}}>أضف منتجات للباقات من قسم المخزون</span></div></div>
            :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10}}>
              {withItems.map(pkg=>(
                <button key={pkg.id} onClick={()=>onSelect(pkg)} style={{background:C.card,borderRadius:14,padding:"14px 12px",border:`2px solid ${pkg.iconColor||C.brd}30`,cursor:"pointer",textAlign:"center",transition:"all .2s",display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
                  <div style={{width:54,height:54,borderRadius:16,background:`${pkg.iconColor||C.acc}18`,border:`2px solid ${pkg.iconColor||C.acc}35`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>{pkg.icon||"📦"}</div>
                  <div style={{fontWeight:800,fontSize:12,color:C.txt,lineHeight:1.3}}>{pkg.name}</div>
                  <div style={{fontSize:10,color:C.mut}}>{(pkg.items||[]).length} منتج</div>
                  <div style={{fontWeight:800,color:pkg.iconColor||C.acc,fontSize:13}}>{fmt(pkgTotal(pkg))} دج</div>
                </button>
              ))}
            </div>}
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════
    //  BARCODE TAB — تسجيل بالماسح + مولد الباركود
    // ══════════════════════════════════════════════
    function BarcodeTab({products,cats,notify,reload}){
      const[mode,setMode]=useState("scanner"); // "scanner" | "generator"
      // ── Scanner state ──
      const[scanVal,setScanVal]=useState("");
      const[found,setFound]=useState(null);   // existing product
      const[scanNew,setScanNew]=useState(false); // show new-product form
      const[form,setForm]=useState({name:"",category:"",price:"",cost:"",stock:"",minStock:"5",barcode:"",unit:"قطعة"});
      const scanRef=useRef(null);
      // ── Generator state ──
      const[genVal,setGenVal]=useState("");
      const[genLabel,setGenLabel]=useState("");
      const[genFormat,setGenFormat]=useState("CODE128");
      const[genColor,setGenColor]=useState("#000000");
      const[genBg,setGenBg]=useState("#ffffff");
      const[genWidth,setGenWidth]=useState(2);
      const[genHeight,setGenHeight]=useState(80);
      const[genQty,setGenQty]=useState(1);
      const svgRef=useRef(null);

      // focus scan input on mount when in scanner mode
      useEffect(()=>{if(mode==="scanner"&&scanRef.current)scanRef.current.focus();},[mode]);

      // auto-generate barcode when genVal changes
      useEffect(()=>{
        if(mode==="generator"&&genVal&&svgRef.current){
          try{
            JsBarcode(svgRef.current,genVal,{
              format:genFormat,
              lineColor:genColor,
              background:genBg,
              width:parseFloat(genWidth),
              height:parseInt(genHeight),
              displayValue:true,   // always show the barcode number inside the SVG
              fontOptions:"bold",
              fontSize:14,
              margin:10,
            });
          }catch(e){
            // invalid value for selected format — clear SVG
            svgRef.current.innerHTML="";
          }
        }
      },[genVal,genFormat,genColor,genBg,genWidth,genHeight,mode]);

      const handleScan=e=>{
        if(e.key!=="Enter"||!scanVal.trim())return;
        const bc=scanVal.trim();
        setScanVal("");
        const existing=products.find(p=>p.barcode===bc);
        if(existing){
          setFound(existing);
          setScanNew(false);
          notify(`✓ تم العثور: ${existing.name}`);
        } else {
          setFound(null);
          setScanNew(true);
          setForm(f=>({...f,barcode:bc,name:"",category:cats[0]?.name||"",price:"",cost:"",stock:"",minStock:"5"}));
          notify("⚠ باركود غير موجود — أضف المنتج","err");
        }
      };

      const saveNew=async()=>{
        if(!form.name||!form.price){notify("الاسم والسعر مطلوبان","err");return;}
        await db.save("products",{
          name:form.name,category:form.category||"عام",
          price:parseFloat(form.price)||0,cost:parseFloat(form.cost)||0,
          stock:parseInt(form.stock)||0,minStock:parseInt(form.minStock)||5,
          barcode:form.barcode,unit:form.unit||"قطعة",
        });
        await reload(["products"]);
        notify(`✓ تمت إضافة: ${form.name}`);
        setScanNew(false);setFound(null);
        if(scanRef.current)scanRef.current.focus();
      };

      const printBarcode=()=>{
        if(!svgRef.current||!genVal)return;
        const svgData=new XMLSerializer().serializeToString(svgRef.current);
        const svgBlob=new Blob([svgData],{type:"image/svg+xml;charset=utf-8"});
        const url=URL.createObjectURL(svgBlob);
        const img=new Image();
        img.onload=()=>{
          const canvas=document.createElement("canvas");
          canvas.width=img.width*2; canvas.height=img.height*2;
          const ctx=canvas.getContext("2d");
          ctx.scale(2,2); ctx.drawImage(img,0,0);
          const dataUrl=canvas.toDataURL("image/png");
          const labelHtml=genLabel
            ?`<div class="lbl">${genLabel}</div>`:"";
          const card=`<div class="bc"><img src="${dataUrl}" width="${img.width}" height="${img.height}"/>${labelHtml}</div>`;
          const w=window.open("","_blank");
          if(!w)return;
          w.document.write(`<html><head><title>باركود — ${genVal}</title>
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              body{background:#fff;display:flex;flex-wrap:wrap;gap:10px;padding:12px;direction:rtl;font-family:Tajawal,sans-serif}
              .bc{display:inline-flex;flex-direction:column;align-items:center;border:1px solid #e5e7eb;border-radius:6px;padding:10px;background:#fff;page-break-inside:avoid}
              .bc img{display:block}
              .lbl{font-size:12px;font-weight:700;text-align:center;margin-top:6px;color:#111;max-width:200px;word-break:break-word}
              @media print{body{padding:6px;gap:6px}}
            </style></head><body>
            ${Array(parseInt(genQty||1)).fill(card).join("")}
            </body></html>`);
          w.document.close();
          setTimeout(()=>w.print(),500);
          URL.revokeObjectURL(url);
        };
        img.src=url;
      };

      const genRandom=()=>{
        const r=String(Math.floor(Math.random()*9000000000000)+1000000000000);
        setGenVal(r);
      };

      // ── SCANNER UI ──
      const scannerJSX=(
        <div style={{flex:1,overflowY:"auto",padding:14}}>
          {/* Scanner input zone */}
          <div style={{background:"linear-gradient(135deg,#0a1628,#0d1f3c)",border:`2px dashed ${C.acc}50`,borderRadius:18,padding:"28px 20px",textAlign:"center",marginBottom:18,position:"relative",overflow:"hidden"}}>
            <div style={{position:"absolute",inset:0,pointerEvents:"none",overflow:"hidden"}}>
              <div style={{position:"absolute",left:0,right:0,height:2,background:`linear-gradient(90deg,transparent,${C.acc}80,transparent)`,animation:"scanLine 2s linear infinite",top:0}}/>
            </div>
            <div style={{fontSize:40,marginBottom:10}}>📡</div>
            <div style={{fontWeight:900,fontSize:16,color:C.acc,marginBottom:4}}>امسح الباركود بالماسح الضوئي</div>
            <div style={{fontSize:11,color:C.mut,marginBottom:16}}>وجّه الماسح USB نحو الباركود أو اكتب يدوياً ثم اضغط Enter</div>
            <div style={{position:"relative",maxWidth:380,margin:"0 auto"}}>
              <input ref={scanRef} value={scanVal} onChange={e=>setScanVal(e.target.value)} onKeyDown={handleScan}
                placeholder="في انتظار الإشارة..." dir="ltr"
                style={{...INP,fontSize:20,fontWeight:700,textAlign:"center",letterSpacing:3,padding:"14px",fontFamily:"monospace",border:`2px solid ${scanVal?C.acc:C.brd}`,background:scanVal?"#0a1f0a":"#060e1a",color:scanVal?C.acc:C.mut,transition:"all .2s",width:"100%"}}
                autoComplete="off" autoFocus/>

    // ── Products Tab ──
    function ProductsTab({products,cats,notify,reload}){
      const[search,setSrch]=useState(""),[selCat,setSelCat]=useState("all"),[modal,setModal]=useState(false),[edit,setEdit]=useState(null),[catModal,setCatM]=useState(false),[sortBy,setSort]=useState("name"),[view,setView]=useState("list");
      const[manageCats,setManageCats]=useState(false);  // نافذة إدارة التصنيفات
      const[moveCat,setMoveCat]     =useState(null);    // { from, to } نقل المنتجات

      // حذف تصنيف مع نقل منتجاته
      const deleteCat = async (cat, transferTo) => {
        // نقل المنتجات للتصنيف المختار أو "غير مصنف"
        const prods = products.filter(p=>p.category===cat.name);
        for(const p of prods){
          await db.save("products", {...p, category: transferTo||"غير مصنف"});
        }
        await db.remove("categories", cat.id);
        await reload(["products","categories"]);
        notify(`✓ تم حذف «${cat.name}»${prods.length?` ونقل ${prods.length} منتج`:""}`);
        if(selCat===cat.name) setSelCat("all");
      };

      // نقل كل منتجات تصنيف لآخر
      const moveProducts = async (fromName, toName) => {
        const prods = products.filter(p=>p.category===fromName);
        for(const p of prods){
          await db.save("products", {...p, category: toName});
        }
        await reload(["products"]);
        notify(`✓ تم نقل ${prods.length} منتج إلى «${toName}»`);
        setMoveCat(null);
      };
      const filt=products.filter(p=>(!search||p.name.includes(search)||(p.barcode||"").includes(search))&&(selCat==="all"||p.category===selCat)).sort((a,b)=>sortBy==="price"?b.price-a.price:sortBy==="stock"?a.stock-b.stock:a.name.localeCompare(b.name));
      const del=async id=>{if(!confirm("حذف هذا المنتج؟"))return;await db.remove("products",id);await reload(["products"]);notify("✓ تم حذف المنتج");};
      return(
        <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>
          {/* Toolbar */}
          <div style={{padding:"10px 12px",background:C.surf,borderBottom:`1px solid ${C.brd}`,flexShrink:0}}>
            <div style={{display:"flex",gap:7,marginBottom:9}}>
              <div style={{position:"relative",flex:1}}><input value={search} onChange={e=>setSrch(e.target.value)} placeholder="بحث بالاسم أو الباركود..." style={{...INP,paddingRight:35}}/><span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:C.mut,pointerEvents:"none"}}><Ico.srch/></span></div>
              <select value={sortBy} onChange={e=>setSort(e.target.value)} style={{...INP,width:"auto",padding:"8px 10px",fontSize:12}}>
                <option value="name">الاسم</option><option value="price">السعر</option><option value="stock">المخزون</option>
              </select>
              <button onClick={()=>setView(v=>v==="list"?"grid":"list")} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:"8px 11px",color:C.mut,cursor:"pointer",fontSize:16,flexShrink:0}}>{view==="list"?"⊞":"≡"}</button>
              <button onClick={()=>{setEdit(null);setModal(true);}} style={{background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:8,padding:"8px 13px",fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:5,flexShrink:0,boxShadow:`0 3px 12px ${C.acc}35`}}><Ico.plus/> إضافة</button>
            </div>
            <div style={{display:"flex",gap:6,overflowX:"auto",alignItems:"center"}}>
              <button onClick={()=>setSelCat("all")} style={pill(selCat==="all")}>الكل ({products.length})</button>
              {cats.map(c=>(
                <button key={c.id} onClick={()=>setSelCat(c.name)} style={{
                  ...pill(selCat===c.name),
                  display:"flex",alignItems:"center",gap:5,padding:"5px 12px"
                }}>
                  {c.catImg
                    ? <img src={c.catImg} alt="" style={{width:20,height:20,borderRadius:5,objectFit:"cover",flexShrink:0}}/>
                    : <span>{c.icon}</span>
                  }
                  {c.name}
                </button>
              ))}
              <button onClick={()=>setCatM(true)} style={{...pill(false),border:`1px dashed ${C.brd}`}}>+ إضافة</button>
              {cats.length>0&&(
                <button onClick={()=>setManageCats(true)} style={{
                  ...pill(false),
                  border:`1px solid ${C.brd}`,
                  display:"flex",alignItems:"center",gap:4,
                  color:C.mut, flexShrink:0
                }}>⚙️ إدارة</button>
              )}
            </div>
          </div>

          {/* List or Grid */}
          <div style={{flex:1,overflowY:"auto",padding:10}}>
            {view==="list" ? (
              filt.map(p=>{
                const pi=getProdIcon(p);
                const isOut=p.stock<=0,isLow=!isOut&&p.stock<=p.minStock;
                const sc=isOut?C.red:isLow?C.amb:C.grn;
                const mg=p.cost&&p.price?Math.round((p.price-p.cost)/p.price*100):null;
                return(
                  <div key={p.id} style={{background:C.card,borderRadius:12,padding:"11px 13px",marginBottom:7,border:`1px solid ${isOut?"#ef444420":isLow?"#f59e0b20":C.brd}`,display:"flex",alignItems:"center",gap:11,animation:"fadeUp .2s ease",transition:"all .15s"}}>
                    {/* Icon */}
                    {renderPI(pi,52,13)}
                    {/* Info */}
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:13,color:C.txt,marginBottom:3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                        <span style={{background:`${pi.color}15`,color:pi.color,borderRadius:6,padding:"1px 7px",fontSize:10,fontWeight:600}}>{p.category}</span>
                        {p.barcode&&<span style={{fontSize:10,color:C.mut,fontFamily:"monospace"}}>#{p.barcode}</span>}
                        {p.unit&&<span style={{fontSize:10,color:C.mut}}>/{p.unit}</span>}
                      </div>
                    </div>
                    {/* Price */}
                    <div style={{textAlign:"center",flexShrink:0,minWidth:68}}>
                      <div style={{fontWeight:900,color:C.acc,fontSize:15}}>{fmt(p.price)}</div>
                      <div style={{fontSize:9,color:C.mut}}>دج للبيع</div>
                      {mg!==null&&<div style={{fontSize:9,color:C.grn,fontWeight:700,marginTop:1}}>ربح {mg}%</div>}
                    </div>
                    {/* Stock */}
                    <div style={{textAlign:"center",flexShrink:0,minWidth:50}}>
                      <div style={{fontWeight:900,fontSize:18,color:sc,lineHeight:1}}>{p.stock}</div>
                      <div style={{fontSize:9,color:C.mut}}>مخزون</div>
                      {/* Mini progress bar */}
                      <div style={{width:40,height:3,background:C.brd,borderRadius:2,marginTop:3,overflow:"hidden"}}>
                        <div style={{height:"100%",background:sc,width:`${Math.min(100,(p.stock/Math.max(p.minStock*3,10))*100)}%`,borderRadius:2,transition:"width .3s"}}/>
                      </div>
                      {(isOut||isLow)&&<div style={{fontSize:8,color:sc,fontWeight:700,marginTop:2}}>{isOut?"نفذ":"منخفض"}</div>}
                    </div>
                    {/* Actions */}
                    <div style={{display:"flex",flexDirection:"column",gap:5,flexShrink:0}}>
                      <button onClick={()=>{setEdit(p);setModal(true);}} style={{background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:6,padding:"6px 8px",cursor:"pointer",display:"flex"}}><Ico.edit/></button>
                      <button onClick={()=>del(p.id)} style={{background:"#450a0a",color:C.red,border:"none",borderRadius:6,padding:"6px 8px",cursor:"pointer",display:"flex"}}><Ico.trash/></button>
                    </div>
                  </div>
                );
              })
            ) : (
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:9}}>
                {filt.map(p=>{
                  const pi=getProdIcon(p);
                  const isOut=p.stock<=0,isLow=!isOut&&p.stock<=p.minStock;
                  const sc=isOut?C.red:isLow?C.amb:C.grn;
                  return(
                    <div key={p.id} style={{background:C.card,borderRadius:14,padding:"14px 11px",border:`1px solid ${isOut?"#ef444420":isLow?"#f59e0b20":C.brd}`,textAlign:"center",animation:"fadeUp .2s ease",position:"relative"}}>
                      {(isOut||isLow)&&<div style={{position:"absolute",top:8,left:8}}><Ico.warn/></div>}
                      <div style={{display:"flex",justifyContent:"center",marginBottom:8}}>{renderPI(pi,58,14)}</div>
                      <div style={{fontSize:11,fontWeight:700,color:C.txt,marginBottom:4,lineHeight:1.3,minHeight:28}}>{p.name}</div>
                      <div style={{fontWeight:900,color:C.acc,fontSize:14,marginBottom:2}}>{fmt(p.price)} دج</div>
                      <div style={{fontSize:10,color:sc,fontWeight:600}}>{isOut?"نفذ":isLow?`⚠ ${p.stock} متبقٍ`:p.stock+" قطعة"}</div>
                      <div style={{display:"flex",justifyContent:"center",gap:6,marginTop:8}}>
                        <button onClick={()=>{setEdit(p);setModal(true);}} style={{background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:6,padding:"5px 8px",cursor:"pointer",display:"flex"}}><Ico.edit/></button>
                        <button onClick={()=>del(p.id)} style={{background:"#450a0a",color:C.red,border:"none",borderRadius:6,padding:"5px 8px",cursor:"pointer",display:"flex"}}><Ico.trash/></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            {filt.length===0&&<div style={{textAlign:"center",padding:50,color:C.mut}}><div style={{fontSize:38,opacity:.35}}>📭</div><div style={{marginTop:7}}>لا توجد منتجات</div></div>}
          </div>
          {modal&&<ProdModal product={edit} cats={cats} onClose={()=>setModal(false)} onSave={async d=>{await db.save("products",d);await reload(["products"]);setModal(false);notify(edit?"✓ تم التحديث":"✓ تم الإضافة");}}/>}
          {catModal&&<CatModal onClose={()=>setCatM(false)} onSave={async d=>{await db.save("categories",d);await reload(["categories"]);setCatM(false);notify("✓ تمت إضافة التصنيف");}}/>}
          {manageCats&&(
            <div style={{position:"fixed",inset:0,zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={()=>setManageCats(false)}>
              <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.75)"}}/>
              <div style={{background:C.surf,borderRadius:"20px 20px 0 0",width:"100%",maxWidth:500,maxHeight:"88vh",display:"flex",flexDirection:"column",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .28s cubic-bezier(.34,1.56,.64,1)"}} onClick={e=>e.stopPropagation()}>

                {/* رأس */}
                <div style={{padding:"16px 18px",borderBottom:`1px solid ${C.brd}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
                  <div style={{fontWeight:900,fontSize:15,color:C.acc}}>⚙️ إدارة التصنيفات</div>
                  <button onClick={()=>setManageCats(false)} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:7,color:C.mut,cursor:"pointer",display:"flex"}}><Ico.x/></button>
                </div>

                {/* قائمة التصنيفات */}
                <div style={{flex:1,overflowY:"auto",padding:"12px 16px"}}>
                  {cats.length===0?(
                    <div style={{textAlign:"center",padding:40,color:C.mut}}>
                      <div style={{fontSize:36,opacity:.3,marginBottom:8}}>🗂️</div>
                      <div style={{fontSize:13}}>لا توجد تصنيفات</div>
                    </div>
                  ):cats.map(cat=>{
                    const count=products.filter(p=>p.category===cat.name).length;
                    return(
                      <div key={cat.id} style={{
                        background:C.card, borderRadius:14, padding:"13px 15px",
                        marginBottom:9, border:`1px solid ${C.brd}`,
                        display:"flex", alignItems:"center", gap:12,
                        boxShadow:"0 2px 8px rgba(0,0,0,.12)"
                      }}>
                        {/* أيقونة / صورة التصنيف */}
                        {cat.catImg ? (
                          <img src={cat.catImg} alt="" style={{width:46,height:46,borderRadius:12,objectFit:"cover",flexShrink:0,border:`1px solid ${C.brd}`}}/>
                        ) : (
                          <div style={{width:46,height:46,borderRadius:12,background:`${C.acc}15`,border:`1px solid ${C.acc}25`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>{cat.icon}</div>
                        )}

                        {/* المعلومات */}
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:800,fontSize:14,color:C.txt,marginBottom:4}}>{cat.name}</div>
                          <div style={{
                            display:"inline-flex",alignItems:"center",gap:4,
                            background:`${C.acc}12`,border:`1px solid ${C.acc}22`,
                            borderRadius:20,padding:"2px 9px",fontSize:10,color:C.acc,fontWeight:700
                          }}>
                            📦 {count} منتج
                          </div>
                        </div>

                        {/* الأزرار */}
                        <div style={{display:"flex",gap:6,flexShrink:0}}>
                          {/* نقل المنتجات */}
                          <button onClick={()=>setMoveCat({from:cat.name})} style={{
                            background:"rgba(59,130,246,.12)",color:"#60a5fa",
                            border:"1px solid rgba(59,130,246,.25)",borderRadius:9,
                            padding:"7px 11px",cursor:"pointer",fontFamily:"Tajawal,sans-serif",
                            fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:4,
                            transition:"all .15s"
                          }} title="نقل المنتجات">
                            🔀 نقل
                          </button>

                          {/* حذف التصنيف */}
                          <button onClick={()=>setMoveCat({from:cat.name, deleteAfter:true, cat})} style={{
                            background:"rgba(239,68,68,.1)",color:"#f87171",
                            border:"1px solid rgba(239,68,68,.22)",borderRadius:9,
                            padding:"7px 11px",cursor:"pointer",fontFamily:"Tajawal,sans-serif",
                            fontWeight:700,fontSize:11,display:"flex",alignItems:"center",gap:4,
                            transition:"all .15s"
                          }} title="حذف التصنيف">
                            🗑️ حذف
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* زر إضافة تصنيف جديد */}
                <div style={{padding:"12px 16px",borderTop:`1px solid ${C.brd}`,flexShrink:0}}>
                  <button onClick={()=>{setManageCats(false);setCatM(true);}} style={{
                    width:"100%",background:`linear-gradient(135deg,${C.acc},${C.accD})`,
                    color:"#080f1e",border:"none",borderRadius:12,padding:13,
                    fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,
                    cursor:"pointer",boxShadow:`0 4px 14px ${C.acc}35`
                  }}>+ إضافة تصنيف جديد</button>
                </div>
              </div>
            </div>
          )}

          {moveCat&&<MoveCatModal
            moveCat={moveCat} cats={cats} products={products}
            onClose={()=>setMoveCat(null)}
            onMove={moveProducts}
            onDelete={async(cat,dest)=>{await deleteCat(cat,dest);setMoveCat(null);setManageCats(false);}}
          />}
        </div>
      );
    }


    // ── نافذة نقل / حذف التصنيف ──
    function MoveCatModal({moveCat,cats,products,onClose,onMove,onDelete}){
      const isDelete=!!moveCat.deleteAfter;
      const fromCount=products.filter(p=>p.category===moveCat.from).length;
      const otherCats=cats.filter(c=>c.name!==moveCat.from);
      const[targetCat,setTargetCat]=useState(otherCats[0]?.name||"غير مصنف");
      return(
        <div style={{position:"fixed",inset:0,zIndex:600,display:"flex",alignItems:"center",justifyContent:"center",padding:18}} onClick={onClose}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.82)",backdropFilter:"blur(4px)"}}/>
          <div style={{
            background:isDelete?"linear-gradient(145deg,#1a0808,#2d1010)":C.surf,
            border:`1px solid ${isDelete?"rgba(239,68,68,.35)":C.brd}`,
            borderRadius:20,width:"100%",maxWidth:380,padding:"22px 20px",position:"relative",
            boxShadow:`0 20px 60px ${isDelete?"rgba(239,68,68,.2)":"rgba(0,0,0,.4)"}`,
            animation:"fadeUp .25s cubic-bezier(.34,1.56,.64,1)"
          }} onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:"center",marginBottom:18}}>
              <div style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:60,height:60,borderRadius:"50%",marginBottom:12,background:isDelete?"rgba(239,68,68,.15)":"rgba(59,130,246,.12)",border:`1px solid ${isDelete?"rgba(239,68,68,.3)":"rgba(59,130,246,.25)"}`,fontSize:28}}>{isDelete?"🗑️":"🔀"}</div>
              <div style={{fontWeight:900,fontSize:16,color:isDelete?"#fca5a5":C.txt,marginBottom:6}}>
                {isDelete?`حذف تصنيف «${moveCat.from}»`:`نقل منتجات «${moveCat.from}»`}
              </div>
              <div style={{fontSize:12,color:C.mut,lineHeight:1.6}}>
                {fromCount>0?`يحتوي على ${fromCount} منتج — اختر التصنيف المستهدف`:"لا توجد منتجات في هذا التصنيف"}
              </div>
            </div>
            {fromCount>0&&(
              <div style={{marginBottom:18}}>
                <div style={{fontSize:11,color:C.mut,fontWeight:700,marginBottom:8}}>{isDelete?"نقل المنتجات إلى:":"نقل إلى تصنيف:"}</div>
                <div style={{display:"flex",flexDirection:"column",gap:7,maxHeight:240,overflowY:"auto"}}>
                  {otherCats.map(c=>(
                    <button key={c.name} onClick={()=>setTargetCat(c.name)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",borderRadius:12,cursor:"pointer",border:`2px solid ${targetCat===c.name?C.acc:C.brd}`,background:targetCat===c.name?`${C.acc}15`:C.bg,transition:"all .15s"}}>
                      {c.catImg?<img src={c.catImg} alt="" style={{width:32,height:32,borderRadius:8,objectFit:"cover",flexShrink:0}}/>:<div style={{width:32,height:32,borderRadius:8,background:`${C.acc}15`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{c.icon}</div>}
                      <div style={{flex:1,textAlign:"right"}}><div style={{fontWeight:700,fontSize:13,color:C.txt}}>{c.name}</div><div style={{fontSize:10,color:C.mut}}>{products.filter(p=>p.category===c.name).length} منتج</div></div>
                      {targetCat===c.name&&<div style={{color:C.acc,fontSize:18}}>✓</div>}
                    </button>
                  ))}
                  <button onClick={()=>setTargetCat("غير مصنف")} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 13px",borderRadius:12,cursor:"pointer",border:`2px solid ${targetCat==="غير مصنف"?C.amb:C.brd}`,background:targetCat==="غير مصنف"?`${C.amb}15`:C.bg,transition:"all .15s"}}>
                    <div style={{width:32,height:32,borderRadius:8,background:"rgba(245,158,11,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>📁</div>
                    <div style={{flex:1,textAlign:"right"}}><div style={{fontWeight:700,fontSize:13,color:C.txt}}>غير مصنف</div><div style={{fontSize:10,color:C.mut}}>بدون تصنيف محدد</div></div>
                    {targetCat==="غير مصنف"&&<div style={{color:C.amb,fontSize:18}}>✓</div>}
                  </button>
                </div>
              </div>
            )}
            <div style={{display:"flex",gap:9}}>
              <button onClick={onClose} style={{flex:1,background:C.card,color:C.txt,border:`1px solid ${C.brd}`,borderRadius:12,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:700,cursor:"pointer"}}>إلغاء</button>
              <button onClick={()=>{
                const dest=fromCount>0?(targetCat||"غير مصنف"):null;
                if(isDelete) onDelete(moveCat.cat,dest);
                else { if(!dest)return; onMove(moveCat.from,dest); }
              }} style={{
                flex:2,
                background:isDelete?"linear-gradient(135deg,#dc2626,#b91c1c)":"linear-gradient(135deg,#3b82f6,#1d4ed8)",
                color:"white",border:"none",borderRadius:12,padding:13,
                fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:"pointer",
                boxShadow:isDelete?"0 4px 14px rgba(239,68,68,.4)":"0 4px 14px rgba(59,130,246,.4)"
              }}>
                {isDelete?(fromCount>0?"🗑️ حذف ونقل المنتجات":"🗑️ حذف التصنيف"):"🔀 نقل المنتجات"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── Packages Tab ──
    function PackagesTab({packages,products,cats,notify,reload}){
      const[modal,setModal]=useState(false),[edit,setEdit]=useState(null),[detail,setDetail]=useState(null);
      const pkgTotal=pkg=>(pkg.items||[]).reduce((s,it)=>{const p=products.find(x=>x.id===it.productId);return s+(p?p.price*it.qty:0);},0);
      const del=async id=>{if(!confirm("حذف هذه الباقة؟"))return;await db.remove("packages",id);await reload(["packages"]);notify("✓ تم الحذف");};

      // Group by level
      const groups={};packages.forEach(p=>{const g=p.level||"أخرى";groups[g]=(groups[g]||[]).concat(p);});

      if(detail)return(
        <div style={{flex:1,overflowY:"auto",padding:14}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
            <button onClick={()=>setDetail(null)} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:"7px 13px",color:C.txt,fontFamily:"Tajawal,sans-serif",fontSize:12,cursor:"pointer"}}>← رجوع</button>
            <div style={{width:42,height:42,borderRadius:12,background:`${detail.iconColor||C.acc}20`,border:`2px solid ${detail.iconColor||C.acc}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{detail.icon||"📦"}</div>
            <div><div style={{fontWeight:900,fontSize:16,color:detail.iconColor||C.acc}}>{detail.name}</div><div style={{fontSize:11,color:C.mut}}>{detail.level}</div></div>
            <div style={{marginRight:"auto",display:"flex",gap:8}}>
              <button onClick={()=>{setDetail(null);setEdit(detail);setModal(true);}} style={{background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:8,padding:"8px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontSize:12,fontFamily:"Tajawal,sans-serif",fontWeight:600}}><Ico.edit/> تعديل</button>
              <button onClick={()=>{del(detail.id);setDetail(null);}} style={{background:"#450a0a",color:C.red,border:"none",borderRadius:8,padding:"8px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontSize:12,fontFamily:"Tajawal,sans-serif",fontWeight:600}}><Ico.trash/> حذف</button>
            </div>
          </div>
          {detail.notes&&<div style={{background:`${detail.iconColor||C.acc}10`,border:`1px solid ${detail.iconColor||C.acc}25`,borderRadius:11,padding:"10px 14px",marginBottom:14,fontSize:12,color:C.sub}}>📝 {detail.notes}</div>}
          <div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}>
            <div style={{fontWeight:800,fontSize:13,marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span>محتويات الباقة ({(detail.items||[]).length} منتج)</span>
              <span style={{fontWeight:900,color:detail.iconColor||C.acc,fontSize:15}}>{fmt(pkgTotal(detail))} دج</span>
            </div>
            {(detail.items||[]).length===0?<div style={{textAlign:"center",padding:24,color:C.mut}}><div style={{fontSize:32,opacity:.3}}>📦</div><div style={{marginTop:7,fontSize:12}}>لا توجد منتجات في هذه الباقة بعد<br/>اضغط على تعديل لإضافة منتجات</div></div>
            :(detail.items||[]).map((item,i)=>{const p=products.find(x=>x.id===item.productId);const pi=p?getProdIcon(p):{icon:"📦",color:C.mut,img:null};return(
              <div key={i} style={{display:"flex",alignItems:"center",gap:11,padding:"9px 0",borderBottom:i<(detail.items.length-1)?`1px solid ${C.brd}`:"none"}}>
                {renderPI(pi,40,11)}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,color:C.txt,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p?.name||"منتج محذوف"}</div>
                  <div style={{fontSize:10,color:C.mut}}>{p?.category||""} — الكمية: {item.qty}</div>
                </div>
                {p&&<div style={{textAlign:"left",flexShrink:0}}><div style={{fontWeight:800,color:C.acc,fontSize:13}}>{fmt(p.price*item.qty)} دج</div><div style={{fontSize:9,color:C.mut}}>×{item.qty} × {fmt(p.price)}</div></div>}
              </div>
            );})}
          </div>
        </div>
      );

      return(
        <div style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>
          <div style={{padding:"10px 12px",background:C.surf,borderBottom:`1px solid ${C.brd}`,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontSize:13,color:C.mut,fontWeight:600}}>{packages.length} باقة مدرسية</div>
            <button onClick={()=>{setEdit(null);setModal(true);}} style={{background:`linear-gradient(135deg,#7c3aed,#6d28d9)`,color:"white",border:"none",borderRadius:9,padding:"9px 14px",fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:5,boxShadow:"0 3px 12px #7c3aed35"}}><Ico.plus/> باقة جديدة</button>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:12}}>
            {Object.entries(groups).map(([level,pkgs])=>(
              <div key={level} style={{marginBottom:20}}>
                <div style={{fontSize:12,color:C.mut,fontWeight:700,marginBottom:10,padding:"0 4px",display:"flex",alignItems:"center",gap:7}}>
                  <div style={{height:1,flex:1,background:C.brd}}/>
                  <span>{level}</span>
                  <div style={{height:1,flex:1,background:C.brd}}/>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(168px,1fr))",gap:10}}>
                  {pkgs.map(pkg=>{
                    const hasItems=(pkg.items||[]).length>0;
                    return(
                      <div key={pkg.id} className="pkg-card" style={{background:C.card,borderRadius:16,padding:"16px 14px",border:`2px solid ${hasItems?`${pkg.iconColor||C.acc}30`:`${C.brd}`}`,cursor:"pointer",transition:"all .2s",display:"flex",flexDirection:"column",alignItems:"center",gap:8,position:"relative"}} onClick={()=>setDetail(pkg)}>
                        {/* Icon */}
                        <div style={{width:64,height:64,borderRadius:18,background:hasItems?`${pkg.iconColor||C.acc}20`:`${C.brd}30`,border:`2px solid ${hasItems?`${pkg.iconColor||C.acc}45`:`${C.brd}`}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:34,boxShadow:hasItems?`0 4px 16px ${pkg.iconColor||C.acc}25`:"none",transition:"all .2s"}}>
                          {pkg.icon||"📦"}
                        </div>
                        <div style={{textAlign:"center"}}>
                          <div style={{fontWeight:800,fontSize:12.5,color:hasItems?C.txt:C.mut,lineHeight:1.3}}>{pkg.name}</div>
                          {hasItems?(
                            <>
                              <div style={{fontSize:10,color:C.mut,marginTop:3}}>{pkg.items.length} منتج</div>
                              <div style={{fontWeight:900,color:pkg.iconColor||C.acc,fontSize:14,marginTop:3}}>{fmt(pkgTotal(pkg))} دج</div>
                            </>
                          ):(
                            <div style={{fontSize:10,color:C.mut,marginTop:4,fontStyle:"italic"}}>فارغة — انقر للتعديل</div>
                          )}
                        </div>
                        {/* Edit/delete overlay */}
                        <div style={{display:"flex",gap:5,marginTop:2}}>
                          <button onClick={e=>{e.stopPropagation();setEdit(pkg);setModal(true);}} style={{background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:6,padding:"5px 7px",cursor:"pointer",display:"flex"}}><Ico.edit/></button>
                          <button onClick={e=>{e.stopPropagation();del(pkg.id);}} style={{background:"#450a0a",color:C.red,border:"none",borderRadius:6,padding:"5px 7px",cursor:"pointer",display:"flex"}}><Ico.trash/></button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
          {modal&&<PackageModal package_={edit} products={products} cats={cats} onClose={()=>setModal(false)} onSave={async d=>{await db.save("packages",d);await reload(["packages"]);setModal(false);notify(edit?"✓ تم تحديث الباقة":"✓ تمت إضافة الباقة");}}/>}
        </div>
      );
    }

    // ══════════════════════════════════════════════
    //  PRODUCT MODAL  (with smart icon picker)
    // ══════════════════════════════════════════════
    function ProdModal({product,cats,onClose,onSave}){
      const auto=product?{icon:product.icon||detectIcon(product.name||"").icon,color:product.iconColor||detectIcon(product.name||"").color}:null;
      const[f,setF]=useState({name:product?.name||"",category:product?.category||cats[0]?.name||"",price:product?.price||"",cost:product?.cost||"",stock:product?.stock||"",minStock:product?.minStock||5,barcode:product?.barcode||"",unit:product?.unit||"قطعة",icon:auto?.icon||"📦",iconColor:auto?.color||C.mut,iconImg:product?.iconImg||null});
      const set=(k,v)=>setF(x=>({...x,[k]:v}));
      const[capturing,setCapturing]=useState(false);

      const handleName=v=>{
        const det=detectIcon(v);
        setF(x=>({...x,name:v,icon:det.icon,iconColor:det.color}));
      };

      // تحويل الصورة الملتقطة مباشرة لصورة مصغرة دائرية محفوظة
      const handlePhoto=async(e)=>{
        const file=e.target.files?.[0];
        if(!file)return;
        setCapturing(true);
        try{
          const url=URL.createObjectURL(file);
          const img=new Image();
          img.onload=()=>{
            const SIZE=320;
            const canvas=document.createElement("canvas");
            canvas.width=SIZE; canvas.height=SIZE;
            const ctx=canvas.getContext("2d");
            const side=Math.min(img.width,img.height);
            const sx=(img.width-side)/2, sy=(img.height-side)/2;
            ctx.drawImage(img,sx,sy,side,side,0,0,SIZE,SIZE);
            const dataUrl=canvas.toDataURL("image/jpeg",.88);
            setF(x=>({...x,iconImg:dataUrl}));
            URL.revokeObjectURL(url);
            setCapturing(false);
          };
          img.onerror=()=>setCapturing(false);
          img.src=url;
        }catch(_){setCapturing(false);}
      };

      const save=async()=>{
        if(!f.name||!f.price||f.stock===""){alert("يرجى ملء الحقول الإلزامية (*)");return;}
        await onSave({...(product||{}),...f,price:parseFloat(f.price)||0,cost:parseFloat(f.cost)||0,stock:parseInt(f.stock)||0,minStock:parseInt(f.minStock)||5});
      };

      const pi={icon:f.icon,color:f.iconColor,img:f.iconImg};

      return(
        <div style={{position:"fixed",inset:0,zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.72)"}}/>
          <div style={{background:C.surf,borderRadius:"18px 18px 0 0",padding:"18px 16px",width:"100%",maxWidth:520,maxHeight:"94vh",overflowY:"auto",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .28s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div style={{fontWeight:900,fontSize:15,color:C.acc}}>{product?"✏️ تعديل المنتج":"➕ إضافة منتج جديد"}</div>
              <button onClick={onClose} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:7,padding:7,color:C.mut,cursor:"pointer",display:"flex"}}><Ico.x/></button>
            </div>

            {/* ICON SECTION */}
            <div style={{background:C.bg,borderRadius:14,padding:14,marginBottom:16,border:`1px solid ${C.brd}`}}>
              <div style={{fontSize:11,color:C.mut,fontWeight:600,marginBottom:12}}>🎨 أيقونة المنتج</div>

              <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:14}}>
                {/* Preview — same style as product cards */}
                <div style={{position:"relative",flexShrink:0}}>
                  {renderPI(pi,76,18)}
                  {f.iconImg&&(
                    <button onClick={()=>set("iconImg",null)}
                      title="حذف الصورة"
                      style={{position:"absolute",top:-6,left:-6,background:"#450a0a",border:"1px solid #7f1d1d",borderRadius:"50%",width:20,height:20,color:C.red,cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>✕</button>
                  )}
                </div>

                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13,color:C.txt,marginBottom:8}}>{f.name||"اسم المنتج"}</div>

                  {/* Camera button */}
                  <label style={{display:"inline-flex",alignItems:"center",gap:7,
                    background:capturing?"#1a2840":`linear-gradient(135deg,${C.pur},#6d28d9)`,
                    color:"white",borderRadius:9,padding:"8px 14px",fontSize:12,fontWeight:700,
                    cursor:capturing?"not-allowed":"pointer",
                    boxShadow:capturing?"none":`0 3px 12px ${C.pur}40`,
                    transition:"all .2s",opacity:capturing?.7:1}}>
                    {capturing?"⏳ يتم المعالجة...":"📷 التقاط صورة المنتج"}
                    <input type="file" accept="image/*" capture="environment"
                      onChange={handlePhoto}
                      style={{display:"none"}} disabled={capturing}/>
                  </label>

                  <div style={{fontSize:9,color:C.mut,marginTop:6,lineHeight:1.6}}>
                    {f.iconImg
                      ?"✅ الصورة محفوظة — يمكن تغييرها أو حذفها"
                      :"صوّر المنتج وستُحفظ صورته مباشرة كأيقونة\nأو اختر إيموجي أدناه"}
                  </div>
                </div>
              </div>

              {/* Color swatches — active when no photo */}
              {!f.iconImg&&(
                <>
                  <div style={{display:"flex",gap:5,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
                    {["#10b981","#3b82f6","#f59e0b","#8b5cf6","#ef4444","#06b6d4","#f97316","#ec4899","#a78bfa","#64748b"].map(cl=>(
                      <button key={cl} onClick={()=>set("iconColor",cl)}
                        style={{width:22,height:22,borderRadius:6,background:cl,
                          border:f.iconColor===cl?"3px solid white":"2px solid transparent",
                          cursor:"pointer",boxShadow:f.iconColor===cl?`0 0 8px ${cl}`:"none",
                          transition:"all .15s",flexShrink:0}}/>
                    ))}
                    <span style={{fontSize:9,color:C.mut}}>اللون</span>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                    {PICK_ICONS.map(ic=>(
                      <button key={ic} className="icon-btn" onClick={()=>set("icon",ic)}
                        style={{background:f.icon===ic?`${f.iconColor}30`:C.card,
                          border:`1.5px solid ${f.icon===ic?f.iconColor:C.brd}`,
                          borderRadius:8,padding:"5px 7px",fontSize:19,cursor:"pointer",transition:"all .15s"}}>
                        {ic}
                      </button>
                    ))}
                  </div>
                </>
              )}
            </div>

            {/* Fields */}
            {[{k:"name",l:"اسم المنتج *",t:"text",p:"مثال: دفتر 200 صفحة",onChange:handleName},{k:"barcode",l:"الباركود",t:"text",p:"123456"},{k:"price",l:"سعر البيع (دج) *",t:"number",p:"0"},{k:"cost",l:"سعر التكلفة (دج)",t:"number",p:"0"},{k:"stock",l:"الكمية الحالية *",t:"number",p:"0"},{k:"minStock",l:"حد التنبيه",t:"number",p:"5"},{k:"unit",l:"وحدة القياس",t:"text",p:"قطعة، علبة..."}].map(({k,l,t,p,onChange})=>(
              <div key={k} style={{marginBottom:13}}>
                <label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:600}}>{l}</label>
                <input type={t} value={f[k]} onChange={e=>onChange?onChange(e.target.value):set(k,e.target.value)} placeholder={p} style={INP}/>
              </div>
            ))}
            <div style={{marginBottom:14}}>
              <label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:600}}>التصنيف</label>
              <select value={f.category} onChange={e=>set("category",e.target.value)} style={INP}>
                {cats.map(c=><option key={c.id} value={c.name}>{c.icon} {c.name}</option>)}
              </select>
            </div>
            {f.price&&f.cost&&parseFloat(f.price)>0&&parseFloat(f.cost)>0&&(
              <div style={{background:"#052e16",border:"1px solid #166534",borderRadius:9,padding:"9px 13px",marginBottom:14,display:"flex",justifyContent:"space-between",fontSize:12}}>
                <span style={{color:C.mut}}>هامش الربح:</span>
                <span style={{fontWeight:800,color:C.grn}}>{((parseFloat(f.price)-parseFloat(f.cost))/parseFloat(f.price)*100).toFixed(1)}% — {fmt(parseFloat(f.price)-parseFloat(f.cost))} دج</span>
              </div>
            )}
            <div style={{display:"flex",gap:9}}>
              <button onClick={onClose} style={{flex:1,background:C.card,color:C.txt,border:`1px solid ${C.brd}`,borderRadius:10,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:600,cursor:"pointer"}}>إلغاء</button>
              <button onClick={save} style={{flex:2,background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:10,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:"pointer",boxShadow:`0 5px 16px ${C.acc}35`}}>{product?"💾 حفظ":"✓ إضافة"}</button>
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════
    //  PACKAGE MODAL (create/edit with product picker)
    // ══════════════════════════════════════════════
    const PKG_ICONS=["🌱","🌿","🌳","📖","🎯","🔍","📐","🔬","🎓","💡","⚡","🏆","🎨","📋","✏️","📚","🎒","🌟","⭐","🔭","🧪","💎","🏅","🎓","📊","🔢"];
    const LEVELS=["ابتدائي س1","ابتدائي س2","ابتدائي س3","ابتدائي س4","ابتدائي س5","متوسط س1","متوسط س2","متوسط س3","متوسط س4","ثانوي س1","ثانوي س2","ثانوي س3","خاص"];
    const PKG_COLORS=["#10b981","#22c55e","#16a34a","#f59e0b","#ef4444","#3b82f6","#8b5cf6","#06b6d4","#f97316","#fbbf24","#ec4899","#64748b","#7c3aed"];

    function PackageModal({package_,products,cats,onClose,onSave}){
      const[f,setF]=useState({name:package_?.name||"",icon:package_?.icon||"🎒",iconColor:package_?.iconColor||"#f59e0b",level:package_?.level||"ابتدائي س1",notes:package_?.notes||"",items:[...(package_?.items||[])]});
      const[prodSearch,setPSearch]=useState("");
      const set=(k,v)=>setF(x=>({...x,[k]:v}));
      const filtP=products.filter(p=>!prodSearch||p.name.includes(prodSearch)||(p.barcode||"").includes(prodSearch));
      const hasItem=id=>f.items.some(i=>i.productId===id);
      const toggleItem=p=>{
        if(hasItem(p.id))setF(x=>({...x,items:x.items.filter(i=>i.productId!==p.id)}));
        else setF(x=>({...x,items:[...x.items,{productId:p.id,qty:1}]}));
      };
      const setQty=(id,q)=>setF(x=>({...x,items:x.items.map(i=>i.productId===id?{...i,qty:Math.max(1,parseInt(q)||1)}:i)}));
      const total=f.items.reduce((s,it)=>{const p=products.find(x=>x.id===it.productId);return s+(p?p.price*it.qty:0);},0);
      const save=async()=>{
        if(!f.name.trim()){alert("أدخل اسم الباقة");return;}
        await onSave({...(package_||{}),...f});
      };
      return(
        <div style={{position:"fixed",inset:0,zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.75)"}}/>
          <div style={{background:C.surf,borderRadius:"18px 18px 0 0",padding:"18px 16px",width:"100%",maxWidth:560,maxHeight:"95vh",overflowY:"auto",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .28s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div style={{fontWeight:900,fontSize:15,color:C.acc}}>{package_?"✏️ تعديل الباقة":"🎒 إنشاء باقة جديدة"}</div>
              <button onClick={onClose} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:7,padding:7,color:C.mut,cursor:"pointer",display:"flex"}}><Ico.x/></button>
            </div>

            {/* Icon + Color picker */}
            <div style={{background:C.bg,borderRadius:14,padding:14,marginBottom:14,border:`1px solid ${C.brd}`}}>
              <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:11}}>
                <div style={{width:58,height:58,borderRadius:16,background:`${f.iconColor}22`,border:`2px solid ${f.iconColor}50`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:30,flexShrink:0}}>{f.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:11,color:C.mut,fontWeight:600,marginBottom:6}}>أيقونة الباقة</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {PKG_ICONS.map(ic=><button key={ic} className="icon-btn" onClick={()=>set("icon",ic)} style={{background:f.icon===ic?`${f.iconColor}30`:C.card,border:`1.5px solid ${f.icon===ic?f.iconColor:C.brd}`,borderRadius:7,padding:"4px 6px",fontSize:17,cursor:"pointer",transition:"all .15s"}}>{ic}</button>)}
                  </div>
                </div>
              </div>
              <div style={{fontSize:11,color:C.mut,fontWeight:600,marginBottom:6}}>لون الأيقونة</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {PKG_COLORS.map(c=><button key={c} onClick={()=>set("iconColor",c)} style={{width:28,height:28,borderRadius:50,background:c,border:f.iconColor===c?"3px solid white":"2px solid transparent",cursor:"pointer",transition:"all .15s",boxShadow:f.iconColor===c?`0 0 8px ${c}80`:"none"}}/>)}
              </div>
            </div>

            {/* Basic fields */}
            <div style={{marginBottom:13}}><label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:600}}>اسم الباقة *</label><input value={f.name} onChange={e=>set("name",e.target.value)} placeholder="مثال: باقة السنة الأولى ابتدائي" style={INP}/></div>
            <div style={{marginBottom:13}}><label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:600}}>المستوى الدراسي</label><select value={f.level} onChange={e=>set("level",e.target.value)} style={INP}>{LEVELS.map(l=><option key={l} value={l}>{l}</option>)}</select></div>
            <div style={{marginBottom:14}}><label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:600}}>ملاحظات</label><input value={f.notes} onChange={e=>set("notes",e.target.value)} placeholder="وصف اختياري..." style={INP}/></div>

            {/* Product picker */}
            <div style={{background:C.bg,borderRadius:14,padding:13,marginBottom:14,border:`1px solid ${C.brd}`}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:C.txt,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span>اختر المنتجات</span>
                {f.items.length>0&&<span style={{background:`${C.acc}18`,color:C.acc,borderRadius:20,padding:"2px 9px",fontSize:11,fontWeight:800}}>{f.items.length} منتج — {fmt(total)} دج</span>}
              </div>
              <div style={{position:"relative",marginBottom:9}}>
                <input value={prodSearch} onChange={e=>setPSearch(e.target.value)} placeholder="ابحث عن منتج..." style={{...INP,paddingRight:35,padding:"8px 35px 8px 11px",fontSize:12}}/>
                <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:C.mut,pointerEvents:"none"}}><Ico.srch/></span>
              </div>
              <div style={{maxHeight:200,overflowY:"auto"}}>
                {filtP.slice(0,30).map(p=>{
                  const pi=getProdIcon(p);
                  const sel=hasItem(p.id);
                  const item=f.items.find(i=>i.productId===p.id);
                  return(
                    <div key={p.id} style={{display:"flex",alignItems:"center",gap:9,padding:"7px 8px",borderRadius:9,marginBottom:3,background:sel?`${pi.color}12`:C.card,border:`1px solid ${sel?pi.color+"30":C.brd}`,transition:"all .15s",cursor:"pointer"}} onClick={()=>toggleItem(p)}>
                      {renderPI(pi,36,10)}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:600,color:sel?C.txt:C.sub,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
                        <div style={{fontSize:10,color:C.mut}}>{fmt(p.price)} دج — مخزون: {p.stock}</div>
                      </div>
                      {sel&&<input type="number" value={item?.qty||1} min="1" onClick={e=>e.stopPropagation()} onChange={e=>setQty(p.id,e.target.value)} style={{...INP,width:50,padding:"4px 6px",fontSize:13,fontWeight:700,textAlign:"center",color:pi.color,border:`1px solid ${pi.color}40`}}/>}
                      <div style={{width:22,height:22,borderRadius:50,background:sel?C.grn:C.brd,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .2s"}}>
                        {sel?<Ico.chk/>:null}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div style={{display:"flex",gap:9}}>
              <button onClick={onClose} style={{flex:1,background:C.card,color:C.txt,border:`1px solid ${C.brd}`,borderRadius:10,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:600,cursor:"pointer"}}>إلغاء</button>
              <button onClick={save} style={{flex:2,background:`linear-gradient(135deg,#7c3aed,#6d28d9)`,color:"white",border:"none",borderRadius:10,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:"pointer",boxShadow:"0 5px 16px #7c3aed35"}}>{package_?"💾 حفظ التعديلات":"🎒 إنشاء الباقة"}</button>
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════
    //  CUSTOMERS VIEW
    // ══════════════════════════════════════════════
    function CustomersView({customers,sales,notify,reload}){
      const[search,setSrch]=useState(""),[modal,setModal]=useState(false),[edit,setEdit]=useState(null),[detail,setDetail]=useState(null);
      const filt=customers.filter(c=>!search||c.name.includes(search)||(c.phone||"").includes(search));
      // ── Bug fix: compare as numbers (customerId saved via parseInt) ──
      const custSales=cid=>sales.filter(s=>Number(s.customerId)===Number(cid));
      const del=async id=>{if(!confirm("حذف هذا العميل؟"))return;await db.remove("customers",id);await reload(["customers"]);notify("✓ تم الحذف");};
      if(detail){
        const cs=custSales(detail.id);
        const csSorted=[...cs].sort((a,b)=>new Date(b.date)-new Date(a.date));
        const lastVisit=csSorted[0]?.date;
        // إجمالي المشتريات يستثني المرتجعات
        const actualTotal=cs.filter(s=>s.payMethod!=="return").reduce((s,x)=>s+(x.total||0),0);
        // الدين من السجل الرسمي (يُحدَّث عند كل بيع)
        const debt=Math.max(0, detail.debt||0);
        return(
        <div style={{height:"calc(100vh - 54px)",overflowY:"auto",padding:14}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
            <button onClick={()=>setDetail(null)} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:"7px 13px",color:C.txt,fontFamily:"Tajawal,sans-serif",fontSize:12,cursor:"pointer"}}>← رجوع</button>
            <div style={{fontWeight:800,fontSize:15,color:C.acc}}>👤 {detail.name}</div>
          </div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
            {[
              ["إجمالي المشتريات",`${fmt(actualTotal)} دج`,C.acc,"💰"],
              ["عدد الفواتير",cs.filter(s=>s.payMethod!=="return").length,C.blu,"🧾"],
              ["آخر زيارة",lastVisit?dateLabel(lastVisit):"—",C.grn,"📅"],
              ...(debt>0?[["ديون متبقية",`${fmt(debt)} دج`,C.red,"⚠️"]]:[] )
            ].map(([l,v,c,ic])=>(
              <div key={l} style={{background:C.card,borderRadius:11,padding:"12px 16px",border:`1px solid ${c}22`,flex:"1 1 130px"}}>
                <div style={{fontSize:22}}>{ic}</div>
                <div style={{fontWeight:900,fontSize:18,color:c,marginTop:4}}>{v}</div>
                <div style={{fontSize:11,color:C.mut}}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}>
            <div style={{fontWeight:800,fontSize:13,marginBottom:12}}>سجل المشتريات</div>
            {csSorted.length===0?<div style={{color:C.mut,fontSize:12}}>لا توجد مشتريات بعد</div>
            :csSorted.map((s,i)=>(
              <div key={s.id||i} style={{padding:"9px 0",borderBottom:i<csSorted.length-1?`1px solid ${C.brd}`:"none"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:12,color:C.sub,fontWeight:600}}>{dateLabel(s.date)} — {timeLabel(s.date)}</span>
                  <span style={{fontWeight:800,color:s.total<0?C.red:C.acc,fontSize:14}}>{fmt(s.total)} دج</span>
                </div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
                  {(s.items||[]).slice(0,4).map((it,j)=><span key={j} style={{background:C.bg,borderRadius:6,padding:"2px 7px",fontSize:10,color:C.mut}}>{it.name} ×{it.qty}</span>)}
                  {(s.items||[]).length>4&&<span style={{fontSize:10,color:C.mut}}>+{s.items.length-4}</span>}
                  {s.payMethod&&<span style={{marginRight:"auto",fontSize:9,padding:"2px 7px",borderRadius:6,background:s.payMethod==="debt"?`${C.red}18`:s.payMethod==="partial"?`${C.amb}18`:`${C.grn}18`,color:s.payMethod==="debt"?C.red:s.payMethod==="partial"?C.amb:C.grn,fontWeight:700}}>
                    {{cash:"نقداً",cib:"CIB",baridimob:"بريدي",partial:"جزئي",debt:"دين",return:"مرتجع"}[s.payMethod]||s.payMethod}
                  </span>}
                </div>
              </div>
            ))}
          </div>
        </div>
      );}
      return(
        <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 54px)",overflow:"hidden"}}>
          <div style={{padding:"10px 12px",background:C.surf,borderBottom:`1px solid ${C.brd}`,flexShrink:0}}>
            <div style={{display:"flex",gap:8,marginBottom:7}}>
              <div style={{position:"relative",flex:1}}>
                <input value={search} onChange={e=>setSrch(e.target.value)} placeholder="بحث بالاسم أو الهاتف..." style={{...INP,paddingRight:36}}/>
                <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:C.mut,pointerEvents:"none"}}><Ico.srch/></span>
              </div>
              <button onClick={()=>{setEdit(null);setModal(true);}} style={{background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:8,padding:"8px 13px",fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
                <Ico.plus/> عميل جديد
              </button>
            </div>
            <div style={{fontSize:11,color:C.mut}}>{customers.length} عميل مسجّل</div>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:10}}>
            {filt.map(c=>{
              const cs=custSales(c.id);
              const debt=Math.max(0, c.debt||0);
              const total=cs.filter(s=>s.payMethod!=="return").reduce((s,x)=>s+(x.total||0),0);
              return(
              <div key={c.id} style={{background:C.card,borderRadius:11,padding:"11px 13px",marginBottom:7,border:`1px solid ${debt>0?C.red+"30":C.brd}`,display:"flex",alignItems:"center",gap:11,animation:"fadeUp .2s ease"}}>
                <div style={{background:`linear-gradient(135deg,${C.pur},#7c3aed)`,borderRadius:50,width:40,height:40,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0,color:"white",fontWeight:800}}>{c.name.charAt(0)}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,color:C.txt,marginBottom:2}}>{c.name}</div>
                  <div style={{display:"flex",gap:7,alignItems:"center"}}>
                    <Ico.phone/><span style={{fontSize:11,color:C.mut}}>{c.phone}</span>
                    {c.address&&<span style={{fontSize:10,color:"#2a4a6a"}}>📍 {c.address}</span>}
                  </div>
                  {debt>0&&<div style={{fontSize:10,color:C.red,fontWeight:700,marginTop:2}}>⚠ دين: {fmt(debt)} دج</div>}
                </div>
                <div style={{textAlign:"center",flexShrink:0}}>
                  <div style={{fontWeight:900,color:C.acc,fontSize:13}}>{fmt(total)}</div>
                  <div style={{fontSize:9,color:C.mut}}>دج — {cs.filter(s=>s.payMethod!=="return").length} فاتورة</div>
                </div>
                <div style={{display:"flex",gap:5,flexShrink:0}}>
                  <button onClick={()=>setDetail(c)} style={{background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:6,padding:"6px 8px",cursor:"pointer",display:"flex"}}><Ico.eye/></button>
                  <button onClick={()=>{setEdit(c);setModal(true);}} style={{background:"#1e3a5f",color:"#60a5fa",border:"none",borderRadius:6,padding:"6px 8px",cursor:"pointer",display:"flex"}}><Ico.edit/></button>
                  <button onClick={()=>del(c.id)} style={{background:"#450a0a",color:C.red,border:"none",borderRadius:6,padding:"6px 8px",cursor:"pointer",display:"flex"}}><Ico.trash/></button>
                </div>
              </div>
            );})}
            {filt.length===0&&<div style={{textAlign:"center",padding:50,color:C.mut}}><div style={{fontSize:40,opacity:.3}}>👥</div><div style={{marginTop:8}}>لا يوجد عملاء</div></div>}
          </div>
          {modal&&<SimpleModal
            title={edit?"✏️ تعديل عميل":"➕ إضافة عميل جديد"}
            fields={[{k:"name",l:"الاسم الكامل *",t:"text",p:"أحمد بن علي"},{k:"phone",l:"رقم الهاتف *",t:"tel",p:"0500000000"},{k:"address",l:"العنوان",t:"text",p:"المدينة"},{k:"notes",l:"ملاحظات",t:"text",p:"..."}]}
            initial={edit||{name:"",phone:"",address:"",notes:""}}
            required={["name","phone"]}
            onClose={()=>setModal(false)}
            onSave={async d=>{
              await db.save("customers",{
                ...(edit||{}),
                ...d,
                totalPurchases:edit?.totalPurchases||0,
                debt:edit?.debt||0,
                createdAt:edit?.createdAt||new Date().toISOString()
              });
              await reload(["customers"]);
              setModal(false);
              notify(edit?"✓ تم تحديث العميل":"✓ تم إضافة العميل");
            }}/>}
        </div>
      );
    }

    // ══════════════════════════════════════════════
    //  REPORTS VIEW
    // ══════════════════════════════════════════════
    function ReportsView({sales,products,cats}){
      const[period,setPeriod]=useState("day"),[tab,setTab]=useState("sales");
      const now=new Date();
      const fd=s=>{const d=new Date(s.date);if(period==="day")return s.date?.slice(0,10)===todayStr();if(period==="week")return(now-d)<7*24*3600*1000;if(period==="month")return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();return true;};
      const flt=sales.filter(fd);
      const rev=flt.reduce((s,x)=>s+(x.total||0),0);
      const prof=flt.reduce((s,x)=>s+(x.items||[]).reduce((a,it)=>{
        const p=products.find(pr=>pr.id===it.id);
        const cost=it.cost!==undefined?it.cost:(p?.cost||0);
        return a+(it.price-cost)*it.qty;
      },0),0);
      const items=flt.reduce((s,x)=>s+(x.items||[]).reduce((a,i)=>a+i.qty,0),0);
      const cs={};flt.forEach(s=>(s.items||[]).forEach(it=>{const p=products.find(pr=>pr.id===it.id);const cat=p?.category||"أخرى";cs[cat]=(cs[cat]||0)+it.price*it.qty;}));
      const cd=Object.entries(cs).sort((a,b)=>b[1]-a[1]);const mc=Math.max(...cd.map(c=>c[1]),1);
      const pc={};flt.forEach(s=>(s.items||[]).forEach(it=>{pc[it.id]={qty:(pc[it.id]?.qty||0)+it.qty,rev:(pc[it.id]?.rev||0)+it.price*it.qty,name:it.name};}));
      const tp=Object.values(pc).sort((a,b)=>b.qty-a.qty).slice(0,8);
      const dd=Array.from({length:10},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(9-i));const k=d.toISOString().slice(0,10);const ds=sales.filter(s=>s.date?.slice(0,10)===k);return{label:d.toLocaleDateString("fr-FR",{day:"numeric",month:"numeric"}),rev:ds.reduce((s,x)=>s+(x.total||0),0),count:ds.length};});
      const md=Math.max(...dd.map(d=>d.rev),1);
      return(
        <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 54px)",overflow:"hidden"}}>
          <div style={{padding:"10px 12px",background:C.surf,borderBottom:`1px solid ${C.brd}`,flexShrink:0}}>
            <div style={{display:"flex",gap:6,marginBottom:8}}>{[{id:"day",l:"اليوم"},{id:"week",l:"الأسبوع"},{id:"month",l:"الشهر"},{id:"all",l:"الكل"}].map(p=><button key={p.id} onClick={()=>setPeriod(p.id)} style={pill(period===p.id)}>{p.l}</button>)}</div>
            <div style={{display:"flex",gap:6}}>{[{id:"sales",l:"المبيعات"},{id:"products",l:"المنتجات"},{id:"history",l:"سجل الفواتير"}].map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{...pill(tab===t.id),borderRadius:8,padding:"6px 12px"}}>{t.l}</button>)}</div>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:12}}>
            <div style={{display:"flex",gap:9,flexWrap:"wrap",marginBottom:14}}>
              {[{l:"إيرادات",v:`${fmt(rev)} دج`,c:C.acc,i:"💰"},{l:"أرباح صافية",v:`${fmt(prof)} دج`,c:C.grn,i:"📈"},{l:"عدد الفواتير",v:flt.length,c:C.blu,i:"🧾"},{l:"قطع مباعة",v:items,c:C.pur,i:"📦"}].map(k=>(
                <div key={k.l} style={{background:C.card,borderRadius:13,padding:"12px 16px",border:`1px solid ${k.c}22`,flex:"1 1 130px"}}><div style={{fontSize:24}}>{k.i}</div><div style={{fontWeight:900,fontSize:18,color:k.c,marginTop:4}}>{k.v}</div><div style={{fontSize:11,color:C.mut}}>{k.l}</div>{k.l==="أرباح صافية"&&rev>0&&<div style={{fontSize:10,color:C.grn,fontWeight:600}}>هامش {Math.round(prof/rev*100)}%</div>}</div>
              ))}
            </div>
            {tab==="sales"&&<>
              <div style={{background:C.card,borderRadius:14,padding:15,border:`1px solid ${C.brd}`,marginBottom:12}}>
                <div style={{fontWeight:800,fontSize:13,marginBottom:13}}>📅 مبيعات آخر 10 أيام</div>
                <div style={{display:"flex",alignItems:"flex-end",gap:5,height:90}}>
                  {dd.map((d,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><div style={{fontSize:7.5,color:C.mut,textAlign:"center"}}>{d.rev>0?`${Math.round(d.rev/1000)}k`:""}</div><div style={{width:"100%",borderRadius:"4px 4px 0 0",background:d.rev>0?`linear-gradient(180deg,${C.acc},${C.accD})`:C.brd,height:`${Math.max(3,(d.rev/md)*80)}px`,transition:"height .5s ease"}}/><div style={{fontSize:8,color:C.mut,whiteSpace:"nowrap"}}>{d.label}</div>{d.count>0&&<div style={{fontSize:7,color:C.acc}}>{d.count}×</div>}</div>)}
                </div>
              </div>
              <div style={{background:C.card,borderRadius:14,padding:15,border:`1px solid ${C.brd}`}}>
                <div style={{fontWeight:800,fontSize:13,marginBottom:13}}>🏷️ حسب التصنيف</div>
                {cd.length===0?<div style={{color:C.mut,fontSize:12}}>لا توجد بيانات</div>
                :cd.map(([cat,rv],i)=>{const ci=cats.find(c=>c.name===cat);return(<div key={i} style={{marginBottom:11}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:5,fontSize:12}}><span style={{color:C.txt,fontWeight:600}}>{ci?.icon||"📦"} {cat}</span><span style={{color:C.acc,fontWeight:700}}>{fmt(rv)} دج</span></div><div style={{background:C.bg,borderRadius:6,height:6,overflow:"hidden"}}><div style={{background:`linear-gradient(90deg,${C.acc},${C.accL})`,height:"100%",width:`${rv/mc*100}%`,borderRadius:6,transition:"width .5s ease"}}/></div></div>);})}
              </div>
            </>}
            {tab==="products"&&<div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}><div style={{fontWeight:800,fontSize:13,marginBottom:13}}>🏆 أداء المنتجات</div>{tp.length===0?<div style={{color:C.mut,fontSize:12}}>لا توجد بيانات</div>:tp.map((p,i)=>{const prod=products.find(x=>x.name===p.name);const pi=prod?getProdIcon(prod):{icon:"📦",color:C.mut,img:null};return(<div key={i} style={{display:"flex",alignItems:"center",gap:11,padding:"8px 0",borderBottom:i<tp.length-1?`1px solid ${C.brd}`:"none"}}><div style={{fontWeight:900,color:i<3?C.acc:C.mut,fontSize:16,width:22,textAlign:"center",flexShrink:0}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</div>{renderPI(pi,32,9)}<div style={{flex:1,fontSize:12,color:C.txt,fontWeight:600,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{p.name}</div><div style={{fontSize:11,color:C.grn,fontWeight:700,flexShrink:0}}>{p.qty}×</div><div style={{fontSize:11,color:C.acc,fontWeight:700,flexShrink:0}}>{fmt(p.rev)} دج</div></div>);})}</div>}
            {tab==="history"&&<div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}><div style={{fontWeight:800,fontSize:13,marginBottom:13}}>🧾 سجل الفواتير ({flt.length})</div>{flt.length===0?<div style={{color:C.mut,fontSize:12}}>لا توجد فواتير</div>:[...flt].reverse().map((s,i)=><div key={i} style={{padding:"9px 0",borderBottom:i<flt.length-1?`1px solid ${C.brd}`:"none"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}><div style={{display:"flex",alignItems:"center",gap:8}}><div style={{background:`${C.acc}18`,borderRadius:7,padding:"3px 8px",fontSize:10,color:C.acc,fontWeight:800}}>#{(s.id||"").toString().padStart(4,"0")}</div><div style={{fontSize:11,color:C.mut}}>{dateLabel(s.date)} {timeLabel(s.date)}</div></div><div style={{fontWeight:900,color:C.acc,fontSize:14}}>{fmt(s.total)} دج</div></div><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{(s.items||[]).slice(0,5).map((it,j)=><span key={j} style={{background:C.bg,borderRadius:6,padding:"2px 7px",fontSize:10,color:C.mut}}>{it.name} ×{it.qty}</span>)}{(s.items||[]).length>5&&<span style={{fontSize:10,color:C.mut}}>+{s.items.length-5}</span>}</div></div>)}</div>}
          </div>
        </div>
      );
    }
