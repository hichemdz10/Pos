    function CatModal({onClose,onSave}){
      const[name,setName]       =useState("");
      const[icon,setIcon]       =useState("📦");
      const[catImg,setCatImg]   =useState(null);
      const[mode,setMode]       =useState("emoji"); // "emoji" | "photo"
      const[processing,setProc]=useState(false);
      const icons=["📚","📓","✏️","🎨","📎","🎒","🖊️","📐","📏","🗂️","🖍️","📌","📋","🔖","🗒️","📝","🔬","⚛️","🌍","🔢","💡","🖼️","🎵","🎯","⚽","🧸","🔑","💊","🍎","🛒","🏠","🚗","💻"];

      const handlePhoto=async e=>{
        const file=e.target.files?.[0]; if(!file)return;
        setProc(true);
        try{
          const url=URL.createObjectURL(file);
          const img=new Image();
          img.onload=()=>{
            const S=280;
            const canvas=document.createElement("canvas");
            canvas.width=S; canvas.height=S;
            const ctx=canvas.getContext("2d");
            const side=Math.min(img.width,img.height);
            ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
            setCatImg(canvas.toDataURL("image/jpeg",.88));
            URL.revokeObjectURL(url);
            setProc(false);
          };
          img.onerror=()=>setProc(false);
          img.src=url;
        }catch(_){setProc(false);}
      };

      const handleSave=()=>{
        if(!name.trim()){alert("أدخل اسم التصنيف");return;}
        onSave({name:name.trim(), icon, catImg: catImg||null});
      };

      return(
        <div style={{position:"fixed",inset:0,zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.75)"}}/>
          <div style={{background:C.surf,borderRadius:"20px 20px 0 0",padding:"20px 18px 24px",width:"100%",maxWidth:420,maxHeight:"92vh",overflowY:"auto",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .28s cubic-bezier(.34,1.56,.64,1)"}} onClick={e=>e.stopPropagation()}>

            {/* رأس */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div style={{fontWeight:900,fontSize:15,color:C.acc}}>➕ تصنيف جديد</div>
              <button onClick={onClose} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:8,padding:7,color:C.mut,cursor:"pointer",display:"flex"}}><Ico.x/></button>
            </div>

            {/* اسم التصنيف */}
            <label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:700}}>اسم التصنيف *</label>
            <input value={name} onChange={e=>setName(e.target.value)}
              placeholder="مثال: أدوات مكتبية"
              style={{...INP,marginBottom:18,fontSize:14}}/>

            {/* تبديل أيقونة / صورة */}
            <div style={{display:"flex",background:C.bg,borderRadius:12,padding:4,marginBottom:16,border:`1px solid ${C.brd}`}}>
              {[["emoji","😊 أيقونة"],["photo","📷 صورة"]].map(([m,l])=>(
                <button key={m} onClick={()=>setMode(m)} style={{
                  flex:1,padding:"9px 0",borderRadius:9,border:"none",
                  background:mode===m?`linear-gradient(135deg,${C.acc},${C.accD})`:"transparent",
                  color:mode===m?"#080f1e":C.mut,
                  fontFamily:"Tajawal,sans-serif",fontWeight:800,fontSize:13,cursor:"pointer",
                  transition:"all .2s"
                }}>{l}</button>
              ))}
            </div>

            {/* وضع الأيقونة */}
            {mode==="emoji"&&(
              <div>
                {/* معاينة */}
                <div style={{display:"flex",justifyContent:"center",marginBottom:14}}>
                  <div style={{
                    width:70,height:70,borderRadius:18,
                    background:`${C.acc}18`,border:`2px solid ${C.acc}30`,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    fontSize:36,boxShadow:`0 4px 16px ${C.acc}20`
                  }}>{icon}</div>
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
                  {icons.map(ic=>(
                    <button key={ic} onClick={()=>setIcon(ic)} style={{
                      background:icon===ic?`${C.acc}25`:C.card,
                      border:`2px solid ${icon===ic?C.acc:C.brd}`,
                      borderRadius:10,padding:"7px 10px",fontSize:21,
                      cursor:"pointer",transition:"all .15s",
                      boxShadow:icon===ic?`0 0 10px ${C.acc}40`:"none"
                    }}>{ic}</button>
                  ))}
                </div>
              </div>
            )}

            {/* وضع الصورة */}
            {mode==="photo"&&(
              <div>
                {catImg ? (
                  /* معاينة الصورة */
                  <div style={{position:"relative",marginBottom:14}}>
                    <div style={{
                      width:"100%",height:170,borderRadius:16,overflow:"hidden",
                      border:`2px solid ${C.acc}40`,boxShadow:`0 4px 20px rgba(0,0,0,.3)`
                    }}>
                      <img src={catImg} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
                    </div>
                    <button onClick={()=>setCatImg(null)} style={{
                      position:"absolute",top:8,left:8,
                      background:"rgba(239,68,68,.9)",backdropFilter:"blur(4px)",
                      border:"none",borderRadius:"50%",width:30,height:30,
                      color:"white",cursor:"pointer",fontSize:14,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      boxShadow:"0 2px 8px rgba(0,0,0,.4)"
                    }}>✕</button>
                    <div style={{
                      position:"absolute",bottom:10,right:10,
                      background:"rgba(0,0,0,.65)",backdropFilter:"blur(4px)",
                      borderRadius:20,padding:"4px 12px",fontSize:10,color:"white",fontWeight:700
                    }}>✅ تم رفع الصورة</div>
                  </div>
                ) : (
                  /* منطقة رفع الصورة */
                  <label style={{
                    display:"block",cursor:processing?"not-allowed":"pointer",
                    marginBottom:14
                  }}>
                    <div style={{
                      border:`2px dashed ${processing?C.mut:C.acc}`,
                      borderRadius:16,padding:"32px 20px",textAlign:"center",
                      background:processing?C.bg:`${C.acc}06`,
                      transition:"all .2s"
                    }}>
                      {processing ? (
                        <>
                          <div style={{fontSize:32,animation:"spin 1s linear infinite",display:"inline-block",marginBottom:10}}>⚙️</div>
                          <div style={{fontSize:12,color:C.mut,fontWeight:700}}>جاري معالجة الصورة...</div>
                        </>
                      ) : (
                        <>
                          <div style={{fontSize:44,marginBottom:10}}>🖼️</div>
                          <div style={{fontWeight:800,fontSize:14,color:C.acc,marginBottom:6}}>اضغط لاختيار صورة</div>
                          <div style={{fontSize:11,color:C.mut}}>أو التقط صورة بالكاميرا</div>
                          <div style={{
                            marginTop:12,display:"inline-block",
                            background:`linear-gradient(135deg,${C.acc},${C.accD})`,
                            color:"#080f1e",borderRadius:20,padding:"7px 20px",
                            fontSize:12,fontWeight:800
                          }}>📷 اختيار / التقاط</div>
                        </>
                      )}
                    </div>
                    <input type="file" accept="image/*" capture="environment"
                      onChange={handlePhoto} style={{display:"none"}} disabled={processing}/>
                  </label>
                )}
              </div>
            )}

            {/* أزرار الحفظ */}
            <div style={{display:"flex",gap:9,marginTop:20}}>
              <button onClick={onClose} style={{flex:1,background:C.card,color:C.txt,border:`1px solid ${C.brd}`,borderRadius:11,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:600,cursor:"pointer"}}>إلغاء</button>
              <button onClick={handleSave} style={{flex:2,background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:11,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:"pointer",boxShadow:`0 5px 16px ${C.acc}35`}}>
                {mode==="photo"&&catImg?"🖼️ إضافة بالصورة":"✓ إضافة التصنيف"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function SimpleModal({title,fields,initial,required,onClose,onSave}){
      const[f,setF]=useState(initial);const set=(k,v)=>setF(x=>({...x,[k]:v}));
      const save=async()=>{for(const r of required)if(!f[r]?.trim()){alert(`يرجى ملء: ${fields.find(x=>x.k===r)?.l||r}`);return;}await onSave(f);};
      return(
        <div style={{position:"fixed",inset:0,zIndex:500,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={onClose}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.72)"}}/>
          <div style={{background:C.surf,borderRadius:"16px 16px 0 0",padding:"18px 16px",width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",border:`1px solid ${C.brd}`,position:"relative",animation:"fadeUp .28s ease"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}><div style={{fontWeight:900,fontSize:15,color:C.acc}}>{title}</div><button onClick={onClose} style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:7,padding:7,color:C.mut,cursor:"pointer",display:"flex"}}><Ico.x/></button></div>
            {fields.map(({k,l,t,p})=><div key={k} style={{marginBottom:13}}><label style={{fontSize:11,color:C.mut,display:"block",marginBottom:5,fontWeight:600}}>{l}</label><input type={t||"text"} value={f[k]||""} onChange={e=>set(k,e.target.value)} placeholder={p} style={INP}/></div>)}
            <div style={{display:"flex",gap:9,marginTop:4}}><button onClick={onClose} style={{flex:1,background:C.card,color:C.txt,border:`1px solid ${C.brd}`,borderRadius:10,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:600,cursor:"pointer"}}>إلغاء</button><button onClick={save} style={{flex:2,background:`linear-gradient(135deg,${C.acc},${C.accD})`,color:"#080f1e",border:"none",borderRadius:10,padding:13,fontFamily:"Tajawal,sans-serif",fontWeight:900,fontSize:14,cursor:"pointer",boxShadow:`0 5px 16px ${C.acc}35`}}>✓ حفظ</button></div>
          </div>
        </div>
      );
    }

// TelegramView — النسخة المحسّنة v2
// ══════════════════════════════════════════════
function TelegramView({ notify, onBadgeUpdate }) {
  const [orders,   setOrders]   = useState([]);
  const [loading,  setLoading]  = useState(true);
  const [filter,   setFilter]   = useState("pending");
  const [selected, setSelected] = useState(null);
  const [imgModal, setImgModal] = useState(null);
  const [search,   setSearch]   = useState("");
  const [lastSync,       setLastSync]       = useState(null);
  const [stats,          setStats]          = useState({ pending:0, confirmed:0, completed:0, cancelled:0 });
  const [confirmDelete,  setConfirmDelete]  = useState(null);   // { id, name }
  const [deleting,       setDeleting]       = useState(false);

  const STATUS = {
    pending:   { label:"قيد الانتظار", color:"#f59e0b", bg:"#2d1a00", icon:"⏳", grad:"linear-gradient(135deg,#f59e0b,#d97706)" },
    confirmed: { label:"مؤكد",         color:"#3b82f6", bg:"#0f1e3d", icon:"✅", grad:"linear-gradient(135deg,#3b82f6,#2563eb)" },
    completed: { label:"مكتمل",        color:"#10b981", bg:"#032015", icon:"🎉", grad:"linear-gradient(135deg,#10b981,#059669)" },
    cancelled: { label:"ملغى",         color:"#ef4444", bg:"#2d0808", icon:"❌", grad:"linear-gradient(135deg,#ef4444,#dc2626)" },
  };

  const fetchOrders = async () => {
    try {
      setLoading(true);
      const url = filter === "all"
        ? `${SUPABASE_URL}/rest/v1/telegram_orders?order=created_at.desc&limit=50`
        : `${SUPABASE_URL}/rest/v1/telegram_orders?status=eq.${filter}&order=created_at.desc&limit=50`;
      const res = await fetch(url, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
      const data = await res.json();
      setOrders(Array.isArray(data) ? data : []);
      setLastSync(new Date());

      const allRes = await fetch(`${SUPABASE_URL}/rest/v1/telegram_orders?select=status`,
        { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
      const allData = await allRes.json();
      if (Array.isArray(allData)) {
        const s = { pending:0, confirmed:0, completed:0, cancelled:0 };
        allData.forEach(o => { if(s[o.status]!==undefined) s[o.status]++; });
        setStats(s);
        onBadgeUpdate(s.pending);
      }
    } catch(e) { notify("خطأ في التحميل", "err"); }
    finally { setLoading(false); }
  };

  const updateStatus = async (id, status) => {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/telegram_orders?id=eq.${id}`, {
        method:"PATCH",
        headers:{ "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}`,
          "Content-Type":"application/json", "Prefer":"return=minimal" },
        body: JSON.stringify({ status, updated_at: new Date().toISOString() })
      });
      notify(`✓ تم تحديث الطلب إلى: ${STATUS[status]?.label}`);
      setSelected(null);
      fetchOrders();
    } catch(e) { notify("خطأ في التحديث", "err"); }
  };

  const deleteOrder = async (id) => {
    try {
      setDeleting(true);
      await fetch(`${SUPABASE_URL}/rest/v1/telegram_orders?id=eq.${id}`, {
        method:"DELETE",
        headers:{ "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}`, "Prefer":"return=minimal" }
      });
      notify("🗑️ تم حذف الطلب");
      setConfirmDelete(null);
      setSelected(null);
      fetchOrders();
    } catch(e) { notify("خطأ في الحذف", "err"); }
    finally { setDeleting(false); }
  };

  const deleteAllByStatus = async (status) => {
    try {
      setDeleting(true);
      await fetch(`${SUPABASE_URL}/rest/v1/telegram_orders?status=eq.${status}`, {
        method:"DELETE",
        headers:{ "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}`, "Prefer":"return=minimal" }
      });
      notify(`🗑️ تم حذف جميع طلبات «${STATUS[status]?.label}»`);
      setConfirmDelete(null);
      fetchOrders();
    } catch(e) { notify("خطأ في الحذف الجماعي", "err"); }
    finally { setDeleting(false); }
  };

  // 1. مرجع للفلتر لتتجنب مشكلة Stale Closure في الـ WebSocket
  const filterRef = useRef(filter);
  useEffect(() => { 
    filterRef.current = filter; 
  }, [filter]);

  // 2. جلب البيانات من السيرفر عند تغيير الفلتر فقط
  useEffect(() => {
    fetchOrders();
  }, [filter]);

  // 3. فتح قناة الاستماع مرة واحدة فقط عند فتح الكاشير (Dependency Array فارغ)
  useEffect(() => {
    const channel = supa.channel("telegram-realtime")
      .on("postgres_changes", {
        event: "INSERT",
        schema: "public",
        table: "telegram_orders"
      }, payload => {
        const newOrder = payload.new;

        // تشغيل صوت التنبيه وإظهار الإشعار
        if (typeof playNotifSound === "function") playNotifSound();
        notify("📱 طلب جديد من تلغرام!");

        // استخدام filterRef بدلاً من filter المباشر
        setOrders(prev => {
          if (filterRef.current === "all" || filterRef.current === "pending") {
            return [newOrder, ...prev];
          }
          return prev;
        });

        // تحديث العدادات 
        setStats(prevStats => {
          const newStats = { ...prevStats, pending: (prevStats.pending || 0) + 1 };
          onBadgeUpdate(newStats.pending); 
          return newStats;
        });
      })
      .subscribe();

    // التنظيف عند إغلاق التطبيق أو المكون بالكامل
    return () => {
      supa.removeChannel(channel);
    };
  }, []); // القوسان الفارغان يعنيان: افتح الاتصال مرة واحدة فقط!

  const timeAgo = d => {
    const m = Math.floor((Date.now() - new Date(d)) / 60000);
    if(m<1) return "الآن";
    if(m<60) return `${m} د`;
    const h = Math.floor(m/60);
    if(h<24) return `${h} س`;
    return new Date(d).toLocaleDateString("fr-FR");
  };

  const filtered = orders.filter(o =>
    !search || (o.customer_name||"").includes(search) || (o.order_text||"").includes(search)
  );
  const totalAll = Object.values(stats).reduce((a,b)=>a+b,0);
  const modalSt = selected ? (STATUS[selected.status] || STATUS.pending) : STATUS.pending;

  /* ── StatChip ── */
  const Chip = ({st, k}) => {
    const active = filter===k;
    return (
      <div onClick={() => setFilter(k)} style={{
        flex:1, borderRadius:13, padding:"10px 6px", textAlign:"center",
        cursor:"pointer", transition:"all .2s",
        background: active ? `${st.color}18` : "rgba(255,255,255,.03)",
        border:`1px solid ${active ? st.color+"45" : "rgba(255,255,255,.07)"}`,
        boxShadow: active ? `0 4px 14px ${st.color}22` : "none",
        transform: active ? "translateY(-1px)" : "none"
      }}>
        <div style={{fontSize:19, marginBottom:3, lineHeight:1}}>{st.icon}</div>
        <div style={{fontWeight:900, fontSize:17, color: active?st.color:"rgba(255,255,255,.85)", lineHeight:1}}>
          {stats[k]||0}
        </div>
        <div style={{fontSize:8, color:"rgba(255,255,255,.3)", marginTop:3, letterSpacing:.2}}>{st.label}</div>
      </div>
    );
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"calc(100vh - 54px)", overflow:"hidden" }}>

      {/* ══ HEADER ══ */}
      <div style={{
        background:"linear-gradient(180deg,#071020 0%,#0c1d38 100%)",
        borderBottom:"1px solid rgba(0,136,204,.2)", flexShrink:0,
        padding:"12px 14px 10px",
        boxShadow:"0 4px 20px rgba(0,0,0,.4)"
      }}>
        {/* شريط العنوان */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:13 }}>
          <div style={{ display:"flex", alignItems:"center", gap:11 }}>
            {/* أيقونة تلغرام */}
            <div style={{
              background:"linear-gradient(135deg,#0088cc,#005f96)",
              borderRadius:12, width:44, height:44, flexShrink:0,
              display:"flex", alignItems:"center", justifyContent:"center",
              boxShadow:"0 4px 18px #0088cc50"
            }}>
              <svg viewBox="0 0 24 24" fill="white" width="22" height="22">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8l-1.68 7.93c-.12.56-.44.7-.9.43l-2.5-1.84-1.2 1.16c-.13.13-.25.25-.5.25l.18-2.5 4.58-4.14c.2-.18-.04-.27-.3-.1L7.32 15.3l-2.43-.76c-.53-.17-.54-.53.11-.78l9.55-3.68c.44-.16.82.1.69.72z"/>
              </svg>
            </div>
            <div>
              <div style={{ fontWeight:900, fontSize:16, color:"white", lineHeight:1.1 }}>طلبات تلغرام</div>
              <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:3 }}>
                <div style={{
                  width:7, height:7, borderRadius:"50%",
                  background: stats.pending>0 ? "#ef4444" : "#10b981",
                  boxShadow: stats.pending>0 ? "0 0 8px #ef4444" : "0 0 6px #10b981",
                  animation:"glow 1.8s ease infinite"
                }}/>
                <div style={{ fontSize:10, color:"rgba(255,255,255,.45)" }}>
                  مزامنة كل 30 ث
                  {lastSync && ` · آخر تحديث ${lastSync.toLocaleTimeString("ar-DZ",{hour:"2-digit",minute:"2-digit"})}`}
                </div>
              </div>
            </div>
          </div>
          <div style={{display:"flex",gap:7,flexShrink:0}}>
          {(filter==="completed"||filter==="cancelled") && stats[filter]>0 && (
            <button onClick={()=>setConfirmDelete({bulk:true, status:filter})} style={{
              background:"rgba(239,68,68,.12)", border:"1px solid rgba(239,68,68,.3)",
              borderRadius:10, padding:"8px 12px", color:"#f87171",
              cursor:"pointer", fontFamily:"Tajawal,sans-serif",
              fontWeight:700, fontSize:12,
              display:"flex", alignItems:"center", gap:5, transition:"all .2s"
            }}>
              🗑️ حذف الكل
            </button>
          )}
          <button onClick={fetchOrders} style={{
            background:"rgba(0,136,204,.12)", border:"1px solid rgba(0,136,204,.3)",
            borderRadius:10, padding:"8px 14px", color:"#60b8e0",
            cursor:"pointer", fontFamily:"Tajawal,sans-serif",
            fontWeight:700, fontSize:12,
            display:"flex", alignItems:"center", gap:6, transition:"all .2s",
            flexShrink:0
          }}>
            <span style={{display:"inline-block", animation:loading?"spin .8s linear infinite":"none"}}>🔄</span>
            تحديث
          </button>
          </div>
        </div>

        {/* بطاقات الإحصائيات */}
        <div style={{ display:"flex", gap:7, marginBottom:12 }}>
          {Object.entries(STATUS).map(([k,st]) => <Chip key={k} k={k} st={st}/>)}
          {/* الكل */}
          <div onClick={() => setFilter("all")} style={{
            flex:1, borderRadius:13, padding:"10px 6px", textAlign:"center",
            cursor:"pointer", transition:"all .2s",
            background: filter==="all" ? "rgba(255,255,255,.1)" : "rgba(255,255,255,.03)",
            border:`1px solid ${filter==="all" ? "rgba(255,255,255,.3)" : "rgba(255,255,255,.07)"}`,
            boxShadow: filter==="all" ? "0 4px 14px rgba(255,255,255,.08)" : "none",
            transform: filter==="all" ? "translateY(-1px)" : "none"
          }}>
            <div style={{fontSize:19, marginBottom:3}}>📋</div>
            <div style={{fontWeight:900,fontSize:17,color:"rgba(255,255,255,.9)",lineHeight:1}}>{totalAll}</div>
            <div style={{fontSize:8,color:"rgba(255,255,255,.3)",marginTop:3}}>الكل</div>
          </div>
        </div>

        {/* بحث + فلتر */}
        <div style={{display:"flex",gap:7,alignItems:"center"}}>
          {/* حقل البحث */}
          <div style={{
            flex:1, display:"flex", alignItems:"center", gap:8,
            background:"rgba(255,255,255,.06)", border:"1px solid rgba(255,255,255,.1)",
            borderRadius:10, padding:"7px 12px", transition:"border .2s"
          }}>
            <span style={{fontSize:14, opacity:.5}}>🔍</span>
            <input
              value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="بحث باسم العميل أو نص الطلب..."
              style={{
                flex:1, background:"transparent", border:"none", outline:"none",
                color:"white", fontFamily:"Tajawal,sans-serif", fontSize:12,
                caretColor:"#0088cc"
              }}
            />
            {search && (
              <button onClick={()=>setSearch("")} style={{
                background:"none",border:"none",color:"rgba(255,255,255,.4)",
                cursor:"pointer",fontSize:14,padding:0,lineHeight:1
              }}>✕</button>
            )}
          </div>
          {/* عدد النتائج */}
          {search && (
            <div style={{
              background:"rgba(0,136,204,.15)", borderRadius:8, padding:"6px 10px",
              fontSize:10, color:"#60b8e0", fontWeight:700, flexShrink:0,
              border:"1px solid rgba(0,136,204,.25)"
            }}>
              {filtered.length} نتيجة
            </div>
          )}
        </div>
      </div>

      {/* ══ قائمة الطلبات ══ */}
      <div style={{ flex:1, overflowY:"auto", padding:"11px 12px 20px", background:C.bg }}>
        {loading ? (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:70, color:C.mut }}>
            <div style={{ fontSize:44, animation:"spin 1s linear infinite", display:"inline-block", marginBottom:14 }}>⚙️</div>
            <div style={{ fontSize:14, fontWeight:700, color:C.sub }}>جاري تحميل الطلبات...</div>
            <div style={{ fontSize:11, marginTop:6, opacity:.5 }}>يرجى الانتظار</div>
          </div>
        ) : filtered.length === 0 ? (
          <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:70, color:C.mut }}>
            <div style={{ fontSize:60, opacity:.12, marginBottom:16 }}>
              {search?"🔍":"📭"}
            </div>
            <div style={{ fontSize:16, fontWeight:800, marginBottom:7, color:C.sub }}>
              {search ? "لا نتائج مطابقة" : "لا توجد طلبات"}
            </div>
            <div style={{ fontSize:11, opacity:.5, textAlign:"center", maxWidth:220 }}>
              {search
                ? `لا يوجد طلب يحتوي على "${search}"`
                : filter==="pending" ? "رائع! لا طلبات معلقة الآن 🎉" : "لا توجد طلبات في هذه الحالة"}
            </div>
            {search && (
              <button onClick={()=>setSearch("")} style={{
                marginTop:14, background:`${C.acc}18`, color:C.acc,
                border:`1px solid ${C.acc}30`, borderRadius:20, padding:"7px 18px",
                fontFamily:"Tajawal,sans-serif", fontWeight:700, fontSize:12, cursor:"pointer"
              }}>مسح البحث</button>
            )}
          </div>
        ) : filtered.map((order, i) => {
          const st = STATUS[order.status] || STATUS.pending;
          return (
            <div key={order.id}
              style={{
                background: `linear-gradient(145deg,${C.card},${C.card2})`,
                borderRadius:13, marginBottom:8,
                border:`1px solid ${st.color}20`,
                overflow:"hidden",
                animation:`fadeUp .18s ease ${Math.min(i,6)*0.04}s both`,
                cursor:"pointer", transition:"transform .12s,box-shadow .12s",
                boxShadow:`0 2px 10px rgba(0,0,0,.2)`
              }}
              onClick={() => setSelected(order)}>

              {/* شريط اللون العلوي */}
              <div style={{ height:3, background:`linear-gradient(90deg,${st.color},${st.color}40,transparent)` }}/>

              {/* صف واحد مدمج */}
              <div style={{ padding:"9px 12px", display:"flex", alignItems:"center", gap:10 }}>
                {/* Avatar مضغوط */}
                <div style={{
                  background:"linear-gradient(135deg,#0088cc,#005f96)",
                  borderRadius:"50%", width:38, height:38, flexShrink:0,
                  display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:16, color:"white", fontWeight:900,
                  boxShadow:"0 2px 8px #0088cc30",
                  border:"1.5px solid rgba(0,136,204,.25)"
                }}>
                  {(order.customer_name||"?").charAt(0)}
                </div>

                {/* المحتوى الرئيسي */}
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:3 }}>
                    <div style={{ fontWeight:800, fontSize:13, color:C.txt, overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis", flex:1 }}>
                      {order.customer_name || "عميل مجهول"}
                    </div>
                    <div style={{
                      background:`${st.color}15`, color:st.color,
                      borderRadius:20, padding:"2px 8px",
                      fontSize:9.5, fontWeight:800,
                      border:`1px solid ${st.color}28`, flexShrink:0
                    }}>{st.icon} {st.label}</div>
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    {/* نوع المحتوى */}
                    <span style={{ fontSize:11, color:C.mut, overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis", flex:1 }}>
                      {order.has_attachment
                        ? (order.attachment_type==="photo"?"📸 صورة"
                          :order.attachment_type==="video"?"🎬 فيديو"
                          :order.attachment_type==="document"?"📄 مستند":"🎵 صوت")
                        : order.order_text
                          ? `💬 ${order.order_text}`
                          : "—"}
                    </span>
                    <span style={{ fontSize:10, color:C.mut, flexShrink:0 }}>🕐 {timeAgo(order.created_at)}</span>
                  </div>
                </div>

                {/* صورة مصغرة جداً (thumbnail) */}
                {order.has_attachment && order.image_url && (
                  <div style={{ flexShrink:0, width:44, height:44, borderRadius:8, overflow:"hidden", border:`1px solid ${C.brd}` }}
                    onClick={e=>{e.stopPropagation();setImgModal(order.image_url);}}>
                    <img src={order.image_url} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }}
                      onError={e=>e.target.parentNode.style.display="none"}/>
                  </div>
                )}
              </div>

              {/* أزرار الإجراء — pending: صف ضيق */}
              {order.status === "pending" && (
                <div style={{ display:"flex", borderTop:`1px solid ${C.brd}30` }}
                  onClick={e => e.stopPropagation()}>
                  {[
                    { status:"confirmed", label:"تأكيد", color:"#60a5fa", bg:"rgba(59,130,246,.1)" },
                    { status:"completed", label:"اكتمل", color:"#34d399", bg:"rgba(16,185,129,.1)" },
                    { status:"cancelled", label:"إلغاء", color:"#f87171", bg:"rgba(239,68,68,.1)"  },
                  ].map((btn, idx) => (
                    <button key={btn.status} onClick={() => updateStatus(order.id, btn.status)}
                      style={{
                        flex:1, background:btn.bg, color:btn.color,
                        border:"none",
                        borderRight: idx<2 ? `1px solid ${C.brd}30` : "none",
                        padding:"8px 0", fontFamily:"Tajawal,sans-serif",
                        fontWeight:800, fontSize:11.5, cursor:"pointer", transition:"background .15s",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:4
                      }}>
                      {STATUS[btn.status].icon} {btn.label}
                    </button>
                  ))}
                </div>
              )}

              {/* زر حذف — completed / cancelled */}
              {(order.status==="completed"||order.status==="cancelled") && (
                <button onClick={e=>{e.stopPropagation();setConfirmDelete({id:order.id,name:order.customer_name||"هذا الطلب"});}}
                  style={{
                    width:"100%", background:"rgba(239,68,68,.08)",
                    color:"#f87171", border:"none",
                    borderTop:`1px solid rgba(239,68,68,.15)`,
                    padding:"8px 0", fontFamily:"Tajawal,sans-serif",
                    fontWeight:800, fontSize:11.5, cursor:"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",gap:5,
                    transition:"background .15s"
                  }}>
                  🗑️ حذف الطلب
                </button>
              )}
                {order.status === "pending" && (
                <button onClick={e=>{e.stopPropagation();updateStatus(order.id,"completed");}}
                  style={{
                    width:"100%", background:"linear-gradient(90deg,#059669,#047857)",
                    color:"white", border:"none",
                    borderTop:`1px solid rgba(16,185,129,.2)`,
                    padding:"9px 0", fontFamily:"Tajawal,sans-serif",
                    fontWeight:900, fontSize:12, cursor:"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",gap:6
                  }}>
                  🎉 إتمام الطلب والتسليم
                </button>
              )}
            </div>
          );
        })}
      </div>

      {/* ══ Modal تفاصيل الطلب ══ */}
      {selected && (
        <div style={{position:"fixed",inset:0,zIndex:600,display:"flex",alignItems:"flex-end",justifyContent:"center"}}
          onClick={()=>setSelected(null)}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.82)",backdropFilter:"blur(4px)"}}/>
          <div style={{
            background:C.surf, borderRadius:"22px 22px 0 0",
            width:"100%", maxWidth:520, maxHeight:"90vh", overflowY:"auto",
            border:`1px solid ${C.brd}`, position:"relative",
            animation:"fadeUp .28s cubic-bezier(.34,1.56,.64,1)",
            boxShadow:"0 -10px 50px rgba(0,0,0,.6)"
          }} onClick={e=>e.stopPropagation()}>

            {/* شريط الحالة العلوي */}
            <div style={{height:4,background:modalSt.grad,borderRadius:"22px 22px 0 0"}}/>

            {/* رأس المودال */}
            <div style={{
              background:"linear-gradient(135deg,#071424,#0c1e38)",
              padding:"15px 17px 14px",
              display:"flex",alignItems:"center",justifyContent:"space-between"
            }}>
              <div style={{display:"flex",alignItems:"center",gap:13}}>
                <div style={{
                  background:"linear-gradient(135deg,#0088cc,#005f96)",
                  borderRadius:"50%",width:50,height:50,
                  display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:23,color:"white",fontWeight:900,
                  boxShadow:"0 4px 14px #0088cc45",
                  border:"2px solid rgba(0,136,204,.3)"
                }}>
                  {(selected.customer_name||"?").charAt(0)}
                </div>
                <div>
                  <div style={{fontWeight:900,fontSize:16,color:"white"}}>{selected.customer_name||"عميل"}</div>
                  <div style={{fontSize:10,color:"rgba(0,136,204,.8)",marginTop:2}}>
                    {new Date(selected.created_at).toLocaleString("fr-FR")}
                  </div>
                </div>
              </div>
              <button onClick={()=>setSelected(null)} style={{
                background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.12)",
                borderRadius:9,padding:"7px 9px",color:"rgba(255,255,255,.7)",cursor:"pointer",display:"flex",
                transition:"all .15s"
              }}><Ico.x/></button>
            </div>

            <div style={{padding:"15px 17px 20px"}}>
              {/* شارة الحالة */}
              <div style={{
                background:`${modalSt.color}12`, border:`1px solid ${modalSt.color}30`,
                borderRadius:13, padding:"11px 15px", marginBottom:14,
                display:"flex",alignItems:"center",gap:12
              }}>
                <div style={{
                  background:modalSt.grad, borderRadius:10,
                  width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:20,flexShrink:0
                }}>{modalSt.icon}</div>
                <div>
                  <div style={{fontWeight:900,color:modalSt.color,fontSize:15}}>{modalSt.label}</div>
                  <div style={{fontSize:10,color:C.mut,marginTop:2}}>
                    Chat ID: {selected.chat_id || "—"}
                  </div>
                </div>
              </div>

              {/* الصورة */}
              {selected.has_attachment && selected.image_url && (
                <div style={{marginBottom:14,borderRadius:14,overflow:"hidden",cursor:"zoom-in",border:`1px solid ${C.brd}`}}
                  onClick={()=>setImgModal(selected.image_url)}>
                  <img src={selected.image_url} alt="طلب"
                    style={{width:"100%",display:"block"}}
                    onError={e=>e.target.parentNode.style.display="none"}/>
                  <div style={{
                    padding:"8px 14px",background:`${C.card}`,
                    fontSize:11,color:C.mut,display:"flex",alignItems:"center",gap:6
                  }}>🔍 انقر لعرض الصورة كاملة</div>
                </div>
              )}

              {/* نص الطلب */}
              {selected.order_text && selected.order_text !== "[صورة]" && (
                <div style={{
                  background:C.bg, borderRadius:13, padding:"13px 15px",
                  border:`1px solid ${C.brd}`, fontSize:13, color:C.txt,
                  lineHeight:1.8, whiteSpace:"pre-wrap", marginBottom:16,
                  boxShadow:"inset 0 1px 3px rgba(0,0,0,.1)"
                }}>
                  <div style={{fontSize:10,color:C.mut,marginBottom:8,fontWeight:700,display:"flex",alignItems:"center",gap:5}}>
                    💬 نص الطلب
                  </div>
                  {selected.order_text}
                </div>
              )}

              {/* تغيير الحالة */}
              <div style={{marginBottom:8,fontSize:11,color:C.mut,fontWeight:700}}>تغيير الحالة إلى:</div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                {Object.entries(STATUS).map(([key, s2]) => {
                  if(key === selected.status) return null;
                  return (
                    <button key={key} onClick={() => updateStatus(selected.id, key)}
                      style={{
                        background:s2.bg, color:s2.color,
                        border:`1px solid ${s2.color}30`, borderRadius:12,
                        padding:"12px 10px", fontFamily:"Tajawal,sans-serif",
                        fontWeight:800, fontSize:13, cursor:"pointer", transition:"all .15s",
                        display:"flex",alignItems:"center",justifyContent:"center",gap:7
                      }}>
                      <span>{s2.icon}</span> {s2.label}
                    </button>
                  );
                })}
              </div>

              {/* زر الحذف في المودال */}
              {(selected.status==="completed"||selected.status==="cancelled") && (
                <button onClick={()=>setConfirmDelete({id:selected.id,name:selected.customer_name||"هذا الطلب"})}
                  style={{
                    width:"100%", marginTop:14,
                    background:"rgba(239,68,68,.1)", color:"#f87171",
                    border:"1px solid rgba(239,68,68,.25)", borderRadius:12,
                    padding:"12px 0", fontFamily:"Tajawal,sans-serif",
                    fontWeight:800, fontSize:13, cursor:"pointer",
                    display:"flex",alignItems:"center",justifyContent:"center",gap:7
                  }}>
                  🗑️ حذف هذا الطلب نهائياً
                </button>
              )}
            </div>
          </div>
        </div>
      )}


      {confirmDelete && (
        <div style={{position:"fixed",inset:0,zIndex:800,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}
          onClick={()=>!deleting&&setConfirmDelete(null)}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.85)",backdropFilter:"blur(6px)"}}/>
          <div style={{
            background:"linear-gradient(145deg,#1a0a0a,#2d0f0f)",
            border:"1px solid rgba(239,68,68,.35)", borderRadius:20,
            width:"100%", maxWidth:340, padding:"24px 22px",
            position:"relative", boxShadow:"0 20px 60px rgba(239,68,68,.2)",
            animation:"fadeUp .22s cubic-bezier(.34,1.56,.64,1)"
          }} onClick={e=>e.stopPropagation()}>

            {/* أيقونة التحذير */}
            <div style={{textAlign:"center",marginBottom:16}}>
              <div style={{
                display:"inline-flex",alignItems:"center",justifyContent:"center",
                width:60,height:60,borderRadius:"50%",
                background:"rgba(239,68,68,.15)",border:"1px solid rgba(239,68,68,.3)",
                fontSize:30,marginBottom:12
              }}>🗑️</div>
              <div style={{fontWeight:900,fontSize:17,color:"#fca5a5",marginBottom:8}}>
                {confirmDelete.bulk ? "حذف جميع الطلبات" : "حذف الطلب"}
              </div>
              <div style={{fontSize:12.5,color:"rgba(255,255,255,.5)",lineHeight:1.7}}>
                {confirmDelete.bulk
                  ? <>سيتم حذف جميع طلبات «<span style={{color:"#f87171",fontWeight:700}}>{STATUS[confirmDelete.status]?.label}</span>» ({stats[confirmDelete.status]} طلب) نهائياً.</>
                  : <>سيتم حذف طلب <span style={{color:"#f87171",fontWeight:700}}>{confirmDelete.name}</span> نهائياً.</>
                }
                <br/>
                <span style={{color:"#f87171",fontSize:11}}>⚠️ لا يمكن التراجع عن هذا الإجراء</span>
              </div>
            </div>

            {/* أزرار */}
            <div style={{display:"flex",gap:10,marginTop:6}}>
              <button onClick={()=>setConfirmDelete(null)} disabled={deleting}
                style={{
                  flex:1, background:"rgba(255,255,255,.07)",
                  color:"rgba(255,255,255,.7)", border:"1px solid rgba(255,255,255,.12)",
                  borderRadius:12, padding:"12px 0",
                  fontFamily:"Tajawal,sans-serif", fontWeight:700, fontSize:14,
                  cursor:"pointer"
                }}>
                إلغاء
              </button>
              <button
                onClick={()=> confirmDelete.bulk
                  ? deleteAllByStatus(confirmDelete.status)
                  : deleteOrder(confirmDelete.id)
                }
                disabled={deleting}
                style={{
                  flex:1,
                  background: deleting ? "rgba(239,68,68,.3)" : "linear-gradient(135deg,#dc2626,#b91c1c)",
                  color:"white", border:"none", borderRadius:12, padding:"12px 0",
                  fontFamily:"Tajawal,sans-serif", fontWeight:900, fontSize:14,
                  cursor: deleting?"not-allowed":"pointer",
                  boxShadow:"0 4px 16px rgba(239,68,68,.4)",
                  display:"flex",alignItems:"center",justifyContent:"center",gap:7,
                  transition:"all .15s"
                }}>
                {deleting
                  ? <><span style={{animation:"spin .7s linear infinite",display:"inline-block"}}>⚙️</span> جاري الحذف...</>
                  : <>🗑️ {confirmDelete.bulk ? "حذف الكل" : "تأكيد الحذف"}</>
                }
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ══ Modal تأكيد الحذف ══ */}
      {confirmDelete && (
        <div style={{position:"fixed",inset:0,zIndex:800,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}
          onClick={()=>!deleting&&setConfirmDelete(null)}>
          <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.85)",backdropFilter:"blur(6px)"}}/>
          <div style={{
            background:"linear-gradient(145deg,#1a0a0a,#2d0f0f)",
            border:"1px solid rgba(239,68,68,.35)", borderRadius:20,
            width:"100%", maxWidth:340, padding:"24px 22px",
            position:"relative", boxShadow:"0 20px 60px rgba(239,68,68,.2)",
            animation:"fadeUp .22s cubic-bezier(.34,1.56,.64,1)"
          }} onClick={e=>e.stopPropagation()}>
            <div style={{textAlign:"center",marginBottom:16}}>
              <div style={{
                display:"inline-flex",alignItems:"center",justifyContent:"center",
                width:60,height:60,borderRadius:"50%",
                background:"rgba(239,68,68,.15)",border:"1px solid rgba(239,68,68,.3)",
                fontSize:30,marginBottom:12
              }}>🗑️</div>
              <div style={{fontWeight:900,fontSize:17,color:"#fca5a5",marginBottom:8}}>
                {confirmDelete.bulk ? "حذف جميع الطلبات" : "حذف الطلب"}
              </div>
              <div style={{fontSize:12.5,color:"rgba(255,255,255,.5)",lineHeight:1.7}}>
                {confirmDelete.bulk
                  ? <>سيتم حذف جميع طلبات «<span style={{color:"#f87171",fontWeight:700}}>{STATUS[confirmDelete.status]?.label}</span>» ({stats[confirmDelete.status]} طلب) نهائياً.</>
                  : <>سيتم حذف طلب <span style={{color:"#f87171",fontWeight:700}}>{confirmDelete.name}</span> نهائياً.</>
                }
                <br/>
                <span style={{color:"#f87171",fontSize:11}}>⚠️ لا يمكن التراجع عن هذا الإجراء</span>
              </div>
            </div>
            <div style={{display:"flex",gap:10,marginTop:6}}>
              <button onClick={()=>setConfirmDelete(null)} disabled={deleting}
                style={{
                  flex:1, background:"rgba(255,255,255,.07)",
                  color:"rgba(255,255,255,.7)", border:"1px solid rgba(255,255,255,.12)",
                  borderRadius:12, padding:"12px 0",
                  fontFamily:"Tajawal,sans-serif", fontWeight:700, fontSize:14, cursor:"pointer"
                }}>إلغاء</button>
              <button onClick={()=>confirmDelete.bulk?deleteAllByStatus(confirmDelete.status):deleteOrder(confirmDelete.id)}
                disabled={deleting}
                style={{
                  flex:1,
                  background:deleting?"rgba(239,68,68,.3)":"linear-gradient(135deg,#dc2626,#b91c1c)",
                  color:"white", border:"none", borderRadius:12, padding:"12px 0",
                  fontFamily:"Tajawal,sans-serif", fontWeight:900, fontSize:14,
                  cursor:deleting?"not-allowed":"pointer",
                  boxShadow:"0 4px 16px rgba(239,68,68,.4)",
                  display:"flex",alignItems:"center",justifyContent:"center",gap:7
                }}>
                {deleting
                  ? <><span style={{animation:"spin .7s linear infinite",display:"inline-block"}}>⚙️</span> جاري الحذف...</>
                  : <>🗑️ {confirmDelete.bulk?"حذف الكل":"تأكيد الحذف"}</>
                }
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ══ Modal الصورة ══ */}
      {imgModal && (
        <div style={{
          position:"fixed",inset:0,zIndex:700,
          background:"rgba(0,0,0,.97)",
          display:"flex",alignItems:"center",justifyContent:"center",padding:16
        }} onClick={()=>setImgModal(null)}>
          <img src={imgModal} alt=""
            style={{maxWidth:"100%",maxHeight:"90vh",borderRadius:16,boxShadow:"0 16px 70px rgba(0,0,0,.9)"}}/>
          <button onClick={()=>setImgModal(null)} style={{
            position:"fixed",top:18,left:18,
            background:"rgba(255,255,255,.12)",backdropFilter:"blur(10px)",
            border:"1px solid rgba(255,255,255,.2)",borderRadius:"50%",
            width:46,height:46,color:"white",cursor:"pointer",fontSize:20,
            display:"flex",alignItems:"center",justifyContent:"center",
            transition:"background .15s"
          }}>✕</button>
        </div>
      )}
    </div>
  );
}

//  HomeView — لوحة القيادة الرئيسية
// ══════════════════════════════════════════════
function HomeView({products, cats, customers, sales, packages, onNavigate}) {
  const todayKey = todayStr();
  const todaySales = sales.filter(s => (s.date||s.createdAt||"").slice(0,10) === todayKey);
  const todayRev   = todaySales.reduce((s,x)=>s+(x.total||0), 0);
  const todayProfit= todaySales.reduce((s,x)=>s+(x.items||[]).reduce((a,it)=>{
    const p=products.find(pr=>pr.id===it.id);
    return a+(it.price-(it.cost!==undefined?it.cost:(p?.cost||0)))*it.qty;
  },0), 0);
  const outOfStock = products.filter(p=>p.stock<=0);
  const lowStock   = products.filter(p=>p.stock>0&&p.stock<=(p.minStock||5));
  const stockValue = products.reduce((s,p)=>s+p.cost*p.stock,0);
  const last7 = Array.from({length:7},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    const k=d.toISOString().slice(0,10);
    const ds=sales.filter(s=>(s.date||s.createdAt||"").slice(0,10)===k);
    return {label:d.toLocaleDateString("fr-FR",{day:"numeric",month:"numeric"}), rev:ds.reduce((s,x)=>s+(x.total||0),0), count:ds.length};
  });
  const maxRev = Math.max(...last7.map(d=>d.rev),1);
  const prodCounts={};
  sales.forEach(s=>(s.items||[]).forEach(it=>{prodCounts[it.name]=(prodCounts[it.name]||0)+it.qty;}));
  const topProds=Object.entries(prodCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const recentSales=[...sales].sort((a,b)=>new Date(b.date||b.createdAt||0)-new Date(a.date||a.createdAt||0)).slice(0,5);
  const statCards=[
    {icon:"💰",label:"إيرادات اليوم", value:`${fmt(todayRev)} دج`,    color:C.acc, sub:`${todaySales.length} فاتورة`},
    {icon:"📈",label:"أرباح اليوم",   value:`${fmt(todayProfit)} دج`,  color:C.grn, sub:todayRev>0?`هامش ${Math.round(todayProfit/todayRev*100)}%`:"—"},
    {icon:"📦",label:"المنتجات",      value:products.length,           color:C.blu, sub:`${products.reduce((s,p)=>s+p.stock,0)} قطعة في المخزون`},
    {icon:"👥",label:"العملاء",       value:customers.length,          color:C.pur, sub:`${packages.length} باقة`},
    {icon:"🚫",label:"نفذ من المخزون",value:outOfStock.length,         color:C.red, sub:`${lowStock.length} منخفض`,onClick:()=>onNavigate("inventory")},
    {icon:"💎",label:"قيمة المخزون",  value:`${fmt(stockValue)} دج`,   color:"#06b6d4",sub:`${sales.length} فاتورة إجمالاً`},
  ];
  return (
    <div style={{height:"calc(100vh - 54px)",overflowY:"auto",padding:12,background:C.bg}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(148px,1fr))",gap:9,marginBottom:12}}>
        {statCards.map((k,i)=>(
          <div key={i} onClick={k.onClick} style={{background:C.card,borderRadius:14,padding:"13px 13px 11px",border:`1px solid ${k.color}25`,cursor:k.onClick?"pointer":"default",transition:"transform .15s,box-shadow .15s",boxShadow:`0 2px 8px ${k.color}10`}}
            onMouseEnter={e=>{if(k.onClick){e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 6px 20px ${k.color}30`;}}}
            onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow=`0 2px 8px ${k.color}10`;}}>
            <div style={{fontSize:26,marginBottom:5}}>{k.icon}</div>
            <div style={{fontWeight:900,fontSize:17,color:k.color,lineHeight:1.2,marginBottom:2}}>{k.value}</div>
            <div style={{fontSize:11,color:C.mut,fontWeight:600,marginBottom:1}}>{k.label}</div>
            <div style={{fontSize:10,color:C.sub}}>{k.sub}</div>
          </div>
        ))}
      </div>
      <div style={{background:C.card,borderRadius:14,padding:"14px 14px 10px",border:`1px solid ${C.brd}`,marginBottom:10}}>
        <div style={{fontWeight:800,fontSize:13,color:C.txt,marginBottom:12}}>📅 المبيعات — آخر 7 أيام</div>
        <div style={{display:"flex",alignItems:"flex-end",gap:6,height:80}}>
          {last7.map((d,i)=>(
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <div style={{fontSize:8,color:C.mut,textAlign:"center",minHeight:10}}>{d.rev>0?`${d.rev>=1000?Math.round(d.rev/1000)+"k":Math.round(d.rev)}`:""}</div>
              <div style={{width:"100%",borderRadius:"4px 4px 0 0",background:i===6?`linear-gradient(180deg,${C.acc},${C.accD})`:d.rev>0?`linear-gradient(180deg,${C.blu}cc,${C.blu}88)`:C.brd,height:`${Math.max(4,(d.rev/maxRev)*72)}px`,transition:"height .5s ease"}}/>
              <div style={{fontSize:9,color:i===6?C.acc:C.mut,fontWeight:i===6?700:400}}>{d.label}</div>
              {d.count>0&&<div style={{fontSize:8,color:C.acc,fontWeight:700}}>{d.count}×</div>}
            </div>
          ))}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}>
          <div style={{fontWeight:800,fontSize:13,color:C.txt,marginBottom:11}}>🏆 الأكثر مبيعاً</div>
          {topProds.length===0
            ?<div style={{color:C.mut,fontSize:12,textAlign:"center",padding:"14px 0"}}>لا توجد بيانات</div>
            :topProds.map(([name,qty],i)=>{
              const prod=products.find(p=>p.name===name);
              const pi=prod?getProdIcon(prod):{icon:"📦",color:C.mut,img:null};
              return(<div key={i} style={{display:"flex",alignItems:"center",gap:7,padding:"5px 0",borderBottom:i<topProds.length-1?`1px solid ${C.brd}`:"none"}}>
                <div style={{fontWeight:900,color:i<3?C.acc:C.mut,fontSize:12,width:16,flexShrink:0}}>{i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</div>
                {renderPI(pi,26,7)}
                <div style={{flex:1,fontSize:11,color:C.txt,fontWeight:600,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{name}</div>
                <div style={{fontSize:11,color:C.acc,fontWeight:800,flexShrink:0}}>{qty}×</div>
              </div>);
            })
          }
        </div>
        <div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`}}>
          <div style={{fontWeight:800,fontSize:13,color:C.txt,marginBottom:11}}>
            ⚠️ تنبيهات المخزون
            {(outOfStock.length+lowStock.length)>0&&<span style={{background:C.red,color:"white",borderRadius:20,fontSize:10,fontWeight:900,padding:"1px 7px",marginRight:6}}>{outOfStock.length+lowStock.length}</span>}
          </div>
          {outOfStock.length===0&&lowStock.length===0
            ?<div style={{color:C.grn,fontSize:12,textAlign:"center",padding:"14px 0"}}>✅ المخزون بخير</div>
            :<div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:140,overflowY:"auto"}}>
              {[...outOfStock.map(p=>({...p,_t:"out"})),...lowStock.map(p=>({...p,_t:"low"}))].slice(0,7).map((p,i)=>{
                const pi=getProdIcon(p);
                return(<div key={i} style={{display:"flex",alignItems:"center",gap:7,padding:"4px 7px",borderRadius:8,background:p._t==="out"?`${C.red}12`:`${C.amb}12`,border:`1px solid ${p._t==="out"?C.red:C.amb}20`}}>
                  {renderPI(pi,22,6)}
                  <div style={{flex:1,fontSize:10,color:C.txt,fontWeight:600,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{p.name}</div>
                  <span style={{background:p._t==="out"?C.red:C.amb,color:p._t==="out"?"white":"#000",borderRadius:20,fontSize:9,fontWeight:900,padding:"1px 6px",flexShrink:0}}>{p._t==="out"?"نفذ":`${p.stock}`}</span>
                </div>);
              })}
            </div>
          }
          {(outOfStock.length+lowStock.length)>0&&<button onClick={()=>onNavigate("inventory")} style={{width:"100%",marginTop:8,background:`${C.acc}18`,color:C.acc,border:`1px solid ${C.acc}40`,borderRadius:9,padding:"6px 0",fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:11,cursor:"pointer"}}>📦 إدارة المخزون</button>}
        </div>
      </div>
      <div style={{background:C.card,borderRadius:14,padding:14,border:`1px solid ${C.brd}`,marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}>
          <div style={{fontWeight:800,fontSize:13,color:C.txt}}>🧾 آخر المبيعات</div>
          <button onClick={()=>onNavigate("reports")} style={{background:"none",border:`1px solid ${C.brd}`,borderRadius:8,padding:"4px 10px",color:C.mut,fontFamily:"Tajawal,sans-serif",fontSize:11,cursor:"pointer"}}>عرض الكل</button>
        </div>
        {recentSales.length===0
          ?<div style={{color:C.mut,fontSize:12,textAlign:"center",padding:"14px 0"}}>لا توجد مبيعات بعد</div>
          :recentSales.map((s,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<recentSales.length-1?`1px solid ${C.brd}`:"none"}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <div style={{background:`${C.acc}18`,borderRadius:7,padding:"2px 7px",fontSize:10,color:C.acc,fontWeight:800}}>#{(s.id||i+1).toString().padStart(4,"0")}</div>
                <div>
                  <div style={{fontSize:11,color:C.txt,fontWeight:600}}>{(s.items||[]).slice(0,2).map(it=>it.name).join("، ")}{(s.items||[]).length>2?` +${s.items.length-2}`:""}</div>
                  <div style={{fontSize:10,color:C.mut}}>{dateLabel(s.date||s.createdAt)} {timeLabel(s.date||s.createdAt)}</div>
                </div>
              </div>
              <div style={{fontWeight:900,color:C.acc,fontSize:14}}>{fmt(s.total)} دج</div>
            </div>
          ))
        }
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:4}}>
        {[{icon:"🛒",label:"نقطة البيع",id:"pos",color:C.acc},{icon:"📦",label:"المخزون",id:"inventory",color:C.blu},{icon:"👥",label:"العملاء",id:"customers",color:C.pur},{icon:"🏭",label:"الموردون",id:"suppliers",color:C.grn},{icon:"📊",label:"التقارير",id:"reports",color:"#06b6d4"},{icon:"📱",label:"تلغرام",id:"telegram",color:"#3b82f6"}].map(b=>(
          <button key={b.id} onClick={()=>onNavigate(b.id)} style={{background:C.card,border:`1px solid ${b.color}30`,borderRadius:12,padding:"11px 6px",cursor:"pointer",fontFamily:"Tajawal,sans-serif",color:b.color,display:"flex",flexDirection:"column",alignItems:"center",gap:5,transition:"all .15s"}}
            onMouseEnter={e=>{e.currentTarget.style.background=`${b.color}15`;e.currentTarget.style.transform="translateY(-2px)";}}
            onMouseLeave={e=>{e.currentTarget.style.background=C.card;e.currentTarget.style.transform="";}}>
            <span style={{fontSize:22}}>{b.icon}</span>
            <span style={{fontSize:11,fontWeight:700}}>{b.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}



// ══════════════════════════════════════════════
//  App — المكوّن الجذري الرئيسي
// ══════════════════════════════════════════════
function App() {
  const [products,  setProducts]  = useState([]);
  const [cats,      setCats]      = useState([]);
  const [customers, setCustomers] = useState([]);
  const [suppliers, setSuppliers] = useState([]);
  const [sales,     setSales]     = useState([]);
  const [packages,  setPackages]  = useState([]);
  const [loading,   setLoading]   = useState(true);
  const [currentView, setView]    = useState("pos");
  const [sideOpen,  setSideOpen]  = useState(false);
  const [notifs,    setNotifs]    = useState([]);
  const [isLight,   setIsLight]   = useState(false);
  const [tgBadge,   setTgBadge]  = useState(0);
  // ── السلة والمعلقات تعيش في App حتى لا تُفقد عند التنقل ──
  const [cart,       setCart]      = useState([]);
  const [suspended,  setSuspended] = useState([]);

  // ── تحديث الثيم ──
  useEffect(()=>{
    C = isLight ? LIGHT : DARK;
    document.body.classList.toggle("light-mode", isLight);
    setNotifs(n=>[...n]); // force re-render of children
  },[isLight]);

  // ── تحميل البيانات — مع مهلة 6 ثوان لكل جدول ──
  const withTimeout = (p, ms=6000) =>
    Promise.race([p, new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),ms))]);

  const reload = async (tables=["products","categories","customers","suppliers","sales","packages"]) => {
    // "cats" و "categories" كلاهما يحمّل جدول categories ويضبط setCats
    const map = {
      products:   [()=>db.getAll("products"),   setProducts],
      categories: [()=>db.getAll("categories"), setCats],
      cats:       [()=>db.getAll("categories"), setCats],  // alias
      customers:  [()=>db.getAll("customers"),  setCustomers],
      suppliers:  [()=>db.getAll("suppliers"),  setSuppliers],
      sales:      [()=>db.getAll("sales"),      setSales],
      packages:   [()=>db.getAll("packages"),   setPackages],
    };
    // تفادي تكرار تحميل categories مرتين
    const uniqueTables = [...new Set(tables.map(t=>t==="cats"?"categories":t))];
    await Promise.all(
      uniqueTables.filter(t=>map[t]).map(async t=>{
        const [fn, setter] = map[t];
        try {
          const data = await withTimeout(fn());
          setter(data);
        } catch(e) {
          console.warn(`جدول "${t}" فشل:`, e.message);
          setter([]);
        }
      })
    );
  };

  // ── إدراج بيانات تجريبية إذا كانت الجداول فارغة ──
  const seedIfEmpty = async () => {
    try {
      const {data:existingProds} = await supa.from("products").select("id").limit(1);
      if (existingProds && existingProds.length === 0) {
        // أدرج التصنيفات أولاً
        for (const cat of SEED_CATS) {
          await supa.from("categories").insert(toSnake(cat)).catch(()=>{});
        }
        // ثم المنتجات
        for (const prod of SEED_PRODS) {
          await supa.from("products").insert(toSnake({...prod, createdAt: new Date().toISOString()})).catch(()=>{});
        }
        // ثم الباقات والعملاء والموردون
        for (const pkg of SEED_PACKAGES) {
          await supa.from("packages").insert(toSnake(pkg)).catch(()=>{});
        }
        for (const cust of SEED_CUSTOMERS) {
          await supa.from("customers").insert(toSnake(cust)).catch(()=>{});
        }
        for (const sup of SEED_SUPPLIERS) {
          await supa.from("suppliers").insert(toSnake(sup)).catch(()=>{});
        }
        console.log("✅ تم إدراج البيانات التجريبية");
      }
    } catch(e) {
      console.warn("seedIfEmpty:", e.message);
    }
  };

  useEffect(()=>{
    (async()=>{
      try {
        await seedIfEmpty();
        await reload();
      }
      catch(e){ console.error("reload:", e); }
      finally { setLoading(false); }
    })();
  },[]);

  // ── الإشعارات ──
  const notify = (msg, type="ok") => {
    const id = Date.now() + Math.random();
    setNotifs(prev=>[...prev,{id,msg,type}]);
    setTimeout(()=>setNotifs(prev=>prev.filter(n=>n.id!==id)), 3200);
  };

  // ── طباعة الفاتورة ──
  const printInvoice = (sale) => {
    const w = window.open("","_blank","width=420,height=620");
    if(!w) return;
    const items = (sale.items||[]).map(i=>
      `<tr><td>${i.name||""}</td><td style="text-align:center">${i.qty}</td><td>${fmt(i.price)} دج</td><td>${fmt((i.price||0)*(i.qty||1))} دج</td></tr>`
    ).join("");
    w.document.write(`<!DOCTYPE html><html dir="rtl"><head>
      <meta charset="UTF-8"/>
      <style>
        body{font-family:Tajawal,Arial,sans-serif;padding:24px;direction:rtl;color:#111}
        h2{text-align:center;margin-bottom:4px}
        .sub{text-align:center;color:#666;font-size:12px;margin-bottom:16px}
        table{width:100%;border-collapse:collapse;margin-bottom:14px}
        th,td{border:1px solid #ddd;padding:7px 9px;font-size:13px}
        th{background:#f5f5f5;font-weight:700}
        .total{font-weight:900;font-size:16px;text-align:left;border-top:2px solid #333;padding-top:8px}
        .footer{text-align:center;color:#888;font-size:11px;margin-top:18px}
      </style></head><body>
      <h2>📚 مكتبة حشايشي</h2>
      <div class="sub">التاريخ: ${new Date(sale.createdAt||Date.now()).toLocaleString("fr-DZ")}</div>
      <table>
        <thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>المجموع</th></tr></thead>
        <tbody>${items}</tbody>
      </table>
      <div class="total">الإجمالي: ${fmt(sale.total||0)} دج</div>
      <div class="footer">شكراً لزيارتكم 🙏</div>
      <script>setTimeout(()=>{window.print();},400);<\/script>
    </body></html>`);
    w.document.close();
  };

  // ── مؤقت احتياطي: إخفاء شاشة التحميل بعد 12 ثانية بكل الأحوال ──
  const [loadStep, setLoadStep] = useState("connecting"); // connecting | seeding | loading | done
  useEffect(()=>{
    const t = setTimeout(()=>setLoading(false), 12000);
    return ()=>clearTimeout(t);
  },[]);

  if(loading) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",
      height:"100vh",background:"#080f1e",flexDirection:"column",gap:16,
      fontFamily:"Tajawal,sans-serif",padding:24,textAlign:"center"}}>
      <div style={{fontSize:56}}>📚</div>
      <div style={{color:"#f59e0b",fontSize:22,fontWeight:900,letterSpacing:1}}>
        مكتبة حشايشي
      </div>
      <div style={{color:"#8fafc8",fontSize:13}}>جاري الاتصال بقاعدة البيانات…</div>
      <div style={{width:220,height:5,background:"#162236",borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",background:"linear-gradient(90deg,#f59e0b,#d97706)",
          borderRadius:4,animation:"shimmer 1.6s ease-in-out infinite"}}/>
      </div>
      <div style={{color:"#4d6b8a",fontSize:11,marginTop:4,maxWidth:280,lineHeight:1.7}}>
        في حال تأخّر التحميل، تأكد من:<br/>
        ١. الاتصال بالإنترنت<br/>
        ٢. أن Supabase يعمل ويقبل الطلبات<br/>
        ٣. تفعيل RLS يتطلب إضافة Policy للقراءة
      </div>
    </div>
  );

  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",
      background:C.bg,overflow:"hidden",fontFamily:"Tajawal,sans-serif",color:C.txt}}>

      {/* ── شريط التنقل ── */}
      <div style={{display:"flex",alignItems:"center",background:C.surf,
        borderBottom:`1px solid ${C.brd}`,height:54,flexShrink:0,
        overflowX:"auto",overflowY:"hidden"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setView(t.id)} style={{
            flex:"0 0 auto",padding:"0 13px",height:"100%",background:"none",border:"none",
            borderBottom:currentView===t.id?`3px solid ${C.acc}`:"3px solid transparent",
            color:currentView===t.id?C.acc:C.mut,
            fontFamily:"Tajawal,sans-serif",fontWeight:currentView===t.id?800:500,
            fontSize:13,cursor:"pointer",transition:"all .2s",
            display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap",position:"relative"
          }}>
            <span>{t.icon}</span><span>{t.label}</span>
            {t.id==="telegram"&&tgBadge>0&&(
              <span style={{background:"#ef4444",color:"white",borderRadius:"50%",
                minWidth:16,height:16,fontSize:9,fontWeight:900,padding:"0 3px",
                display:"flex",alignItems:"center",justifyContent:"center",
                position:"absolute",top:7,left:4}}>
                {tgBadge>9?"9+":tgBadge}
              </span>
            )}
          </button>
        ))}
        {/* زر الثيم */}
        <div style={{marginRight:"auto",paddingLeft:10,flexShrink:0}}>
          <button onClick={()=>setIsLight(l=>!l)}
            title={isLight?"الوضع الليلي":"الوضع النهاري"}
            style={{background:C.card,border:`1px solid ${C.brd}`,borderRadius:9,
              width:34,height:34,cursor:"pointer",fontSize:16,
              display:"flex",alignItems:"center",justifyContent:"center",
              color:C.txt,transition:"all .2s"}}>
            {isLight?"🌙":"☀️"}
          </button>
        </div>
      </div>

      {/* ── المحتوى ── */}
      <div style={{flex:1,overflow:"hidden",position:"relative"}}>
        {currentView==="home"&&(
          <HomeView products={products} cats={cats} customers={customers}
            sales={sales} packages={packages} onNavigate={setView}/>
        )}
        {currentView==="pos"&&(
          <POSView products={products} cats={cats} customers={customers}
            packages={packages} sales={sales} notify={notify} reload={reload}
            onMenuOpen={()=>setSideOpen(s=>!s)} sideOpen={sideOpen}
            onNavigate={setView} tabs={TABS} currentView={currentView}
            printInvoice={printInvoice}
            cart={cart} setCart={setCart}
            suspended={suspended} setSuspended={setSuspended}/>
        )}
        {currentView==="inventory"&&(
          <InventoryView products={products} cats={cats} packages={packages}
            notify={notify} reload={reload}/>
        )}
        {currentView==="customers"&&(
          <CustomersView customers={customers} sales={sales}
            notify={notify} reload={reload}/>
        )}
        {currentView==="suppliers"&&(
          <SuppliersView suppliers={suppliers} notify={notify} reload={reload}/>
        )}
        {currentView==="reports"&&(
          <ReportsView sales={sales} products={products} cats={cats}/>
        )}
        {currentView==="telegram"&&(
          <TelegramView notify={notify} onBadgeUpdate={setTgBadge}/>
        )}
      </div>

      {/* ── قائمة الإشعارات ── */}
      <div style={{position:"fixed",bottom:18,right:18,zIndex:9999,
        display:"flex",flexDirection:"column",gap:8,pointerEvents:"none"}}>
        {notifs.map(n=>(
          <div key={n.id} style={{
            background:n.type==="err"?"rgba(69,10,10,.97)":n.type==="warn"?"rgba(69,26,3,.97)":"rgba(5,46,22,.97)",
            border:`1px solid ${n.type==="err"?"#ef444650":n.type==="warn"?"#f59e0b50":"#10b98150"}`,
            color:n.type==="err"?"#fca5a5":n.type==="warn"?"#fcd34d":"#6ee7b7",
            borderRadius:13,padding:"10px 18px",
            fontFamily:"Tajawal,sans-serif",fontWeight:700,fontSize:13,
            boxShadow:"0 6px 24px rgba(0,0,0,.5)",
            animation:"popIn .2s ease",maxWidth:320,
            backdropFilter:"blur(12px)"
          }}>{n.msg}</div>
        ))}
      </div>
    </div>
  );
}

    const root=ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
